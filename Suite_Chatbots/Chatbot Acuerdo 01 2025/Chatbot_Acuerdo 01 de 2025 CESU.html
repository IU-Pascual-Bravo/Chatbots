 fundamenta en unos referentes aca-  démicos, filosóficos, pedagógicos y de comportamiento, que   le dan identidad a su comunidad académica, lo cual se pone   de manifiesto en las redes que conforman sus egresados y en   el  impacto  que  estos  tienen  en  el  proyecto  académico  y  en    los procesos de desarrollo social, cultural, científico, tecnoló -  gico o económico, en sus respectivos entornos.  Característica  15.  Seguimiento  de  los  egresados,  su  ca- racterización y aportes en el mejoramiento del programa.   El programa académico da cuenta del seguimiento a la ubi- cación, realizaciones, redes, logros e impactos de sus egresa-  dos, de manera coherente con los fines de la institución y con  sus propios fines.  Característica  16.  Impacto  y  reconocimientos  obtenidos   por los egresados en el medio social y el ámbito académico.   El  programa  académico  evidencia  el  reconocimiento  de  la    alta calidad de la formación recibida, el desempeño destaca - do y el aporte de los egresados a la solución de los problemas  económicos, ambientales, tecnológicos, sociales y culturales,  a  través  del  ejercicio  de  la  disciplina,  profesión,  ocupación  u    oficio correspondiente. \n40  FACTOR 5. Aspectos académicos y evaluación.  Un programa   académico de alta calidad define unos referentes académicos,  filosóficos, curriculares, pedagógicos, evaluativos y organizacio - nales,  que  dan  identidad  a  su  comunidad  académica  y  hacen   posible el reconocimiento de esta como parte de la comunidad  académica  nacional  e  internacional  de  la  profesión,  disciplina,    ocupación u oficio correspondiente, a partir de su tradición y   evidente cultura del mejoramiento permanente apoyado en la   innovación académica.  Característica  17.  Evaluación  de  la  gestión  curricular  y  sus   efectos en la mejora del programa desde una perspectiva de in-  tegralidad, flexibilidad e interacción de las disciplinas.  El progra- ma académico demuestra que su estructura curricular promueve  la  interacción  con  diferentes  disciplinas,  la  formación  en  valores,   la apropiación de conocimientos y métodos, y el desarrollo de las  competencias, capacidades, habilidades y/o destrezas para el ejer-  cicio de la disciplina, profesión, ocupación u oficio, promoviendo   la formación integral del estudiante en coherencia con la misión   institucional y los objetivos propios del programa académico.  La evaluación curricular contribuye a la mejora continua de   la gestión curricular, su flexibilidad, pertinencia y actualización,   facilitando la movilidad de los estudiantes a través de rutas de  formación que ellos mismos construyen a partir de su propia   trayectoria, intereses y aspiraciones. Dichas rutas pueden ser   transitadas dentro de la misma oferta institucional o fuera de   ella, en el ámbito nacional e internacional. El programa académico evidencia en la definición de su   denominación,  en  la  determinación  de  su  duración  y  en  el    número de créditos, o en las respectivas modificaciones, una  reflexión de la comunidad académica en coherencia con las   políticas académicas institucionales, la normatividad vigente y   los referentes en el área del conocimiento.  Característica 18. Coherencia de las estrategias pedagógi- cas con el proyecto educativo del programa académico y las  características de la comunidad de estudiantes.  El programa  académico muestra coherencia entre las estrategias pedagógi- \n41 ACUERDO 01  DE 2025  cas utilizadas, sus características y modalidad con el modelo pe-  dagógico de la institución. Estas estrategias son diseñadas de   acuerdo con los objetivos de los procesos de formación, de cuya  evaluación se obtienen los resultados académicos previstos, se  atienden los aportes de la investigación pedagógica y se pros- pectan los procesos de formación y actualización de los profe-  sores. En el caso de los programas académicos del área de la   salud, a través de los convenios docencia–servicio, demuestran   estrategias adecuadas de enseñanza-aprendizaje en escenarios  de práctica idóneos y suficientes para soportar esta formación.  Característica  19.  Sistema  de  evaluación  de  estudiantes   en  coherencia  con  las  transformaciones  en  las  teorías  y   métodos  de  aprendizaje,  las  dinámicas  del  contexto  y  las   declaraciones del programa.  El programa académico cuenta  con un sistema de evaluación de estudiantes basado en políti-  cas y normas claras, universales y transparentes. Dicho sistema   permite valorar periódica o permanentemente los procesos y  resultados  académicos,  las  actitudes,  los  conocimientos,  las   capacidades  y  las  habilidades  adquiridas  por  los  estudiantes    en coherencia con los objetivos de formación previstos. Los   sistemas  de  evaluación  integran  la  innovación  para  generar   transformaciones profundas en el aprendizaje y acogen diná- micas que les permitan ser coherentes con los cambios en el  conocimiento, y con el desmonte de barreras a la inclusión, es-  pecialmente de personas en condición de discapacidad. Característica 20. Aportes del sistema de evaluación de los   procesos  y  resultados  académicos  al  mejoramiento  curricular    del programa. El programa académico demuestra la existencia   de un proceso de mejoramiento permanente, en el cual se eva- lúa, de manera periódica, y en diferentes momentos a lo largo  del plan de estudios, el grado en que los estudiantes alcanzan  los  procesos  y  resultados  académicos  previstos  y,  con  base  en   dicha evaluación, se toman acciones de ajuste a los aspectos cu-  rriculares y a las metodologías de enseñanza - aprendizaje.  Característica  21.  Coherencia  entre  las  competencias,  ca- pacidades,  habilidades  y/o  destrezas,  los  procesos  y  resul- tados  académicos  previstos  y  demás  aspectos  curriculares   \n42  definidos en el proyecto educativo del programa académico.   El programa académico demuestra coherencia entre las com-  petencias, capacidades, habilidades y/o destrezas definidas, los   procesos y resultados académicos y demás aspectos curricula- res  contemplados  en  el  proyecto  educativo,  o  el  que  haga  sus   veces, entendiendo que las competencias, capacidades, habili- dades y/o destrezas se desarrollan durante la vida de cada perso-  na, pero los procesos formativos contribuyen a su potenciación.  Las  competencias,  capacidades,  habilidades  y/o  destrezas   son conjuntos articulados de conocimientos, disposiciones, acti- tudes y aptitudes que hacen posible comprender y analizar pro-  blemas o situaciones para actuar coherente y eficazmente, indi - vidual o colectivamente, en determinadas situaciones; y pueden  ser evaluadas, demostradas y delimitadas en articulación con los   propósitos declarados en el perfil de egreso de cada programa y  los procesos y resultados académicos previstos.  FACTOR 6. Permanencia y graduación.  El programa aca- démico  implementa  acciones  que  promueven  la  perma- nencia  y  la  graduación  de  los  estudiantes  en  los  tiempos   establecidos curricularmente, teniendo como referente polí-  ticas institucionales y del orden nacional.  Característica  22.  Impacto  de  las  políticas  y  estrategias   implementadas  para  la  permanencia  y  la  graduación.   El   programa académico demuestra la existencia, los resultados  y las evidencias de impacto de las políticas de bienestar, per- manencia y graduación, de los programas de apoyo que pue- den  tener,  por  ejemplo,  enfoques  diferenciales,  accesibles,   interculturales,  plurilingües,  territoriales  e  interseccionales   para la permanencia con equidad fundada en una educación  inclusiva, y la graduación de los estudiantes, que incorporan,   entre otros, procesos de inducción, acompañamiento, orien - tación vocacional, adaptación a la vida universitaria, orienta-  ción para el trabajo de grado y práctica laboral.  Característica 23. Caracterización y atención de estudiantes  a través de los sistemas, estrategias y programas dispuestos   para tal fin.  El programa académico demuestra el impacto de la  \n43 ACUERDO 01  DE 2025  caracterización de sus estudiantes, en cuanto a condiciones de   ingreso, desempeño y permanencia en este. El sistema de aler - tas  tempranas  da  cuenta  de  su  efectividad  en  el  desarrollo  de   acciones de prevención y atención diferenciada de los estudian-  tes en relación con los índices de permanencia y graduación.  Característica 24. Evolución de los ajustes a los aspectos  curriculares y pedagógicos como resultado de los progra- mas de permanencia y graduación.  El programa académi- co demuestra la evolución de los ajustes en sus aspectos curri- culares,  a  partir  del  análisis  del  seguimiento,  entre  otros,  de   los programas de permanencia, las líneas base de las alertas  tempranas y las cifras y tiempos de graduación implementa- dos en su interior en el marco de la realidad contextual y so-  ciocultural de la comunidad estudiantil.  Característica  25.  Contribución  de  los  mecanismos  de   selección  a  la  reducción  de  la  deserción  y  la  graduación   oportuna.   El  programa  académico  demuestra  el  análisis  y   contribución  de  los  mecanismos  de  selección  en  el  desarro- llo de actividades orientadas a la reducción de la deserción y  a la graduación oportuna, así como los ajustes a los procesos  de selección derivados de dichos análisis, en correspondencia   con el principio de equidad definido en el presente Acuerdo.  FACTOR  7.  Proyección  e  interacción  con  el  entorno.   Un   programa  académico  de  alta  calidad fortalece su relaciona- miento con las comunidades locales, regionales, nacionales e  internacionales, para el desarrollo de labores formativas, aca- démicas, docentes, de investigación-creación, de innovación,   científicas, artísticas y culturales, y de relación con el sector ex -  terno (extensión o proyección social) con alcance territorial.  Característica 26. Inserción del programa en contextos aca- démicos  locales,  regionales,  nacionales  e  internacionales.   El   programa académico da cuenta de que en la reflexión, organi - zación y actualización de sus aspectos curriculares toma como  referencia las tendencias, el estado del arte de la disciplina o pro- fesión y los indicadores de calidad reconocidos por la comunidad   académica nacional e internacional. \n44  Característica 27. Resultados y logros de las relaciones y  de la cooperación de profesores y estudiantes con comu- nidades locales, regionales, nacionales y extranjeras y sus  efectos en el posicionamiento del programa.  El programa  académico demuestra el impacto de la cooperación de profe- sores y estudiantes con otras instituciones o entidades locales,  regionales, nacionales y extranjeras, en el desarrollo de labo- res formativas, académicas, docentes, de investigación-crea-  ción, de innovación, científicas, artísticas y culturales, y de re -  lación con el sector externo (extensión o proyección social).  Característica 28. Efectos de las políticas para el desarro- llo  de  habilidades  comunicativas  en  una  o  varias  lenguas   en coherencia con el proyecto educativo del programa aca- démico.    El  programa  académico  demuestra  el  efecto  de  las   políticas y estrategias implementadas para el desarrollo de las   competencias comunicativas, en una o varias lenguas. Y tra - tándose  de  programas  académicos  que  interactúan  con  co- munidades no hispanohablantes, atienden y respetan las par-  ticularidades y las tradiciones culturales y ancestrales del país.  Característica 29. Impacto y aportes de la proyección e inte- racción  social  en  diferentes  contextos.   El  programa  académi-  co identifica y da cuenta de los diferentes impactos y aportes del   programa en las actividades de extensión, proyección social e in- teracción en general con las comunidades y sus contextos y cómo  estos contribuyen a la formación de sus estudiantes y promueven  la participación de la comunidad académica del programa en la   solución de los problemas y transformación de su contexto.  FACTOR 8. Aportes de la investigación, la innovación, el desa- rrollo tecnológico, la creación e investigación-creación artís- tica y cultural, asociados al programa académico.  Un progra- ma  académico  de  alta  calidad  demuestra  que  contribuye  a  la   formación de un espíritu investigativo, artístico, creativo e inno- vador, que favorece en el estudiante una aproximación crítica y  permanente al estado del arte en las áreas del conocimiento del  programa académico y promueve un pensamiento autónomo,   crítico y ético que permite la identificación y formulación de pro -  blemas con alternativas de solución. Asimismo, evidencia el im - \n45 ACUERDO 01  DE 2025  pacto en la sociedad de sus contribuciones, sociales, científicas,   tecnológicas,  culturales,  de  innovación  y  de  creación,  y  atiente   a las responsabilidades asociadas al cumplimiento del principio   de sostenibilidad ambiental.  Característica  30.  Capacidades  y  procesos  para  la  con- solidación de la investigación, el desarrollo tecnológico, la  innovación,  la creación e investigación-  creación  artística   y  cultural  en  el  programa  académico.   El  programa  acadé- mico  demuestra  que  los  profesores  realizan  actividades  de   investigación, desarrollo tecnológico,  innovación  o  creación,  reconocidas  por  el  Sistema  Nacional  de  Ciencia  y  Tecnolo- gía, y cuenta con condiciones y recursos institucionales para   el desarrollo de dichas actividades.  Característica 31. Identificación de los resultados, logros   e  impactos  de  la  investigación,  el  desarrollo  tecnológico,  la   innovación,  la  creación  e  investigación-  creación  artística  y   cultural en los diferentes contextos del programa.  El progra- ma académico evidencia que los productos resultantes de la in- vestigación, el desarrollo tecnológico, la innovación y la creación  enriquecen los aspectos curriculares, fortalecen la formación de  los estudiantes y contribuyen a la actualización y generación de  conocimiento o a la solución de problemas de la sociedad, la ge- neración de nuevos espacios para la renovación permanente de  enfoques conceptuales y teóricos que contribuyan al desarrollo   investigativo innovador y a la producción intelectual.  Característica 32. Coherencia de las líneas de investigación  y/o creación y resultados con el proyecto educativo del pro- grama  académico.   El  programa  académico  demuestra  que   existe  una  relación  coherente  entre  las  líneas  de  investigación   y  los  avances  alcanzados  en  el  periodo  de  observación  con  las   declaraciones de su proyecto educativo de programa, o lo que  haga sus veces, la articulación de los propósitos académicos y las   dinámicas investigativas.  Característica 33. Resultados de la formación para la inves- tigación,  desarrollo  tecnológico,  la  innovación  y  la  creación.    El programa académico demuestra los resultados de la interac- \n46  ción profesor-estudiante en el desarrollo de capacidades de in- dagación y búsqueda, pensamiento crítico, creativo e innovador  y en la formación en diferentes métodos para la investigación, la  innovación y/o la creación artística y cultural, de acuerdo con las   características y modalidad del programa académico.  Característica  34.  Demostración  del  uso  de  los  resul- tados  de  investigación,  el  desarrollo  tecnológico,  la  inno- vación  y/o  la  creación  e  investigación-creación  artística   y  cultural  en  el  mejoramiento  del  programa.   El  programa   académico da cuenta del uso de resultados de investigación,  desarrollo  tecnológico,  la  innovación  y/o  la  creación  e  inves- tigación-creación  artística y  cultural en el mejoramiento del  programa,  mediante  la  sistematización  de  la  información    que soporta el seguimiento realizado.  Característica  35.  Impacto  de  la  investigación  y/o  la  in- vestigación-creación en el contexto en el que se ofrece el  programa.  El programa académico da cuenta de los impac- tos generados en su contexto o entorno, de los resultados al- canzados en el periodo de observación, de los desarrollos de  los  proyectos  de  investigación  asociados  coherentemente a    las líneas de investigación manifiestos en su proyecto educa -  tivo, o en lo que haga sus veces.  FACTOR 9. Bienestar de la comunidad académica del pro- grama.  Un programa académico de alta calidad da cuenta de  la implementación de los programas y protocolos de bienes- tar  institucional  pertinentes  y  adecuados  a  las  necesidades    de su comunidad académica, y de su impacto.  Característica 36. Evolución y evaluación de los progra- mas  y  servicios  que  desarrollan  las  políticas  de  bienestar   en el marco del pluralismo, la diversidad y la  inclusión.  El  programa académico demuestra la implementación de polí-  ticas y protocolos de bienestar, definidos institucionalmente,   a través de la evolución y evaluación de los programas y ser- vicios  que  buscan  el  desarrollo  humano  y  el  mejoramiento   de la calidad de vida de la persona y del grupo institucional  como un todo (estudiantes, docentes y personal administra- \n47 ACUERDO 01  DE 2025  tivo). Estos tienen en cuenta las condiciones y necesidades de   cada estamento, en cada uno de los lugares donde desarrolla  sus  labores,  de  acuerdo  con  las  características  y  modalidad   del  programa  académico,  en  el  marco  del  pluralismo,  la  di-  versidad, la equidad y la inclusión.  Característica 37. Incidencia de los programas, planes y  actividades de bienestar en la formación integral y en la ca- lidad de vida de la comunidad de estudiantes.  El programa   académico identifica y da cuenta de los diferentes impactos   y aportes de las actividades de bienestar en la formación in- tegral y en la calidad de vida de los estudiantes, mediante la  sistematización de la información que soporta el seguimien-  to realizado, desde la admisión hasta la graduación.  Característica  38.  Adaptación  y  evaluación  de  los  progra- mas,  actividades  e  infraestructura  de  bienestar  a  las  condi- ciones  particulares  que  determinan  la  oferta  del  programa.   El  programa  académico  da  cuenta  de  los  mecanismos  y   ejercicios de evaluación y de las adaptaciones realizadas para  atender a las condiciones particulares de su entorno y de los  miembros de su comunidad y para promover la participación  de los estudiantes en los programas y actividades de bienes-  tar y en el uso de la infraestructura disponible.  FACTOR 10. Recursos físicos, tecnológicos, medios educa- tivos y ambientes de aprendizaje.  Un programa académico  de alta calidad dispone y usa recursos pertinentes requeridos  para dar cumplimiento al proyecto educativo, o a lo que haga  sus veces, del programa académico, de acuerdo con sus ob-  jetivos, características y modalidad.  Característica  39.  Evolución  y  evaluación  de  los  medios   educativos que soportan los ambientes de aprendizaje del  programa.  El programa académico dispone los medios edu- cativos necesarios para el desarrollo de los procesos formativos  y  ha  puesto  en  marcha  programas  de  mejoramiento,  actua- lización  y  evaluación  de  estos  medios,  en  coherencia  con  las    estrategias pedagógicas, tecnológicas y de acompañamiento,  con el fin de lograr el mejoramiento permanente de las labo - \n48  res  formativas,  académicas,  docentes,  de  investigación-crea-  ción, de innovación, científicas, artísticas y culturales, y de re - lación  con  el  sector  externo  (extensión  o  proyección  social),  y    de cualificar los aprendizajes asociados a estas actividades, en   coherencia con los procesos y resultados académicos, las ca-  racterísticas y la modalidad del programa académico.  Característica 40. Aporte de los medios educativos en los  procesos y resultados académicos de los estudiantes aten- diendo su contexto y a los principios rectores de la alta ca- lidad.    El  programa  académico  demuestra  la  disponibilidad,   acceso, uso y apropiación, por parte de los estudiantes, de es- pacios,  recursos,  herramientas  y  equipos  para  enriquecer  los    procesos de enseñanza y aprendizaje, de acuerdo con las ca - racterísticas y modalidad del programa académico, atendien-  do a su contexto y a los principios rectores de la alta calidad.  Característica 41. Evolución de la suficiencia y calidad de  los medios educativos, recursos bibliográficos y de informa - ción en coherencia con las dinámicas propias  del  progra- ma y su mejoramiento.  El programa académico demuestra   la evolución y suficiencia de los medios educativos, recursos  bibliográficos y de información, plataformas informáticas y   los equipos computacionales y de telecomunicaciones (hard-  ware y software licenciado) actualizados y adecuados para el  diseño y la producción de contenidos, la implementación de   estrategias  pedagógicas  y  el  continuo  apoyo  y  seguimiento   de las actividades académicas de los estudiantes, de acuerdo   con las características y modalidad del programa académico.  Característica 42. Evolución, suficiencia y evaluación de   los recursos de infraestructura física y tecnológica en cohe- rencia  con  el  proyecto  educativo  del  programa  académico.    El programa académico demuestra la evolución, suficiencia y   evaluación  de  los  espacios  físicos,  aulas,  laboratorios,  talleres,   centros de simulación, plataformas tecnológicas, recursos tec- nológicos,  biblioteca  y  salas  de  estudio,  para  el  cumplimiento   de sus labores formativas, académicas, docentes, investigativas,   científicas, culturales, de innovación y de extensión, de acuerdo  con las características y modalidad del programa académico. \n49 ACUERDO 01  DE 2025  FACTOR 11.  Organización, administración y financiación del   programa académico.  Un programa académico de alta cali- dad cuenta con una estructura administrativa y de procesos  de gestión que estén al servicio de las labores formativas, aca- démicas, docentes, de investigación-creación, de innovación,   científicas, artísticas y culturales, y de relación con el sector   externo (extensión o proyección social), en coherencia con su   proyecto educativo, o lo que haga sus veces.  Característica 43. Identificación de los logros y resulta - dos  de  la  organización  y  la  gestión  del  programa.   El  pro- grama académico cuenta con una estructura organizacional  con  cuerpo(s)  colegiado(s)  donde  participan  por  lo  menos   representantes  de  los  profesores,  los estudiantes  y  los egre- sados, y que, además, tiene implementados los mecanismos   administrativos necesarios para identificar los logros y resul -  tados de la organización y la gestión del programa.  Característica  44.  Evolución  y  evaluación  de  la  soste- nibilidad, los recursos y las capacidades del programa en  coherencia con el proyecto educativo.   El programa acadé- mico  muestra  la  evolución  y  evaluación  de  la  sostenibilidad   de las capacidades institucionales en materia de sus recursos   humanos, técnicos, tecnológicos, biográficos y de laborato - rios, así como de la infraestructura física, entre otros, necesa- rios para favorecer la permanencia, el desarrollo académico y   la graduación de los estudiantes.  Característica 45. Liderazgo en la dirección y gestión.  La  dirección y los comités muestran su liderazgo en la gestión, a  través de orientaciones en las que participan profesores, es- tudiantes  y  egresados  los  cuales  contribuyen  a  la  dinámica    administrativa y académica. También evidencia la existencia   de  procesos,  trámites  y  procedimientos  claros  y  conocidos   por la comunidad académica y los grupos de interés relacio-  nados con el programa académico.  Característica  46.  Sistemas  de  comunicación  e  infor- mación  actualizados,  accesibles  y  oportunos  en  el  mejo- ramiento  del  programa.   El  programa  académico  muestra   \n50  que  cuenta  con  mecanismos  que  facilitan  la  comunicación   entre  todos  los  miembros de  su  comunidad y con  sistemas   de información establecidos y accesibles, en el marco de los   derechos de la protección de datos.  Característica 47. Consolidación de los recursos y capa- cidades coherentes con la evolución del programa.  El pro- grama académico muestra la consolidación de los recursos y  capacidades, coherentes con la evolución del programa, ne- cesarios  para  favorecer  la  permanencia,  el  desarrollo  acadé-  mico y la graduación de los estudiantes.  Característica 48. Identificación de la sostenibilidad fi - nanciera  del  programa  académico.   El  programa  académi-  co dispone de recursos financieros para su funcionamiento   e inversión, de acuerdo con sus características y modalidad,  así como con la naturaleza jurídica de la institución, su iden-  tidad, misión, tipología y contexto.  FACTOR 12. Aseguramiento de la alta calidad del programa.   A partir de su tradición y cultura del mejoramiento permanen-  te, y de los fines filosóficos, pedagógicos y organizacionales,   que dan identidad a su comunidad académica, un programa  académico de alta calidad desarrolla las condiciones para pro-  mover la participación reflexiva de la comunidad en sus proce - sos de autoevaluación y autorregulación, detectar los aspectos   y procesos que requieren ser mejorados e identificar los resul - tados, logros e impactos que ha generado la cultura de la cali- dad en articulación con el sistema interno de aseguramiento   de la calidad institucional. Característica 49. Reflexión y participación de la comunidad   en los procesos de gestión, autoevaluación, autorregulación y   mejoramiento permanente del programa académico. El pro - grama académico evidencia que tiene una cultura de mejo- ramiento permanente, que aplica criterios y procedimientos  para la evaluación periódica y participativa de la comunidad  en los procesos de gestión, autoevaluación, autorregulación y  del mejoramiento del programa académico, liderados por los  diferentes comités u otras formas de organización, en donde  \n51 ACUERDO 01  DE 2025  participan estudiantes, profesores y egresados en la toma de   decisiones para el mejoramiento permanente.  Característica 50. Consolidación de la información y los  datos que dan cuenta de los resultados, logros e impactos  de la alta calidad del programa en el periodo de observa- ción correspondiente a la autoevaluación.  El programa aca- démico  demuestra  que  ha  consolidado  la información y los   datos en el marco del Sistema Interno de Aseguramiento de  la Calidad Institucional para soportar los procesos de autoe- valuación,  autorregulación  y  del  mejoramiento  permanente    del programa académico.  Característica 51. Identificación de los principales resul - tados,  logros  e  impactos  de  la  cultura  de  la  calidad  en  el   mejoramiento  del  programa.   El  programa  académico  de-  muestra la identificación de los principales resultados, logros   e  impactos  y  la  implementación  de  las  recomendaciones   realizadas  en  los  procesos  de  autoevaluación,  consolidando   la  cultura  de  la  calidad  y  el  mejoramiento  permanente  del    programa.  Artículo  14.  Compromisos  de  los  programas  académicos   acreditados  en  alta  calidad.   Los  programas  académicos  con   acreditación en alta calidad asumen los siguientes compromisos:  a.  Conservar o mejorar, durante la vigencia de la acredita - ción, la calidad alcanzada en la totalidad de los factores  y  características,  a  partir  de  las  cuales  se  desarrolló  el    trámite de evaluación de la alta calidad. b.  De presentarse cambios sustantivos que afecten la alta   calidad,  que  fue  reconocida  en  uno  o  varios  de  los  com- ponentes  del  modelo  de  acreditación  en  alta  calidad,  el   Representante  Legal  de  la  institución  deberá  informar   oportunamente  al  Consejo  Nacional  de  Acreditación   -CNA- sobre tales cambios y allegar la documentación res- pectiva para que el programa académico sea evaluado de   nuevo, si el caso lo amerita. El resultado de la evaluación   realizada  por  el  Consejo  Nacional  de  Acreditación  -CNA-    deberá ser informada al Ministerio de Educación Nacional. \n52  c.  Cumplir con lo establecido en el artículo 54 del presen - te acuerdo en lo referente al avance de las acciones de  mejoramiento del programa académico desde el Siste-  ma Interno de Aseguramiento de la Calidad -SIAC-.  Artículo 15. Relación docencia servicio.  Para la acredita- ción en alta calidad de programas académicos que cuentan  con  prácticas  formativas  cuyo  desarrollo  se  lleve  a  cabo  en   el marco  de  la relación docencia- servicio,  se  requerirá  de la   evaluación de dicha relación por parte de la Comisión Inter-  sectorial para el Talento Humano en Salud. El cumplimiento   de esta condición será comunicado por el Ministerio de Edu- cación Nacional  al  Consejo  Nacional  de  Acreditación  -CNA-   durante el trámite de acreditación y en todo caso antes de la   finalización de la evaluación integral. \n53  ACUERDO 01  DE 2025  Artículo  16.  Unidad  académica  de  alta  calidad.   La  alta   calidad  de  una  unidad  académica,  en  la  perspectiva  de  la   acreditación, se reconoce considerando referentes a partir de  los cuales orienta su acción y supone retos de alta exigencia  al reconocer sus particularidades, de acuerdo con los campos  del saber y conocimiento, identidad, valores declarados y for- mas de organización que se reconocen en la normativa insti- tucional, en la comunidad institucional y en los contextos con   los que interactúa.  La alta calidad de las unidades académicas supone el desa- rrollo y apropiación de una sólida cultura de autoevaluación y  autorregulación orientada al mejoramiento permanente, so- portada en el sistema interno de aseguramiento de la calidad   de la institución. La alta calidad permite evidenciar la gestión,   el apoyo y los logros de la unidad académica en el desarrollo  permanente  de  las  labores  formativas,  académicas,  docen-  tes, de investigación-creación, de innovación, científicas, ar - tísticas y culturales, y de relación con el sector externo (exten- sión  o  proyección  social)  de  los  programas  académicos  que    agrupa y articula.  La alta calidad de una unidad académica, desde la perspec- tiva de la acreditación, supone entre otras cualidades, que la  unidad académica:  a.    demuestra  la  coherencia  entre  el  proyecto  educativo   institucional, o lo que haga sus veces, los propósitos de- clarados, sus campos del saber y de conocimiento y las  acciones realizadas;  CAPÍTULO IV  MODELO DE ACREDITACIÓN EN ALTA CALIDAD DE UNIDADES ACADÉMICAS \n54  b.    promueve el desarrollo profesoral y los procesos forma- tivos de los docentes que permiten la constitución de  comunidades académicas sólidas;  c.  acompaña el desarrollo de las competencias, capacida - des,  habilidades  y/o  destrezas  que  requiere  la  forma- ción  de  los  estudiantes  como  profesionales  idóneos  y   como ciudadanos responsables;  d.    contribuye  para  que  se  generen  las  condiciones  para   que  los  profesores  y  los  estudiantes  adelanten  proce- sos  formativos  y  de  investigación  con  compromiso  de   pertinencia  y  relevancia  social  propios  de  ambientes   educativos equitativos e inclusivos;  e.    articula la administración de la institución y la gestión  académica para el cumplimiento  de  los  propósitos  de   la unidad;  f.    desarrolla e implementa las políticas de buen gobierno  institucional que garantizan la estabilidad de la unidad,   asegurando sistemas de gestión transparentes, efica -  ces y eficientes; g.    promueve  la  inserción  en  una  dinámica  global,  aten- diendo  a  las  dinámicas  sociales,  culturales  y  produc- tivas  de  las  regiones  en  donde  hace  presencia  y   desarrollando  estrategias  y  actividades  de  internacio-  nalización que beneficien a la comunidad que alberga; h.    apoya  la  implementación  de  políticas  institucionales    eficaces de seguimiento a egresados; y i.    gestiona y administra con responsabilidad e idoneidad   los recursos financieros que garantizan el cumplimien - to adecuado de sus funciones misionales, así como los  recursos  físicos  y  tecnológicos  que  exige  el  desarrollo    de esas funciones.  La acreditación en alta calidad de programas se desarrollará  por programa académico o por acreditación de programas aca-  démicos mediante la acreditación de unidades académicas.  Artículo  17.  Acreditación  en  alta  calidad  de  unidades   académicas.   La  acreditación  en  alta  calidad  de  una  unidad   académica representa para la institución de educación supe-  rior el reconocimiento de las cualidades y la labor específica  \n55 ACUERDO 01  DE 2025  institucional que de manera pertinente y coherente desarro- lla una comunidad académica, a partir de los programas aca-  démicos de pregrado y posgrado que agrupa y articula.  En  la  acreditación  en  alta  calidad  de  una  unidad  acadé- mica  se  tendrán  en  cuenta  los  elementos  declarados  en  el   proyecto  educativo  institucional  o  lo  que  haga  sus  veces,  y   en  los  proyectos  educativos  o  lo  que  haga  sus  veces,  de  los   programas académicos que la integran, así como, su gestión,   participación, desarrollo y acompañamiento.  Cada  institución,  en  el  marco  de  su  autonomía  y  dentro   del principio que reconoce la acreditación como un proceso   voluntario, podrá definir libremente si realiza o no la acredita -  ción de sus unidades académicas.  En la acreditación de una unidad académica, la institución  voluntariamente podrá presentar a acreditación o renovación  sus programas adscritos dentro la misma solicitud, para que   se evalúen en un único trámite.  En todo caso, para la acreditación de unidades académicas  por primera vez la unidad debe presentarse con el cincuenta  por ciento (50%) de sus programas académicos acreditables   para acreditación en un único trámite. Los programas acredi -  tados no pierden su condición de acreditables. La institución   podrá presentar voluntariamente los programas académicos  que  se  encuentran  acreditados  para  su  renovación  en  este    único trámite.  En los casos que la unidad académica cuente con la totali- dad de programas académicos acreditados en alta calidad, la  institución presentará para acreditación la unidad académi-  ca acompañada del plan de mejoramiento de los programas   académicos o el último presentado ante el Consejo Nacional   de Acreditación (CNA).  Artículo 18. Evaluación de la alta calidad de las unidades  académicas.  La evaluación de la alta calidad de las unidades   académicas implica un ejercicio de carácter interpretativo.   Entonces, la evaluación integral que realiza el Consejo Nacio- \n56  nal de Acreditación -CNA- interpreta el sentido que tiene un   hecho en un contexto institucional y social específico, enmar - cado  en  los  principios  y  valores  establecidos  en  el  presente   acuerdo, como también en los valores declarados por la insti-  tución y referidos a su identidad, misión y organización.  Parágrafo  1.   El  proceso  de  acreditación  de  las  unidades   académicas  que  ingresan  al  Sistema  Nacional  de  Acredi- tación  tendrá  en  cuenta  la  autonomía  de  la  institución  de   educación  superior  para  utilizar  sus  propias  metodologías,   recursos e instrumentos de recolección, evaluación de la in-  formación y definición de características adicionales y aspec -  tos por evaluar, según su modelo autoevaluación.  Parágrafo  2.   El  Consejo  Nacional  de  Acreditación  -CNA-   determinará, mediante lineamientos, el alcance de las carac- terísticas y los aspectos por evaluar asociados a los factores de  la acreditación de unidades académicas, de acuerdo con los  elementos  característicos declarados por parte de la institu- ción en el proyecto educativo institucional o lo que haga sus   veces.  Artículo  19.  Factores  y  características  para  la  evalua- ción de las unidades académicas.  Una unidad académica  de alta calidad debe demostrar su esfuerzo continuo articu- lado  a  la  institución  por  consolidar  una  cultura  fundamen- tada  en  el  mejoramiento  permanente,  la  autoevaluación,  la   autorregulación y la innovación académica, que se evidencia   como a continuación se relaciona.  Para  la  acreditación  o  renovación  de  acreditación  de  una   unidad  académica,  la  institución  deberá  dar  cuenta  los  si- guientes factores y sus características:  FACTOR  1.  Identidad  de  la  unidad  académica,  organiza- ción,  administración  y  estructura.   Una  unidad  académica   de  alta  calidad  desarrolla  una  cultura  de  la  alta  calidad bajo   los  valores  y  principios  declarados  en  el  proyecto  educativo   institucional o lo que haga sus veces, socializa esos principios  y  apoya  su  apropiación  por  parte  de  la  comunidad,  cumple   \n57 ACUERDO 01  DE 2025  unos objetivos claros y desarrolla las funciones que le son es- tablecidas en la normatividad institucional, por medio de una  estructura de procesos y procedimientos que le permiten el  mejoramiento permanente, la autoevaluación y la autorregu-  lación. Una unidad académica de alta calidad en el ámbito   de  su  gestión  académico-administrativa  promueve  la  parti- cipación  e  inclusión  de  los  diferentes  estamentos  y  actores    que configuran su comunidad académica, posibilitando su   intervención  en  el  desarrollo  y/o  gestión  de  la  unidad  en  la   toma de decisiones y la articulación con el sistema interno de   aseguramiento de la calidad de la institución.  Característica  1.  Demostración  de  la  coherencia,  perti- nencia y relevancia del actuar de la unidad académica.  La  unidad académica actúa de manera coherente y pertinente  con  el  medio  social,  cultural  y  ambiental,  de  acuerdo  con  la   identidad y el proyecto educativo institucional o lo que haga  sus  veces,  en  el  ámbito  de  su  contexto,  de  forma  dinámica;   demuestra  el  desarrollo  de  sus  objetivos  y  funciones  en  co- herencia  con  las  labores  formativas,  académicas,  docentes,    científicas, culturales y de extensión de sus programas, y está  articulada con los cambios del entorno y de la institución.  Característica  2.  Organización,  administración  y  trans- parencia  de  la  unidad  académica.   La  unidad  académica   tiene  una  administración  que,  atendiendo  a  los  estatutos,   políticas, procedimientos y reglamentos de la institución o lo  que  haga  sus  veces,  y  al  sistema  interno  de  aseguramiento   de  la  calidad  institucional,  garantiza  una  gestión  de  calidad   sostenible  social,  económica  y  ambientalmente,  así  como   la  participación  efectiva  de  los  miembros  de  su  comunidad   académica en las decisiones y el desarrollo de acciones y pro- yectos propios, bajo criterios de ética, efectividad, calidad, in- tegridad, transparencia, inclusión y equidad, promoviendo la   cualificación de los integrantes de la comunidad.  FACTOR  2.  Comunidades  académicas  e  integración  de  la   unidad  académica.   Una  unidad  académica  de  alta  calidad   promueve la constitución de una comunidad académica, in- tegrada  y  articulada  en  torno  al  desarrollo  de  las  funciones   \n58  misionales  de  docencia, investigación y proyección social de   los programas que la integran. Así mismo, desarrolla acciones   que  integran  a  profesores  y  estudiantes  de  los  programas   académicos con el propósito de consolidar el campo de cono- cimiento o saber que articula a la unidad, promoviendo la in- terdisciplinariedad, el desarrollo de proyectos, la movilidad de  profesores y estudiantes entre los programas académicos de  pregrado y de estos con  los  programas  académicos  de  pos-  grado cuando cuenten con ellos. Una unidad académica de   alta calidad promueve la nueva oferta académica de manera  pertinente y prospectiva, y realiza la evaluación integral de su   gestión curricular.  Característica  3.  Articulación  curricular  de  los  progra- mas,  desarrollo  de  proyectos  de  investigación  conjuntos   y movilidad.  La unidad académica demuestra su consolida- ción  a  través  de  la  integración  curricular  de  sus  programas   académicos;  la  realización  de  actividades  disciplinares  e  in- terdisciplinares;  la  interacción  entre  estudiantes,  profesores   y egresados mediante la conformación de redes y el trabajo  colaborativo, entre otras estrategias que permiten la consoli- dación de sus procesos misionales, la ejecución de proyectos  de formación, creación, investigación, investigación-creación,   innovación y extensión.  Característica  4.  Articulación  y  coherencia  de  los  com- ponentes  pedagógicos  y  de  evaluación.   La  unidad  acadé- mica  garantiza  la  efectividad  e  integridad  de  la  articulación   entre  las  políticas,  procesos  y  procedimientos  de  la  institu- ción,  orientados  a  la  gestión  de  los  componentes  formati- vos, pedagógicos, de evaluación, de interacción y de relación   social y ambiental, así como de sus procesos de enseñanza,   aprendizaje  y  evaluación,  con  miras  al  logro  de  los  procesos   y  resultados  académicos  previstos,  el  mejoramiento  perma- nente,  la  autoevaluación,  la  autorregulación  y  la  innovación    pedagógica.  Artículo  20.  Evaluación  de  los  programas  académicos   en el trámite de acreditación  de  una  unidad  académica.    En  la  acreditación  o  renovación  de  acreditación  de  los  pro- \n59 ACUERDO 01  DE 2025  gramas académicos que se presenten en el trámite de acre- ditación  de  la  unidad  académica,  se  tendrán  en  cuenta  de   manera conjunta o independiente, según sea el caso, los fac- tores y características para evaluación de programas  acadé-  micos definidos en el artículo 13 del presente Acuerdo.  La unidad académica deberá presentar por cada programa  académico, de manera independiente, el “Proyecto educativo  del programa e identidad institucional”, siguiendo lo estableci-  do en el FACTOR 1, del artículo 13 del presente Acuerdo.  De  manera  integrada,  en  un  único  informe  de  autoeva- luación y en cuadros maestros independientes, la institución  deberá demostrar para los programas académicos acredita- bles o por renovación de acreditación, que dan cuenta de los  siguientes factores y características:  FACTOR 2.  Comunidad de estudiantes.   FACTOR 3.  Comunidad de profesores.   FACTOR 4.  Comunidad de egresados.   FACTOR 5.  Aspectos académicos y evaluación.   FACTOR 6.  Permanencia y graduación.  FACTOR 7.  Proyección e interacción con el entorno.  FACTOR  8.   Aportes  de  la  investigación,  la  innovación,  el   desarrollo  tecnológico,  la  creación  e  investigación-crea-  ción artística y cultural, asociados al programa académico.   FACTOR 9.  Bienestar de la comunidad académica del pro-  grama.  FACTOR 10.  Recursos físicos, tecnológicos, medios educa-  tivos y ambientes de aprendizaje.  FACTOR 11.  Organización, administración y financiación del  programa académico.  FACTOR 12.  Aseguramiento de la alta calidad del programa.  En  caso  de  que  haya  aspectos  diferenciadores  entre  los    programas afines presentados al trámite de acreditación o de   renovación de acreditación, la institución deberá dar cuenta  de esos aspectos diferenciadores en los respectivos factores y  características, especialmente cuando se trate de programas   académicos del área de la salud. \n60  En los FACTORES 2, 3 y 4, la institución deberá demostrar  de manera integrada para los programas académicos presen- tados al trámite de acreditación o de renovación de acredita- ción,  los  aspectos  en  los  que  las  comunidades  académicas   de cada uno de los programas realizan acciones comunes e  interactúan para consolidar el campo de conocimiento o sa- ber de la unidad, o para consolidar el campo interdisciplinar,   cuando se trate de unidades académicas interdisciplinares.  Artículo 21. Compromisos de las unidades académicas  acreditadas en alta calidad.   Las unidades académicas  con  acreditación  en  alta  calidad  y  sus  programas  académicos   asumen los siguientes compromisos:  a.    Conservar o mejorar, durante la vigencia de la acredita- ción, la calidad alcanzada en la totalidad de los factores  y las características, a partir de las cuales se desarrolló el   trámite de evaluación de la alta calidad. b.    Informar oportunamente al Consejo Nacional de Acre-  ditación -CNA- los cambios o modificaciones sustanti - vos  que  afecten  la  alta  calidad  que  fue  reconocida  en   uno o varios de los componentes del modelo de acredi-  tación. El Representante Legal de la institución deberá  informar tales cambios o modificaciones y allegar la do - cumentación respectiva para que la unidad académica   sea evaluada de nuevo, si el caso lo amerita. El resultado   de  la  evaluación  realizada  por  el  Consejo  Nacional  de   Acreditación -CNA- deberá ser informado al Ministerio  de Educación Nacional para que adopte las medidas a   que haya lugar. c.    Divulgar y promover su acreditación en alta calidad y la  de sus programas académicos acreditados en alta ca- lidad,  informando  con  precisión  el  lugar  o  lugares  de    desarrollo evaluado(s), el número de años de vigencia   de dicha acreditación y el número de la resolución mi- nisterial mediante la cual se otorga o renueva la acredi-  tación en alta calidad. d.    Desarrollar  los  planes  de  mejoramiento  resultado  de   los  procesos  de  autoevaluación  de  la  unidad  y  de  los    programas académicos. \n61 ACUERDO 01  DE 2025  e.    Cumplir con lo establecido en el artículo 54 del presen- te acuerdo en lo referente al avance de las acciones de  mejoramiento de la unidad académica desde el Siste-  ma Interno de Aseguramiento de la Calidad -SIAC-.  Artículo  22.  Relación  docencia  servicio.     Para  la  acredi- tación en alta calidad de unidades académicas que integran  programas  académicos  que  cuentan  con  prácticas  formati- vas cuyo desarrollo se lleve a cabo en el marco de la relación  docencia-servicio,  se  requerirá  de  la  evaluación  de  dicha  re- lación  por  programa  por  parte  de  la  Comisión  Intersectorial    para el Talento Humano en Salud. El cumplimiento de esta   condición  será  comunicado  por  el  Ministerio  de  Educación   Nacional al Consejo Nacional de Acreditación -CNA-  durante  el  trámite  de  acreditación  y  en  todo  caso    previo a la evaluación integral. \n62  Artículo 23. Instituciones de alta calidad.  La alta calidad  de  una  institución,  desde  la  perspectiva  de  la  acreditación,   se reconoce considerando  los referentes a partir de los cua- les orienta su acción y supone retos de alta exigencia y com- plejidad asociados a sus particularidades: naturaleza jurídica,  identidad, misión, tipología, formas de organización, comuni-  dad institucional y contextos con los que interactúa.  La  alta  calidad  de  las  instituciones  supone  el  desarrollo  y   apropiación de una sólida cultura de autoevaluación y auto- rregulación  orientada  al  mejoramiento  permanente,  sopor- tada  en  un  sistema  interno  de  aseguramiento  de  la  calidad   que permita evidenciar los logros alcanzados en el desarrollo  permanente  de  sus  labores  formativas,  académicas,  docen-  tes, de investigación-creación, de innovación, científicas, ar - tísticas y culturales, y de relación con el sector externo (exten-  sión o proyección social).  La alta calidad de una institución, desde la perspectiva de  la acreditación, supone entre otras características, que la ins- titución:  a.    demuestra  la  coherencia  entre  los  propósitos  declara- dos en el proyecto educativo institucional o lo que haga  sus veces y las acciones realizadas;  b.    tiene  una  planta  profesoral  que  lidera  los  procesos  for- mativos y permite la constitución de comunidades aca- démicas sólidas;  c.    posibilita y facilita a los estudiantes el desarrollo de las  competencias,  capacidades,  habilidades  y/o  destrezas   que requiere su formación integral como profesionales  idóneos y como ciudadanos responsables;  CAPÍTULO V  MODELO DE ACREDITACIÓN EN ALTA CALIDAD DE INSTITUCIONES \n63  ACUERDO 01  DE 2025  d.    cuenta con las condiciones para responder adecuada- mente a los requerimientos formativos y de investiga- ción y se guía por un compromiso con la pertinencia y  la relevancia social que suponen ambientes educativos  equitativos e inclusivos;  e.    logra una articulación efectiva entre la administración  y la academia para el desarrollo de los propósitos insti- tucionales;  f.    desarrolla e implementa políticas de buen gobierno que  garantizan  la  estabilidad  institucional  y  aseguran  siste-  mas de gestión transparentes, eficaces y eficientes; g.    tiene  la  capacidad  de  inserción  en  una  dinámica  glo- bal,  comprende  las  dinámicas  sociales  culturales  y   productivas  de  las  regiones  en  donde  hace  presencia   y desarrolla estrategias y actividades de internacionali-  zación que benefician el desempeño de estudiantes y   profesores en un contexto global;  h.  implementa políticas eficaces de seguimiento a egre - sados; y  i.  cuenta con los recursos financieros para garantizar el   cumplimiento adecuado de sus  funciones  misionales,  y  con  los  recursos  físicos  y  tecnológicos  que  requiere    para el desarrollo de esas funciones.  Artículo 24. Acreditación en alta calidad de instituciones.    La acreditación en alta calidad de instituciones se aplica a aque- llas instituciones cuya oferta de programas académicos está li- mitada a un campus, o para aquellas que tienen una oferta or-  ganizada y diferencial en varios campus.  Las instituciones que cuenten con una oferta organizada  y diferencial podrán presentar para  evaluación  cada  uno  de   los campus. Para el caso de la oferta de programas acadé - micos por fuera de un campus, deberán presentar en el plan  de  mejoramiento  o  el  documento  que  haga  sus  veces,  las   acciones de consolidación y fortalecimiento de la oferta aca-  démica en las regiones con sus correspondientes avances. El   Consejo  Nacional de Acreditación -CNA- realizará visita a los  campus y determinará la pertinencia de la visita a los progra-  mas académicos ofertados en las regiones. \n64  Parágrafo.  Para efectos de la temporalidad en la acreditación  institucional  multicampus,  el  porcentaje  de  programas  acadé- micos acreditados sobre acreditables corresponde al global de   la institución. Para el cálculo de este porcentaje se tendrán en   cuenta todos los programas acreditados y, respecto de los acre- ditables, solo se tendrán en cuenta aquellos que hacen parte del  o los campus; es decir, no se incluirán los programas académicos   ofertados en regiones donde no se tenga un campus.  Artículo 25. Evaluación de la alta calidad de las institucio- nes.   La evaluación de la alta calidad de las instituciones implica   un ejercicio que no puede renunciar a su carácter interpretativo.   La evaluación integral que realiza el Consejo Nacional de Acre- ditación - CNA-, interpreta el sentido que tiene un hecho en un   contexto institucional y social específico, enmarcado en la natu - raleza jurídica, identidad, misión, organización y tipología insti-  tucional. Para efectos de la evaluación con fines de acreditación   en alta calidad de instituciones, los factores son los siguientes:  FACTOR 1.  Identidad institucional.  FACTOR 2.  Gobierno institucional, organización y transpa-  rencia.   FACTOR  3.   Desarrollo  ambientalmente  sostenible  y  ges-  tión institucional.   FACTOR 4.  Sistema interno de aseguramiento de la calidad.  FACTOR 5.  Estructura y procesos académicos.  FACTOR  6.   Aportes  de  la  investigación,  la  innovación,   el  desarrollo  tecnológico,  la creación e investigación-crea-  ción artística y cultural al entorno.  FACTOR 7.  Extensión, proyección e impacto social.   FACTOR 8.   Visibilidad regional, nacional e internacional.   FACTOR 9.  Bienestar institucional.  FACTOR 10.  Comunidad de profesores.   FACTOR 11.  Comunidad de estudiantes.   FACTOR 12.  Comunidad de egresados.  Los  anteriores  factores  se  evalúan  de  acuerdo  con  carac- terísticas  que  corresponden  a  referentes  universales  de  alta   calidad  y  a  las  particularidades  institucionales,  las  cuales  se    evidencian en los diferentes aspectos por evaluar. \n65 ACUERDO 01  DE 2025  Las  instituciones  que  ingresan  al  Sistema  Nacional  de   Acreditación  están  en  libertad  de  utilizar  sus  propias  meto- dologías,  recursos  e  instrumentos  para  la  recolección  y  eva-  luación de información, y de definir características adicionales  y aspectos por evaluar.  Artículo  26.  Factores  y  características  para  la  evalua- ción  de  instituciones.     Una  institución  de  alta  calidad  de- muestra su esfuerzo permanente por consolidar una cultura  institucional fundamentada en el mejoramiento permanen- te y la innovación académica, que se evidencia en cada uno   de los factores que a continuación se relacionan.  Parágrafo.  El Consejo Nacional de Acreditación -CNA- deter- minará, mediante lineamientos, el alcance de las características  y los aspectos por evaluar asociados a los factores institucionales,  de acuerdo con los elementos característicos que se declaran en   el proyecto educativo institucional o lo que haga sus veces.  FACTOR 1. Identidad institucional.  Una institución de alta ca- lidad tiene unos valores declarados coherentes con los princi- pios rectores de la alta calidad y un proyecto educativo institu- cional, o lo que haga sus veces, socializados y apropiados por   la comunidad. Estos son los referentes fundamentales para   el desarrollo de las labores formativas, académicas, docentes,   científicas, culturales y de extensión, en todo su ámbito de in -  fluencia y en las modalidades que la institución determine. A   su vez, cuenta con un proceso institucional participativo de va- loración y actualización sistemática, en el cual se evidencia la  inclusión de los diferentes estamentos y actores que intervie-  nen en el desarrollo y/o gestión de la institución.  Característica 1. Demostración de la coherencia, pertinen- cia y relevancia de la misión con el desarrollo de las labores   formativas, académicas, docentes, científicas, culturales y de   extensión.  La institución cuenta con una misión que es perti- nente y coherente con el medio social, cultural y ambiental, de  acuerdo  con  su  naturaleza  jurídica,  identidad,  tipología  y  con-  texto. Dicha misión es dinámica en la medida que implica una   evaluación  sistemática,  es  coherente  y  está  articulada  con  los   \n66  cambios del entorno. A su vez, se despliega en los objetivos y en  los procesos académicos y administrativos.  Característica 2. Apropiación del proyecto educativo insti- tucional, o lo que haga sus veces, por parte de la comunidad  académica.   La  institución  cuenta  con  un  proyecto  educativo   institucional, o lo que haga sus veces, como fundamento para el  gobierno institucional, la planeación, la administración, la evalua- ción y la autorregulación, y el desarrollo y proyección de sus labo- res formativas, académicas, docentes, de investigación-creación,   de innovación, científicas, artísticas y culturales, y de relación con  el sector externo (extensión o proyección social).  Característica  3.  Coherencia  de  los  resultados,  logros  e   impactos de la institución con su identidad.  La institución  de  alta  calidad  se  reconoce  porque,  además  de  contar  con   un proyecto educativo, o el que haga sus veces, en donde se   manifiesta su identidad, sus procesos de formación acadé - mica y profesional permite evidenciar el fortalecimiento per- manente de su comunidad académica en un ambiente que  incentiva el bienestar institucional y ofrece las oportunidades  para el desarrollo personal integral en las diferentes  dimen- siones  del  ser  humano;  y  de  manera  coherente  la  impronta    común institucional se manifiesta en los resultados, logros e   impactos en su quehacer cotidiano, en el ejercicio profesional  de sus egresados y en el modo como asume sus responsabi- lidades sociales y ciudadanas, que forman parte del recono-  cimiento de sus entornos sociales en general.  FACTOR  2.  Gobierno  institucional,  organización  y  trans- parencia.  Una institución de  alta calidad, de acuerdo con su  naturaleza  jurídica,  identidad,  misión,  tipología  y  contexto,   se  reconoce  por  tener  un  gobierno  que  ofrece  estabilidad   institucional,  ejercido  a  través  de  un  sistema  de  normas,  re- glamentos,  políticas,  estrategias,  decisiones,  estructuras  y   procesos,  dirigidos  al  servicio  de  los  intereses  generales  y  al   cumplimiento de su misión  y  proyecto  educativo  institucio-  nal, o lo que haga sus veces, bajo criterios de ética, eficiencia,   calidad, integridad, transparencia, inclusión, equidad y parti-  cipación de los miembros de la comunidad académica. \n67 ACUERDO 01  DE 2025  Característica  4.  Participación  efectiva  de  los  miem- bros  de  la  comunidad  institucional  en  las  decisiones  y  el    desarrollo institucional, bajo criterios de ética, eficiencia,   calidad, integridad, transparencia, inclusión y equidad.  Las  orientaciones estratégicas y las decisiones de política y desa- rrollo institucional se toman en el máximo órgano de gobier- no de la institución, el cual cuenta con la participación, entre  otros, de representantes de los sectores externos, los profeso- res, los estudiantes y los egresados, en coherencia con su na-  turaleza jurídica, identidad, misión y tipología.  Característica  5.  Consolidación  e  implementación  de  las   políticas en coherencia con su planeación y propósitos misio- nales.  La institución demuestra como resultado de sus políticas,  la existencia de múltiples relaciones e interacciones con los gru- pos de interés de la sociedad, la comunidad, el sector público y  privado, y los actores del Sistema de Aseguramiento de la Cali-  dad de la Educación Superior. Lo anterior en consonancia con   la naturaleza jurídica, identidad, misión y tipología de las institu- ciones, de manera que se articulen las políticas de la educación y   del desarrollo en general, mediante la generación de reflexiones   y prospectivas que contribuyan a las labores formativas, acadé- micas, docentes, de investigación-creación, de innovación, cien-  tíficas, artísticas y culturales, y de relación con el sector externo  (extensión o proyección social).  Característica  6.  Mecanismos  y  medios  utilizados  en  la   rendición de cuentas institucionales.  La institución desarro- lla  mecanismos  de  rendición  de  cuentas  periódicos  a  todos   sus grupos de interés y a la comunidad académica, mediante   procesos y métodos reflexivos, estructurados y documenta - dos,  que  permiten  un  análisis  objetivo  de  los  compromisos    establecidos y las acciones de mejoramiento.  FACTOR  3.  Desarrollo  ambientalmente  sostenible  y  gestión   institucional.  Una institución de alta calidad da cuenta de una  consolidada gestión institucional y de una arquitectura institu- cional  articuladas,  para  su  desarrollo  ambiental  sostenible  y  el   cumplimiento de sus labores formativas, académicas, docentes,   de investigación- creación, de innovación, científicas, artísticas y  \n68  culturales, y de relación con el sector externo (extensión o pro- yección  social),  en  correspondencia  con  su  naturaleza  jurídica,    identidad, misión, tipología y contexto regional.  Característica 7. Administración y gestión de la institución  en  el  desarrollo  ambiental  sostenible  y  permanente.  La ins- titución  demuestra  que  su  administración  y  gestión  son  sos- tenibles  social,  económica  y  ambientalmente,  se  ejercen  con    liderazgo, y que sus orientaciones están claramente definidas,   son conocidas por los distintos estamentos y contribuyen efec- tivamente a la estabilidad administrativa de la institución y a la  continuidad de sus políticas académicas orientadas al apoyo y   acompañamiento para una eficiente ejecución de sus labores   formativas,  académicas,  docentes,  de  investigación-creación,    de innovación, científicas, artísticas y culturales, y de relación  con el sector externo (extensión o proyección social), definidas   por ella en el marco de la Constitución y la ley, según su natura-  leza jurídica, tipología, identidad y misión.  Asimismo,  la  institución  desarrolla  políticas  de  estímulo,    promoción y cualificación de sus funcionarios, servidores y   contratistas e implementa un modelo de arquitectura institu- cional sostenible social, económica y ambientalmente, que se  expresa en la articulación de la organización, los procesos y los  cargos, con un seguimiento periódico que le permite eviden-  ciar oportunidades de mejora.  Característica  8.  Sistemas  de  comunicación  e  informa- ción actualizados, accesibles y necesarios para el mejora- miento de la institución.  La institución demuestra que man- tiene,  con  responsabilidad  social,  económica  y  ambiental,  y    alta cobertura, procesos y mecanismos de comunicación efi - cientes y actualizados que promueven y garantizan el dere- cho de acceso a la información y la protección de datos, con  observancia de los enfoques diferenciales, de manera que es-  tos sean apropiados por los destinatarios.  Característica  9.  Evolución  de  los  recursos  de  apoyo   académico acorde con las características de la comunidad  académica  y  en  coherencia  con  la  oferta  académica.   La   \n69 ACUERDO 01  DE 2025  institución demuestra la evolución en la dotación de equipos,  mobiliario,  plataformas  tecnológicas,  sistemas  informáticos,    recursos bibliográficos físicos y/o digitales, bases de datos, re - cursos  de  aprendizaje  e  información,  que  garantizan  la  dis- ponibilidad, el acceso, la adaptabilidad y aceptabilidad en los   ambientes de aprendizaje físicos y virtuales de que dispone.   Asimismo,  atiende  los  requerimientos  particulares  de  la  co- munidad  académica  con  responsabilidad  social  y  ambien- tal, para que estos recursos sean utilizados apropiadamente  y contribuyan a eliminar las barreras para el aprendizaje, en  el desarrollo de las labores formativas, académicas, docentes,   de investigación-creación, de innovación, científicas, artísti - cas y culturales, y de relación con el sector externo (extensión  o proyección social), de acuerdo con las características de los  programas  académicos  y  sus  modalidades,  en  correspon- dencia con su naturaleza jurídica, identidad, misión, tipología   y contexto regional.  Característica 10. Evolución de la infraestructura física y  tecnológica acorde con las características de la comunidad  académica y en coherencia con la oferta académica.  La ins- titución demuestra con responsabilidad social y ambiental, la   eficiencia de una infraestructura física y tecnológica con espa - cios físicos y virtuales e instalaciones para el desarrollo de las  labores  formativas,  académicas,  docentes,  de  investigación-    creación, de innovación, científicas, artísticas y culturales, y de   relación con el sector externo (extensión o proyección social)   en ambientes de bienestar.  La capacidad instalada está acorde con el número y carac- terísticas  de  los  programas  académicos  y  sus  modalidades,   en  correspondencia  con  su  naturaleza  jurídica,  identidad,    misión, tipología, contexto regional y ambiental. Para tal fin,   la  institución  evidencia  la  planeación,  gestión,  evolución  y   utilización  de  la  infraestructura  física  y  tecnológica  con  res- ponsabilidad social y ambiental, así como acciones que aco- gen  prácticas  de  inclusión  y  garantizan  una  actualización   adecuada  a  las  necesidades  de  la  formación  y  un  desarro- llo sostenible y armónico con las demandas del cuidado del   medio ambiente. \n70  Característica 11. Ejecución de los recursos financieros en   coherencia con el proyecto educativo institucional, los planes  de mejoramiento y el plan de desarrollo.  La institución cuenta   con patrimonio propio, solidez financiera y una asignación apro -  piada de recursos financieros para la operación y la inversión con   responsabilidad social y ambiental, de acuerdo con el desarrollo  de  las  labores  formativas,  académicas,  docentes,  de  investiga-  ción-creación, de innovación, científicas, artísticas y culturales, y   de relación con el sector externo (extensión o proyección social),  en  coherencia  con  su  naturaleza  jurídica,  tipología  e  identidad   institucional  y  con  las  modalidades  en  que  ofrece  sus  progra-  mas académicos. En consecuencia, la institución planea, ejecuta   y  proyecta  las  asignaciones  presupuestales  de  acuerdo  con  las   exigencias previstas en los procesos de planeación, los planes de  mejoramiento, el plan de desarrollo y el proyecto educativo como   parte de sus políticas de mejoramiento permanente.  FACTOR  4.  Sistema  Interno  de  Aseguramiento  de  la  Calidad.    Una institución de alta calidad construye una cultura de la autoe- valuación, autorregulación y el mejoramiento permanente, como   punto de partida de la reflexión crítica de su comunidad académi - ca desde donde se consolidan capacidades y procesos y se identi-  fican resultados, logros e impactos, generando planes de mejora - miento que inciden en las decisiones institucionales y ámbitos de   influencia, en desarrollo de su autonomía institucional. Por tanto,  contempla políticas, una estructura, y organización cualificada.  Característica  12.  Cultura  de  la  autoevaluación  desde    procesos de reflexión permanente de la comunidad ins - titucional  como  un  insumo  en  las  acciones  de  mejora- miento  permanente  y  autorregulación.   Es  el  conjunto  de   orientaciones,  prácticas  y  mecanismos  que  las  instituciones   implementan  para  el  seguimiento  sistemático  del  cumpli- miento de los objetivos misionales declarados, el análisis de  las condiciones en las que se desarrollan las labores misiona- les, la evaluación de los diferentes servicios y la aplicación de   medidas para el mejoramiento permanente.  La  institución  de  alta  calidad  ha  apropiado  la  cultura  de   la  autoevaluación  y  autorregulación,  por  lo  tanto,  evidencia   \n71 ACUERDO 01  DE 2025  resultados  de  mejoramiento  en  las  labores  formativas,  aca- démicas, docentes, de investigación-creación, de innovación,   científicas, artísticas y culturales, y de relación con el sector   externo (extensión o proyección  social)  y  en  todas  las  activi-  dades necesarias para sostenerlas. Para ello, da cuenta de la   participación de la comunidad institucional, con el soporte de  los sistemas de información articulados, que se evidencian en   la toma de decisiones y la ejecución de estas.  Característica 13. Gestión de la información como soporte  fundamental del aseguramiento de la calidad y del mejora- miento.  La institución consolida la gestión integrada de la infor- mación como un pilar del sistema interno de aseguramiento de  la  calidad,  con  alcance  a  todos  los  programas  académicos  y  al   avance en su mejoramiento; así mismo realiza los procesos de  actualización  de  datos  de  los  sistemas  nacionales  de  informa- ción siguiendo la normatividad vigente y hace uso de estos para   el mejoramiento de la institución y de sus programas.  Característica 14. Consolidación y evolución del sistema  interno  de  aseguramiento  de  la  calidad.   La  institución  da   cuenta de la consolidación y evolución del sistema interno de  aseguramiento  de  la  calidad,  y  de  mecanismos  articulados   de autoevaluación, autorregulación y mejoramiento perma-  nente. Este sistema, que evidencia la cultura de la calidad,  está basado, entre otros, en espacios de reflexión de la co - munidad institucional, en la sistematización, gestión y uso de  la  información,  en  la  evolución  basada  en  los  indicadores  y   metas propios y en la articulación de las acciones de mejora  con la planeación y las proyecciones presupuestales de la ins-  titución. Lo anterior, en coherencia con los principios rectores   de la alta calidad y con la naturaleza de las distintas labores  formativas, académicas, docentes, de investigación-creación,   de innovación, científicas, artísticas y culturales, y de rela - ción con el sector externo (extensión o proyección social), de   acuerdo con la oferta de sus programas académicos.  Característica 15. Evaluación integral de directivas, pro- fesores,  estudiantes  y  personal  administrativo  como  par- te del mejoramiento de la institución.  La institución aplica  \n72  sistemas  de  evaluación  institucionales,  que  incluyen,  entre   otros, la evaluación de los profesores y de las redes de trabajo  colaborativo que conforman, del personal administrativo y de   las directivas para favorecer su mejoramiento y cualificación.   Esta evaluación alcanza las distintas labores formativas, aca- démicas, docentes, de investigación-creación, de innovación,   científicas, artísticas y culturales, y de relación con el sector ex - terno (extensión o proyección social), de acuerdo con la iden- tidad de la institución y con las características de los progra-  mas académicos y sus modalidades. A partir de la evaluación  integral, la institución evidencia mejoramiento en la cualifi -  cación de los directivos, profesores y personal administrativo.  FACTOR 5. Estructura y procesos académicos.  Una institu- ción  de  alta  calidad  garantiza  la  efectividad  e  integridad  de   la articulación entre las políticas, procesos y procedimientos  institucionales  orientados  a  la  gestión  de  los  componentes   formativos,  pedagógicos,  de  evaluación,  de  interacción  y  de   relación social y ambiental, así como de  las  actividades  aca- démicas  y  los  procesos  formativos  que  se  concretan  en  la   oferta de programas académicos pertinentes y enmarcados   en la universalidad del conocimiento.  Característica 16. Componentes formativos acordes con  la  identidad  institucional  y  en  coherencia  con  el  proyec- to educativo.  La institución está comprometida, de acuerdo  con su misión y su proyecto educativo institucional, o lo que  haga  sus  veces,  con  el  desarrollo  de  planes  de  estudio  que   soportan los procesos y resultados académicos previstos y ex-  presados en los perfiles de ingreso y egreso establecidos, los   cuales  deberán  ser  monitoreados  y  evaluados,  de  tal  forma    que la institución utilice los resultados con el fin de generar   las estrategias necesarias para el mejoramiento permanente,   según su sistema interno de aseguramiento de la calidad.  La  institución  da  cuenta  de  una  política  de  créditos  acadé- micos  que  permite  establecer  el  número  total  de  créditos  de   cada uno de los programas académicos, en coherencia con la   normatividad vigente, las reflexiones internas y los referentes  que la institución define previamente. Asimismo, determina los  \n73 ACUERDO 01  DE 2025  criterios para la asignación de horas de trabajo independiente y  de interacción con el profesor, en el marco de las características  de cada programa académico y en coherencia con la naturale-  za jurídica, tipología, identidad y misión institucional.  Característica  17.  Coherencia  de  los  componentes  peda- gógicos  y  de  evaluación  con  la  identidad  institucional,  el   proyecto  educativo  y  la  oferta  académica.   La  institución  da   cuenta de los mecanismos y estrategias implementadas efecti- vamente para lograr la articulación y coherencia de los procesos   de enseñanza, aprendizaje y evaluación, con miras al logro de   los procesos y resultados académicos previstos, al mejoramien-  to permanente y a la innovación pedagógica y académica.  Característica 18. Relevancia social de los procesos acadé- micos  para  responder  efectivamente  a  los  cambios  propios   del contexto y a las necesidades de formación a lo largo de la  vida.  La institución demuestra que, de acuerdo con su naturale- za jurídica, identidad, misión, tipología y contexto, ha incorpora- do mecanismos de articulación para responder efectivamente a  los cambios propios del contexto y a las necesidades de forma- ción a lo largo de la vida, así como a las demandas propias de los  cambios  sociales,  culturales,  ambientales  y  tecnológicos  en  los    órdenes local, regional, nacional y global. Dichos mecanismos   sirven también para implementar las propuestas de articulación  de los programas académicos, las distintas modalidades, y para   el fortalecimiento de la inter y multidisciplinariedad.  Característica 19. Consolidación y fortalecimiento de los   procesos de creación, modificación y ampliación de progra - mas académicos acordes con las necesidades del contexto  y  del  conocimiento,  en  cumplimiento  de  la  normatividad   vigente.  La institución da cuenta en los procesos de creación,   modificación y ampliación de la oferta de programas acadé - micos de pregrado y de posgrado de la aplicación de políticas  y  procedimientos  que  promuevan  la  alta  calidad  y  el  mejo- ramiento  permanente  en  todos  los  programas  académicos,   atendiendo a las necesidades del contexto y del conocimien- to y cumpliendo la normatividad vigente y los procedimientos   establecidos por el Ministerio de Educación Nacional. \n74  Para la definición o modificación de las denominaciones y   de los créditos académicos, la institución evidencia coheren- cia con las políticas académicas institucionales y la normati-  vidad vigente.  FACTOR  6.  Aportes  de  la  investigación,  la  innovación,  el  de- sarrollo  tecnológico,  la  creación  e  investigación-creación  ar- tística  y  cultural  al  entorno.   Una institución de alta calidad, de  acuerdo con su naturaleza jurídica, identidad, misión y tipología,  se reconoce por tener procesos sobresalientes de formación para  la investigación, el espíritu crítico y la creación, y por sus aportes   al conocimiento científico, el desarrollo tecnológico, la innovación,   la transferencia y el desarrollo cultural, en todo su ámbito de in-  fluencia. Asimismo, evidencia su responsabilidad social a través   de  la  formación  que  ofrece,  del  impacto  de  sus  contribuciones    sociales, científicas, tecnológicas, culturales, de innovación, de   creación  artística  y  cultural  en  la  sociedad  y  de  su  compromiso   con una sociedad ambientalmente sostenible y con el análisis y la   gestión de los impactos relacionados con el desarrollo sostenible.  Característica 20. Resultados de las acciones de forma- ción para la investigación, creación e innovación en cohe- rencia con sus capacidades, procesos y proyecto educativo  institucional.  La institución aplica políticas y estrategias para  la  inserción  de  los  estudiantes  en  las  dinámicas  de  genera- ción,  apropiación,  sistematización  y  transferencia de conoci- mientos, aplicables de manera diferenciada, y para evidenciar  los resultados de esa inserción, de acuerdo con las caracterís-  ticas y modalidad del programa académico. Para ello, cuenta   con mecanismos efectivos para fomentar en los estudiantes,  un  pensamiento  creativo,  crítico  y  con  capacidad  de  com- prender los procesos de investigación, innovación, creación e  investigación-creación artística y cultural y del desarrollo tec-  nológico en diversos contextos.  Característica  21.  Procesos  de  investigación,  desarrollo   tecnológico,  innovación,  creación  e  investigación-creación   artística y cultural en coherencia con las capacidades, pro- cesos y el proyecto educativo institucional.  De acuerdo con  su naturaleza jurídica, identidad, misión y tipología, la institu- \n75 ACUERDO 01  DE 2025  ción evidencia los procesos de producción académica, inves- tigativa,  de  desarrollo  tecnológico,  innovación  y  de  creación,   y demuestra la aplicación de políticas claras y el compromiso   explícito con estas dimensiones del quehacer académico. Di - chas políticas se traducen además en acciones que incluyen el  fomento y la evaluación de la actividad investigativa, de inno- vación  y  creación  e  investigación-creación  artística  y  cultural   de los profesores, la difusión de sus productos, el apoyo a pro- yectos y la estructura organizacional para el desarrollo de estas  actividades, en coherencia con sus capacidades, procesos y el   proyecto educativo institucional o lo que haga sus veces.  Característica 22. Identificación de los logros alcanzados   e impactos generados derivados de los procesos de investi- gación, desarrollo tecnológico, innovación, creación e inves- tigación-creación  artística  y  cultural  en  coherencia  con  sus   capacidades, procesos y proyecto educativo.  La institución da  cuenta  de  la  coherencia  de  los  resultados,  logros  alcanzados  e   impactos generados en el periodo de observación, con las capa- cidades, procesos y declaraciones incluidas en su proyecto edu-  cativo institucional o lo que haga sus veces.  FACTOR  7.  Extensión,  proyección  e  impacto  social.   Una  insti- tución de alta calidad tiene una evidente capacidad de ser pros- pectiva en lo que hace, promueve y apoya un desarrollo de lar- go plazo, sostenible, económico, ambiental, tecnológico, social y  cultural, y atiende a los problemas de los lugares donde lidera la  creación de nuevo conocimiento, bajo el principio de acción sin   daño y de acuerdo con su identidad, misión y tipología. Asimis - mo,  la  institución  demuestra  compromiso  con  los  entornos  en   todos los lugares donde hace presencia por medio de sus pro- gramas académicos y de la ejecución de sus labores formativas,  académicas, docentes, de investigación-creación, de innovación,   científicas, artísticas y culturales, y de relación con el sector exter - no (extensión o proyección social), a través de políticas y progra-  mas específicos de proyección e interacción con el sector externo.  Característica 23. Visibilidad de las contribuciones realiza- das por la institución para el desarrollo sostenible, económi- co,  ambiental,  tecnológico,  social  y  cultural  del  entorno.   La  \n76  institución demuestra que define, mantiene y evalúa su inte - racción con la sociedad, los sectores productivos públicos y pri- vados,  y  las  organizaciones  que  buscan  impactar  el  desarrollo   económico,  ambiental,  tecnológico,  social  y  cultural,  de  forma    que pueda ejercer influencia positiva en el desarrollo de políti - cas, proyectos e iniciativas, en correspondencia con su natura-  leza jurídica, identidad, misión, tipología y contexto regional. La   pertinencia de las contribuciones realizadas por la institución es  sistematizada a través de los resultados y logros obtenidos que  contribuyen a generar procesos de aprendizaje asociados a los   procesos de autoevaluación.  Característica  24.  Contribuciones  de  la  institución  y  de   sus  programas  al  ejercicio  de  los  derechos  sociales,  eco- nómicos  y  culturales,  y  a  los  derechos  colectivos  y  del   ambiente  desarrollados  desde  la  Constitución  Política  de   Colombia.  La institución propende, identifica y visibiliza el   ejercicio  de  los  derechos  sociales,  económicos  y  culturales,   con  los  que  las  comunidades  académicas  contribuyen  para   el desarrollo de los derechos colectivos y del ambiente esta-  blecidos desde la Constitución Política de Colombia.
