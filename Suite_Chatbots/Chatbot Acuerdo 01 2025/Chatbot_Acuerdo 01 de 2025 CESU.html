  Característica 25. Identificación del impacto social, cultu - ral y artístico de la institución.  La institución evidencia en su  entorno el impacto social, cultural y artístico de su compromiso  con la gestión, el estudio, la protección y la salvaguarda del pa- trimonio  cultural  y  artístico  material  e  inmaterial  y  natural,  en   concordancia  con  la  normatividad  vigente  y  con  el  desarrollo   de sus actividades formativas, académicas, docentes, de inves-  tigación-creación, científicas, culturales, de innovación y de re -  lación con el sector externo (extensión o proyección social). Por   lo tanto, en el marco de sus políticas promueve la protección y  la salvaguarda de lo que ha sido culturalmente heredado, con- siderando las tradiciones y los saberes ancestrales como un le-  gado que debe ser conservado para las generaciones futuras.  FACTOR  8.  Visibilidad  regional,  nacional  e  internacional.    Una institución de alta calidad demuestra que ha fijado un   marco institucional para articular su quehacer con entornos  comunitarios, locales, regionales, nacionales e internacionales  \n77 ACUERDO 01  DE 2025  de tal forma que les permite a los estudiantes, los profesores,  el personal administrativo y los egresados reconocer diversas   culturas y aprender de ellas. La institución es reconocida en el   orden  regional,  nacional  e  internacional  y  demuestra  capa- cidades para acceder a recursos y saberes en el orden inter- nacional, para la comunicación intercultural y para el análisis   comparativo de sus procesos académicos y su contexto.  Característica  26.  Interacción  de  la  institución  en  con- textos locales, regionales, nacionales e internacionales.  La  institución estimula la interacción de los miembros de la co- munidad  institucional  con  miembros  reconocidos  de  otras   comunidades locales, regionales, nacionales e internaciona- les,  promueve  la  cooperación  con  programas  académicos  e   instituciones en el país y en el exterior, interactúa con orga- nizaciones  y  sectores  de  acuerdo  con  el  proyecto  educativo   institucional, o lo que haga sus veces, y da cuenta de los re-  sultados, logros e impactos de estas interacciones.  Característica  27.  Contribución  de  las  relaciones  externas   de profesores y estudiantes en el desarrollo de las labores for- mativas, académicas, docentes, de investigación-creación, de   innovación, científicas, artísticas y culturales, y de relación con   el sector externo (extensión o proyección social).  La institución  promueve la interacción con otras instituciones del orden local,  regional, nacional e internacional, así como con la diáspora cien-  tífica colombiana; así mismo favorece, apoya y coordina la mo - vilidad de profesores y estudiantes a través del desplazamiento   temporal, en doble vía, con propósitos académicos. Por lo tanto,   su comunidad académica logra competencias multiculturales y   de lenguaje que le permiten una interacción de mutuo beneficio  con otras comunidades en un contexto global. De la misma for - ma, comprende que la interacción en un contexto global se da  porque las labores formativas, académicas, docentes, de investi-  gación-creación, de innovación, científicas, artísticas y culturales,   y de relación con el sector externo (extensión o proyección social)  desarrollan  acciones  diferenciadoras  para  un  posicionamiento   global de la institución, bien sea por sus procesos de innovación   científica, tecnológica, social o ambiental, o porque la institución  atiende problemáticas de interés global. \n78  FACTOR  9.  Bienestar  institucional.   En  una  institución  de   alta calidad el bienestar institucional implica la existencia de  diferentes programas y protocolos de promoción, prevención  e  intervención  interna  y  en  el  entorno,  que  buscan  cumplir   con dos grandes objetivos: el primero es el mejoramiento de  la  calidad  de  vida  y  el  desarrollo  humano  de  los  miembros    de la comunidad académica con base en la identificación de   sus necesidades e intereses en relación con las artes, las cul- turas, las lúdicas y los deportes, entre otras áreas; el segundo  es mitigar los riesgos de afectación física, psicológica y social   que se presenten en la dinámica institucional. Por ello, la ins - titución cuenta con la estructura y la infraestructura adecua- da, de acuerdo con su naturaleza jurídica, identidad, misión y   tipología y, además, procura una flexibilidad curricular para   que todos y todas hagan uso de los servicios que se dispon-  gan. También cuenta con protocolos de prevención, detec - ción,  atención  de  violencias  y  cualquier  tipo  de  discrimina- ción  basada  en  género;  promoción,  prevención  y  atención   integral  de  la  salud  mental;  y  promoción,  detección  y  aten-  ción de violencias, acoso y discriminación.  Característica  28.  Políticas  del  bienestar  institucional   para el desarrollo humano y el mejoramiento de la calidad  de  vida  de  las  personas  de  su  comunidad.   La  institución    demuestra que ha definido y aplica políticas y protocolos de   bienestar  institucional  orientadas  a  promover  el  desarrollo   humano y el mejoramiento de la calidad de vida de la persona  y  del  grupo  institucional  (estudiantes,  profesores  y  personal    administrativo) como un todo. Estas acciones deben ser acor - des  con  las  condiciones  y  necesidades de  cada persona, en    cada uno de los lugares donde desarrolle sus labores. Asimis - mo, demuestra que las condiciones de bienestar promueven  el  desarrollo  integral  de  la  persona  y  sus  responsabilidades   dentro  de  una  comunidad  con  participación  y  compromiso    institucional.  Característica  29.  Consolidación  de  los  programas  y  la   infraestructura del bienestar acorde con las características  de  la  comunidad  de  la  institución  en  coherencia  con  su   oferta  académica,  desarrollo  y  planeación.   La  institución   \n79 ACUERDO 01  DE 2025  da cuenta del seguimiento al uso de los programas, recursos  e  infraestructura  de  bienestar  y  de  su  evaluación  y  mejora- miento periódico, en coherencia con las necesidades y carac-  terísticas de la comunidad de la institución.  Característica  30.  Estrategias  de  articulación  del  bien- estar  con  las  funciones  de  docencia,  investigación  y  ex- tensión  y,  con  el  acompañamiento  y  apoyo  académico  a   estudiantes.    La institución acompaña y apoya el desarrollo   integral  de  sus  estudiantes  e  implementa  mecanismos  de   inclusión para la atención de estudiantes de poblaciones di-  versas y con distintas características socioculturales. Además   articula  el bienestar  con  las funciones misionales de docen- cia, investigación-creación y extensión en el marco de los pro-  gramas académicos.  FACTOR  10.  Comunidad  de  profesores.   Una  institución  de    alta calidad evidencia la formación, perfil y compromiso de   sus profesores y establece las condiciones necesarias para ha-  cer posible un adecuado desempeño de estos en sus labores   formativas, académicas, docentes, de investigación-creación,   de innovación, científicas, artísticas y culturales, y de relación   con  el  sector  externo  (extensión  o  proyección  social),  en  co-  herencia con la misión declarada. Asimismo, promueve la   consolidación de una comunidad de profesores, caracteriza- da por la conformación de redes y el trabajo colaborativo, su  diversidad, su compromiso y su participación en la consolida-  ción de la identidad institucional.  Característica  31.  Procesos  de  selección,  vinculación  y   permanencia  e  impactos  en los logros de la institución.  A  partir de sus  políticas y normativa  interna, la institución  de-  muestra la aplicación transparente y eficaz de los criterios   establecidos para la selección, vinculación, promoción y per- manencia  de  los  profesores  y  para  el  reconocimiento  de  su    impacto en los logros institucionales.  Característica 32. Estatuto, trayectoria y reconocimiento  profesoral.   La  institución  aplica  y  fortalece  las  disposiciones   establecidas en el estatuto profesoral, o lo que haga sus veces,  \n80  en el que se definen, entre otros aspectos, sus derechos y de - beres, el régimen disciplinario, el escalafón docente, su parti- cipación en los órganos de gobierno de la institución y los cri- terios académicos e investigativos de vinculación, desarrollo,  evaluación y permanencia en la institución, evidenciando los  efectos  de  esas  disposiciones  en  la  trayectoria  profesoral,  la   inclusión y el reconocimiento de los méritos y el ascenso en el  escalafón, en coherencia con la naturaleza jurídica, identidad,   tipología, misión y oferta académica.  Característica  33.  Fortalecimiento  de  la  planta  profeso- ral  en  número,  dedicación,  formación  y  experiencia  para   materializar el proyecto educativo institucional.  La institu- ción  cuenta  con  una  planta  profesoral  diversa  en  su  origen    académico, demográfico, cultural y de género, apropiada con   relación  a  la  vinculación,  cantidad  y  dedicación  de  los  pro- fesores, su formación y desarrollo profesional, en coherencia  con  su  identidad,  tipología,  apuestas  pedagógicas  y  oferta    académica. Asimismo, muestra que ha establecido los me - canismos para la asignación del tiempo y de las actividades   de sus profesores de forma equitativa y eficiente para el lo - gro de los propósitos y objetivos misionales que se concretan  en el desarrollo individual y en entornos colaborativos, de sus  labores  formativas,  académicas,  docentes,  de  investigación-    creación, de innovación, científicas, artísticas y culturales, y de   relación con el sector externo (extensión o proyección social),   acordes con el tipo de vinculación y contratación.  La  diversidad  del  cuerpo  profesoral  mantiene  coherencia   con  la  naturaleza  jurídica,  identidad,  tipología,  misión  de  la    institución y modalidades de los programas académicos. De   la  misma  forma,  reconoce  las  características  propias  de  los   lugares de desarrollo de los programas académicos, y cuenta  con  estrategias  que  le  permitan  atender  con  alta  calidad  y    pertinencia la docencia en dichos lugares.  Característica  34.  Políticas,  capacidades,  procesos,  y  re- sultados del desarrollo profesoral en coherencia con el pro- yecto  educativo  institucional.   La  institución  demuestra  que   aplica políticas, adelanta programas y sistematiza los resultados  \n81 ACUERDO 01  DE 2025  del  desarrollo  profesoral,  así  como  el  reconocimiento  al  ejerci-  cio calificado de las labores formativas, académicas, docentes,  de investigación-creación, de innovación, científicas, artísticas y   culturales, y de relación con el sector externo (extensión o pro- yección social), de conformidad con los objetivos de la educa-  ción superior y de la institución. Estos programas incluyen a   todos los profesores vinculados a la institución por las distintas   formas de contratación y en todas las modalidades.  El desarrollo profesoral involucra el desarrollo de las com- petencias  pedagógicas  necesarias  para  atender  a  los  es- tudiantes  que  ingresan  a  la  institución,  de  acuerdo  con  las   modalidades de los programas académicos y con los reque- rimientos de la formación, la internacionalización y la inter y   multiculturalidad de profesores y estudiantes.  Característica 35. Coherencia entre los estímulos a la tra- yectoria de los profesores y el proyecto educativo institucio- nal.  La institución demuestra la divulgación, aplicación y actua- lización de criterios académicos en un régimen de estímulos   que reconoce y favorece el ejercicio calificado de las labores   formativas,  académicas,  docentes,  de  investigación-creación,    de innovación, científicas, artísticas y culturales, y de relación  con el sector externo (extensión o proyección social). La remu - neración  que  reciben  los  profesores  está  de  acuerdo  con  sus   méritos académicos y profesionales, en coherencia con el pro-  yecto educativo institucional o lo que haga sus veces.  FACTOR  11.  Comunidad  de  estudiantes.   Una institución de  alta  calidad  reconoce  los  derechos  y  deberes  de  sus  estu-  diantes, aplica las normas establecidas para tal fin, respeta   y  promueve  su  participación  en  los  órganos  de  gobierno  y   garantiza su ingreso y permanencia en el marco de políticas  de  equidad  e  inclusión  que  favorezcan  la  graduación  en  los   tiempos  establecidos  en  los  planes  de  estudio,  en  todos  los   lugares  donde  realiza  labores  formativas,  académicas,  do-  centes, de investigación-creación, de innovación, científicas,   artísticas y culturales, y de relación con el sector externo (ex- tensión  o  proyección  social),  en  coherencia  con  su  proyecto    educativo institucional o lo que haga sus veces. Asimismo,  \n82  promueve la consolidación de una comunidad de estudian- tes,  caracterizada  por  la  conformación  de  redes  y  el  trabajo   colaborativo,  su  diversidad,  su  compromiso  con  el  conoci- miento y con la sociedad y su participación en la consolida-  ción de la identidad institucional.  Característica 36. Impacto del estatuto estudiantil en el  proceso  formativo,  la  permanencia  y  la  graduación  opor- tuna.    La  institución  demuestra  que  aplica  las  disposiciones   establecidas  en  el  estatuto  o  reglamento  estudiantil  en  el   que se expresan, entre otros aspectos, sus derechos y debe- res, el régimen disciplinario y los criterios académicos de in- greso, permanencia, promoción, transferencia y graduación,  de acuerdo con las características y modalidades de la ofer-  ta académica. La institución demuestra que tiene un com - promiso  permanente  y  sistemático  con  el  ciclo  de  vida  del    estudiante en la institución y que, por lo tanto, acompaña su   proceso formativo e incentiva su interés por el aprendizaje a   lo largo de la vida.  Característica  37.  Resultados  de  los  programas  de  se- guimiento,  orientación,  acompañamiento  a  todos  los  es- tudiantes  y  atendiendo  a  la  diversidad,  el  pluralismo,  la   inclusión  y  la  interculturalidad.   La  institución  demuestra   que la admisión, la permanencia y el seguimiento de los es- tudiantes en la institución, y el desarrollo integral de ellos, se  enmarcan en criterios académicos y se expresan en políticas  equitativas e incluyentes que promueven el aprendizaje co- laborativo, de acuerdo con las características y modalidades   de la oferta académica. Por lo tanto, la institución evidencia   un compromiso visible con la efectividad de los procesos for- mativos de los estudiantes, quienes, por ello, tienen un mejor   desempeño que el promedio nacional en indicadores como  los asociados a la deserción y a la graduación, entre otros. Adi - cionalmente, muestra que realiza un ejercicio activo de carac-  terización de sus estudiantes al ingreso, con el fin de realizar  programas sistemáticos de seguimiento para el acompaña - miento a su proceso formativo, de tal forma que el estudiante  alcance los procesos y resultados académicos previstos en su   perfil de formación. \n83 ACUERDO 01  DE 2025  Característica 38. Resultados de los estímulos y apoyos  para  estudiantes.   La  institución evidencia  los  resultados de  los apoyos y estímulos, incluidos los económicos,  que propi- cian el ingreso, permanencia y graduación de los estudiantes,  en especial, para aquellos con méritos académicos y en con-  dición de vulnerabilidad.  FACTOR  12.  Comunidad  de  egresados.   Una  institución  de   alta calidad demuestra que  cuenta  con  programas  y  meca-  nismos de acompañamiento a sus egresados, con el propó - sito de favorecer la conformación de redes entre los mismos,  el  ejercicio  profesional  y  su  inserción  laboral,  el  aprendizaje   continuo y el retorno curricular desde su experiencia hacia los  programas académicos, apoyándose en sistemas de informa-  ción adecuados. Para esto, la institución cuenta con dinámi - cas que le permitan la interacción y el acercamiento con sus  egresados y sus redes, conocer su ubicación y las actividades   que desarrollan, a fin de garantizar la pertinencia de la oferta   educativa y la participación de los egresados en los procesos  de toma de decisiones, en coherencia con su naturaleza jurí-  dica, estatutos y demás reglamentos de la institución.  Característica 39. Evidencias del seguimiento y de la ca-  racterización de los egresados, identificando sus aportes a   las  innovaciones  curriculares  de  los  programas  académi- cos  y  las  transformaciones  institucionales  soportados  en   sistemas  de  información.   La  institución  demuestra  que  la   interacción con sus egresados y sus redes, y los resultados de   las evaluaciones sobre el desempeño y desarrollo de estos,   contribuyen  a  las  transformaciones  e  innovaciones  curricu- lares que favorecen los procesos y resultados académicos de  sus estudiantes y que fortalecen la pertinencia de los progra-  mas académicos. Por lo tanto, la institución implementa en   su  sistema  interno  de  aseguramiento  de  la  calidad  los  me- canismos necesarios para incorporar a sus egresados en sus   actividades y en los análisis realizados.  Característica 40. Identificación y sistematización del im - pacto  de  los  egresados  en  el  medio  social,  académico  y  los   reconocimientos  obtenidos .  La  institución  demuestra  que  \n84  cuenta  con  una  política  y  un  programa  institucional  de  egre- sados,  soportados  en  sistemas  de  información  que  facilitan  la    identificación, sistematización y evaluaciones permanentes, que   permiten poner en marcha la conformación de redes de egre- sados y acciones de mejora que favorecen la inserción laboral, el   desempeño, el emprendimiento y el impacto de los egresados   en el desarrollo de los territorios, en el medio social, académico y   la identificación de los reconocimientos obtenidos.  Característica  41.  Incidencia  de  los  programas  o  accio- nes con los egresados en el fortalecimiento del vínculo con  la Institución a lo largo de la vida.  La institución demuestra  que cuenta con los mecanismos para la interacción con sus  egresados y entre los mismos y que aprovecha sus contribu-  ciones en beneficio de las labores formativas, académicas,  docentes, de investigación-creación, de innovación, científi - cas, artísticas y culturales, y de relación con el sector externo   (extensión o proyección social).  Artículo  27.  Compromisos  de  las  instituciones  acredi- tadas en alta calidad.   Las instituciones con acreditación en  alta calidad asumen los siguientes compromisos:  a.    Conservar o mejorar, durante la vigencia de la acredita- ción, la calidad alcanzada en la totalidad de los factores  y las características, a partir de las cuales se desarrolló el   trámite de evaluación de la alta calidad. b.    De presentarse cambios sustantivos que afecten la alta  calidad, que fue reconocida en uno o varios de los com- ponentes del modelo de acreditación en alta calidad, el  Representante Legal de la institución deberá informar  oportunamente  al  Consejo  Nacional  de  Acreditación   -CNA-  sobre  tales  cambios  y  allegar  la  documenta- ción respectiva para que la institución sea evaluada de   nuevo, si el caso lo amerita. El resultado de la evalua - ción realizada por el Consejo Nacional de Acreditación  -CNA- deberá ser informado al Ministerio de Educación   Nacional. c.    La acreditación en alta calidad institucional se otorga- rá solamente de acuerdo con el  carácter  académico  o  \n85 ACUERDO 01  DE 2025  tipología de la institución en el momento de la evalua- ción,  según  sea  universidad,  institución  universitaria  o   escuela  tecnológica,  institución  tecnológica  o  institu- ción  técnica  profesional  y  todas  aquellas  habilitadas   por la ley para la oferta y desarrollo de programas aca-  démicos de educación superior. d.    En caso de cambio de carácter académico o tipología,  la acreditación otorgada con el carácter anterior conti- nuará  vigente  hasta  el  vencimiento  del  término  de  la    acreditación. Vencido este término, la institución podrá   adelantar el trámite de acreditación en su nuevo carác-  ter académico o tipología. e.    Divulgar y promover su acreditación en alta calidad, in- formando con precisión el lugar o lugares de desarrollo   evaluado(s), el número de años de vigencia de dicha   acreditación  y  el  número  de  la  resolución  ministerial   mediante la cual se otorga o renueva la acreditación en   alta calidad. f.    Hace parte de la responsabilidad de una institución de  educación  superior acreditada  en  alta  calidad  institu-  cional, difundir, promover y acompañar procesos de  acreditación. Este aspecto será tenido en consideración   para  la  renovación  de  la  acreditación  en  alta  calidad    institucional. g.    Cumplir con lo establecido en el artículo 54 del presen- te acuerdo en lo referente al avance de las acciones de  mejoramiento de la institución desde el Sistema Inter-  no de Aseguramiento de la Calidad -SIAC-. \n86  Artículo 28. Visitas de interacción y acompañamiento  a la alta calidad.  Las instituciones, cuando así lo consideren,  podrán  solicitar  al  Consejo  Nacional  de  Acreditación  -CNA-    visitas de interacción y acompañamiento. Estas visitas serán   realizadas  por  los  consejeros  del  Consejo  Nacional  de  Acre- ditación -CNA-, y de ser necesario apoyadas por personal de   la secretaría técnica. No se podrán efectuar a programas,   unidades  académicas  e  instituciones  que  tengan  en  curso   ante el Consejo Nacional de Acreditación -CNA- trámites de   acreditación.  Artículo 29. Trámite de acreditación en alta calidad.   El  trámite de acreditación en alta calidad, tanto para programas  académicos, unidades académicas, como para instituciones,  se desarrollará a través de las siguientes etapas:  a.  Apreciación de condiciones iniciales. b.  Autoevaluación. c.  Evaluación externa por pares académicos. d.  Evaluación integral. e.    Expedición del acto administrativo que concede la acredi-  tación o formula recomendaciones a la institución.  Artículo 30. Apreciación de condiciones iniciales.  Es el  proceso mediante el cual la institución, unidad académica o  los  programas  académicos  realizan  una  evaluación  que  les   permite  establecer una  línea base  frente a  los  factores  y  ca-  racterísticas definidos en el presente Acuerdo.  CAPÍTULO VI  VISITAS DE INTERACCIÓN Y ACOMPAÑA-MIENTO A LA ALTA CALIDAD Y TRÁMITE DE ACREDITACIÓN EN ALTA CALIDAD \n87  ACUERDO 01  DE 2025  La  apreciación  de  condiciones  iniciales  estará  a  cargo  de   los miembros del Consejo Nacional de Acreditación -CNA- y   constituye un proceso de valoración y acompañamiento que  permite identificar las potencialidades para continuar con el   trámite de acreditación de las instituciones, unidades acadé-  micas y los programas académicos.  Artículo  31.  Objeto  de  la  apreciación  de  condiciones  ini- ciales.    La  apreciación  de  condiciones  iniciales  tiene  por  objeto   establecer si un programa académico, unidad académica o una  institución, que busca obtener la acreditación en alta calidad, tie-  ne potencialidades para continuar en el trámite de acreditación.  El  propósito  de  la  apreciación  de  condiciones  iniciales  es   alcanzar  una  visión  preliminar  de  la  dinámica  y  funciona- miento  del  programa  académico,  unidad  académica  o  la   institución como un todo, para lo cual se valoran, entre otros  aspectos, el cumplimiento de la normatividad vigente, el go- bierno institucional, la organización académica y administra-  tiva, los profesores, los recursos físicos, tecnológicos y finan - cieros,  y  los  principales  resultados,  logros  e  impactos  de  la   institución, las unidades académicas y de los programas aca- démicos  en  sus  labores  formativas,  académicas,  docentes,    de investigación-creación, de innovación, científicas, artísticas   y culturales, y de relación con  el  sector  externo  (extensión  o    proyección social).  Asimismo, la apreciación de condiciones iniciales permite  a la institución, unidad académica o al programa académico  avanzar en el trámite de acreditación en alta calidad, para la  siguiente etapa de autoevaluación dando cuenta, entre otros,  de la incorporación de planes y programas de mejoramiento  con  acciones  de  corto,  mediano  y largo plazo, encaminados   a disminuir los aspectos a mejorar detectados por el Consejo   Nacional de Acreditación -CNA-. Estos avances deben ser in -  cluidos en la etapa de autoevaluación.  Artículo 32. Aspectos de las condiciones iniciales.  En la eta- pa  de  apreciación  de  condiciones  iniciales  una  institución,  una   unidad académica o un programa académico deberá presentar: \n88  a.    La evidencia de que se trata de una institución, unidad  académica  o  programa  acreditable,  según  correspon- da,  de  acuerdo  con  lo  dispuesto  en  el  literal  a),  b)  o  c)    del numeral 2.3 del artículo 2 del presente Acuerdo. b.  Un documento resultado de la reflexión de la comu - nidad institucional, de la unidad académica o del pro- grama académico, según corresponda, en el que se va- loran las capacidades y procesos, destacando cómo su  trayectoria y dinámicas han permitido alcanzar resulta- dos y logros que impactan la calidad de los diferentes  factores del modelo de acreditación en alta calidad, en  el(los)  campus,  la(s)  unidad(es)  académica(s)  o  el(los)   programa(s)  académico(s)  que  hacen  parte  del  trámi- te,  teniendo  como  referencia  el  artículo  10,  16  o  23  del    presente Acuerdo. c.    El documento del último proceso de autoevaluación de  la institución, unidad académica o programa académi- co soportado en el Sistema Interno de Aseguramiento   de la Calidad de la institución. Para la acreditación en   alta calidad de una unidad académica, la institución de- berá presentar un solo documento de autoevaluación  que  vincule  los  programas  acreditables  o  por  renova- ción de acreditación que la institución busca incluir en   el trámite de acreditación de una unidad académica. d.    El documento del plan de mejoramiento y el análisis de  los  avances  en  el  periodo  de  tiempo  correspondiente   al(los) campus, la(s) unidad(es) académica(s) o el(los) pro-  grama(s) académico(s) que haga(n) parte del trámite. e.    Los  cuadros  maestros  con  información  de  los  últimos    cinco (5) años, del(los) campus, la(s) unidad(es) acadé - mica(s)  y  del(los)  programa(s)  académico(s)  que  ha-  ga(n) parte del trámite. Para la acreditación en alta ca - lidad  de  una  unidad  académica,  la  institución  deberá   presentar  de  manera  independiente  y  por  programa   el(los) cuadro(s) maestro(s) del(los) programa(s) acredi- table(s) o por renovación de acreditación que la institu- ción busca incluir en el trámite de acreditación de una   unidad académica. Los cuadros maestros permiten la   sistematización de la información y de los datos, apor- tados por una institución, una unidad académica o un  \n89 ACUERDO 01  DE 2025  programa académico en un periodo de observación. Es   responsabilidad  de  los  sistemas  internos  de  asegura- miento de la calidad de la institución propender por la  coherencia de los datos en toda la documentación y en  las  presentaciones  que  soportan  cada  proceso  en  sus    distintas etapas. f.    La información y documentos previstos deben ser pre- sentados por la institución de acuerdo con las guías es-  tablecidas por el Consejo Nacional de Acreditación -CNA.  Parágrafo.   Para  iniciar  el  trámite  de  condiciones  iniciales    una institución deberá tener al menos cinco (5) años de fun - cionamiento continuo en el carácter académico en el que se   presenta al trámite de acreditación. Este término se contará   desde la fecha de expedición del acto administrativo por me- dio  del  cual  el  Ministerio  de  Educación  Nacional  autoriza  el    cambio de carácter académico o tipología.  Artículo  33.  Solicitud  de  apreciación  de  condiciones   iniciales.  Para la apreciación de condiciones iniciales, el Re- presentante  Legal  de  la  institución  presentará  la  solicitud,  a   través de la herramienta tecnológica o mecanismo que se dis- ponga para ello, en la que manifestará la intención de iniciar  el  trámite  de  acreditación  en  alta  calidad,  ya  sea  de  alguno   de sus programas académicos, unidades académicas o de la   institución. Para ello la institución deberá: a.    Adjuntar los documentos previstos en el artículo 32 del   presente Acuerdo. b.    Evidenciar que está al día con los requerimientos de in- formación en el Sistema Nacional de Información de la  Educación Superior -SNIES-, o el que haga sus veces, de   acuerdo con la normativa vigente. c.    No tener vigentes sanciones administrativas, medidas  de vigilancia especial o medidas para la protección tem- poral de los recursos, bienes y activos de la institución, ni   tener pendiente el cumplimiento de estas. d.    Presentar  los  documentos  expedidos  por  las  autori-  dades competentes en los que se certifique que los  \n90  miembros del máximo órgano de gobierno, directivos  o  representantes  legales,  no  son  deudores  alimenta- rios morosos, ni tienen vigentes condenas por actos de  discriminación de que tratan los artículos 134A y 134B,  delitos  contra  la  asistencia  alimentaria  de  que  trata  el   artículo 233, y delitos contra la libertad, integridad y for- mación sexuales de que trata el Título IV, libro segundo,  parte especial de los delitos en particular, de la Ley 599   de 2000 o normas que la modifiquen, o sanciones disci - plinarias que estén directamente relacionadas con las  conductas descritas en los delitos referidos de acuerdo   con la normativa aplicable. e.    Presentar  los  documentos  expedidos  por  las  autori-  dades competentes en los que se certifique que los   miembros  del  máximo  órgano  de  gobierno,  los  direc- tivos o representantes legales, no tienen vigentes con- denas contra la administración pública de que trata el  título  XV,  el  orden  económico  social  de  que  trata  el  tí- tulo X y el patrimonio económico de que trata el título  VII  del  libro  segundo,  parte  especial,  de  los  delitos  en   particular de la Ley 599 de 2000, o normas que la mo-  difiquen, o sanciones disciplinarias que estén directa - mente relacionadas con las conductas descritas en los   delitos referidos de acuerdo con la normativa aplicable.  Parágrafo  1.   Las  instituciones  con  acreditación  institucio- nal vigente no requieren de la apreciación de condiciones ini- ciales para la acreditación por primera vez de los programas  académicos de pregrado y posgrado, ni de unidades acadé-  micas. En el caso de las instituciones con acreditación por   campus,  sí  se  requiere  la  apreciación  de  condiciones  inicia- les cuando la unidad académica o el programa académico se  encuentre en un campus no acreditado; aunque sus códigos   SNIES estén asociados a un campus acreditado.  Parágrafo 2.  Las unidades académicas con acreditación de  alta calidad vigente no requieren de la apreciación de condi- ciones iniciales para la acreditación por primera vez de los pro-  gramas académicos de pregrado y posgrado que las integran. \n91 ACUERDO 01  DE 2025  Parágrafo 3.  Expirada la vigencia de la acreditación en alta  calidad  institucional,  de  unidad  académica  o  de  programa   académico, sin que la institución haya radicado el informe de  autoevaluación para su renovación en el tiempo dispuesto en  el presente Acuerdo, esta deberá solicitar nuevamente la apre-  ciación de condiciones iniciales.  Artículo 34.  Verificación de la solicitud de apreciación   de condiciones iniciales.  El Ministerio de Educación Nacio- nal con el apoyo del Consejo Nacional de Acreditación - CNA-   verificará la información a la que se refieren los artículos 32 y   33  del  presente  Acuerdo  y  podrá  solicitar  información  com-  plementaria.  Si la institución no da cumplimiento a lo solicitado por el Mi- nisterio de Educación Nacional y el Consejo Nacional de Acre- ditación -CNA- en el término legal, se entenderá desistida la  solicitud, salvo que antes del vencimiento de este plazo, soli-  cite prórroga hasta por un término igual y por una única vez.  Artículo 35. Visita de apreciación de condiciones iniciales.   Surtida la verificación de información, el Consejo Nacional de   Acreditación -CNA- designará el o lo(s) consejero(s) que llevarán  a  cabo  la  visita  de  apreciación  de  condiciones  iniciales,  la  cual   se realizará previa concertación de las fechas y la agenda con el   Representante Legal de la institución.  Para  la  apreciación  de  condiciones  iniciales  de  programas   académicos, unidades académicas y de instituciones, la visita  se realizará en todos los lugares de desarrollo que la institución   haya presentado en la solicitud. Para el caso de los programas  con registro calificado único deberán presentarse conforme al  registro calificado vigente.  Artículo 36. Informe de visita de apreciación de condi- ciones  iniciales.   El  o  los  consejeros  que  realizan  la  visita  de   apreciación de condiciones iniciales elaborarán y presentarán  el respectivo informe a través de la herramienta tecnológica   o mecanismo que se disponga para ello. \n92  Artículo 37. Concepto de apreciación de condiciones ini- ciales.  El Consejo Nacional de Acreditación -CNA- elaborará:  a.    Un concepto de cumplimiento de condiciones iniciales  cuando  evidencie  que  el  programa académico, la uni- dad académica o la institución cuenta con las condicio-  nes para avanzar a la etapa de autoevaluación con fines  de acreditación. b.    Un  concepto  de  no  cumplimiento  de  condiciones  ini- ciales  cuando  considere  que  el  programa  académico,   la unidad académica o la institución no cumple con las  condiciones para avanzar a la etapa de autoevaluación   con fines de acreditación. c.    Un concepto de cumplimiento parcial de condiciones  iniciales  cuando  considere  que  la  unidad  académica   cumple con las condiciones para avanzar a la etapa de   autoevaluación con fines de acreditación, pero uno o   varios  de  sus  programas  académicos  presentados  al    trámite no cumple con tales condiciones. d.    Un concepto de cumplimiento parcial de condiciones  iniciales  cuando  considere  que  la  unidad  académica   no  cumple  con  las  condiciones  para  avanzar  a  la  eta-  pa de autoevaluación con fines de acreditación, pero   uno  o  varios  de  sus  programas académicos presenta-  dos al trámite cumple con tales condiciones.  El  concepto  se  comunicará  al  Representante  Legal  de  la   institución a través de la herramienta tecnológica o mecanis-  mo que se disponga para ello.  Si  el  Consejo  Nacional  de  Acreditación  -CNA-  considera   que la institución, la unidad académica o el programa acadé- mico no cumple o cumple parcialmente con las condiciones  iniciales que le permitan continuar con la etapa de autoeva-  luación con fines de acreditación, esta podrá: i.    Radicar  una  nueva  solicitud  de  apreciación  de  condi- ciones  iniciales,  en  la  que  además  de  la  información   relacionada con los aspectos establecidos en los artícu- los 32 y 33 del presente Acuerdo, se incluya en el docu-  mento de reflexión y en los nuevos cuadros maestros la  \n93 ACUERDO 01  DE 2025  información  que  permita  evidenciar  las  acciones  ade- lantadas para atender los aspectos a mejorar conteni- dos en el concepto anterior emitido por el Consejo Na-  cional de Acreditación -CNA-, y sus avances. ii.    Retirar del trámite para acreditación de unidad acadé- mica el o los programas académicos que no cumplen  con las condiciones para avanzar a la etapa de autoeva-  luación con fines de acreditación, y presentarlo(s) para   un  trámite  posterior  de  acreditación  o  renovación  de    acreditación. iii.    Retirar  del  trámite  para  acreditación  la  unidad  acadé- mica que no cumple con las condiciones para avanzar   a la etapa de autoevaluación con fines de acreditación,   avanzar con el trámite de acreditación del o los progra- mas académicos  que  cumplen  con  las  condiciones,  y   presentar posteriormente la unidad para un trámite de   acreditación o renovación de acreditación.  Contra el concepto que emita el Consejo Nacional de Acre- ditación -CNA- procederá la solicitud de reconsideración para   la institución de educación superior.  Por su parte, si la institución que ha recibido concepto del  cumplimiento  de  la  apreciación  de  condiciones  iniciales,   dentro  de  los  veinticuatro  (24)  meses  siguientes  a  la  comu- nicación del concepto no presenta el informe de autoevalua-  ción con fines de acreditación, deberá solicitar nuevamente  la apreciación de condiciones iniciales.  Parágrafo transitorio.  Para las instituciones, unidades aca- démicas y programas académicos que a la fecha de expedi- ción del presente Acuerdo se encuentren dentro del plazo de  doce (12) meses contemplados en el Acuerdo 02 de 2020 para  la radicación del informe de autoevaluación, este plazo se ex- tenderá hasta los veinticuatro (24) meses a los que hace refe-  rencia el párrafo anterior.  Artículo 38. Solicitud de reconsideración.  A través de la  herramienta tecnológica o mecanismo que se disponga para  ello,  la institución  podrá solicitar  la reconsideración del  con- \n94  cepto de apreciación de condiciones iniciales emitido por el  Consejo  Nacional  de  Acreditación  -CNA-  dentro  de  los  diez    (10) días hábiles siguientes a la comunicación de este. El Con - sejo  Nacional  de  Acreditación  -CNA-  resolverá  la  solicitud  de    reconsideración mediante concepto en el que podrá ratificar  o modificar el concepto inicial.  Artículo 39. Autoevaluación.     La autoevaluación consiste  en  el  ejercicio  permanente  de  revisión,  reconocimiento,  re-  flexión e intervención que lleva a cabo la institución sobre sí   misma o sobre un programa académico o una unidad acadé- mica, con una amplia participación de la comunidad institu- cional y con el objetivo de valorar el desarrollo de sus funcio- nes sustantivas, en aras de lograr la alta calidad en todos sus  procesos, conforme los componentes del modelo de acredi-  tación en alta calidad establecidos en el presente Acuerdo. La   autoevaluación que adelanta internamente la institución cul- mina con un informe, el cual contiene los resultados, logros e   impactos y un plan de mejoramiento.  Artículo  40.  Presentación  del  informe  de  autoevalua- ción.   La institución presentará el informe de autoevaluación  y  los  documentos  requeridos  en  los  formatos  preestableci- dos, a través de la herramienta tecnológica o mecanismo que   se disponga para ello. La institución deberá dar cumplimien - to a lo dispuesto en los literales b), c), d) y e) del artículo 33 de   este Acuerdo.  Parágrafo  1.   La  radicación  del  informe  de  autoevaluación    con fines de acreditación de programa académico se deberá   realizar con no menos de dieciocho (18) meses de antelación   al vencimiento del correspondiente registro calificado.  Parágrafo 2.  La radicación del informe de autoevaluación   con fines de acreditación de una unidad académica se debe - rá presentar con no menos de dieciocho (18) meses de ante-  lación al vencimiento más próximo del registro calificado del   o los programas académicos acreditados o acreditables que  conforman  dicha  unidad  académica  y  que  harán  parte  del    respectivo trámite. \n95 ACUERDO 01  DE 2025  Parágrafo  3.   Al  momento  de  presentar  el  informe  de  au-  toevaluación con fines de acreditación de programa acadé - mico, unidad académica o institucional, se deberá mantener  el cumplimiento de las condiciones iniciales de las que tratan   los artículos 32 y 33 de este Acuerdo.  Parágrafo 4.  Los cuadros maestros serán presentados una  única vez con el documento de autoevaluación y no serán ac-  tualizados durante el proceso, a fin de preservar la consisten -  cia de la información en el periodo de observación.  Artículo 41. Condiciones para la presentación del infor-  me de autoevaluación con fines de acreditación en alta   calidad  de  programas  académicos.     Para  la  presentación    del informe de autoevaluación con fines de acreditación en   alta calidad de programas académicos, la institución deberá  cumplir con las siguientes condiciones:  a.    Desarrollar  cada  uno  de  los  componentes  del  modelo   de acreditación en alta calidad dispuestos en el presente   Acuerdo y en la forma que defina el Consejo Nacional de  Acreditación -CNA- en las respectivas guías. Relacionar la   información  respecto  de  los  lugares  de  desarrollo  y  mo-  dalidades autorizadas para el programa académico. Esto   incluye cuadros maestros de estudiantes y profesores para  la ampliación, recursos y medios educativos e infraestruc- tura, entre otros, para cada municipio(s), distrito(s), área(s),  no  municipalizada(s),  territorio(s)  indígena(s),  y/o  territo- rio(s) de consejo(s) comunitario(s) de pueblos negros, afro- colombianos,  raizales  y  palenqueros  que  lo  conforma(n),    donde se amplió la cobertura del programa académico. b.    Las ampliaciones de lugar de desarrollo del programa aca- démico y modalidades aprobadas con posterioridad a su  acreditación se evaluarán en el trámite de renovación de la   acreditación. Asimismo, las ampliaciones que se autoricen   al programa académico mientras se lleve a cabo el trámite   de acreditación, podrán ser objeto de evaluación en este. c.    Presentar  un  único  informe  de  autoevaluación  en  el   que se relacione toda la información de las modalida- des y lugares de desarrollo autorizados, cuando se tra- \n96  te de programas académicos que cuentan con registro   calificado único, los cuales serán evaluados de manera  conjunta y simultánea.   Asimismo, la ampliación de lugares de desarrollo del pro- grama  académico  e  inclusión  de  nuevas  modalidades   que  se  autoricen  mientras  se  lleva  a  cabo  el  trámite  de    acreditación, podrán ser objeto de evaluación en este. d.    Presentar  un  único  informe  de  autoevaluación  con  la   totalidad  de  programas  que  conforman  la  propuesta   de formación por ciclos, y no de forma independiente,   cuando se trate de programas académicos diseñados  curricularmente por ciclos propedéuticos. Este incluirá   los factores y características en los cuales la institución   pueda ir dando cuenta. e.    Evidenciar  en  el  informe  de  autoevaluación  las  acciones   y resultados que den cuenta de las recomendaciones del  Consejo Nacional de Acreditación -CNA- contenidas en el   concepto de cumplimiento de condiciones iniciales. f.    Desarrollar y soportar en el informe de autoevaluación  todos los  cambios  sustantivos  que haya presentado el  programa  académico  en  relación  con  las  condiciones    iniciales que fueron verificadas.  Articulo 42. Condiciones para la presentación del infor-  me de autoevaluación con fines de acreditación en alta   calidad de una unidad académica.  Para la presentación del   informe de autoevaluación con fines de acreditación de una   unidad  académica,  la  institución  deberá  cumplir  con  las  si- guientes condiciones:  a.    Desarrollar  en  el  informe  de  autoevaluación  el  factor   uno y dos de unidades académicas y sus características  establecidas  en  el  modelo  de  acreditación  de  unidad    académica, en la forma en que defina el Consejo Nacio -  nal de Acreditación -CNA- en la correspondiente guía.   Este  informe  además  debe  incluir  el  desarrollo  de  los   factores y características de los programas acreditables  o por renovación de acreditación que la institución bus- ca vincular en el trámite de acreditación de una unidad  \n97 ACUERDO 01  DE 2025  académica, de acuerdo con lo dispuesto en el artículo   20 del presente Acuerdo. Los cuadros maestros de los   programas  presentados  al  trámite  se  presentarán  de    manera independiente por cada uno de estos. b.    En correspondencia con la identidad, misión, valores y  principios declarados en el proyecto educativo institu- cional  o  lo  que  haga  sus  veces,  y  teniendo  en  cuenta   referentes nacionales e internacionales, se evidenciará  el cumplimiento de indicadores de logro de la unidad  académica y los mecanismos para su evaluación en sus  procesos académico-administrativos para el desarrollo  de  las  funciones  misionales,  de  docencia,  investiga- ción-creación y proyección social de los programas que  la integran, así como en el fortalecimiento de la forma- ción  docente  que  permite  la  consolidación  de  las  co-  munidades académicas. c.    Relacionar  la  información  respecto  de  los  lugares  de   desarrollo  y  modalidades  autorizadas  para  los  progra-  mas académicos que integran la unidad académica.   Esto incluye cuadros maestros de estudiantes y profe- sores para la ampliación, recursos y medios educativos  e  infraestructura,  entre  otros,  para  cada  municipio(s),   distrito(s),  área(s),  no  municipalizada(s),  territorio(s)  in- dígena(s),  y/o  territorio(s)  de  consejo(s)  comunitario(s)   de  pueblos  negros,  afrocolombianos,  raizales  y  palen- queros que lo conforma(n), donde se amplió la cober-  tura del o los programas académicos.  Las  ampliaciones  de  lugar  de  desarrollo  de  los  progra- mas  académicos  que  integran  la  unidad  académica  y   modalidades  aprobadas  con  posterioridad  a  su  acre- ditación se evaluarán en el trámite de renovación de la   acreditación. Asimismo, las ampliaciones que se autori - cen a los programas académicos que integran la unidad  académica mientras se lleve a cabo el trámite de acredi-  tación, podrán ser objeto de evaluación en este trámite. d.    Desarrollar y soportar en el informe de autoevaluación  todos  los  cambios  sustantivos  que  haya  presentado   la  unidad  académica  y  los  programas  que  la  integran   posteriores  a  la  apreciación  de  condiciones  iniciales    que fueron verificadas. \n98  Articulo 43. Condiciones para la presentación del infor-  me de autoevaluación con fines de acreditación en alta   calidad  institucional.   Para  la  presentación  del  informe  de    autoevaluación con fines de acreditación de la institución, es   necesario tener en cuenta las siguientes condiciones:  a.    Desarrollar  en  el  informe  de  autoevaluación  cada  uno   de los componentes del modelo de acreditación en alta   calidad, en la forma que defina el Consejo Nacional de   Acreditación -CNA- en las respectivas guías, en el caso  de  una  acreditación  multicampus  este  informe  debe    incluir todos los campus de manera integral. b.    En  correspondencia  con  su  identidad,  misión  y  tipo- logía,  y  teniendo  en  cuenta  referentes  nacionales  e   internacionales,  se  evidenciará  el  cumplimiento  de   indicadores  de  logro  institucionales  en  el  desarrollo   permanente  de  las  labores  formativas,  académicas,   docentes,  de  investigación-creación,  de  innovación,    científicas, artísticas y culturales, y de relación con el   sector externo (extensión o proyección social), así como   los mecanismos para su evaluación. c.    Si se trata de una primera acreditación, tener acredita- do  al  menos  el  treinta  por  ciento  (30%)  de  los  progra- mas  acreditables  de  acuerdo  con  lo  establecido  en  el    presente Acuerdo. d.    Desarrollar y soportar en el informe de autoevaluación  todos los cambios sustantivos que haya presentado la  institución en relación con las condiciones iniciales que   fueron verificadas.  Artículo 44.  Verificación del informe de autoevaluación.   Después  de  radicado  el  informe  de  autoevaluación,  el  Conse-  jo Nacional de Acreditación -CNA- verificará el cumplimiento   de las condiciones previstas en los artículos 31 y 32 del presen-  te Acuerdo y podrá solicitar información complementaria. Si la   institución  no  da  cumplimiento  a  lo  solicitado  por  el  Consejo   Nacional de Acreditación -CNA- en el término legal, se enten- derá  desistida  la  solicitud,  salvo  que  antes  del  vencimiento  de   dicho  plazo  solicite  prórroga  hasta  por  un  término  igual  y  por    una única vez. \n99 ACUERDO 01  DE 2025  Artículo 45. Evaluación externa por pares académicos.  Es  la  evaluación  que  realizan  los  pares  académicos,  con  base  en   el informe de autoevaluación y la visita realizada por ellos que  conduce a la elaboración y presentación de un informe sobre la  calidad del programa académico, la unidad académica y/o sus  programas o de la institución, teniendo en cuenta la naturale- za  jurídica,  identidad,  misión  y  tipología,  así  como  el  proyecto   educativo  Institucional  o  el  que  haga  sus  veces,  su  desarrollo   por parte de la unidad académica o el proyecto educativo, o lo   que haga sus veces, del programa académico. La evaluación   por pares se orienta a fomentar la colaboración y el aprendizaje   mutuo, a promover la identificación de buenas prácticas y el in -  tercambio de experiencias. Esta etapa consta de: 1.    Selección de la comisión de pares académicos  2.    Preparación y programación de la visita  3.    Visita de pares académicos  4.    Informe de pares académicos  5.    Envío del informe de pares a la institución  Selección  de  la  comisión  de  pares  académicos.   La  se- lección de la comisión de pares se realizará en uso del banco  de pares que dispondrá el Consejo Nacional de Acreditación   -CNA- para tal fin. El banco de pares deberá estar integrado   por expertos académicos nacionales e internacionales, cuyos   requisitos específicos serán establecidos por el Consejo Na - cional de Acreditación -CNA- y aprobados por el Consejo Na-  cional de Educación Superior -CESU-.  El Consejo Nacional de Acreditación -CNA- seleccionará la  comisión de pares académicos que realizará la visita de eva-  luación externa, cuyo número de integrantes se definirá en  cada caso. Una vez conformada la comisión y los pares aca - démicos hayan manifestado su aceptación formal, el Consejo  Nacional de Acreditación -CNA- informará a la institución so- bre la designación de pares a través de la herramienta tecno-  lógica o mecanismo que se disponga para ello.  La institución podrá solicitar al Consejo Nacional de Acredi- tación -CNA-, mediante escrito motivado, el cambio de cual- quiera de los pares académicos que conforman la comisión, y  \n100  de encontrarse mérito para acceder al cambio de conformi- dad  con  el  artículo  65  del  presente  Acuerdo,  el  Consejo  Na- cional de Acreditación -CNA- procederá a designar nuevo(s)   par(es) académico(s). La solicitud de cambio de pares acadé - micos  podrá  realizarse por una única vez, siempre y cuando   no se configure una causal de inhabilidad, incompatibilidad o  conflicto de intereses que motive un nuevo cambio.  Preparación y programación de la visita.  Previamente al  desarrollo de la visita, la comisión de pares deberá estudiar el  informe de autoevaluación y sus correspondientes anexos, lo  cual se constituye en el insumo necesario para la estructura-  ción de la agenda. De manera simultánea, la secretaría técni - ca del Consejo Nacional de Acreditación -CNA- acordará con   la institución la fecha y la agenda de la visita.  Una vez revisada integralmente la información suministra- da  por  la  institución,  unidad  académica  o  el  programa  aca- démico y en caso de necesitar información adicional para la  realización de la visita, el par coordinador de visita deberá co- municarlo  al  Consejo  Nacional  de  Acreditación  -CNA-,  a  tra- vés de la herramienta tecnológica o mecanismo que se dis-  ponga para ello.  Visita de pares académicos.  La secretaría técnica del Con- sejo Nacional de Acreditación -CNA- llevará a cabo las gestio- nes logísticas necesarias para el desarrollo de la visita acorde  con la fecha y agenda concertada a través de la herramienta   tecnológica o mecanismo que se disponga para ello. Una vez finalizada la visita, la institución realizará, en los for - matos  que  suministre  el  Consejo  Nacional  de  Acreditación   -CNA-, la evaluación de los pares académicos como uno de los   mecanismos para fortalecer el rol de los pares académicos.  Informe  de  pares  académicos.   Después  de  realizada  la   visita,  los  pares  académicos  elaborarán y presentarán el res- pectivo informe, a través de la herramienta tecnológica o me- canismo  que  se  disponga  para  ello  en  el  tiempo  estipulado    contractualmente para la presentación del informe. El Con - \n101 ACUERDO 01  DE 2025  sejo Nacional de Acreditación -CNA- podrá requerir aclaracio- nes y ajustes al informe, de conformidad con los parámetros   establecidos para su presentación.  En caso de presentación del informe o su ajuste por fuera  de los tiempos estipulados contractualmente para el mismo,  se considerará el incumplimiento del par académico con las   consecuencias legales que de ello se deriven.  Envío del informe de pares a la institución.  El informe de  los pares académicos será enviado al Representante Legal de  la institución a través de la herramienta tecnológica o meca-  nismo que se disponga para ello.  El Representante Legal podrá realizar las aclaraciones, pre- cisiones y complementos que considere necesarios, aportan-  do las evidencias correspondientes. Dichas observaciones de - berán  presentarse  a  través  de  la  herramienta  tecnológica  o    mecanismo que se disponga para ello.  Artículo  46.  Evaluación  integral.   La  evaluación  integral   de la alta calidad del programa académico, de la unidad aca- démica y sus programas o de la institución la realiza el Con- sejo Nacional de Acreditación -CNA- a partir de los resultados  de  la  autoevaluación,  del  informe  de  evaluación  externa  de   los pares académicos, y de los comentarios que la institución  realice al informe de los pares académicos y demás informa-  ción que se estime necesaria.  La evaluación integral concluye con un concepto del Con- sejo Nacional de Acreditación - CNA- sobre la calidad demos- trada por el programa académico, la unidad académica o la  institución, en el que se recomienda al Ministerio de Educa- ción  Nacional  la  acreditación  en  alta  calidad  y  su  tempora- lidad,  o  con  un  concepto  de  recomendaciones  de  mejora-  miento dirigido a la institución.  Artículo 47. Expedición del acto administrativo que con- cede la acreditación o formula recomendaciones a la insti- tución.   La acreditación en alta calidad de programa académico,  \n102  de una unidad académica y/o sus programas o de la institución  se hará constar en un acto administrativo expedido por el Minis-  terio de Educación Nacional, debidamente motivado.  De  presentarse  el  caso  en  el  cual  el  Consejo  Nacional  de   Acreditación  -CNA-  considere  que  no  se  han  alcanzado  las   condiciones  de  alta  calidad  para  lograr  la  acreditación  del   programa  académico,  la  unidad  académica  y/o  sus  progra- mas o de la institución, emitirá las recomendaciones de me-  jora pertinentes, las cuales en un marco de confidencialidad   serán comunicadas a la institución, a través de la herramienta   tecnológica o mecanismo que se disponga para ello.  Cuando  las  recomendaciones  de  mejora  se  presenten   sobre  unidades  académicas,  el  Consejo  Nacional  de  Acredi- tación  -  CNA  recomendará  el  otorgamiento  o  la  renovación   de  la  acreditación  de  los  programas  académicos  que  hayan   alcanzado  las  condiciones  de  alta  calidad  con  su  respectiva    temporalidad.  Parágrafo 1.  En el acto administrativo que conceda la acre- ditación en alta calidad a una unidad académica, se relacio- narán  de  manera  expresa  los  programas  académicos  de  di- cha unidad a los que se otorga o renueva la acreditación en   alta calidad y su temporalidad.  Parágrafo 2.  En el acto administrativo de acreditación en   alta calidad de la unidad académica, se identificará el nom - bre de la unidad académica acreditada y se le otorgará un nú-  mero de identificación de acreditación de unidad asociado al   código institucional del SNIES -Sistema Nacional de Informa-  ción de la Educación Superior-. Este número solo se tendrá  en cuenta para efectos informativos. Además, se relacionará   la temporalidad de la acreditación de la unidad, la denomina- ción de los programas que en ella se agrupan y que reciben la  acreditación en alta calidad o la renovación de esta y la tem-  poralidad que se le otorga a cada uno de ellos.  Parágrafo  3.   El  trámite  de  acreditación  en  alta  calidad  se   desarrollará  en  un  término  de  diez  (10)  meses,  contados  a   \n103 ACUERDO 01  DE 2025  partir de la radicación del informe de autoevaluación. El Con - sejo Nacional de Acreditación -CNA-, previa autorización del  Consejo  Nacional  de  Educación  Superior  -CESU-,  expedirá   la guía del trámite de acreditación en alta calidad, en la cual  precisará cada una de las etapas y los términos para el desa-  rrollo de estas.  Artículo 48. Recursos contra el acto administrativo de  acreditación en alta calidad.   Contra  el  acto  administrativo   que  concede  la  acreditación  en  alta  calidad  de  programa   académico,  unidad  académica  y/o  sus  programas  o  institu- cional procederá el recurso de reposición, en los términos del   Capítulo VI de la Ley 1437 de 2011 o la norma que lo modifique,  derogue o sustituya.  Artículo  49.  Entrega  de  la  acreditación  en  alta  calidad.    El  Ministerio  de  Educación  Nacional,  con  la  participación  del   Consejo Nacional de Acreditación -CNA-, hará entrega a la ins- titución de la acreditación en alta calidad institucional, en un   evento público con participación de la comunidad académica.  Artículo  50.  Reconsideración  de  las  recomendaciones   del Consejo Nacional de Acreditación -CNA-.   La institución,  a través de la herramienta tecnológica o mecanismo  que  se  disponga para ello, podrá solicitar la reconsideración del con- cepto  de  recomendaciones  de  mejoramiento  emitido  por   el  Consejo  Nacional  de  Acreditación  -  CNA-  en  la  etapa  de   evaluación  integral  dentro  de  los  treinta  (30)  días  calenda-  rio siguientes al recibo de la comunicación del concepto. El   Consejo Nacional de Acreditación -CNA- resolverá la solicitud  de  reconsideración  mediante  concepto  que  recomiende  la    acreditación o confirme el concepto de recomendaciones de  mejoramiento.  Artículo  51.  Temporalidad  de  la  acreditación.   La  tem- poralidad otorgada  podrá  ser de  seis  (6),  ocho  (8)  o  diez  (10)    años, dependiendo del grado de consolidación, sostenibi - lidad  e  impacto  de  la  unidad  académica,  el  programa  aca- démico o de la institución, el grado de madurez del sistema  interno  de  aseguramiento  de  la  calidad  de  la  institución,  la   \n104  forma  en  que  la  institución  utiliza  los  resultados  obtenidos   para el mejoramiento permanente y su capacidad de soste-  ner en un tiempo (años de acreditación) la calidad acredita - da, de acuerdo con el modelo de acreditación en alta calidad   definido en el presente Acuerdo.  Parágrafo 1.  En el trámite de acreditación de unidades aca- démicas, la temporalidad de la acreditación de la unidad será  independiente de la temporalidad de la acreditación de cada  uno de los programas académicos que resulten acreditados   o que renueven su acreditación en dicho trámite. El Consejo   Nacional  de  Acreditación  -CNA-  recomendará  la  temporali- dad de la acreditación otorgada a la unidad y/o de cada pro-  grama académico.  Parágrafo  2.   La  temporalidad  de  la  acreditación  de  los   programas académicos que se presentan a renovación de la  acreditación en alta calidad, en el marco del trámite de acre- ditación de unidades académicas, deberá tener en conside- ración  la  temporalidad  más favorable teniendo en cuenta la  que se otorgue a la unidad académica y la que goza  al  mo- mento de presentarse en el informe de autoevaluación de la   unidad académica.  Parágrafo  3.   En  el  caso  de  la  acreditación  en  alta  calidad   institucional,  la  máxima  temporalidad sólo se podrá otorgar  a aquellas instituciones que, además de cumplir con los más  altos  criterios  de  calidad  y  la  realización  de  sus  propósitos  y   objetivos de acuerdo con la evaluación integral que realiza el  Consejo Nacional de Acreditación  -CNA-, tengan  acreditado  al menos el cincuenta por ciento (50%) de los programas aca-  démicos acreditables. \n105  ACUERDO 01  DE 2025  Artículo 52. Renovación de la acreditación en alta calidad.   La renovación de la acreditación de programa académico, uni- dad  académica  o  institucional  corresponde  a  un  proceso  que    define los criterios generales que tendrá en cuenta la institu - ción, la unidad o el programa, y que son presentados a conside- ración del Consejo Nacional de Acreditación -CNA- para la reno-  vación de dicha acreditación. Al igual que la acreditación inicial,  la renovación de esta es voluntaria y temporal.  El trámite de renovación de la acreditación en alta calidad  se enfoca en el estudio, el análisis y la evaluación de la conso- lidación y proyección de las fortalezas que han caracterizado  a la institución, la unidad académica o al programa académi- co, para lo cual  se  tendrá  en  cuenta  la  comprobación  de  la   efectividad de los planes de mejoramiento resultados de los  procesos de autoevaluación e integrado por las oportunida-  des de mejora identificadas a lo largo del trámite de acredita - ción y la capacidad innovadora que demuestra el programa   académico, la unidad académica o la institución.  Parágrafo 1.  Para el proceso de renovación de la acredita- ción institucional se debe tener al menos acreditados el trein- ta  por  ciento  el  (30%)  de  los  programas  académicos  acredi- tados sobre los acreditables o demostrar el incremento en el  número de programas acreditados con relación al proceso de   acreditación anterior.  Parágrafo 2.  Si la institución radica la solicitud de renovación  de acreditación del programa académico, unidad académica  y/o programas académicos que la integran o institucional con   CAPÍTULO VII  RENOVACIÓN DE LA ACREDITACIÓN EN ALTA CALIDAD Y TRÁMITE \n106  la antelación señalada en el numeral primero del artículo 53   del presente Acuerdo, la vigencia de la acreditación se enten-  derá prorrogada hasta que concluya el trámite.  Artículo 53. Trámite de renovación de la acreditación en  alta calidad.  El trámite para la renovación de la acreditación del  programa  académico,  unidad  académica  y/o  sus  programas  o   institucional  se  desarrollará  conforme  a  lo  dispuesto  en  el  pre- sente Acuerdo, en todo caso se tendrá en cuenta lo siguiente:  1.    El  Representante  Legal  de  la  institución  presentará,  a   través de la herramienta tecnológica o mecanismo que  se disponga para ello, el informe de autoevaluación con   fines de renovación de la acreditación en alta calidad   con no menos de doce (12) meses de anticipación a la  fecha de vencimiento de la acreditación del programa  académico, de la unidad académica y/o sus programas   vinculados o institucional. Dicho informe deberá sinte - tizar los resultados de la autoevaluación para cada fac- tor y característica, y expresar la situación actual de las   recomendaciones de mejoramiento identificadas para   cada uno, especialmente en relación con aquellas for-  muladas en el trámite de acreditación anterior. 2.  Una vez recibido el informe de autoevaluación, se verifi - cará la completitud de este, y en caso de no requerirse  información  complementaria,  el  Consejo  Nacional  de   Acreditación -CNA- procederá a designar los pares aca- démicos  que  han  de  realizar  la evaluación externa del   programa  académico,  unidad  académica  y/o  progra-  mas que la integran o de la institución. La secretaría   técnica  del  Consejo  Nacional  de Acreditación -CNA-  deberá llevar a cabo las gestiones logísticas necesarias  para  el  desarrollo  de  la  visita  acorde  con  la  fecha  y  la   agenda concertadas a través de la herramienta tecno-  lógica o mecanismo que se disponga para ello.  Si la institución no da cumplimiento a lo solicitado por  el Consejo Nacional de Acreditación -CNA- en el térmi- no legal, se entenderá desistida la solicitud de renova- ción  de  acreditación,  salvo  que  antes  del  vencimiento   de  dicho  plazo  solicite  prórroga  hasta  por  un  término    igual y por una única vez. \n107 ACUERDO 01  DE 2025  3.    Los  pares  académicos  realizarán  la  visita  teniendo  en   cuenta el informe de autoevaluación de la situación ac- tual del programa académico, la unidad académica y/o  sus  programas  o  de  la  institución  y  el  concepto  de  la   evaluación  integral  del  Consejo  Nacional  de  Acredita- ción -CNA- que dio lugar a la acreditación del programa   académico, la unidad académica o de la institución. 4.    La comisión de pares académicos, una vez realizada la  visita,  elaborará  el  informe  de  evaluación  externa  y,  a   través de la herramienta tecnológica o del mecanismo  que se disponga para ello, lo pondrá en conocimiento  del Consejo Nacional de Acreditación -CNA-,  quien  podrá  pedir  las  aclaraciones  y  comple-  mentos que estime pertinentes. El Consejo Nacional de   Acreditación -CNA- enviará, a través de la herramienta  tecnológica  o  mecanismo  que  se  disponga  para  ello,   copia  del  informe  de  evaluación  externa  al  Represen-  tante Legal de la institución para sus comentarios. 5.    El Consejo Nacional de Acreditación -CNA-, una vez re- cibidas  las  observaciones  de  la  institución,  emitirá  su   concepto sobre la alta calidad del programa académi- co,  la  unidad  académica  y/o  de  los  programas  que  la   integran o de la institución, con base en el informe de  autoevaluación, el informe de la evaluación externa por  parte de los pares y los comentarios de la institución a   este último informe. 6.    La  evaluación  integral  concluye  con  un  concepto  del   Consejo  Nacional  de  Acreditación  -CNA-  en  el  que  se   recomienda  al  Ministerio  de  Educación  Nacional  la   acreditación  en  alta  calidad  y  su  temporalidad,  o  con   un  concepto  de  recomendaciones  de  mejoramiento    dirigido a la institución.  De  presentarse  el  caso  en  el  cual  el  Consejo  Nacional   de Acreditación -CNA- considere que no se han alcan- zado  las  condiciones  de  alta  calidad  para  lograr  la  re- novación  de  la  acreditación  del  programa  académico,   unidad  académica  y/o  sus  programas  académicos  o   institucional,  emitirá  las  recomendaciones  de  mejora    pertinentes que en un marco de confidencialidad serán   comunicadas a la institución a través de la herramienta  \n108  tecnológica o mecanismo que se disponga para ello. 7.    La acreditación en alta calidad del programa académi- co, unidad académica y/o programas académicos que  la integran o de la institución se hará constar en un acto  administrativo  expedido  por  el  Ministerio  de  Educa-  ción Nacional, debidamente  motivado. 8.    La institución podrá, a través de la herramienta tecno- lógica o mecanismo que se disponga para ello, solicitar  la  reconsideración  del  concepto  de  recomendaciones   de  mejoramiento  emitido  por  el  Consejo  Nacional  de   Acreditación -CNA- en el trámite de  la acreditación en  alta calidad del programa académico, unidad académi- ca y/o de los programas que la integran o de la institu- ción dentro de los treinta (30) días calendario siguientes   al recibo de la comunicación del concepto. 9.     El Consejo Nacional de Acreditación -CNA- resolverá la  solicitud  de  reconsideración  mediante  concepto  que    recomiende la acreditación o confirme el concepto de  recomendaciones de mejoramiento. 10.  Contra  el  acto  administrativo  de  renovación  de  la   acreditación  en  alta  calidad  de  programa  académi- co, unidad académica y/o programas que la integran o  institucional  procederá el recurso de reposición, en los   términos de la Ley 1437 de 2011 o la norma que la modifi -  que, derogue o sustituya. 11.    El  Ministerio  de  Educación  Nacional,  con  la  participa- ción del Consejo Nacional de Acreditación -CNA-, hará  entrega a la institución de la renovación de la acredita- ción en alta calidad institucional, en un evento público   con participación de la comunidad académica.  Parágrafo 1.  A partir de la vigencia del presente Acuerdo,  las instituciones deberán solicitar la renovación de la acredita-  ción en alta calidad con la antelación prevista en este artículo.  Parágrafo  2.   Si  la  institución  radica  el  informe  de  autoe- valuación  de  un  programa  académico,  unidad  académica   y/o programas académicos que la integran y de la institución  con  la  antelación  prevista  en  este  artículo,  la  vigencia  de  la   acreditación se extenderá hasta que se produzca el concepto  \n109 ACUERDO 01  DE 2025  de recomendaciones del Consejo Nacional de Acreditación y  el acto administrativo por el cual el Ministerio de Educación   Nacional otorga la acreditación en alta calidad.  Parágrafo 3.  Para la solicitud de la renovación de la acredi- tación institucional gradual por campus es necesario contar   con acreditación vigente en el campus principal.  Parágrafo 4.  Al momento de presentar el informe de autoe-  valuación con fines de renovación de acreditación de programa   académico,  unidad  académica  o  institucional,  según  corres- ponda,  se  deberá  mantener  el  cumplimiento  de  las  condicio-  nes iniciales de las que tratan el artículo 33 de este Acuerdo. Sin   embargo, en la solicitud de la renovación no se tendrá en cuen-  ta lo definido en la etapa de apreciación de condiciones iniciales  con relación al cambio de carácter de la institución. \n110  Artículo  54.  Avance  de  las  acciones  de  mejoramiento   desde el Sistema Interno de Aseguramiento de la Calidad  -SIAC-.  Las instituciones realizarán el seguimiento al avance  de  las  acciones  de  mejoramiento  de  sus  programas  acadé- micos  y  de  sus  unidades  académicas  acreditados,  en  consi- deración a lo establecido en su Sistema Interno de Asegura-  miento de la Calidad -SIAC-.  Las  instituciones  acreditadas  deberán  enviar  en  un  úni- co  documento  al  Consejo  Nacional  de  Acreditación  -CNA-  el   avance de su plan de mejoramiento institucional, así como el  avance de sus unidades académicas acreditadas, a la mitad de   la vigencia de la acreditación institucional, en donde se refle -  jen las acciones de mejoramiento y la consolidación del SIAC.  A partir de la vigencia del presente Acuerdo, las institucio- nes  acreditadas  o  no  acreditadas  institucionalmente  y  que   tengan programas acreditados en alta calidad deberán enviar  a la mitad de la vigencia de la acreditación de cada uno de los  programas  académicos  acreditados,  por  una  única  vez,  el  in- forme de avance de las acciones de mejoramiento, soportado   en el Sistema Interno de Aseguramiento de la Calidad -SIAC-. Parágrafo. El Consejo Nacional de Acreditación -CNA- ex - pedirá una guía sobre los sistemas internos de aseguramien- to de la calidad -SIAC-, que incluirá, entre otros, aspectos del   seguimiento al avance de las acciones de mejora.  Artículo 55. Visitas de seguimiento.  El Consejo Nacional  de Acreditación -CNA- podrá, como parte de la evaluación in-  CAPÍTULO VIII  COMPLEMENTOS AL PROCESO DE LA ACREDITACIÓN EN ALTA CALIDAD \n111  ACUERDO 01  DE 2025  tegral, recomendar la realización de visitas de seguimiento de   los planes de mejoramiento. Estas visitas podrán ser realiza - das  por  consejeros  o  exconsejeros  del  Consejo  Nacional  de    Acreditación -CNA-.  Parágrafo.  El Consejo Nacional de Acreditación -CNA- re- glamentará la visita de evaluación externa para seguimiento  por parte de consejeros o exconsejeros del Consejo  Nacional   de Acreditación -CNA- en seis (6) meses. Artículo 56. Publicidad de la acreditación en alta calidad.   Una institución, una unidad académica o un programa aca-  démico de educación superior solo podrá utilizar el califica - tivo  de  “Acreditado  en  alta  calidad”  cuando  el  Ministerio  de   Educación Nacional le haya otorgado o renovado, mediante   resolución, la acreditación en alta calidad. La acreditación en   alta calidad de programas académicos o unidades académi- cas  no  conduce  automáticamente  a  la  acreditación  en  alta   calidad de instituciones; esta se concede mediante acto ad- ministrativo independiente y como consecuencia de una so-  licitud específica.  En la publicidad de la institución, la unidad académica o del   programa académico donde se señale el calificativo de “Acre - ditada  en  alta  calidad”  se  deberá  hacer  referencia  al  número    de años de vigencia y el número de la resolución ministerial  por la cual se otorga o renueva la acreditación en alta calidad. \n112  Artículo  57.  Terminación  anticipada  del  trámite  de   acreditación en alta calidad.  Si durante cualquier etapa del   trámite de acreditación se configura alguna de las siguientes   situaciones, se dará por terminado el trámite de acreditación  o  renovación  de  acreditación  en  alta  calidad  según  corres- ponda, de programa, unidad académica o institucional:  a.    Imposición de sanciones administrativas a la institu-  ción por parte del Ministerio de Educación Nacional. b.    Imposición de medidas de vigilancia especial por par-  te del Ministerio de Educación Nacional. c.    Imposición de medidas para la protección temporal  de los recursos, bienes y activos de la institución por   parte del Ministerio de Educación Nacional. d.    Condena vigente contra uno o varios de los miembros  del máximo órgano de gobierno, directivos o repre- sentantes legales, por actos de discriminación de que  tratan los artículos 134A y 134B, delitos contra la asis- tencia alimentaria que trata el artículo 233, y delitos  contra la libertad, integridad y formación sexuales de   CAPÍTULO IX  TERMINACIÓN ANTICIPADA DEL TRÁMITE DE ACREDITACIÓN EN ALTA CALIDAD Y PÉRDIDA DE EJECUTORIEDAD DEL ACTO ADMINISTRATIVO QUE OTORGA O RENUEVA LA ACREDITACIÓN EN ALTA CALIDAD \n113  ACUERDO 01  DE 2025  que trata el Título IV, libro segundo, parte especial de  los delitos en particular, de la Ley 599 de 2000 o nor-  mas que la modifiquen, o sanciones disciplinarias que   estén directamente relacionadas con las conductas  descritas en los delitos referidos de acuerdo con la   normativa aplicable. e.    Condena vigente contra uno o varios de los miembros  del máximo órgano de gobierno, directivos o repre- sentantes legales, por delitos contra la administración  pública de que trata el título XV, el orden económico  social de que trata el título X y el patrimonio econó- mico de que trata el título VII del libro segundo, parte  especial, de los delitos en particular, de la Ley 599 de   2000 o normas que la modifiquen, o sanciones disci - plinarias que estén directamente relacionadas con las  conductas descritas en los delitos referidos de acuerdo   con la normativa aplicable. f.    Deuda vigente por alimentos de uno o varios de los  miembros del máximo órgano de gobierno, de los di-  rectivos o representantes legales.  Cuando el Ministerio de Educación Nacional tenga cono-  cimiento por algún medio de la configuración de alguna de   las causales referidas,  previa recomendación  académica del  Consejo Nacional de Acreditación -CNA, dará por terminado  el trámite de acreditación según corresponda, de programa,  unidad académica o institucional, en la etapa en que se en-  cuentre mediante acto administrativo que será notificado  oportunamente al Representante Legal de la institución. De   igual forma se procederá cuando en el curso del trámite de  acreditación en alta calidad de programa académico expire la   vigencia del registro calificado de conformidad con las dispo - siciones contenidas en el Decreto 1075 de 2015 o normas que   lo modifiquen.  La institución, a través de la herramienta tecnológica o me- canismo que se disponga para ello, podrá solicitar al Ministerio  de Educación Nacional, la reconsideración de la terminación  anticipada del trámite de acreditación en alta calidad según  corresponda,  de  programa,  unidad  académica  o  institucio- \n114  nal, dentro de los diez (10) días hábiles siguientes a la notifi -  cación de este. El Ministerio de Educación Nacional resolverá  la solicitud de reconsideración mediante acto administrativo. Parágrafo. Cuando se presenten las causales descritas en   los  literales  d),  e)  y  f),  la  institución  podrá  subsanar  por  una   única vez, en el marco de su autonomía universitaria, la situa-  ción que originó la misma. Si la situación persiste, se configu - rará  la  causal  para  que  se  evalúe  la  terminación  anticipada    del trámite de acreditación.  Artículo  58.  Pérdida  de  ejecutoriedad  del  acto  adminis- trativo que otorga o renueva la acreditación en alta calidad.   Se podrá configurar la pérdida de ejecutoriedad del acto admi - nistrativo que otorga o renueva la acreditación en alta calidad,  según corresponda, de programa académico, unidad académi- ca  o  institucional,  si  durante  su  vigencia  ocurre  alguna  de  las    situaciones que se relacionan a continuación. Para estos efectos   se adelantará el procedimiento previsto en el artículo 59 de este   Acuerdo. a.    Imposición de sanciones administrativas a la institu-  ción por parte del Ministerio de Educación Nacional. b.    Imposición de medidas de vigilancia especial por par-  te del Ministerio de Educación Nacional. c.    Imposición de medidas para la protección temporal  de los recursos, bienes y activos de la institución por   parte del Ministerio de Educación Nacional.  Artículo 59. Procedimiento para la perdida de ejecutorie- dad del acto administrativo que otorga o renueva la acre- ditación en alta calidad según corresponda, de programa  académico,  unidad  académica  o  institucional.   En firme el   acto administrativo que ordena la imposición de las sanciones  o  las  medidas  relacionadas  en  el  artículo  anterior,  el  Ministe- rio de Educación Nacional solicitará por escrito dirigido alCon- sejo  Nacional  de  Acreditación  -CNA-,  la  emisión  de  concepto    académico en el que se especifique si se mantienen o no, las   condiciones que determinaron la recomendación de otorga- miento o renovación de la acreditación en alta calidad según  \n115 ACUERDO 01  DE 2025  corresponda,  de  programa  académico,  unidad  académica  o    institucional. Este concepto académico deberá emitirse en el   marco  del  modelo  de  acreditación  en  alta  calidad  vigente  al    momento del otorgamiento o la renovación de la acreditación.  Recibida  la  solicitud,  en  sesión  de  Sala  General,  el  Conse- jo Nacional de Acreditación - CNA- emitirá el respectivo con-  cepto. Para emitir el concepto académico, el CNA podrá so - licitar evaluación externa por pares académicos o requerir a  la institución para que allegue la información que considere   necesaria.  Una vez el Ministerio de Educación Nacional reciba el con- cepto académico emitido por el CNA proferirá el acto admi- nistrativo que decide sobre la pérdida o no de la ejecutoriedad  del  acto  administrativo  que  otorgó  o  renovó  la  acreditación   en alta calidad según corresponda, de programa académico,   unidad académica o instituc
