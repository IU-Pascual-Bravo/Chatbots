ional. Contra este acto adminis - trativo procederá el recurso de reposición, en los términos del   Capítulo VI la Ley 1437 de 2011 o la norma que lo modifique,  derogue o sustituya.  Parágrafo 1.  En firme el acto administrativo que decide la   pérdida de ejecutoriedad del acto administrativo que otorgó  o renovó la acreditación en alta calidad, la institución deberá  cesar  todo  tipo  de  publicidad  en  la  que  se  haga  referencia   a  la  condición  de  acreditación  en  alta  calidad  según  corres- ponda, del programa académico, unidad académica o de la   institución.  Parágrafo 2.  Cuando se trate de la imposición de la medi-  da de vigilancia especial de suspensión del registro calificado   de  programa  académico,  la  imposición  de  medidas  para  la   protección  temporal  de  los  recursos,  bienes  y  activos  de  la   institución,  o  la  imposición  de  sanciones  administrativas  de   suspensión de programas académicos, suspensión de regis-  tros calificados, cancelación de programas académicos o de  registros calificados, suspensión de la personería jurídica de   la institución o cancelación de la personería jurídica de la ins- titución, el Ministerio de Educación Nacional decidirá en acto  \n116  administrativo debidamente motivado, sobre la pérdida o no  de ejecutoriedad del acto administrativo que otorgó o reno- vó la acreditación en alta calidad según corresponda, de pro-  grama académico, unidad académica o institucional. Contra   este  acto  administrativo  procederá  el  recurso  de  reposición,   en los términos de la Ley 1437 de 2011 o la norma que lo mo-  difique, derogue o sustituya. \n117  ACUERDO 01  DE 2025  Artículo  60.  Pares  académicos.   Los  pares  académicos   son  personas  idóneas,  reconocidas  por  sus  características   académicas  y/o  profesionales,  íntegras  y  éticas,  que  tienen   a cargo la evaluación externa de los programas académicos,   unidades académicas e instituciones. Conforman, a su vez,   un  equipo  que  emite  un  informe  riguroso  sobre  la  alta  cali- dad,  basado  en  el  análisis  de  las  dimensiones  universales  y    específicas en los contextos de la evaluación. Los pares académicos que dan soporte y acompañan el  trámite de evaluación, tienen el compromiso de verificar la   existencia  de  estándares  superiores  acordes  con  la  alta  cali- dad de las instituciones, unidades académicas y/o programas  académicos y ponen a disposición de la institución su forma- ción y experiencia, de tal forma que se desarrolle un proceso   articulado y colaborativo.  Artículo 61. Deberes de los pares académicos.  El par aca- démico, al momento de realizar la visita y rendir el informe de  esta deberá:  a.    Fundamentar sus consideraciones en razones objetivas  y ciertas, dejando de lado preconcepciones o estereoti- pos en torno al quehacer de la institución, unidad aca-  démica y/o del programa académico. b.    Respetar la naturaleza jurídica, identidad, misión y tipo-  logía de la institución. c.    Establecer unas relaciones respetuosas con las personas   CAPÍTULO X  GESTIÓN (BANCO) DE PARES ACADÉMICOS PARA LA ACREDITACIÓN EN ALTA CALIDAD \n118  de la institución con las cuales interactúa y propender por   una comunicación orientada a la comprensión mutua. d.    Aportar desde su experiencia y conocimiento en la eva- luación  del  programa  académico,  unidad  académica    y/o la institución. e.    Utilizar los instrumentos y guías de evaluación suminis-  tradas por el Consejo Nacional de Acreditación -CNA-. f.    Asumir y cumplir oportunamente los compromisos ad- quiridos con el Consejo Nacional de Acreditación -CNA-  y con el grupo de pares en los momentos previos a la  visita, durante ella y en el período de elaboración y pre-  sentación del informe de evaluación externa. g.    Manejar  la  información  que  reciba  con  la  debida  pru-  dencia y guardar absoluta confidencialidad de la infor -  mación conocida en su condición como par académico. h.    Respetar y cumplir los límites constitucionales, legales y   reglamentarios dados por la normatividad colombiana.  Artículo  62.  Repositorio  de  pares  académicos.     El  Mi- nisterio  de  Educación  Nacional  actualizará  el  repositorio  de   pares académicos siguiendo un procedimiento de invitación   pública, el cual se desarrollará en el término de un año, con -  tado desde la entrada en vigor del presente Acuerdo.  Una  vez  conformado  el  repositorio  de  pares  académicos,   las hojas de vida de sus integrantes estarán disponibles para  consulta en la herramienta tecnológica o mecanismo que se  disponga para ello, conforme con la normatividad sobre pro-  tección de datos personales que se encuentre vigente.  El  Consejo  Nacional  de  Acreditación  -CNA-  podrá  invitar  a   conformar el repositorio de pares a académicos nacionales e in-  ternacionales, que cumplan con el perfil y con los procesos de   formación  que  se  promueven  a  través  de  la  Escuela  de  Pares   para apoyar los procesos de formación de las diferentes comuni- dades, atendiendo la diversidad de instituciones, unidades aca-  démicas, programas académicos y campos del conocimiento.  Parágrafo.  El Consejo Nacional de Acreditación -CNA, den- tro de los seis (6) meses siguientes a la expedición del presen- \n119 ACUERDO 01  DE 2025  te  Acuerdo,  actualizará  los  criterios  y  el  mecanismo  de  eva- luación  de  los  pares  académicos  y  la  inclusión  de  expertos    nacionales e internacionales en el repositorio de pares.  Artículo 63. Régimen de inhabilidades, impedimentos e  incompatibilidades.  Los pares académicos son particulares en  ejercicio de funciones administrativas, por tal razón se encuen- tran sujetos al régimen de inhabilidades, incompatibilidades y   conflicto de intereses dispuesto por la Constitución y la ley.  Artículo  64.  Conflicto de intereses.  Cuando  exista  inte- rés  en  la  evaluación  por  parte  de un par académico porque    lo afecte o beneficie de alguna manera, a él o a su cónyuge, o  compañero o compañera permanente, o alguno de sus pa - rientes  hasta  cuarto  grado  de  consanguinidad,  segundo  de    afinidad o primero civil, o a su socio, o socios de hecho, deberá   declararse  impedido  de  participar  en  la  evaluación  externa    del trámite de acreditación en alta calidad. Las siguientes conductas constituyen conflicto de intereses: a.    Actuar en trámite de acreditación a sabiendas de que  se encuentra bajo el alcance de una presión institucio- nal, laboral, profesional o comercial externa, que pudie-  ra colocarlo en una posición de conflicto de intereses  real o aparente. b.    Tomar parte en alguna actividad que pudiera poner en   riesgo la confianza en la competencia, imparcialidad,   juicio  o  integridad  de  las  actuaciones  que  realiza  el    Consejo Nacional de Acreditación -CNA-. c.  Beneficiarse de la información que no está al alcance   del público en general y que ha obtenido en el ejercicio   de sus funciones. d.    Aprovechar  su  oportunidad  como  par  evaluador  para   promover intereses de la organización o institución a la   cual pertenece. e.    Tener  grave  enemistad  o  vínculos  estrechos  de  amis- tad con las directivas de la institución que adelanta el  trámite  de  acreditación  ante  el  Consejo  Nacional  de    Acreditación -CNA-. \n120  f.    Haber  formulado  queja,  denuncia,  o  demanda  en  al- guna instancia sobre actuaciones de la institución que  adelanta el respectivo trámite de acreditación o de sus   directivos.  Artículo  65.  Impedimentos  y  recusaciones.   En  caso  de   que la institución evaluada considere que alguno de los pa- res asignados se encuentra impedido de participar en la eva- luación  externa  del  trámite  de  acreditación  en  alta  calidad   por  alguna  de  las  características  antes  mencionadas,  podrá   recusarlo  ante  el  Consejo  Nacional  de  Acreditación  -CNA-   que, cuando proceda, designará nuevos pares y comunicará  su determinación a la institución a través de la herramienta   tecnológica o mecanismo que se disponga para ello.  Artículo 66. Código de Ética.  El Consejo Nacional de Acre- ditación  -CNA-  actualizará  el  código  de  ética  para  los  pares   académicos en coherencia con el presente acuerdo y lo pu-  blicará dentro de los seis (6) meses siguientes a su expedición. \n121  ACUERDO 01  DE 2025  Artículo 67. Lineamientos y guías del modelo de acre- ditación  en  alta  calidad.   El  Consejo  Nacional  de  Acredita- ción -CNA- publicará, dentro de los seis (6) meses siguientes a  la expedición del presente Acuerdo, las guías necesarias para  la actualización del modelo de acreditación en alta calidad y   el desarrollo del trámite de acreditación.  El Consejo Nacional de Acreditación – CNA actualizará pe- riódicamente los lineamientos, guías y documentos técnicos  que integran el modelo de acreditación en alta calidad, pre- via  aprobación  del  Consejo  Nacional  de  Educación  Superior    – CESU.  Artículo  68.  Aplicación  gradual  del  modelo  de  acredi- tación  en  alta  calidad.   Las  disposiciones  contenidas  en  el   presente  Acuerdo,  así  como  las  guías  que  se  emitan  como   consecuencia de este, sin perjuicio de lo dispuesto en los artí- culos 69 y 70 de la presente norma, se aplicarán gradualmen- te de la siguiente manera:  a.  Para la presentación del informe de autoevaluación  con fines de acreditación de programas académicos,   unidades  académicas  e  instituciones,  la  actualización   del modelo de acreditación establecido en el presente  Acuerdo se aplicará a partir del primero (1°) de enero de   dos mil veintisiete (2027). b.  Para las solicitudes de renovación de la acreditación de   programas académicos e instituciones, la actualización  del modelo de acreditación establecido en el presente  Acuerdo se aplicará a partir del primero (1°) de junio de   dos mil veintisiete (2027).  CAPÍTULO XI  GUÍAS, RÉGIMEN DE TRANSICIÓN, SITUACIONES PARTICULARES Y VIGENCIA \n122  c.  Para las solicitudes de apreciación de condiciones inicia - les lo establecido en el presente Acuerdo se aplicará a par-  tir del primero (1°) de enero de dos mil veintiséis (2026).  Artículo  69.  Régimen  de  transición  en  suspensión  del   trámite  de  acreditación.   Para  las  instituciones  o  programas   académicos que a la entrada en vigencia del presente Acuerdo  tengan suspendido el trámite de acreditación institucional o de  programas  académicos,  según  corresponda,  en  aplicación  del    artículo 42 del Acuerdo 02 de 2020 del CESU modificado por el   Acuerdo 04 de 2022 del CESU, se procederá a dar continuidad  con el trámite de acreditación en la etapa en que se encuentre y  a decidir conforme a las disposiciones contenidas en los acuer- dos,  lineamientos,  documentos  técnicos,  circulares  o  guías  vi-  gentes al momento de radicación de la solicitud.  Artículo  70.  Régimen  de  transición  para  instituciones   o programas académicos objeto de medidas preventivas.   A  las  instituciones  o  programas  académicos,  según  corres- ponda,  que  a  partir  de  la  entrada  en  vigencia  del  presente   Acuerdo sean objeto de  medidas preventivas, se les aplicará  de manera  preferencial lo dispuesto en los artículos  58  y  59   del presente Acuerdo.  Artículo  71.  Aplicación  del  modelo  de  acreditación  en   alta  calidad  para  instituciones  o  programas  académicos   que se encuentren dentro de las situaciones previstas en  el artículo 51 del Acuerdo 02 de 2020.  A las instituciones de  educación superior o programas académicos que, a la fecha  de entrada en vigencia del presente Acuerdo, se encuentren  en  las  situaciones  descritas  en  el  Artículo  51  del  Acuerdo  02   de  2020,  les  será  aplicable  de  preferencia  lo  dispuesto  en  el    artículo 59 del presente Acuerdo.  Artículo  72.  Aplicación  del  modelo  de  acreditación  en   alta  calidad.   Las  solicitudes  de  apreciación  de  condiciones   iniciales,  acreditación  o  renovación  de  la  acreditación  en   alta calidad, que a la fecha de entrada en vigor del presente  acuerdo se encontraban radicadas ante el Consejo Nacional  de  Acreditación  -CNA-,  y  las  situaciones  descritas  en  el  an- \n123 ACUERDO 01  DE 2025  terior  artículo,  serán  tramitadas  y  decididas  conforme  a  las   disposiciones  contenidas  en  los  acuerdos,  lineamientos,  do- cumentos  técnicos,  circulares  o  guías  vigentes  al  momento    de radicación de la solicitud.  Artículo 73. Vigencia y derogatorias.  El presente Acuer- do rige a partir del día siguiente  de su publicación, según el  artículo 65 y 87 de la Ley 1437 de 2011 y deroga los Acuerdos 02  de 2020 y 04 de 2022, así como los lineamientos y circulares  proferidos como consecuencia de estos, y las demás normas   que le sean contrarias.  PUBLÍQUESE Y CÚMPLASE  Dado en Bogotá D.C., a los veintiséis (26) días del mes de  mayo del año dos mil veinticinco (2025).  JOSÉ DANIEL ROJAS MEDELLÍN Presidente del CESU DORA LILIA MARÍN DÍAZ Secretaria Técnica del CES \n";

            let tipo = 'Sistema', bg = '#fefce8', color = '#854d0e', justify = 'center', border = '';
            if (m.classList.contains('user-message')) { tipo = 'Tú'; bg = '#2563eb'; color = '#fff'; justify = 'flex-end'; }
            else if (m.classList.contains('bot-message')) { tipo = 'Bot'; bg = '#f1f5f9'; color = '#1e293b'; justify = 'flex-start'; border = 'border:1px solid #e2e8f0;'; }
            return '<div style="display:flex;justify-content:' + justify + ';margin-bottom:10px;"><div style="background:' + bg + ';color:' + color + ';padding:10px 14px;border-radius:10px;max-width:80%;word-wrap:break-word;' + border + '"><small style="opacity:.65;font-size:.75rem;display:block;margin-bottom:4px;">' + tipo + '</small>' + m.innerHTML + '</div></div>';
        }).join('');
        return '<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><title>Historial - Chatbot</title><style>body{font-family:Segoe UI,sans-serif;background:#f8fafc;color:#1e293b;margin:0;padding:24px;}.header{text-align:center;margin-bottom:24px;border-bottom:1px solid #e2e8f0;padding-bottom:16px;}h1{color:#2563eb;font-size:1.5rem;margin:0 0 4px;}p{margin:0;color:#64748b;font-size:.85rem;}.chat{max-width:760px;margin:0 auto;}pre{background:#1e293b;color:#f1f5f9;padding:10px;border-radius:6px;overflow-x:auto;}code{background:rgba(37,99,235,.08);padding:2px 5px;border-radius:4px;font-size:.86em;}</style></head><body><div class="header"><h1>📄 Historial del chat</h1><p>Exportado el ' + new Date().toLocaleString('es-CO') + '</p></div><div class="chat">' + rows + '</div></body></html>';
    }
    document.getElementById('download-html-btn').addEventListener('click', () => {
        const html = buildHistorialHTML();
        if (!html) { alert('El historial está vacío.'); return; }
        const a = document.createElement('a');
        a.href = URL.createObjectURL(new Blob([html], {type: 'text/html;charset=utf-8'}));
        a.download = 'historial-chatbot-' + Date.now() + '.html';
        a.click(); URL.revokeObjectURL(a.href);
    });
    document.getElementById('download-pdf-btn').addEventListener('click', () => {
        const html = buildHistorialHTML();
        if (!html) { alert('El historial está vacío.'); return; }
        const win = window.open('', '_blank');
        win.document.write(html + '<scr' + 'ipt>window.onload=function(){window.print();window.onafterprint=function(){window.close();};};</scr' + 'ipt>');
        win.document.close();
    });

     suggestedQuestion.addEventListener('change', () => {
         if (suggestedQuestion.value) {
             questionInput.value = suggestedQuestion.value;
             questionInput.focus();
         }
     });

    // Chat
    function addMsg(message, sender, isThinking = false) {
        const el = document.createElement('div');
        el.classList.add(sender === 'user' ? 'user-message' : sender.includes('system') ? 'system-message' : 'bot-message');
        if (sender.includes('error')) el.classList.add('error');
        if (sender === 'bot' && !isThinking) {
            const pm = message.replace(/\[/g,'\\[').replace(/\]/g,'\\]').replace(/\(/g,'\\(').replace(/\)/g,'\\)');
            el.innerHTML = '<strong>Chatbot:</strong> <div class="tex2jax_process" style="margin-top:5px;">' + (marked.parse ? marked.parse(pm) : pm) + '</div>';
            if (window.MathJax && window.MathJax.typesetPromise) window.MathJax.typesetPromise([el]).catch(e => console.error(e));
        } else if (sender === 'bot') {
            el.innerHTML = '<strong>Chatbot:</strong> <span>' + message + '</span>'; el.id = 'thinking-msg';
        } else { el.textContent = message; }
        chatDisplay.appendChild(el); chatDisplay.scrollTop = chatDisplay.scrollHeight;
    }
    function updateLastMsg(message) {
        const el = document.getElementById('thinking-msg');
        const pm = message.replace(/\[/g,'\\[').replace(/\]/g,'\\]').replace(/\(/g,'\\(').replace(/\)/g,'\\)');
        const html = marked.parse ? marked.parse(pm) : pm;
        if (el) { el.innerHTML = '<strong>Chatbot:</strong> <div class="tex2jax_process" style="margin-top:5px;">' + html + '</div>'; el.removeAttribute('id'); if (window.MathJax && window.MathJax.typesetPromise) window.MathJax.typesetPromise([el]).catch(e => console.error(e)); }
        else addMsg(message, 'bot');
        chatDisplay.scrollTop = chatDisplay.scrollHeight;
    }

    async function sendQuestion() {
        const question = questionInput.value.trim();
        if (!question || isProcessing) return;
        addMsg(question, 'user'); questionInput.value = '';
        isProcessing = true; sendButton.disabled = true; questionInput.disabled = true;
        loadingSpinner.style.display = 'inline-block'; sendButtonText.textContent = 'Enviando';
        addMsg('Pensando...', 'bot', true);
        const maxLen = 800000;
        const t1 = PDF_TEXT.length > maxLen ? PDF_TEXT.substring(0, maxLen) + '... (truncado)' : PDF_TEXT;
        let prompt = 'Documento 1 ("' + PDF_NAME + '"): "' + t1 + '"\n\n';
         prompt += '(Instrucción: Para expresiones matemáticas, utiliza SÓLO $$...$$ para bloque y $...$ para texto en línea.)\n\nPregunta: ' + question + '\n\nRespuesta:';
        try {
            const res = await fetch(BACKEND_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ prompt: prompt, model: MODEL })
            });
            if (!res.ok) { let e=''; try{e=await res.text();}catch(_){} throw new Error('Error del servidor: ' + res.status + ' ' + res.statusText + '. ' + e.substring(0,200)); }
            const text = (await res.text()).trim();
            updateLastMsg(text || 'La IA no proporcionó una respuesta.');
        } catch(err) { updateLastMsg('Lo siento, ocurrió un error: ' + err.message); }
        finally {
            isProcessing = false; sendButton.disabled = false; questionInput.disabled = false;
            loadingSpinner.style.display = 'none'; sendButtonText.textContent = 'Enviar'; questionInput.focus();
        }
    }
    sendButton.addEventListener('click', sendQuestion);
    questionInput.addEventListener('keypress', e => { if (e.key==='Enter' && !e.shiftKey) { e.preventDefault(); sendQuestion(); } });
     addMsg('Documento "' + PDF_NAME + '" listo. ¡Puedes empezar a preguntar!', 'system');
     window.scrollTo(0, 0);
</script>
</body>
</html>
