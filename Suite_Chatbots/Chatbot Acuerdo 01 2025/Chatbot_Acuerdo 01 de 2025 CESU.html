    const PDF_TEXT = "ACUERDO 01 DE  20 25 \nConsejo Nacional de Educación  Superior – CESU-  Ricardo Moreno Patiño  Viceministro de Educación Superior   Fernando Henao   Delegado de la Ministra de Ciencia,  Tecnología e Innovación   Gustavo Andrés Monsalve Londoño   Delegado de la Directora del ICFES,  Director de Evaluación   Marcela González Triana  Delegada de la Directora del  Departamento Nacional de Planeación  – DNP, Subdirectora de Educación,  Cultura y Deporte (e)   José Daniel Muñoz Castaño  Delegado del Rector de la Universidad  Nacional de Colombia, Vicerrector  Académico   Oscar García Vargas  Representante de la Comunidad  Académica de las Universidades   Estatales u Oficiales  Ivaldo Torres Chávez  Representante de los Rectores de las   Universidades Estatales u Oficiales   César Augusto López Meza  Representante de los Rectores de las  Universidades Privadas  Omar Lengerke Pérez  Representante de los Rectores de las  Instituciones Tecnológicas   Eduardo Alfonso Crissien Borrero  Representante de los Rectores de las  Universidades Privadas   Maritza Rondón Rangel  Representante de los Rectores de las  Universidades de Economía Solidaria   Luis Alfonso Pérez Guerra   Representante de los Rectores de las  Instituciones Técnicas Profesionales  Jairo Alexander Osorio Saraz   Representante de los Rectores de las  Instituciones Universitarias o Escuelas   Tecnológicas, Estatales u Oficiales   Ximena Duque Alzate  Representante del Sector Productivo   Carmen Eugenia Fonseca Cuenca  Representante de los Profesores  Universitarios   Manuela Loaiza Cruz  Representante de los Estudiantes  Universitarios   Claudia Ximena Calero Cifuentes  Representante del Sector Productivo  Juan Carlos Bolívar Sandoval  Secretario Técnico del CESU  CESU que aprobó el acuerdo 01 de 2025  Ricardo Moreno Patiño   Viceministro de Educación Superior   Diana Regina Rúa Patiño  Delegada de la Ministra de Ciencia,  Tecnología e Innovación, Directora de  Vocaciones y Formación   Gustavo Andrés Monsalve Londoño  Delegado de la Directora del ICFES,  Director de evaluación (E)   Adriana Marcela González Triana   Delegada del Director del  Departamento Nacional de Planeación,  Subdirectora de Educación, Cultura y  Deporte (E)   José Daniel Muñoz Castaño  Delegado del Rector de la Universidad  Nacional de Colombia, Vicerrector  Académico   Óscar García Vargas  Representante de la Comunidad  Académica de las Universidades   Estatales u Oficiales   Ivaldo Torres Chávez  Representante de los Rectores de las   Universidades Estatales u Oficiales   Rolando Roncancio Rachid  Representante de los Rectores de las  Universidades Privadas   Omar Lengerke Pérez  Representante de los Rectores de las  Instituciones Tecnológicas   Eduardo Alfonso Crissien Borrero  Representante de los Rectores de las  Universidades Privadas   Maritza Rondón Rangel  Representante de los Rectores de las  Universidades de Economía Solidaria   Leonardo Pérez Suescún   Representante de los Rectores de las  Instituciones Técnicas Profesionales   Jairo Alexander Osorio Saraz  Representante de los Rectores de las  Instituciones Universitarias o Escuelas   Tecnológicas, Estatales u Oficiales   Ximena Duque Alzate  Representante del Sector Productivo -  FEDESOFT   Carmen Eugenia Fonseca Cuenca  Representante de los Profesores  Universitarios   Jesús Alberto Manzano Cañizares  Representante de los Estudiantes  Universitarios   Claudia Ximena Calero Cifuentes  Representante del Sector Productivo -  ASOCAÑA   Dora Lilia Marín Díaz - Secretaria  Técnica del CESU, Directora de Calidad  para la Educación Superior  Miembros del consejo   Nacional de acreditación  Mario Fernando Uribe Orozco   Coordinador Consejo  Consejero Área de Bellas Artes  Carlos Gómez Restrepo   Consejero Área de Ciencias de la Salud  María Piedad Marín Gutiérrez   Consejera Área de Ciencias Sociales y  Humanas  Álvaro Mauricio Flórez Escobar   Consejero Área de Matemáticas y  Naturales  Adriana Xiomara Reyes   Consejera  Área de Ingeniería, arquitectura   y afines  Jaime Ernesto Díaz Ortíz   Consejero  Área de Agronomía, Veterinaria   y Afines  Carlos Hernán González Campo   Consejero  Área de Economía y   Administración, Contaduría y afines.  Cesar Darío Guerrero Santander   Consejero  Área de Formación Técnica y  Tecnológica  Carmen Amalia Camacho Sanabria    Consejera Área de Ciencias de la Educación \n3  Que el artículo 67 de la Constitución Política de Colombia es- tablece “La educación es un derecho de la persona y un ser-  vicio que tiene una función social”. Así mismo, señala que co - rresponde al Estado velar por la calidad y el cumplimiento de   los fines de la educación.  Que  el  artículo  34  de  la  Ley  30  de 1992  “Por  la  cual  se  or- ganiza  el  servicio  público  de  la  educación  superior”,  creó  el   Consejo  Nacional  de  Educación  Superior  -CESU-  como  un   órgano  del  Gobierno  nacional  de  carácter  permanente,  vin- culado al Ministerio de Educación Nacional, con funciones de   coordinación, planificación, recomendación y asesoría.  Que el artículo 53 de esta ley creó el Sistema Nacional de  Acreditación  con  el  objetivo  fundamental  de  garantizar  a  la   sociedad que las instituciones que hacen parte de este cum- plan los más altos requisitos de calidad y realizan sus propó-  sitos y objetivos.  Que esta disposición legal estableció que el ingreso al Sis- tema Nacional de Acreditación  es  un  acto  voluntario  de  las   instituciones  de  educación  superior  que,  en  ejercicio  de  su    ACUERDO 01 DE 2025  “Por el cual se actualiza  el Modelo de Acreditación  en Alta Calidad”  EL CONSEJO NACIONAL  DE EDUCACIÓN SUPERIOR  – CESU  En uso de sus facultades  legales, en especial de las  señaladas en los artículos 34  y 36 de la Ley 30 de 1992 y en  el Decreto 1075 de 2015  CONSIDERANDO \n4  autonomía,  deciden  avanzar  en  el  mejoramiento  de  la  cali- dad y rendir cuentas sobre el servicio público que prestan a   la sociedad.  Que  el  Consejo  Nacional  de  Educación  Superior  -CESU-,   con fundamento en la competencia establecida en el artículo  54 de la referida ley, asignó al Consejo Nacional de Acredita- ción -CNA- las funciones de recomendar al Ministerio de Edu- cación Nacional el reconocimiento de la acreditación de pro- gramas académicos, unidades académicas e instituciones de  educación superior que han superado con éxito el proceso de  evaluación y de presentar a las instituciones las recomenda- ciones de mejoramiento pertinentes, conforme a los criterios   y etapas definidos en el modelo de acreditación.  Que el Consejo Nacional de Educación Superior -CESU-, a  partir del Acuerdo 06 de 1995 y de conformidad con el artículo   55 de la Ley 30 de 1992 que define la autoevaluación como   una tarea permanente de las instituciones de educación su- perior,  reconoció  en  la  acreditación  el  instrumento  a  partir    del cual se “busca la reafirmación de la pluralidad y diversi -  dad, dentro de la calidad, así como de las especificidades de  cada institución. Por lo tanto, este proceso deberá adelantar - se en un marco de respeto de la vocación y de las identidades  institucionales,  en  el  entendimiento  de  que  ese  pluralismo    enriquece el sistema de educación superior del país”.  Que  con  fundamento  en  las  políticas  generales  que  es- tableció  el  Consejo  Nacional  de  Educación Superior  -CESU-   para el desarrollo del Sistema Nacional de Acreditación y en  armonía con el ordenamiento jurídico vigente, el Consejo Na-  cional de Acreditación -CNA- inició en 1996 la definición del   marco  conceptual  y  metodológico  para  la  evaluación  de  la    alta calidad en la educación superior.  Que en el marco de los presupuestos constitucionales de  la  autonomía  universitaria,  el  Consejo  Nacional  de  Acredita- ción  -CNA-  ha  construido  un  modelo  de  acreditación  en  el    que se identifican los diferentes factores que determinan la   alta calidad de la educación superior, que a lo largo de más  \n5 ACUERDO 01  DE 2025  de 25 años se ha nutrido con experiencias de otros contextos  y con el conocimiento de las comunidades académicas.  Que el modelo de acreditación en alta calidad se ha desa- rrollado a partir de lineamientos,  guías y  documentos técni-  cos que permiten el acompañamiento a las instituciones en   los procesos de autoevaluación y su aplicación en la evalua- ción para el reconocimiento de la acreditación en alta calidad  de  las  instituciones  de  educación  superior,  de  programas   académicos  de  pregrado,  maestrías,  doctorados  y  especiali-  dades médico-quirúrgicas.  Que,  como  resultado  de  la  construcción  colectiva  y  par- ticipativa  de  las  comunidades  académicas durante el perio- do 2012 a 2014, el Consejo Nacional de Educación Superior  –  CESU,  mediante  Acuerdo  02  de  2014,  presentó  el  “Acuerdo   por  lo  Superior  2034”,  en  el  que  se  adoptó  una  orientación   política  en  relación  con  la  calidad  de  los  programas  acadé- micos  y  las  instituciones  de  educación  superior,  en  cuyas   líneas  de  acción  se  consignaron,  entre  otras,  las  siguientes:   i)  “estructurar  un  Sistema  de  Aseguramiento  de  la  Calidad   que actúe con mayor efectividad frente a las necesidades de   acompañamiento y orientación de los estudiantes, los pro - gramas  académicos,  las  IES  y  el  sistema  en  su  conjunto”,  y   ii) “garantizar que las instituciones y programas académicos,  como  resultado  de  sus  procesos  de  autoevaluación,  imple- menten mecanismos precisos para la rendición de cuentas y  compromisos de mejoramiento en el marco de los procesos   de registro calificado y acreditación”. Que, conforme a lo anterior, en el año 2020 se actualizó   el  modelo  de  acreditación  en  alta  calidad  con  el  propósito,   entre  otros,  de  integrar  los  lineamientos  de  los  programas   académicos  con  una  visión  general  que  diera  cuenta  de  la   naturaleza  de  un  programa  académico  y  así  poder  capitali- zar  los  esfuerzos,  recursos,  procesos  y  desarrollos  al  interior   de los sistemas internos de aseguramiento de la calidad y, lo- grar que los diferentes dispositivos que las instituciones han  venido construyendo y consolidando para la autoevaluación   fueran más eficientes. \n6  Que el Acuerdo 02 de 2020 permitió que el modelo de acre- ditación en alta calidad atienda  a  algunas  de  las  tendencias   internacionales  en  materia  de  acreditación,  reconozca  la  di- versidad  de  las  instituciones,  modalidades  de  formación  y   tipología  de  los  programas  académicos,  y  la  armonización    conceptual del Sistema Nacional de Acreditación.  Que,  en  armonía  con  la  necesidad  de  brindar  al  Sistema   Nacional de Acreditación un modelo de acreditación actuali- zado, así como de integrar los actores del sistema, regular las  etapas del trámite de acreditación y reiterar la importancia de  la acreditación en alta calidad, el Gobierno Nacional expidió el  Decreto 843 de 13 de junio de 2020, “Por el cual se adiciona el  Capítulo 7 al Título 3 de la Parte 5 del Libro 2 del Decreto 1075   de 2015 - Único Reglamentario del Sector Educación”. Que la definición de un Sistema de Aseguramiento de la Ca - lidad de la Educación Superior indica la importancia de la trans- formación continua de las instituciones de educación superior,  así como de sus unidades académicas y programas académicos  para atender a los cambios sociales, culturales y ambientales, y  que desde esa perspectiva se busca que la acreditación sea un  reconocimiento a los programas académicos, las unidades aca- démicas y las instituciones que avanzan de manera importante   en su compromiso con la calidad de la educación superior.  Que para la organización de un Sistema Nacional de Acre- ditación  que  reconozca  la  diversidad  en  la  organización  te- rritorial  del  país  y  en  las  formas  en  las  que  las  instituciones    definen el funcionamiento de su oferta educativa, buscando   garantizar  una  mayor  calidad  en  la  educación  superior,  se   hace  necesario  establecer  conceptos  y  criterios  pertinentes,   por medio de los cuales se promueva la innovación y la con- solidación  de  comunidades  académicas,  en  los  que  se  for- talezca  la  autonomía  institucional,  la  responsabilidad  social   de  las  instituciones,  unidades  académicas  y  programas,  y  la    confianza entre los actores del sistema.  Que  las  acciones  que  contribuyen  con  el  logro  de  estos   propósitos, descritos en las Bases del Plan Nacional de Desa- \n7 ACUERDO 01  DE 2025  rrollo 2022-2026 “Colombia Potencia Mundial de la Vida” (Ca- pítulo 2), a través de la estrategia de “reconceptualización del  sistema de aseguramiento de la calidad de la educación su- perior”, exigen un ajuste integral del sistema en el sentido de   definir, bajo criterios de integralidad, el concepto de calidad,   la  acreditación  de  unidades  académicas,  los  factores  y  ca- racterísticas para la acreditación  de  programas  académicos,   unidades académicas y de instituciones; reconocer la impor- tancia de la autoevaluación permanente, la autorregulación,  el fortalecimiento de los sistemas internos de aseguramiento  de la calidad y la promoción de la colaboración entre las insti- tuciones y programas acreditados en alta calidad, y establecer   medidas que promuevan la calidad y pertinencia, entre otras.  Que, con los avances que se obtuvieron con la expedición   del Decreto 529 de 2024, que modifica el Decreto 1075 de 2015  “Único Reglamentario del Sector Educación”, y la reflexión   académica y participativa mediante la cual no solo se evalúan  las  capacidades  y  procesos  de  los  programas  académicos  y   las  instituciones,  sino  los  resultados  académicos  que  vincu- lan el aprendizaje de los estudiantes, se hace necesaria la ar-  monización de objetivos y estrategias del registro calificado   y de la acreditación, de tal forma que se promueva el avance  sistemático y coordinado de los esfuerzos de los actores que   contribuyen al desarrollo de la educación superior.  Que, durante el proceso de implementación del Acuerdo 02  de  2020,  se  recogieron  los  aportes  de  las  comunidades  acadé- micas, pares internacionales y, se revisaron las nuevas tendencias  internacionales en relación con la acreditación en alta calidad, a   fin de construir una propuesta de actualización que permita res -  ponder a los desafíos contemporáneos de la educación superior.  Que en consideración a los ejercicios descritos, el presente   acuerdo busca fortalecer la confianza en la autonomía de las   instituciones, la participación de las comunidades académi-  cas, el acompañamiento en los procesos de acreditación de  programas, unidades académicas e instituciones, con el fin   de consolidar una oferta pertinente y relevante para los terri-  torios e incentivar la responsabilidad social. \n8  Que  para  el  cumplimiento  de  estos  propósitos  es  necesario   que  los  procesos  de  autoevaluación,  autorregulación,  mejora- miento permanente, evaluación externa y evaluación integral de  la alta calidad tengan en cuenta los retos que tienen las institu- ciones de educación superior para dar respuesta a las demandas   sociales, ser consecuentes con su identidad y garantizar el perfil   de sus egresados en un medio laboral altamente competitivo y  cambiante que exige que los procesos y resultados académicos   obtenidos sean pertinentes.  Que la madurez alcanzada por el Consejo Nacional de Acredi- tación -CNA- y la armonización con la Comisión Nacional Inter- sectorial de Aseguramiento de la Calidad de la Educación Supe- rior -CONACES- fortalece los procesos de acreditación e inspira   confianza a las instituciones que voluntariamente decidieron   presentar sus procesos de mejoramiento de la calidad para eva- luación  y  que  fueron  reconocidos  a  través  del  Decreto  1330  de    2019 y ahora el Decreto 529 de 2024, que modificó el Decreto  1075 de 2015, contribuyendo con ello a la reducción de trámites.  Que el Consejo Nacional de Acreditación -CNA- está compro-  metido con procesos de acreditación y certificación internacional,  como se desprende del hecho de que en el año 2012 obtuvo la cer -  tificación con la International Network for Quality Assurance Agen - cies in Higher Education -INQAAHE-, renovada en 2017 y 2022, en  2019 con la Red Iberoamericana para el Aseguramiento de la Ca- lidad en la Educación Superior -RIACES-, y acoge las recomenda-  ciones correspondientes como oportunidades de mejoramiento. Que la certificación de la World Federation for Medical  Education -WFME- de Estados Unidos obtenida en 2023, me - diante  la  cual  el  Consejo  Nacional  de  Acreditación  -CNA-  es    reconocido como agencia acreditadora por diez (10) años,   permitiendo  que  los programas de Medicina del país acredi-  tados en alta calidad dentro de la vigencia de la certificación,   entren  automáticamente  a  ser  reconocidos  por  los  Estados   Unidos y que sus graduados puedan gestionar sus procesos  para ejercer en ese país o continuar con sus estudios de pos-  grado, significa un avance importante en la ruta del reconoci - miento de la formación médica en el contexto internacional,  \n9 ACUERDO 01  DE 2025  consolidando  el  modelo  de  acreditación  colombiano  en  las    comunidades académicas.  Que  el  Consejo  Nacional  de  Acreditación  -CNA-  está  com-  prometido con procesos de acompañamiento, acreditación,  certificación internacional y reconocimiento, con el fin de ali - nearse con las tendencias y desafíos de la educación superior y   de la acreditación en un marco de convergencia internacional.  Que en sesión ordinaria del CESU del 14 de diciembre de 2023,  el Consejo Nacional de Acreditación -CNA- propuso al Consejo  Nacional de Educación Superior -CESU- la actualización del mo-  delo de acreditación en alta calidad. En dicha sesión ordinaria, el   CESU decidió establecer una comisión transitoria para trabajar   la propuesta, la cual sesionó hasta el día 22 de abril de 2024.  Que en sesión ordinaria del CESU del 25 de abril de 2024, el  CNA  propuso  al  CESU  la  actualización  del  modelo  de  acredi- tación en alta calidad en los siguientes aspectos: i) el reconoci- miento de la alta calidad de las instituciones de educación su- perior,  cualquiera  sea  su  naturaleza  jurídica,  identidad,  misión,   tipología y contexto regional; ii) el reconocimiento de la alta ca- lidad de la oferta académica, cualquiera sea su modalidad; iii) el  reconocimiento del contexto en el que las instituciones ofertan   sus programas y generan impacto; iv) la identificación de resul - tados,  logros  e  impactos  en  los  procesos  de  autoevaluación  y   evaluación  externa  de  programas  académicos  e  instituciones,   adicionales a los procesos y capacidades que tradicionalmente  se  venían  considerando;  v)  la  evidencia  de  los  procesos  que  se    incorporan en las relaciones de enseñanza aprendizaje y en los   procesos y resultados académicos como un aspecto importante   para la mejora de la gestión curricular y, vi) la unificación de los li - neamientos de acreditación de programas académicos, los cua- les  se  complementarán  con  aspectos  por  evaluar  que  podrán   ser adaptados por las instituciones acorde con sus característi-  cas, particularidades y contextos.  Que el Consejo Nacional de Acreditación -CNA- estimó nece- sario: i) incorporar los principios de buen gobierno en los proce- sos de acreditación de instituciones, ii) generar recomendacio- \n10  nes, iii) identificar buenas prácticas orientadas al gobierno de   las  instituciones,  y  iv)  asegurar  la  alta  calidad  y  pertinencia  en   el cumplimiento de sus labores formativas, académicas, docen-  tes, de investigación-creación, de innovación, científicas, artísti - cas y culturales, y de relación con el sector externo (extensión o  proyección social), como lo ha declarado el Consejo Nacional de   Educación Superior -CESU- en el Acuerdo 02 de 2020.  Que es necesario promover el fortalecimiento de los sistemas  internos de aseguramiento de la calidad de las instituciones del  país, de forma que sirvan de soporte a una cultura de mejora- miento  permanente  de  la  calidad  y  que  atiendan  de  manera    articulada a los procesos de registro calificado y de acreditación  en alta calidad.  Que, para alcanzar los más altos estándares de calidad, es ne-  cesario y oportuno fortalecer la confianza en el Sistema Nacio -  nal de Acreditación, mediante la flexibilización del modelo de   acreditación y el reconocimiento a los programas académicos,  a  las  unidades  académicas  y  a  las  instituciones  de  educación   superior de la responsabilidad de autorregularse y autoevaluar-  se de manera continua. Que conforme a ello, la acreditación en   alta calidad de programas se desarrollará por programa acadé- mico o por acreditación de programas académicos mediante la  acreditación de unidades académicas y la acreditación institu- ciónal a través de la acreditación por campus o acreditación en   alta calidad multicampus.  Que el fortalecimiento de los sistemas internos de asegura- miento de la calidad institucionales permitirá evidenciar los lo- gros, resultados e impactos de la institución y de los programas  orientados  a  la  contribución  del  desarrollo  ambientalmente    sostenible.  Que  el  reconocimiento  de  la  heterogeneidad  normativa  y   diversidad de las instituciones de educación superior exige un   enfoque flexible y contextualizado en la evaluación de la calidad   que  atienda  a  los  objetivos  misionales  del  proyecto  educativo   de los programas académicos y del proyecto educativo institu-  cional, o lo que haga sus veces. \n11 ACUERDO 01  DE 2025  Que el 5 de junio de 2024 el CESU estableció una comisión  para  trabajar  en  sus  comentarios  a  la  propuesta  de  actuali-  zación del modelo de acreditación. Que en sesión ordinaria   del  CESU  del  31  de  octubre  de  2024  la  comisión  transitoria    presentó dicha propuesta.  Que,  con  fundamento  en  la  solicitud  de  actualización  del   modelo  de  acreditación  presentada  por  el  Consejo  Nacional   de  Acreditación  -CNA-,  y  atendiendo  las  consideraciones  de   la  comisión  transitoria  del  CESU,  de  las  instituciones  y  de  las   comunidades académicas, el Consejo Nacional de Educación  Superior  -CESU-,  consideró  pertinente  actualizar  el  modelo   de acreditación en alta calidad, teniendo en cuenta como ejes  articuladores el mejoramiento permanente, la reconceptuali-  zación de la alta calidad, la interacción o acompañamiento a   la calidad como principio del modelo de acreditación, la con-  fianza entre los actores y el actuar institucional, la autonomía   universitaria, la pertinencia de la oferta educativa y el fortale- cimiento  de  una  identidad  de  la  calidad  educativa  asociada    a la movilidad y a la internacionalización. Además, consideró   pertinente actualizar el modelo de acreditación en alta calidad  reconociendo la acreditación de unidades académicas como  una estrategia que le permita a las instituciones avanzar en los  procesos de Acreditación en alta calidad y fortalecer las comu-  nidades académicas que definieron su organización académi -  co-administrativa.  Que,  de  conformidad  con  lo  previsto  en  el  numeral  8  del   artículo  8  del  Código  de  Procedimiento  Administrativo  y  de   lo Contencioso Administrativo (Ley 1437 de 2011) y en el artí-  culo 2.1.2.1.14 del Decreto 1081 de 2015 - Único del Sector Presi - dencia de la República, el presente Acuerdo fue publicado en  el Sistema Único de Consulta Pública - SUCOP entre el 15 de   noviembre de 2024 y el 30 de noviembre de 2024, con el fin   de  recibir  opiniones,  sugerencias  o  propuestas  alternativas    por parte de los ciudadanos y grupos de interés.  En consecuencia, el Consejo Nacional de Educación Superior  -CESU-,  ACUERDA: \n12  Artículo 1. Objeto.  El presente Acuerdo tiene por objeto actua- lizar el modelo de acreditación en alta calidad para programas  académicos, unidades académicas e instituciones y promover la   alta calidad como atributo de la educación superior, a fin de lo - grar que las comunidades académicas y la sociedad en su con- junto, reconozcan en la acreditación de programas académicos,  unidades  e  instituciones  una  condición  distintiva  autónoma,   nacional  e  internacional,  que  atiende  al  mejoramiento  perma- nente de la calidad de la educación superior, en armonía con las   dinámicas sociales, culturales, científicas, tecnológicas y de inno -  vación del territorio nacional.  Artículo 2. Referentes conceptuales.  Son orientaciones de ca-  rácter conceptual que contribuyen al análisis y reflexión de las   instituciones, unidades académicas y programas en sus proce-  sos de autoevaluación, autorreflexión y mejora continua.  2.1 Referentes del Sistema Nacional de Acreditación  a.  Alta  calidad.   En  el  marco  del  modelo  de  acreditación    que define el presente Acuerdo, la alta calidad se reconoce   cuando una institución, una unidad académica o un progra- ma  académico  de  educación  superior  reúne  las  cualidades   que  caracterizan  su  universalidad  y,  al  mismo  tiempo,  hace    realidad la especificidad que corresponde a sus propósitos y  objetivos particulares, de manera sobresaliente.  CAPÍTULO I  OBJETO, ALCANCE, REFERENTES CONCEPTUALES Y COMPONENTES DEL MODELO DE ACREDITACIÓN EN ALTA CALIDAD \n13  ACUERDO 01  DE 2025  La  calidad  está  estrechamente  relacionada  con  la  perti- nencia referida a la coherencia entre los objetivos de forma- ción, las acciones realizadas y las circunstancias, necesidades,   posibilidades y expectativas de su contexto. En consecuencia,   la  alta  calidad  demanda  coherencia  entre  las  acciones  que   una  institución,  una  unidad  académica  o  un  programa  im- plementa para cumplir sus propósitos formativos, los proce- sos y resultados académicos, logros alcanzados y los impac- tos  generados,  en correspondencia con sus declaraciones, su  naturaleza y contextos, el compromiso con la mejora perma-  nente y su capacidad de transformación y adaptación.  Una  institución,  unidad  académica  o  programa  acadé- mico  de  educación  superior  que  logra  alcanzar  el  reconoci- miento de alta calidad se constituye en un referente para los  procesos  de  mejoramiento  de  otras  instituciones,  unidades   académicas  o  programas  que  comparten  elementos  esen-  ciales correspondientes a su naturaleza.  b. Modelo de acreditación en alta calidad.  Marco episte-  mológico, conceptual, filosófico, ético, jurídico y metodológi - co que incluye los principios, objetivos, fundamentos teóricos  y conceptuales, criterios de calidad, lineamientos y guías, que  permiten la valoración, el reconocimiento y la consolidación   de la alta calidad en la educación superior.  c.  Logros  institucionales,  de  unidades  académicas  y  de   programas académicos.  Son los aportes que se soportan en  las capacidades y procesos, en el desarrollo del conocimiento,   el contexto y la sociedad en su conjunto. Se alcanzan a partir   de la materialización del proyecto educativo, o lo que haga sus  veces,  y  del  desarrollo  de  las  labores  formativas,  académicas,    docentes, de investigación-creación, de innovación, científicas,   artísticas  y  culturales,  y  de  relación  con  el  sector  externo  (ex-  tensión o proyección social), de acuerdo con su identidad.  2.2. Referentes para las labores misionales  a.  Procesos  y  resultados  académicos  o  de  la  formación.   Independientemente del enfoque pedagógico que en el mar- co de su autonomía las instituciones junto con sus programas  \n14  de  educación  superior  determinen,  los  resultados  académi- cos declarados deberán evidenciarse a través de los diferentes   procesos que se incorporan en las relaciones de enseñanza  aprendizaje, definidos en sus proyectos educativos, o los que   hagan sus veces, y sus estrategias formativas, donde prevale- cen  las  diferentes  dimensiones,  y  dar  cuenta,  entre  otros,  de   la mejora continua, de su actualización curricular y su calidad  educativa, y del grado de desarrollo de las competencias, ca- pacidades, habilidades y/o destrezas que se espera que un es-  tudiante haya logrado en su proceso formativo.  b.  Procesos  y  resultados  de  investigación,  innovación,   desarrollo  tecnológico,  creación  e  investigación-creación   artística y cultural.  Son los productos que se obtienen en los  procesos, proyectos o programas de investigación, innovación,  desarrollo  tecnológico,  creación  e  investigación-creación  ar- tística y cultural, los cuales responden a la identidad, misión,  tipología y al contexto regional, local y global de la institución,   de la unidad académica y de los programas académicos.  c. Procesos y resultados de la extensión, relación con el  sector externo o proyección  social.   Son  los  productos  que   se  obtienen  en  los  procesos,  proyectos  o programas de ex- tensión y/o proyección social generados por las instituciones,  unidades  académicas  o  programas  para  promover  y  apoyar   el desarrollo económico, ambiental, tecnológico, social y cul-  tural, de las colectividades en las que intervienen. Se desarro - llan a partir del compromiso de atender a los problemas del  contexto,  en  coherencia  con  la  identidad  y  misión  de  la  ins- titución,  las  unidades  académicas  y  los  programas,  y  tienen   impacto  en  la  formación  cuando  los  estudiantes  participan    en las actividades.  2.3 Referentes de organización y de oferta académica  a.  Programa  académico  acreditable.   Es  el  programa  aca-  démico con registro calificado vigente para ser ofrecido y de - sarrollado que cuenta con por lo menos cuatro (4) cohortes de   graduados y ocho (8) años de funcionamiento. En cada uno de  estos años la institución debe haber reportado estudiantes ma -  triculados al programa en cualquier periodo académico. La ve - \n15 ACUERDO 01  DE 2025  rificación de esta información se realizará a través del Sistema  Nacional de Información de la Educación Superior -SNIES-.  Se consideran acreditables los programas académicos técni- cos profesionales, tecnológicos, profesionales universitarios, de   especialidad médico-quirúrgica, de maestría y de doctorado.  La  acreditación  en  alta  calidad  de  programas  se  desarrolla- rá por programa académico o por acreditación de programas   académicos mediante la acreditación de unidades académicas.  b.  Unidad  académica  acreditable.   Es  una  estructura  or- gánica académico- administrativa en la que la institución de  educación  superior  agrupa,  integra,  administra  y  gestiona   programas académicos de pregrado y/o posgrado a partir de  campos del conocimiento y saber, que permite el alcance de  propósitos comunes y desarrolla las funciones misionales de  formación, académicas, docentes, de investigación-creación,   de innovación, científicas, artísticas y culturales, y de relación  con el sector externo (extensión o proyección social). La institución en el marco de su autonomía define en sus   estatutos  y  reglamentación  interna  sus  unidades  académi- cas acorde con su arquitectura institucional, según su natu-  raleza jurídica, tipología, identidad y misión.  Una  unidad  académica  acreditable  es  aquella  que  ha   mantenido  su  identidad  en  procesos  de  gestión  académi-  co-administrativa por más de cinco (5) años y que ha liderado   y tiene vigente la acreditación de al menos el cincuenta  por   ciento (50%) de los programas académicos acreditables. En el   número de programas acreditables se deben incluir los pro- gramas acreditados, en tanto que estos no pierden la condi-  ción de acreditables.  En  el  trámite  de  la  acreditación  de  una  unidad  académi- ca, los programas académicos acreditables que pertenezcan  a la misma unidad académica podrán acreditarse o renovar su  acreditación de alta calidad, si cumplen con las condiciones   de calidad requeridas. \n16  Un  programa  académico  acreditado  solo  puede  contabi- lizarse para la acreditación de una unidad académica por el   tiempo de su acreditación.  c.  Institución acreditable.  Para todos los efectos del pre- sente  Acuerdo,  se entiende  por  institución,  la  institución  de   educación superior y aquella habilitada por la ley para ofrecer   y desarrollar programas académicos de educación superior.  Una  institución  de  educación  superior  acreditable  es  la   institución que, manteniendo su carácter académico o tipo-  logía por más de cinco (5) años tiene acreditados al menos el   treinta por ciento (30%) de los programas académicos acre-  ditables. En el número de programas acreditables se deben   incluir los programas acreditados, en tanto que estos no pier-  den la condición de acreditables.  La acreditación en alta calidad de instituciones se aplica a  aquellas instituciones cuya oferta de programas académicos  está  limitada  a  un  campus,  o  para  aquellas  que  tienen  una    oferta organizada y diferencial en varios campus.  Las  instituciones  con  varios  campus  podrán  presentar- se  como  un  todo  (Multicampus)  o  de  manera  gradual  por   campus  teniendo  en  cuenta  que  el  campus  principal  (que   corresponde  en  el  Sistema  Nacional  de  Información  de  la   Educación Superior -SNIES- al código IES padre) debe ser el  primero en obtener la acreditación en alta calidad para que   así se pueda surtir la gradualidad. La institución podrá pre - sentar varios campus de manera simultánea siempre y cuan- do entre ellos se encuentre el campus principal, si este no ha   sido acreditado previamente.  Para efectos del presente Acuerdo,  campus  es un espacio  o conjunto  de  espacios físicos  y/o  digitales  en  el  que  la  ins-  titución de educación superior define, organiza y desarrolla  sus labores formativas, académicas, docentes, científicas, cul - turales,  de  innovación  y de  extensión,  en  coherencia  con  su    misión, tipología, identidad y naturaleza. \n17 ACUERDO 01  DE 2025  Para  efectos  del  presente  Acuerdo,  se  entiende  por  ins- titución  multicampus  aquella  que,  teniendo  una  oferta  de   programas  académicos,  en  diferentes  campus  del  territorio    colombiano, funciona de manera integrada. Las instituciones   multicampus deben tener: i) un único nombre o razón social,  ii) un único propósito institucional expresado en una misión  común, iii) un único sistema de gobierno institucional y iv) un  mismo  conjunto  de  políticas y normas internas para la ges- tión  institucional  (estatutos,  reglamentos  y  sistema  interno    de aseguramiento de la calidad).  2.4. Componentes del modelo de acreditación en alta calidad  2.4.1.  Lineamientos.  Son las orientaciones para adelantar   los procesos de autoevaluación con fines de acreditación en   alta calidad de programas académicos, unidades académi- cas e instituciones:  a.  Lineamientos  para  la  acreditación  en  alta  calidad  de   programas académicos.  Permiten adelantar los procesos  de autoevaluación de los programas académicos teniendo  en cuenta la tipología de formación, el proyecto educativo  del programa académico, o lo que haga sus veces, y la mo-  dalidad o modalidades en que son ofrecidos.  b. Lineamientos para la acreditación en alta calidad de  unidades  académicas.   Permiten  adelantar  los  procesos   de autoevaluación de las unidades académicas de acuer- do  con  los  valores  y  principios  declarados  en  el  proyecto    educativo institucional, o lo que haga sus veces.  c.  Lineamientos  para  la  acreditación  en  alta  calidad  de   instituciones.   Permiten  adelantar  los  procesos  de  autoe- valuación de las instituciones de acuerdo con su naturale-  za jurídica, identidad, misión y tipología.  2.4.2. Componentes de los lineamientos para el proceso  de acreditación en alta calidad.  El concepto emitido por el  Consejo Nacional de Acreditación -CNA- sobre la alta calidad  de  un  programa  académico,  una  unidad  académica  o  una   institución, es el resultado de un análisis integrado de los fac- \n18  tores que conforman el modelo. Cada factor es examinado   con base y en consideración integrada de las características   que lo constituyen. El grado de cumplimiento de cada ca - racterística  debe  ser  establecido  mediante  un  análisis  inte- gral de los diferentes aspectos por evaluar y de la información   que los respalda o los soporta. Los lineamientos de acredita - ción en alta calidad de programas académicos, de unidades  académicas y de instituciones se componen de factores, ca- racterísticas, aspectos por evaluar e información, los cuales se   definen así:  a.  Factores.   Son  los  ejes  articuladores  de  la  evaluación  y   deben  ser  vistos  desde  una  perspectiva  integral  y  sistémica   (no desagregados), ya que ellos se expresan de una manera  interdependiente, siendo desarrollados a través de caracterís-  ticas. Las capacidades, procesos, resultados, logros e impac - tos del programa, de la unidad académica o de la institución,  alrededor  de  cada  factor  del  modelo,  dan  cuenta  de  la  alta   calidad, a través de la materialización del proyecto educativo   y de, los valores declarados, o lo que haga sus veces.  b.  Características.   Son  los  elementos  distintivos  de  cada    factor. Son interdependientes y permiten establecer los efec - tos generados por el factor en la calidad de los procesos aca-  démicos. Las características de calidad del modelo de acre - ditación en alta calidad son propias de la educación superior  y expresan el carácter universal de este nivel educativo, pue- den ser aplicables a todo tipo de institución, programa aca- démico  o  unidad  académica,  según  el  proyecto  educativo   institucional y los valores declarados, o lo que haga sus veces,   considerando la identidad y misión de cada institución.  c. Aspectos por evaluar.  Son los elementos que permiten  valorar las características conforme a información cuantitati- va y cualitativa aportada por el programa académico, la uni- dad académica o la institución, de acuerdo con su identidad  y en coherencia con el proyecto educativo y los valores decla-  rados, o lo que haga sus veces. Asimismo, permiten apreciar  el desempeño y el mejoramiento permanente en un contex - to  particular,  con  el  ánimo  de  hacer  evidente,  hasta  donde   \n19 ACUERDO 01  DE 2025  sea posible y confiable, el grado de calidad alcanzado. Los   aspectos por evaluar son indicativos; es decir, que son obser- vables, medibles o que permiten demostrar los cambios y los  progresos que realiza el programa, la unidad académica o la   institución hacia el logro de sus resultados específicos. Las instituciones, atendiendo la flexibilidad del modelo de   acreditación,  pueden  utilizar  sus  propios  instrumentos  para    la recolección de información y pueden definir característi - cas  y  aspectos  por  evaluar  adicionales,  teniendo  en  cuenta   los factores y las características de los lineamientos de acre- ditación en alta calidad de programas académicos, unidades  académicas y de instituciones, y atendiendo los criterios que   inspiran el Sistema Nacional de Acreditación.  d. Información.  Soporta la evaluación de los aspectos que  se encuentran relacionados con los demás componentes del  modelo  de  acreditación,  a  través  del  sistema  interno  de  ase- guramiento  de  la  calidad  de  la  institución,  que  la  reportan  y    sistematiza en los instrumentos dispuestos para tal fin y la   consolida  de  manera  coherente  con  toda  la  documentación   presentada en cada una de las etapas del trámite de acredita-  ción. La información pertinente, actualizada y objetiva permi - te dar cuenta de la evolución de la institución, la unidad o los   programas académicos para realizar una evaluación integral. \n20  Artículo 3. Acreditación en alta calidad.  La acreditación es  el reconocimiento temporal  de  la  alta  calidad  que  otorga  el   Ministerio  de  Educación  Nacional,  previo  concepto  del  Con- sejo Nacional de Acreditación -CNA-, a los programas acadé- micos,  unidades  académicas  e  instituciones  que  cumplen   con los más altos criterios de calidad y que realizan sus pro- pósitos y objetivos, teniendo en cuenta la naturaleza jurídica,  identidad, misión y tipología de las instituciones de educación  superior, así como el campo del saber y conocimiento que ar- ticulan  las  unidades  académicas  y  los  programas  académi-  cos, según sus características y modalidades.  La  acreditación  en  alta  calidad  se  otorga  después  de  un   proceso de autoevaluación voluntaria realizado por la institu- ción que tiene como referente sus propias declaraciones,  las  de sus unidades académicas y las de sus programas acadé-  micos. Implica una evaluación externa de los pares académi - cos y la evaluación integral por parte del Consejo Nacional de   Acreditación -CNA-.  La acreditación en alta calidad promueve el fortalecimien- to de una cultura de la calidad de los programas académicos,  unidades académicas e instituciones, soportada en los siste- mas  internos  de  aseguramiento  de  la  calidad  de  las  institu-  ciones para el desarrollo de sus funciones misionales. Ade -  más, incrementa la confianza nacional e internacional en las   instituciones,  las  unidades  académicas  y  en  los  programas    académicos que la acogen.  CAPÍTULO II  ACREDITACIÓN EN ALTA CALIDAD, PRINCIPIOS, OBJETIVOS Y SISTEMA NACIONAL DE ACREDITACIÓN \n21 ACUERDO 01  DE 2025  Artículo  4.  Principios  de  la  acreditación.     Son  los  funda- mentos  que  proporcionan  un  marco  de  referencia  para  las   instituciones,  los  pares  académicos,  el  Consejo  Nacional  de   Acreditación -CNA- y la comunidad académica en el desarro- llo y apropiación de una cultura de la calidad, en consonancia  con los objetivos de la educación superior en Colombia y los   referentes internacionales de aseguramiento de la calidad.  Los  principios  rectores  de  la  alta  calidad  que  orientan  las   prácticas de autoevaluación, autorregulación, mejoramiento  permanente  y  evaluación  sobre  un  entendimiento  común,   son los siguientes:  a.  Apropiación  social  del  conocimiento.   Es  el  proceso  o   estrategia intencionada que busca comprender e intervenir  las relaciones entre las ciencias, la tecnología, la innovación, la   creación y la sociedad. La apropiación social del conocimien - to convoca a diversos actores sociales, públicos y privados, a  dialogar  e  intercambiar  sus  saberes,  prácticas,  conocimien-  tos, análisis, reflexiones y experiencias, promoviendo entor -  nos de confianza, equidad e inclusión para generar prácticas   de  participación  continua  y,  de  esta  manera,  contribuir  a  la    democratización y uso del conocimiento.  b. Colaboración.  Es la base del trabajo mancomunado y el  aprendizaje mutuo de las comunidades académicas de todo  el mundo, condición fundamental del trabajo académico y de  la construcción de la paz y la democracia; clave en los proce- sos de mejoramiento permanente de instituciones, unidades   académicas y programas. A nivel pedagógico, permite reco - nocer y construir a partir de las diferencias en la comprensión  para establecer y mantener la comunicación que requiere la   apropiación social del conocimiento. Es determinante en las   relaciones interinstitucionales, internacionales e intercultura- les y en el reconocimiento del valor de los saberes propios de   quienes entran en relación con los saberes y conocimientos.  c.  Pertinencia.   Constituye  la  correspondencia  entre  las   necesidades  y/o  vocaciones  sociales,  económicas,  culturales    y ambientales del contexto, identificadas por las institucio - \n22  nes  de  educación  superior  mediante  la  investigación-crea- ción propia y el diálogo con los diferentes actores sociales, y  los  objetivos  de  formación  y  acciones  que  las  instituciones,   sus  unidades  académicas  y  sus  programas  llevan  a  cabo   mediante  sus  labores  formativas,  académicas,  docentes,  de    investigación-creación, de innovación, científicas, artísticas   y  culturales,  y  de  relación  con  el  sector  externo  (extensión  o   proyección social) para satisfacerlas en el marco del desarrollo   personal y humano integral. La pertinencia es una condición   de la calidad, por lo que la calidad de instituciones, de unida-  des académicas y de programas supone su pertinencia.  d.  Equidad.   El  principio  de  equidad  en  los  procesos  de    acreditación de alta calidad se refiere a la promoción de un   entorno  que  reconoce  y  valora  las  diferencias  individuales  y   colectivas,  la  inclusión  y  la  inter  y  multiculturalidad,  aprove- chando las particularidades únicas de cada una de las insti- tuciones  de  educación  superior,  sus  unidades  y  programas    académicos. La equidad fomenta una cultura de calidad y   excelencia  al  garantizar  condiciones  justas  para  el  acceso,   permanencia  y  graduación  en  la  formación  de  alta  calidad,   adaptándose a las diversas necesidades de las comunidades   de estas instituciones.  Este principio implica el compromiso de las instituciones,  unidades  y  programas  de  implementar  adecuaciones  razo- nables  para  reducir  cualquier  forma  de  exclusión,  discrimi- nación  o  segregación  por  motivos  de  etnia,  género,  lengua,   cultura, condición física, económica o social, entre otros; y el  de introducir políticas y/o protocolos que articulen las accio- nes  destinadas  a  evidenciar,  intervenir  y  reducir  las  brechas   injustas  o  desproporcionadas  que  limitan  el  acceso  y  el  de- sarrollo pleno en las actividades formativas, académicas, do-  centes, investigativas, científicas, culturales, de innovación y  de extensión.  La equidad es un criterio fundamental para valorar, atribuir  y  distribuir  los  derechos  y  responsabilidades  dentro  del  Sis- tema Nacional de Acreditación, considerando las diferencias   individuales, colectivas y las necesidades específicas de cada  \n23 ACUERDO 01  DE 2025  persona y comunidad. También reconoce la importancia de   las  capacidades  de  las  instituciones  de  educación  superior    para abordar y reducir las inequidades sociales.  e.  Coherencia.   Es  el  cumplimiento  de  la  promesa  de  va- lor  sobre  la  función  social  de  la  educación  superior  y  el  gra- do  de  relación  efectiva  entre  lo  que  la  institución,  la  unidad   académica y el programa académico declaran en su misión,  propósito,  proyecto  educativo  institucional,  proyecto  educa- tivo del programa académico, valores, o lo que haga sus ve-  ces, y lo que efectivamente realizan. Esta relación debe es - tar en consonancia con la identidad, misión o tipología, para  desarrollar  las  labores  formativas,  académicas,  docentes,  de    investigación-creación, de innovación, científicas, artísticas   y  culturales,  y  de  relación  con  el  sector  externo  (extensión  o   proyección  social),  de  manera  que  se  posibilite  el  desarrollo   humano y el ejercicio de la profesión o disciplina desde una  perspectiva ética, así como la cooperación y el desarrollo de  las  potencialidades  del  entorno  en  un  contexto  altamente    cambiante.  f. Transparencia.  Es la disposición y el compromiso de los  actores del Sistema Nacional de Acreditación con el cumpli-  miento de sus funciones y competencias con eficiencia y efi -  cacia en el marco de la constitución y la ley. Entre estas, se   encuentran  prever  y  garantizar  la  calidad,  el  cumplimiento   de  la  misión  institucional,  del  proyecto  educativo  institucio- nal y del proyecto educativo del programa académico, de los  valores declarados, o lo que haga sus veces, así como asumir  sus  responsabilidades  con  los  impactos  ambientales,  socia- les,  económicos  y  de  gobierno  de  sus  intervenciones  en  el   contexto, haciendo públicos, de forma oportuna, integral, ve- raz y válida, los criterios de evaluación y los logros, resultados  e impactos de gestión, mediante el acceso a la información,  la  divulgación,  la  transferencia  del  conocimiento  y  la  rendi-  ción de cuentas.  g.  Innovación.   Corresponde  a  la  creación,  introducción  o    mejora significativa de productos, procesos y/o servicios que   la institución realiza en su gestión institucional y sus funcio- \n24  nes  misionales,  en  respuesta  a  los  retos  que  presenta  la  so- ciedad  contemporánea,  asociados  a  cambios  tecnológicos,    sociales, culturales y económicos. Esto implica desarrollar e  implementar soluciones nuevas o mejoradas significativa - mente  a  problemáticas  institucionales,  sociales,  educativas,   económicas y ambientales, basadas en ciencias, tecnologías  y artes, que reconozcan los saberes ancestrales y comunita- rios, así como la relación con el sector productivo, como fuen- tes de diálogo y transformación para el bien común y mejo-  ramiento de las condiciones sociales.  h. Objetividad.  Es la cualidad de las decisiones y actuacio- nes que, basadas en razones cualitativas, cuantitativas, acuer- dos intersubjetivos, evidencias, fuentes de información, indi- cadores y criterios de evaluación, dan sustento a valoraciones  imparciales sobre la alta calidad de los programas, unidades  académicas y de la institución, emitidas por los actores que   componen el Sistema Nacional de Acreditación.  i. Adaptabilidad.  Es la capacidad crítica de respuesta ágil  y  efectiva  ante  los  cambios  del  entorno  social,  económico,    tecnológico y cultural. Este principio promueve que se desa - rrollen y actualicen continuamente los procesos educativos,  administrativos y de gestión, de manera que puedan antici- parse  y  adaptarse  a  las  nuevas  demandas  y  expectativas  de   los  estudiantes,  la  comunidad  académica  y  la  sociedad  en    general en su beneficio, en el marco de la identidad, objeti -  vos, misión y visión institucional. Además, implica aprovechar   las oportunidades para crear más valor y gestionar el riesgo   ante situaciones imprevistas y contingentes.  j.  Relevancia.   En  una  institución  de  educación  superior,   en una unidad académica o en un programa académico de   alta calidad, su relevancia se configura como la interacción   dinámica  entre  las  perspectivas,  expectativas  y  aspiraciones   que los actores involucrados y la sociedad espera de las insti- tuciones y lo que éstas hacen a corto, mediano y largo plazo,  frente  a  las  problemáticas  sociales,  económicas,  culturales   y  ambientales  en  sus  procesos  educativos;  respetando  las   culturas  locales  y  promoviendo  la  innovación  y  el  desarrollo   \n25 ACUERDO 01  DE 2025  sostenible. En tal sentido, armonizan su proyecto educativo   institucional con las necesidades sociales, uniendo los propó- sitos de la comunidad académica con el bienestar colectivo; y  aseguran que las acciones de las instituciones de educación  superior  contribuyan  al  bien  común,  en  una  apuesta  ética;   mide  sus  impactos  externos  mediante  métricas  cualitativas    que prioricen los beneficios sociales y ambientales por enci - ma de los logros internos, para evaluar el aporte real de la ins- titución  a  la  sociedad,  considerando  su  papel  como  agente    transformador comprometido con el bien común.  k. Responsabilidad social.  Es el compromiso asumido por  el programa, la unidad académica o la institución de respon- der ante la sociedad por el impacto resultante del ejercicio de  sus  funciones  misionales  de  formación,  investigación-crea-  ción, innovación y extensión. Este principio tiene en cuenta el   efecto transformador del ejercicio de las funciones misiona- les en la sociedad, así como la importancia estratégica de la  educación superior en la formación de profesionales y ciuda-  danos y en la construcción del futuro del país. Implica el cum - plimiento de los principios establecidos en el presente Acuer- do como parte inherente del actuar institucional, es uno de   los fines asociados a la formación integral, orienta la creación,   desarrollo y transmisión del conocimiento, es prioritario en la  contribución al estudio y solución de los problemas de la so-  ciedad y al desarrollo cultural, económico, científico, político y   ético de la nación e implica el compromiso con la sostenibi- lidad ambiental y con los demás objetivos establecidos en la   ley de educación superior. La responsabilidad social está aso - ciada a la pertinencia, la calidad, la superación de la exclusión  y de las inequidades sociales, el cultivo de la convivencia en   paz y el respeto de la diversidad.  Artículo 5. Objetivos de la acreditación en alta calidad.   Los  objetivos de la acreditación en alta calidad son:  a. Promover una cultura de la calidad que evidencie los   principios,  la  diversidad  institucional  y  territorial,  y  el  com- promiso  con  el  mejoramiento  permanente,  contribuyendo   al fortalecimiento del rol social y académico de la educación   superior. \n26  b. Fortalecer la cultura de la alta calidad en las institucio - nes, en las unidades académicas y en los programas acadé- micos, y promover la colaboración entre instituciones, unida-  des y programas en sus procesos de mejoramiento. c. Servir como un instrumento a través del cual el Estado   colombiano da fe pública de la alta calidad de los programas  académicos, las unidades académicas y las instituciones, en  el contexto de las dinámicas globales, regionales y locales de  la educación superior, que asume la diversidad de institucio- nes como un valor del sistema de educación superior colom- biano, en aras de promover de manera efectiva la regionaliza- ción, la cooperación interinstitucional, la equidad, la inclusión   y la inter y multiculturalidad. d. Favorecer la construcción y consolidación de comunida - des académicas en condiciones equiparables con institucio-  nes internacionales y nacionales de alta calidad. e. Promover en las instituciones, unidades académicas y   programas la formación integral de ciudadanos socialmente  responsables  que  desarrollen  y  hagan  efectivas  sus  capaci- dades  humanas  y  contribuyan  a  la  construcción  de  una  so-  ciedad incluyente, equitativa y ambientalmente sostenible. f. Incentivar procesos de buen gobierno institucional que   permitan a las instituciones mantener continuidad, sosteni-  bilidad y transparencia en el aseguramiento de la calidad. g. Estimular la cultura de la autorregulación, la rendición   de cuentas, la autoevaluación y el mejoramiento permanente  de las instituciones, las unidades académicas y los programas  académicos, con el propósito de alcanzar altos estándares de  calidad,  soportados  en  sistemas  internos  de  aseguramiento    de la calidad. h. Promover la visibilidad, la integralidad y articulación de   las  labores  formativas,  académicas,  docentes,  de  investiga-  ción-creación, de innovación, científicas, artísticas y cultura - \n27 ACUERDO 01  DE 2025  les,  y  de  relación  con  el  sector  externo  (extensión  o  proyec- ción  social),  de  tal  forma  que  las  comunidades  académicas   puedan  establecer  formas  de  relación  activas  y  productivas   con  el  conocimiento  y  el  entorno  a  través  de  procesos  de    transformación calificados y cualificados. i. Incentivar el desarrollo de la investigación, investiga - ción-creación,  la  innovación,  la  creación  artística  y  cultural,   y  la  incorporación  tecnológica  en  el  quehacer  institucional   para  impulsar  la  transformación  curricular  y  contribuir  a  la   atención de las demandas sociales y productivas del entorno   local, nacional y/o internacional. j. Desarrollar un conjunto de referentes y de indicadores   que faciliten a los actores del Sistema Nacional de Acredita- ción  adelantar  los  procesos  de  aseguramiento  de  la  calidad   en  un  contexto  global,  regional  y  local,  teniendo  en  cuenta   tanto los principios rectores de la alta calidad como la diver- sidad  de  contextos,  campos  de  conocimiento,  instituciones,    unidades académicas y programas. k. Incrementar la confianza nacional e internacional en las   instituciones, en las unidades académicas y en los programas  académicos que acogen la alta calidad, y en sus actividades  de generación, apropiación social y difusión del conocimien-  to, así como de extensión, proyección e interacción social.  Artículo 6. Sistema Nacional de Acreditación.  El Sistema  Nacional de Acreditación tiene  como  objetivo  garantizar  a  la  sociedad  que  las  instituciones que  hacen  parte  de este   cumplen las más altas condiciones de calidad y realizan sus  propósitos y objetivos en coherencia con su naturaleza jurí-  dica, identidad, misión y tipología.  Acogerse  al  Sistema  Nacional  de  Acreditación  es  volun- tario  para  las  instituciones  que  incorporan  en  sus  sistemas   internos  de  aseguramiento  de  la  calidad  los  desafíos  que   establece  la  acreditación  en  alta  calidad,  como  una  vía  para   transformarse  sistemáticamente  y  responder  a  los  cambios   de la sociedad, a las maneras de aprender y a las necesidades   de un ejercicio profesional altamente cambiante. \n28  Artículo 7. Actores del Sistema Nacional de Acreditación.   De acuerdo con la normatividad vigente, el Sistema Nacional  de Acreditación está conformado, entre otros, por los siguien- tes actores:  a.  Ministerio de Educación Nacional. b.  Ministerio de Ciencia, Tecnología e Innovación. c.  Consejo Nacional de Educación Superior -CESU-. d.  Consejo Nacional de Acreditación -CNA-. e.  Las instituciones que optan por la acreditación. f.  Las comunidades académicas y científicas. g.  Los pares académicos.  Artículo  8.  Actores  del  Sistema  de  Aseguramiento  de  la   Calidad  de  la  Educación  Superior.   De  acuerdo  con  lo  es-  tablecido en el artículo 2.5.3.2.1.3 del Decreto 1075 de 2015,   son actores del Sistema de Aseguramiento de la Calidad de la  Educación Superior:  a.  El Ministerio de Educación Nacional. b.  El Ministerio de Salud y Protección Social. c.  El Ministerio de Ciencia, Tecnología e Innovación. d.  El Consejo Nacional de Educación Superior – CESU. e.  El Consejo Nacional de Acreditación – CNA. f.    La Comisión Nacional Intersectorial de Aseguramiento   de la Calidad de la Educación Superior – CONACES. g.    El Instituto Colombiano para la Evaluación de la Educa-  ción – ICFES. h.    El  Instituto  Colombiano  de  Crédito  Educativo  y  Estu- dios  Técnicos  en  el  Exterior  “Mariano  Ospina  Pérez”  –    ICETEX. i.    La Comisión Intersectorial para el Talento Humano en   Salud. j.    Las instituciones de educación superior y aquellas ha- bilitadas por la ley para ofrecer y desarrollar programas   de educación superior. k.  La comunidad académica y científica en general. l.  Los pares académicos. m.  Todos  aquellos  entes  que  intervienen  en  el  desarrollo    de la educación superior. \n29 ACUERDO 01  DE 2025  Artículo  9.  Armonización  de  los  Sistemas  Nacional  de   Acreditación  y  de  Aseguramiento  de  la  Calidad  de  la   Educación  Superior.   Reconociendo  la  importancia  de  los   sistemas  internos  de  aseguramiento  de  la  calidad  que  pro- mueven la autorregulación y la autoevaluación de las institu- ciones, se busca armonizar la actuación del Consejo Nacional  de  Acreditación  –CNA-  y  la  Comisión  Nacional  Intersectorial   de  Aseguramiento  de  la  Calidad  de  la  Educación  Superior    -CONACES- lo cual redundará en la confianza de los proce - sos y resultados académicos o de la formación; procesos y re- sultados de investigación, innovación, desarrollo tecnológico,  creación e  investigación-  creación artística  y cultural;  proce- sos y resultados de la extensión, relación con el sector externo   o proyección social. Dicha articulación se logra: Desde las Instituciones. La armonización se da a partir   de  los  sistemas  internos  de  aseguramiento de la calidad de   las  instituciones  que  cumplen  con  la  exigencia  del  artículo    2.5.3.2.3.1.4. del Decreto 1075 de 2015, o el que haga sus veces,   y facilitan:  a.  La obtención, modificación y renovación de registros  calificados. b.  La acreditación y renovación de la acreditación en alta   calidad de instituciones, de unidades académicas y de   programas. c.  La generación de una cultura de aseguramiento de la   calidad, y  d.  La implementación y seguimiento de los planes de de -  sarrollo o lo que haga sus veces, y los de mejoramiento. A partir de las instancias de evaluación. El diálogo entre el   Consejo Nacional de Acreditación -CNA- y la Comisión Nacio- nal Intersectorial de Aseguramiento de la Calidad de la Edu- cación  Superior  –CONACES-  se  concreta  en  políticas,  proce-  sos armonizados e información confiable y compartida. En los trámites de evaluación de la calidad. La evaluación   de la calidad se realiza mediante dos instancias y en dos mo- mentos distintos, a saber: \n30  a.  En el registro calificado, mediante la evaluación del   cumplimiento de las condiciones de calidad institucio- nales y de programas académicos obligatorias para la  oferta de programas académicos, que es realizada por  la  Comisión  Nacional  Intersectorial  de  Aseguramiento    de la Calidad de la Educación Superior - CONACES. b.  En la acreditación en alta calidad, mediante la evalua - ción  de  la  alta  calidad  de  los  programas  académicos,   unidades  académicas  y  de  instituciones  dentro  del   proceso  voluntario  de  acreditación,  que  es  realizada    por el Consejo Nacional de Acreditación – CNA-. \n31  ACUERDO 01  DE 2025  Artículo  10.  Programas  académicos  de  alta  calidad.   El  ser   acreditable  es  uno  de  los  requisitos  para  iniciar  el  proceso  de    reflexión institucional orientado a decidir si un programa cum - ple con las condiciones de alta calidad requeridas para iniciar el  proceso de acreditación, que en el caso de las instituciones no  acreditadas implica la realización del informe de condiciones ini-  ciales y en las acreditadas el proceso de autoevaluación.  La alta calidad de un programa académico, desde la pers- pectiva  de  la  acreditación,  se  reconoce  considerando  los  re- ferentes a partir de los cuales orienta su acción y supone re- tos  de  alta  exigencia  y  complejidad  en  sus particularidades,   según la identidad, misión y tipología institucional, así como  el proyecto educativo del programa, o lo que haga sus veces,  como los que a continuación se enuncian:  a.    El  compromiso  con  la  cultura  de  la  autoevaluación,  la    autorregulación y el mejoramiento permanente. b.  La definición de unos referentes filosóficos, pedagógi - cos  y  organizacionales  que  responden  a  necesidades    locales, regionales, nacionales e internacionales. c.    El  cumplimiento  de  los  procesos  y  resultados  acadé- micos  que  garanticen  la  integralidad  en  los  procesos    formativos, la flexibilidad en los aspectos curriculares y   la coherencia de las estrategias pedagógicas y evalua-  tivas con dichos objetivos. d.    El fortalecimiento de la investigación, investigación-crea- ción artística y cultural y de los vínculos establecidos con  la  docencia,  que  contribuyen  a  desarrollar  en  sus  estu- diantes las capacidades de indagación, pensamiento crí-  tico, creativo e innovador.  CAPÍTULO III  MODELO DE ACREDITACIÓN EN ALTA CALIDAD DE PROGRAMAS ACADÉMICOS \n32  e.    La claridad y transparencia en los reglamentos y en las  relaciones de los profesores, los estudiantes y el cuerpo   administrativo, entre ellos y con la institución. f.    Las  políticas  y  estrategias  transparentes  y  universales    de selección, acompañamiento, permanencia y gra -  duación de los estudiantes. g.    La vinculación de un profesorado idóneo que se cuali-  fica gracias a la cultura de alta calidad, que incluye ac -  tividades y estímulos a la formación y al trabajo cualifi -  cado. h.    El impacto de los egresados en el contexto social y aca-  démico. i.    Las relaciones efectivas entre las comunidades acadé- micas y con las comunidades académicas nacionales e   internacionales. j.    Una  estructura  organizacional  con  participación  de   profesores  y  estudiantes,  al  servicio  del  mejoramiento    permanente. k.  Los recursos, los medios educativos y la financiación  necesaria para el cumplimiento del proyecto formativo.  Artículo  11.  Acreditación  en  alta  calidad  de  programas   académicos.  La acreditación en alta calidad para programas  académicos  tendrá  en  cuenta  tanto  los  elementos  declara- dos en su proyecto educativo, o lo que haga sus veces, como   las condiciones aprobadas en el registro calificado y las parti -  cularidades si se trata de un registro calificado único.  En el caso de programas académicos ofrecidos por ciclos  propedéuticos se contarán como acreditados los programas   que constituyen el ciclo. Para efectos de los acreditables se  considerará el ciclo propedéutico como un programa. Parágrafo. Los programas académicos con registro califica - do único, independientemente del número de modalidades  y/o  lugares  de  desarrollo,  contarán  como  uno  solo  registro,    tanto para los acreditables como para los acreditados. Igual - mente, contarán como uno solo para el cálculo en el porcen-  taje de programas acreditados sobre los acreditables. \n33 ACUERDO 01  DE 2025  Artículo  12.  Evaluación  de  la  alta  calidad  de  programas   académicos.  Para efectos de la evaluación con propósitos de  la acreditación en alta calidad de programas académicos, los  factores son los siguientes:  FACTOR 1.  Proyecto educativo del programa e identidad   institucional.  FACTOR 2.  Comunidad de estudiantes.   FACTOR 3.  Comunidad de profesores.   FACTOR 4.  Comunidad de egresados.   FACTOR 5.  Aspectos académicos y evaluación.   FACTOR 6.  Permanencia y graduación.  FACTOR 7.  Proyección e interacción con el entorno.  FACTOR  8.   Aportes  de  la  investigación,  la  innovación,  el   desarrollo  tecnológico,  la  creación  e  investigación-crea-  ción artística y cultural, asociados al programa académico.   FACTOR 9.  Bienestar de la comunidad académica del pro-  grama.  FACTOR 10.  Recursos físicos, tecnológicos, medios educa-  tivos y ambientes de aprendizaje.  FACTOR 11.  Organización, administración y financiación del  programa académico.  FACTOR 12.  Aseguramiento de la alta calidad del programa.  Los  factores  anteriores  se  evalúan  de  acuerdo  con  carac- terísticas  que  corresponden  a  referentes  nacionales  e  inter- nacionales de alta calidad y a las particularidades institucio- nales,  las  cuales  se  evidencian  a  través  de  los  aspectos  por   evaluar teniendo en cuenta los elementos característicos que  se declaran en el proyecto educativo del programa o lo que   haga sus veces.  Artículo  13.  Factores  y  características  para  evaluación   de  programas  académicos.     Una  institución  demuestra  el   esfuerzo  permanente  para  consolidar  su  identidad  a  través   de  una  cultura  organizacional  fundamentada  en  el  mejora- miento permanente y la innovación académica, lo cual, para  el  caso  de  la  alta  calidad  de  los  programas  académicos,  se   evidencia  en  cada  uno  de  los  factores  que  se  relacionan  a    continuación. \n34  Parágrafo 1.  El Consejo Nacional de Acreditación -CNA- de- terminará,  mediante  lineamientos, las características y unos  aspectos por evaluar indicativos asociados a los  factores  de  programas  académicos,  que  serán  evaluados  teniendo    en  cuenta  los elementos específicos que se declaran en el   proyecto educativo del programa académico  o  lo  que  haga    sus veces.  Parágrafo  2.   En  la  renovación  de  la  acreditación  en  alta    calidad de un programa académico modificado a registro  calificado único, la autoevaluación, la evaluación externa por   pares académicos, los comentarios del rector y la evaluación  integral  realizada  por  el  Consejo  Nacional  de  Acreditación   -CNA-  se  harán  teniendo  en  cuenta  la  consolidación  de  las   modalidades y/o lugares de desarrollo incorporados durante   la vigencia de la acreditación.  El Consejo Nacional de Acreditación -CNA- propende por  el  seguimiento  a  la  implementación  y  el  avance  de  los  pla- nes de mejoramiento, que incluirán las acciones de mejora y  de consolidación durante la vigencia de la acreditación otor- gada, junto a las capacidades, procesos, resultados, logros al- canzados e impactos generados, los cuales serán tenidos en   cuenta para la renovación de la acreditación.  FACTOR  1.  Proyecto  educativo  del  programa  e  identidad   institucional.   Un  programa  académico  de  alta  calidad  se   reconoce porque, a partir de una evidente cultura del mejo-  ramiento permanente, define unos referentes filosóficos, pe - dagógicos y organizacionales en coherencia con sus políticas  institucionales  que se evidencian en la  formulación  del  pro- yecto educativo del programa o lo que haga sus veces, sirven  como referentes fundamentales para el desarrollo y cumpli- miento de sus propósitos y marcan la identidad propia de su   comunidad académica, la cual es reconocida por la sociedad.  Característica  1.  Proyecto  educativo  del  programa.   El   proyecto  educativo  del  programa académico, o lo que haga   sus  veces,  es  coherente  con  la misión  y  la  identidad  institu- cional, así como con los campos de acción de las profesiones  \n35 ACUERDO 01  DE 2025  o disciplinas, y orienta el desarrollo de las labores formativas,  académicas,  docentes,  de  investigación-  creación,  de  inno-  vación, científicas, artísticas y culturales, y de relación con el   sector  externo  (extensión  o  proyección  social),  en  relación   con  los  objetivos  de  formación  profesional  e  integral  de  los    estudiantes.  El  proyecto  educativo  del  programa  académico,  o  lo  que    haga sus veces, debe ser de conocimiento público. En el caso   de  los  programas  académicos  del  área  de  la  salud,  además,   se tendrá en cuenta la relación y coherencia entre la institu- ción de educación superior y los escenarios donde se realizan   las prácticas formativas.  Característica  2.  Relevancia  académica  y  pertinencia   social  del  programa  académico.   El  programa  académico   responde a las necesidades locales, regionales, nacionales o   internacionales previamente definidas y sustentadas, inde - pendientemente de la(s) modalidad(es) en la(las) que se ofer- ta, su naturaleza y el reconocimiento que recibe por el modo   como impacta y hace realidad su finalidad.  FACTOR  2.  Comunidad  de  estudiantes.   Un  programa  aca- démico  de  alta  calidad  se  reconoce  porque  permite  a  sus   estudiantes  desarrollar,  de  manera  individual  y  en  entornos   participativos con otros estudiantes, actitudes, capacidades,  habilidades  y  conocimientos,  entre  otros  aspectos,  durante    su proceso de formación, en concordancia con sus fines filo -  sóficos, pedagógicos y organizacionales evidenciados en el  alcance del perfil de formación en coherencia con su identi -  dad, modalidad y propósitos formativos.  Característica  3.  Incidencia  de  las  actividades  de  for- mación  integral.   El  programa  académico  da  cuenta  de  la   participación  de  los  estudiantes  en  actividades  de  investi- gación,  desarrollo  tecnológico,  innovación,  creación  e  inves- tigación-creación  artística,  cultural  y  deportiva,  así  como  en   proyectos de desarrollo social y ambiental con comunidades  o con diferentes organizaciones, relacionamiento nacional e  internacional y en otras acciones de formación complemen- \n36  taria, que inciden en la formación integral, evaluando su im- pacto en coherencia con las características y el proyecto edu-  cativo del programa, o lo que haga sus veces.  Característica  4.  Orientación,  acompañamiento  y  segui- miento  a  estudiantes.   El  programa  académico,  en  el  marco   de las políticas institucionales demuestra procesos de orienta-  ción, acompañamiento y seguimiento académico a sus estu - diantes, con impacto evidente en su formación, permanencia  y  graduación,  de  acuerdo  con  la  caracterización  realizada  al   momento de su ingreso, según la modalidad y el nivel de for-  mación del programa.  Característica 5. Estrategias pedagógicas para el fortale- cimiento de la autonomía y el trabajo colaborativo con res- ponsabilidad social.  El programa académico declara, evalúa,  fomenta  y  desarrolla,  durante  el  proceso  de  aprendizaje,  las   capacidades, habilidades y destrezas para el trabajo autóno- mo y el trabajo colaborativo de cada estudiante en entornos  participativos  con  otros  estudiantes  y  demás  actores  de  la    comunidad académica. El programa genera los medios, es - pacios  y  ambientes  necesarios para promover el trabajo au- tónomo y colaborativo, y evalúa su impacto en los procesos y   resultados académicos de los estudiantes. Además, imple -  menta estrategias de seguimiento y mejora continua.  Característica  6.  Políticas  académicas  y  normativas  en  el   proceso formativo en procura de una cultura de paz y toleran- cia, el antirracismo, la perspectiva de género y la atención a  poblaciones  diversas,  entre  otros.   El  programa  académico  da   cuenta de la divulgación, aplicación y actualización de los regla- mentos estudiantiles y las políticas académicas aprobadas, en los   que se definen, entre otros aspectos, los deberes y derechos, el ré - gimen disciplinario, la participación de la comunidad académica  en la toma de decisiones y las condiciones y exigencias académi- cas de permanencia, graduación y la generación de una cultura  de la paz, la tolerancia, el reconocimiento y el respeto mutuo, el  antirracismo, la perspectiva de género e identidades diversas, y la  inclusión de personas con discapacidad, entre otros, de acuerdo   con las características y modalidad del programa académico. \n37 ACUERDO 01  DE 2025  Característica 7. Estímulos y apoyos para todos los estu- diantes y en atención a la diversidad, el pluralismo y la in- clusión.  El programa académico demuestra el impacto de los   beneficios otorgados a los estudiantes, a través de estímulos  académicos, apoyos socioeconómicos y ajustes razonables. A   su vez, demuestra la atención a la diversidad, el pluralismo y   la inclusión en la comunidad de estudiantes.  FACTOR 3. Comunidad de profesores.  Un programa acadé- mico  de  alta  calidad  se  reconoce  porque  a  partir  de  los  re-  ferentes filosóficos, pedagógicos y organizacionales que dan   identidad  a  su  comunidad  académica,  establece  las  condi- ciones de formación académica, dedicación, tipo de vincula- ción,  calidad  y  pertinencia  de  sus  profesores,  en  coherencia    con las particularidades del programa y su modalidad. Asi - mismo, hace seguimiento y promueve el bienestar, el desa- rrollo  académico,  investigativo  y  pedagógico,  la  permanen-  cia, la cualificación permanente, la conformación de redes y  el trabajo colaborativo entre sus profesores.  Característica  8.  Resultados  de  los  procesos  de  selec- ción,  vinculación  y  permanencia  de  los  profesores  en  el   mejoramiento  del  programa.   La  institución  demuestra  la    aplicación transparente y eficaz de los criterios establecidos   para los procesos de selección, vinculación y permanencia de  sus profesores, y evalúa la incidencia de estos procesos en el  mejoramiento  del  programa  y  el  impacto  en  los  procesos  y    resultados académicos.  Característica  9.  Estatuto,  trayectoria  y  reconocimiento   profesoral.   La  institución  demuestra la aplicación de un es- tatuto profesoral, o lo que hace sus veces, y sus efectos  en la  trayectoria  profesoral,  la  inclusión,  el  reconocimiento  de  los   méritos y el ascenso en  el  escalafón,  de  acuerdo  con  las  ca-  racterísticas y modalidad del programa académico.  Característica  10.  Planta  profesoral  para  materializar  el   proyecto  educativo  del  programa.   El  programa  académi- co  cuenta,  directamente  o  a  través  de  la  facultad,  escuela  o   departamento  respectivo,  con  un  núcleo  de  profesores  con   \n38  la dedicación, formación y experiencia requeridos para el de- sarrollo  de  las  labores  formativas,  académicas,  docentes,  de    investigación-creación, de innovación, científicas, artísticas   y  culturales,  y  de  relación  con  el  sector  externo  (extensión  o   proyección social) y para la atención de la totalidad de los es- tudiantes  matriculados,  de  acuerdo  con  las  características  y   modalidad del programa académico para materializar el pro-  yecto educativo del programa, o lo que haga sus veces.  Característica 11. Capacidades, procesos, y resultados, del  desarrollo  profesoral  del  programa  en  coherencia  con  el   proyecto  educativo.   Se  demuestran  los  resultados  del  desa- rrollo profesoral, en relación con las capacidades y procesos de  la institución para responder a las necesidades y los objetivos  de  formación,  la  diversidad  de  los  estudiantes,  las  modalida- des del programa, la formación investigativa, la investigación  formativa y los requerimientos de internacionalización y de in- ter y multiculturalidad de profesores y estudiantes, de acuerdo   con las características y modalidad del programa académico.  Característica 12. Coherencia entre los estímulos a la trayec- toria de los profesores del programa y el proyecto educativo.   La institución y el programa académico demuestran la divulga- ción, aplicación y actualización de criterios académicos en la po-  lítica de estímulos que reconoce y favorece el ejercicio calificado   de  las  labores  formativas,  académicas,  docentes,  de  investiga-  ción-creación, de innovación, científicas, artísticas y culturales, y  de relación con el sector externo (extensión o proyección social).   En los programas de alta calidad, los estímulos que reciben los  profesores deben asociarse a los méritos o logros académicos y  profesionales, en coherencia con el proyecto educativo del pro- grama académico, o lo que haga sus veces, y con los procesos y   resultados académicos.  Característica  13.  Producción,  pertinencia,  utilización  e   impacto  de  material  docente.   Los  profesores  producen  de   manera  individual  y  colaborativa  con  otros  profesores  de  la   institución, materiales propios del tipo de formación para el  desarrollo de las diversas actividades académicas, que sopor- tan los ambientes de aprendizaje, los cuales se evalúan perió- \n39 ACUERDO 01  DE 2025  dicamente con base en criterios y mecanismos académicos   previamente definidos, de acuerdo con las características y  modalidad del programa académico.  Característica 14. Evaluación integral de profesores y sus  efectos en el mejoramiento del programa.  El programa aca- démico  demuestra  procesos  periódicos  y  permanentes  de   evaluación integral de los profesores y de las redes de trabajo  colaborativo que conforman, con alcance a las distintas acti-  vidades y desempeños en las labores formativas, académicas,  docentes, de investigación-creación, de innovación, científi - cas, artísticas y culturales, y de relación con el sector externo   (extensión o proyección social). Dichos procesos son estable - cidos, difundidos y conocidos previamente, y son coherentes   con las características y modalidad del programa académico.  FACTOR 4. Comunidad de egresados.  Un programa acadé- mico de alta calidad se
