n\ten\tel\tlogro\tde\tlos\tperfiles\testablecidos\ten\tlos\tprogramas\tacadémicos\tofertados.\t  Por\tlo\ttanto,\tel\tegresado\tes\tla\tprueba\tculmen\tde\tla\trealización\tinstitucional.\tSu\trol,\tse\tseguirá\t  inscribiendo\ten\tla\tvida\tde\tla\tinstitución,\ta\tpartir\tde\tun\trelacionamiento\tconstante\tque\tpermita\t  reconocer sus dinámicas en los contextos de aplicación profesional en los que les corresponda   actuar.\tSus\texperiencias,\tlogros,\trealizaciones\te\timpactos\ten\tsus\tentornos\tse\tconstituyen\ten\t  insumos clave para la autorregulación y valoración de la pertinencia de los mismos programas   de\tlos\tque\tformaron\tparte.\tPor\tlo\ttanto,\tvincularlos\ten\tinteracciones\tdialógicas\tpermanentes\t  facilitará\tla\tcualificación\teducativa\ty\tpermitirá\tun\tcontinuum\tde\tla\toferta\tde\tformación\tpermanente\t  a lo largo de la vida.    La sociedad es entendida como una red de relaciones que tiene la responsabilidad de   crear condiciones propicias para que las personas puedan acceder a una educación emancipadora   (Freire,\t2005).\tEsto\timplica\tfomentar\tla\tparticipación\tcomunitaria\ty\tel\tdiálogo\thorizontal\ten\tlos\t  procesos\teducativos,\tasí\tcomo\tgenerar\tespacios\tde\treflexión\tcrítica\ty\tacción\ttransformadora\ten\t  la\tcreación\tde\tsistemas\teducativos\tinclusivos\ty\tde\tcalidad,\tque\tbrinden\toportunidades\tequitativas\t  de acceso a la educación y formación profesional.    A simismo,\tla\tsociedad\tdebe\tpromover\ty\tgarantizar\tel\tacceso\tigualitario\ta\toportunidades\t  educativas\ty\tlaborales,\tconvirtiéndose\ten\tun\tagente\tclave\ten\tel\tproceso\tde\tprofesionalización\t  al crear las condiciones necesarias para que los individuos puedan desarrollarse plenamente y   contribuir\tde\tmanera\tsignificativa\tal\tprogreso\tsocial\ty\teconómico.\tAdemás\tde\tfacilitar\tla\tdifusión,\ty\t  el\tacceso\ta\tla\tinformación,\tpara\tque\tlas\tpersonas\tlogren\tuna\tmayor\tespecialización\ty\tdesarrollo\ten\t  sus\táreas\tde\tinterés;\te\tinfluir\ten\tel\tproceso\tde\tespecialización\tcreando\tcondiciones\tde\ttrabajo,\t  orden público y oportunidades de empleo. \nModelo Educativo y Pedagógico 54  5.7.3 El rol de las organizaciones comunitarias  5.7.4 El rol de las empresas  \t   Según\tel\tMinisterio\tdel\tInterior\tde\tColombia,\tuna\t“Organización\tComunal\tes\tla\tinstancia\ta\t  través de la cual las comunidades deciden organizarse para liderar e impulsar procesos comuni -  tarios\ten\tbarrios\ty\tveredas,\tmaterializándose\ta\ttravés\tde\tla\tparticipación,\tel\tquehacer\ten\tla\tvida\t  de\tlas\tcomunidades”\t(párr.\t1).\tAdicional,\tpara\tFreire\t(2005)\tlas\torganizaciones\tcomunitarias\tac -  túan como espacios de participación activa y colectiva de los individuos; permiten el intercam -  bio\tde\tconocimientos,\thabilidades\ty\texperiencias\tentre\tsus\tmiembros,\tademás\tde\tpotenciar\tel\t  fortalecimiento\tde\tsus\tcapacidades\tprofesionales.\tAsimismo,\tpromueven\tla\tconciencia\tcrítica\t  y\tla\tsolidaridad,\tcreando\tcondiciones\tpropicias\tpara\tla\tformación\ty\tel\tdesarrollo\tde\thabilidades\t  que trascienden la capacitación técnica en torno a intereses y necesidades comunes.  \t   En\teste\tcontexto,\tlas\torganizaciones\tcomunitarias\tdesarrollan\tla\tparticipación\tactiva\tde\t  los\tindividuos,\ty\tla\ttoma\tde\tdecisiones\ten\tla\tgestión\tde\tsus\tpropios\tproyectos\ty\tactividades.\t  Esto\timplica\tque\tsus\tmiembros\ttengan\tla\toportunidad\tde\tejercer\tliderazgo,\tfortalecer\tlas\thabi -  lidades de trabajo en equipo y contribuir al bienestar y desarrollo de sus comunidades; promo -  viendo\tla\tsuperación\tde\tla\topresión\ty\tla\tmarginación,\ta\ttravés\tde\tla\tsolidaridad,\tla\tparticipación,\t  la\tautoorganización,\tla\tinteracción\ty\tel\tdiálogo\thorizontal.    La I.U. Pascual Bravo reconoce la importancia de las organizaciones comunitarias en la   formación\tde\tsus\testudiantes,\tpues\tson\tel\tsustento\tdel\taccionar\tinstitucional;\ta\tsu\tvez,\testas\t  organizaciones\tse\tbenefician\tde\tlos\tconocimientos\tde\tlos\testudiantes\tporque\tlos\taplican\ten\tla\t  solución\tde\tproblemas,\tsatisfacción\tde\tnecesidades\ty\talcance\tde\tintereses.\tLos\tindividuos\tque\t  han sido formados de manera autónoma y responsable en las aulas de clase posteriormente   son los encargados de regresar a la comunidad para trabajar por ella.  \t   Las\tempresas\tfacilitan\tel\tdesarrollo\tde\thabilidades\tespecíficas\ten\tla\tformación\tprofe -  sional\tde\tlos\tindividuos,\ta\ttravés\tde\tprogramas\tde\tcapacitación\ty\tprácticas\tlaborales;\tpueden\t  contribuir\tcon\tla\tadquisición\tde\tconocimientos\ttécnicos\ty\tcompetencias\tespecíficas\tnecesa -  rias\tpara\tdesempeñarse\ten\tdeterminados\tcampos\to\tindustrias.\tFreire\t(2005)\tplantea\tque\tlas\t  empresas deben asumir la responsabilidad de proporcionar un entorno laboral propicio para el   crecimiento y desarrollo de sus trabajadores; lo que implica no solo brindar oportunidades de   formación\ty\tcapacitación,\tsino\ttambién\tfomentar\tla\tparticipación\tactiva\tde\tlos\templeados\ten\tla\t  toma de decisiones y la búsqueda de soluciones creativas. \nModelo Educativo y Pedagógico 55  \t   La\tI.U.\tPascual\tBravo,\tfiel\ta\tsu\ttradición,\treconoce\tel\trol\tdel\tsector\tproductivo,\ty\tsus\t\tac -  ciones\tformativas\than\testado\tpermeadas\tde\tcara\ta\tlas\tempresas,\tsus\tnecesidades\te\tintereses.\t  A\tpartir\tde\testa\trelación,\tlos\testudiantes\tgozan\tde\texperiencias\treales\ten\tmúltiples\tespacios\t  sociales,\tcomunitarios,\tacadémicos\ty\tespecíficamente\ten\tlos\tdel\tsector\tproductivo\ta\ttravés\tde\t  prácticas,\tsemilleros\tde\tinvestigación,\tintercambio\tde\trecursos,\tentre\totros,\ty\tlos\tcontextos\tque\t  se\trecrean\ten\tlas\tmetodologías\tactivas\tde\tenseñanza,\taprendizaje\ty\tevaluación\tse\tenfocan\ten\t  situaciones reales que se viven a diario en los procesos productivos.  \nModelo Educativo y Pedagógico 56 6. COMPO   - NENTES  DEL PRO   - CESO PE   - DAGÓGICO  6. COMPONENTES DEL   PROCESO PEDAGÓGICO \nModelo Educativo y Pedagógico 57  6. COMPONENTES DEL PROCESO PEDAGÓGICO  Dime y lo olvido,   enséñame y lo recuerdo,  involúcrame y lo aprendo.   Benjamin Franklin  6.1 Características de los criterios de desempeño y saberes  En\tel\tacuerdo\tacadémico\t001\tdel\t2\tde\tagosto\tde\t2013,\tel\tConsejo\tAcadémico\tde\tla\tI.U.\t  Pascual\tBravo\tadopta\tel\tmodelo\tcurricular\tpor\tcompetencias,\tante\teste\tenfoque\tes\timportante\t  comprender\tque\tlas\tcompetencias,\tsegún\tTobón\t(2008)\tson:  Procesos\tcomplejos\tde\tdesempeño\tcon\tidoneidad\ten\tdeterminados\tcontextos,\tintegrando\t diferentes   saberes\t(saber\tser,\tsaber\thacer,\tsaber\tconocer\ty\tsaber\tconvivir),\tpara\trealizar\tactividades\ty/o\t  resolver\tproblemas\tcon\tsentido\tde\treto,\tmotivación,\tflexibilidad,\tcreatividad,\tcomprensión\ty\t  emprendimiento,\tdentro\tde\tuna\tperspectiva\tde\tprocesamiento\tmetacognitivo,\tmejoramiento\t  continuo\ty\tcompromiso\tético,\tcon\tla\tmeta\tde\tcontribuir\tal\tdesarrollo\tpersonal,\tla\tconstrucción\ty\t  afianzamiento\tdel\ttejido\tsocial,\tla\tbúsqueda\tcontinua\tdel\tdesarrollo\teconómico-empresarial\t  sostenible,\ty\tel\tcuidado\ty\tprotección\tdel\tambiente\ty\tde\tlas\tespecies\tvivas\t(p.5).  \t   Por\ttanto,\tla\tI.U.\tPascual\tBravo,\tcon\tla\tformación\tde\tegresados\tidóneos\tdesde\tel\tsaber\t  conocer,\tsaber\thacer,\tsaber\tser\ty\tconvivir,\tpretende\taportar\ta\tla\tsociedad\tsujetos\tque\tpuedan\t  desempeñarse\tcomo\tprofesionales\ty\tpersonas\téticas,\tíntegras,\tintegrales\te\tinnovadoras.\tPara\t  esto,\tinterviene\tel\tcurrículo\tdesde\tsus\tdiferentes\tniveles:\tmacrocurricular,\tmesocurricular\ty\tmi -  crocurricular,\tal\tdeclarar\tpor\tcada\tuno\tde\tellos\tresultados\tde\taprendizaje\tque\ttengan\tcoherencia\t  entre sí para cada una de las ofertas académicas de la institución.  Al hacer referencia al nivel microcurricular es importante comprender que   El\tmicrocurrículo\tes\tel\ttercer\ty\túltimo\tnivel\tde\tconcreción\tcurricular\tdefinido\tpor\tla\tI.U.\tPascual\t  Bravo,\ten\tél\tlos\tdocentes\tplanifican\tlo\tque\tserá\tel\tdesarrollo\tde\tla\tacción\tformativa\tpor\tMódulos\t  Académicos\tde\tAprendizaje\t-\tMAA.\tEstos\tmódulos\tsurgen\tdel\tmesocurrículo\ten\trelación\tdirecta,\t  indirecta o integrada con las unidades de competencia o Unidades de Resultados de Aprendizaje   genéricos,\ttransversales\ty\tacadémicos\t/\tespecíficos\tdel\tprograma\tde\tformación\tprofesional.\t  Es  función  del  docente  la  caracterización  de  los  MAA  a  través  de  dos  momentos:  el  diseño    microcurricular y el desarrollo microcurricular.  2  2 Tomado\tdel\tdocumento,\ten\tconstrucción,\tdel\tmodelo\tde\tdiseño\ty\tdesarrollo\tcurricular\tde\tla\tI.U.\tPascual\tBravo,\ten\t  proceso de adopción y formalización. \nModelo Educativo y Pedagógico 58  6.2 Estrategias experienciales de aprendizaje    Para\tcada\tdiseño\tmicrocurricular\tse\tdefine,\tcomo\tfunción\tproductiva\tglobal,\tun\tresultado\tde\t  aprendizaje,\tdel\tque\tse\tderivan\tsubfunciones\tproductivas\tgenerales,\tconocidas\tcomo\t\tElementos\t  de\tResultados\tde\tAprendizaje\t(ERA),\tque\tdan\torigen\ta\tcriterios\tde\tdesempeño\to\tIndicadores\tde\t  Resultados\tde\tAprendizaje\t(IRA),\tlos\tsaberes,\tel\trango\tde\taplicación\to\tcontexto\ty\tlas\tevidencias\t  requeridas\tde\tcertificación.\tLo\tanterior\tpermite\tplanificar\tla\tenseñanza\tde\tuna\tfunción\tproductiva,\t  desde\tuna\tperspectiva\tintegral,\ten\tel\tque\tconvergen\tel\tsaber,\tel\thacer,\tel\tser\ty\tel\tconvivir.\t    Luego\tde\ttener\tclaridad\tcon\tel\tdiseño\tmicrocurricular,\tse\tpasa\tal\tdesarrollo\tmicrocurricular,    el cual está permeado por la intencionalidad metodológica y didáctica que el docente le otorga   al\tacto\tde\teducar;\tdiseñando\ty\tejecutando\tActividades\tde\tEnseñanza,\tAprendizaje\ty\tEvaluación\t  (AEAE),\tque\tpermiten\tel\taprendizaje\tde\tlos\tcriterios\tde\tdesempeño,\tconcebidos\tcomo\tjuicios\t  que\tcaracterizan\tlas\thabilidades\tnecesarias\tpara\tefectuar\tuna\tsubfunción\tproductiva.\tEs\tdecir,\t  dan cuenta de qué tiene que hacer una persona para cumplir con dicha subfunción (ya sea   conceptual,\tprocedimental\to\tcomportamental)\tdefinida\ten\tel\tERA.\t    Al\tmomento\tde\tplanificar\tlos\tcriterios\tde\tdesempeño,\tes\tmuy\timportante\tque\tsean    detallados,\tque\texista\tun\tequilibrio\tentre\tsu\tcorte\tcognitivo,\tprocedimental\ty\tactitudinal,\ty\tque\t  se\texpresen\ten\tel\torden\tlógico\tde\tsu\tdesarrollo.\tEn\tel\tenfoque\tde\tresultados\tde\taprendizaje,\tlos\t  criterios de desempeño se constituyen en Indicadores de Resultados de Aprendizaje (IRA).     Por\tsu\tparte,\tlos\tsaberes,\tal\tser\tlos\tobjetos\tde\testudio\tde\tun\tdesempeño,\tson\totro\taspecto    constitutivo\tde\tlos\tERA,\ty\tconsisten\ten\tdefinir\tcuáles\tson\tlos\tconocimientos\tque\tuna\tpersona\t  debe\ttener\ty\tcomprender\tpara\tdesarrollar\tlos\tcriterios\tde\tdesempeño\t/\tIRA.\tEs\timportante\t  también  nombrar  que  cada  saber  debe  estar  directamente  relacionado  con  alguno  de  los    criterios\tde\tdesempeño\tdefinidos.    Las estrategias experienciales de aprendizaje tienen como propósito principal generar   la  participación  activa  y  directa  de  los  estudiantes  en  su  proceso  educativo.  Se  centran  en    brindar\texperiencias\tprácticas\ty\tsignificativas,\tasí\tcomo\tsituaciones\treales\tque\testablezcan\t  conexiones con su entorno y sus conocimientos previos. Estas se conciben como un proceso   de\tadquisición\tde\tconocimientos\ty\thabilidades,\ty\tse\tdan\ta\ttravés\tde\tuna\tsecuencia\tde\tfases\t  que\tinvolucran\tla\treflexión,\tinteriorización,\taplicación\ty\tasimilación\tdel\tconocimiento\ty\tla\tex -  periencia.   \t   Kolb\t(como\tse\tcitó\ten\tPawelek,\t2013)\tpropone\tcuatro\tetapas\tclaves\ten\tlas\texperiencias\t \nModelo Educativo y Pedagógico 59  de\taprendizaje:\texperiencia\tconcreta,\tobservación\treflexiva,\tconceptualización\tabstracta\ty\t  experimentación\tactiva.\tEn\tla\tprimera,\tel\tindividuo\tse\tinvolucra\tdirectamente\ten\tuna\tactivi -  dad\to\tsituación;\tluego,\tpasa\ta\treflexionar\tsobre\tsu\texperiencia\ty\tanalizar\tlas\tconsecuencias;\t  para\tposteriormente\tgeneralizar\tlos\tconceptos\ty\tprincipios\taprendidos;\ty\tpor\túltimo,\ten\tla\t  experimentación\tactiva,\taplica\tlos\tconceptos\ten\tnuevas\tsituaciones\ty\tevalúa\tlos\tresultados\t  obtenidos.\tA\ttravés\tde\testas\tetapas\tde\taprendizaje,\tlos\testudiantes\tdesarrollan\ty\tasimilan\tel\t  conocimiento y la experiencia progresiva durante el proceso educativo.    Para la I.U. Pascual Bravo las estrategias de aprendizaje involucran actividades prác -  ticas,\tde\texperimentación,\treflexión\ty\taplicación\tdel\tconocimiento\ten\tcontextos\treales\to\tsi -  mulados.\tLos\testudiantes\tson\tdesafiados\ta\tresolver\tproblemas,\ttomar\tdecisiones,\ttrabajar\ten\t  equipo\ty\tenfrentar\tsituaciones\tauténticas,\tlo\tque\tles\tpermite\tdesarrollar\tel\tsaber,\thacer\ty\tser\t  como\thabilidades\tintegradas,\tque\tpromueven\tel\tpensamiento\tcrítico,\tla\tcreatividad,\tla\tresolu -  ción de problemas y la transferencia de conocimiento a situaciones nuevas.    6.3 Recursos didácticos    Para Mallart (2001) la didáctica es la ciencia de la educación que se enfoca en el es -  tudio\te\tintervención\tdel\tproceso\tde\tenseñanza,\taprendizaje\ty\tevaluación,\tcon\tel\tobjetivo\tde\t  lograr\tla\tformación\tintegral\tde\tlos\testudiantes.\tEn\teste\tsentido,\tla\tdidáctica\tse\tencarga\tde\t  utilizar\telementos,\tmétodos\ty\ttécnicas\tconocidos\tcomo\trecursos\tdidácticos,\tpara\tfavorecer\t  los\tprocesos\teducativos\tpresentes\ten\tla\tplanificación,\timplementación\ty\tevaluación\tde\tla\tfor -  mación.  \t   Los\trecursos\tdidácticos\tadoptan\tdiversas\tformas,\tcomo\tmateriales\tfísicos,\tdigitales,\t  audiovisuales,\tinteractivos,\ttalleres\ty\tlaboratorios;\ty\tse\tconstituyen\ten\tel\tsoporte\trequerido\t  por  los  contextos  reales  o  simulados  establecidos  en  los  ambientes  de  aprendizaje.  Estos    recursos\tfacilitan\tla\tcomprensión\tde\tsaberes\ty\tla\tparticipación\tactiva\tde\tlos\testudiantes,\tpara\t  enriquecer\tla\texperiencia\teducativa\ty\tponer\ten\tpráctica\tlos\taprendizajes,\tde\tmanera\ttangible\t  y\tconcreta,\t\tfavoreciendo\tla\tconsolidación\tde\tlos\tconocimientos\tadquiridos.  \t   Para\tla\tI.U.\tPascual\tBravo,\tlos\trecursos\tdidácticos,\ten\tla\tpresentación\tdinámica\tde\t  información,\trespaldan\ty\tenriquecen\tlos\tmétodos\tde\tenseñanza,\taprendizaje\ty\tevaluación\ten\t  el\tproceso\teducativo.\tTambién\tpermiten\tuna\tinteracción\tdirecta\tcon\tlos\tsaberes,\thabilidades\t  procedimentales\ty\tcomportamientos,\tlo\tque\ta\tsu\tvez,\tpor\tmedio\tde\telementos\tvisuales\ty\taudi -  tivos facilita la comprensión integral del conocimiento complejo. La disposición intencionada  \nModelo Educativo y Pedagógico 60  de los recursos didácticos se constituye en una estrategia interactiva para el estudio colabo -  rativo,\tla\tpromoción\tde\tla\tautonomía,\tla\toptimización\tde\therramientas\tdigitales\ty\tla\tpuesta\ten\t  marcha de experiencias de aprendizaje enriquecedoras.  6.4 Evaluación  \t   Como\teje\tarticulador\tllega\tla\tevaluación,\tla\tcual\thace\tparte\tdel\tproceso\teducativo\tpre -  sentado\ten\teste\tmodelo:\tplanificación\tcurricular,\timplementación\tdidáctica,\tevaluación\tde\t  competencias y orientación formativa integral. Ella permite contemplar el proceso de forma -  ción como un engranaje que se une con los diferentes niveles de concreción curricular: parte   del\tnivel\tmicrocurricular,\tpasa\tpor\tel\tmesocurricular\ty\ttermina\ten\tel\tmacrocurricular.\tEn\testa\t  medida,\tla\tevaluación\tno\tpuede\tlimitarse\ta\tla\tforma\tde\tcuantificar\tel\tresultado\tde\taprendizaje\t  de\tun\tmódulo\tacadémico,\tpues\tella\tdebe\ttambién\tabar     }
    function getLuminance(hex) {
        const { r, g, b } = hexToRgb(hex);
        const toLinear = (value) => {
            const s = value / 255;
            return s <= 0.03928 ? s / 12.92 : ((s + 0.055) / 1.055) ** 2.4;
        };
        return 0.2126 * toLinear(r) + 0.7152 * toLinear(g) + 0.0722 * toLinear(b);
    }
    function hslToHex(h, s, l) {
        const hue = ((h % 360) + 360) % 360;
        const saturation = Math.max(0, Math.min(100, s)) / 100;
        const lightness = Math.max(0, Math.min(100, l)) / 100;
        const hueToRgb = (p, q, t) => {
            let temp = t;
            if (temp < 0) temp += 1;
            if (temp > 1) temp -= 1;
            if (temp < 1 / 6) return p + (q - p) * 6 * temp;
            if (temp < 1 / 2) return q;
            if (temp < 2 / 3) return p + (q - p) * (2 / 3 - temp) * 6;
            return p;
        };
        const q = lightness < 0.5 ? lightness * (1 + saturation) : lightness + saturation - lightness * saturation;
        const p = 2 * lightness - q;
        const r = hueToRgb(p, q, hue / 360 + 1 / 3);
        const g = hueToRgb(p, q, hue / 360);
        const b = hueToRgb(p, q, hue / 360 - 1 / 3);
        return rgbToHex(r * 255, g * 255, b * 255);
    }
    function getReadableTextColor(bgColor) { return getLuminance(bgColor) > 0.56 ? '#111827' : '#f8fafc'; }
    function generatePalette() {
        const hue = Math.floor(Math.random() * 360);
        const bg = hslToHex(hue, 45 + Math.floor(Math.random() * 20), 16 + Math.floor(Math.random() * 70));
        const text = getReadableTextColor(bg);
        const isDark = getLuminance(bg) < 0.5;
        const accent = hslToHex((hue + 35 + Math.floor(Math.random() * 60)) % 360, 80, isDark ? 55 : 45);
        const card = isDark ? mixColors(bg, '#ffffff', 0.08) : mixColors(bg, '#000000', 0.05);
        const border = isDark ? mixColors(card, '#ffffff', 0.18) : mixColors(card, '#000000', 0.12);
        const input = isDark ? mixColors(card, '#ffffff', 0.07) : mixColors(card, '#000000', 0.04);
        const inputBorder = isDark ? mixColors(border, '#ffffff', 0.12) : mixColors(border, '#000000', 0.1);
        const botBg = isDark ? mixColors(bg, '#ffffff', 0.12) : mixColors(bg, '#000000', 0.06);
        return {
            bgColor: bg,
            textColor: text,
            cardBgColor: card,
            cardBorderColor: border,
            inputBgColor: input,
            inputBorderColor: inputBorder,
            chatBubbleBotBg: botBg,
            chatBubbleBotText: text,
            chatBubbleUserBg: accent,
            chatBubbleUserText: getReadableTextColor(accent),
            primaryColor: accent,
            secondaryColor: isDark ? mixColors(accent, '#ffffff', 0.2) : mixColors(accent, '#000000', 0.2),
            headerBorderColor: border,
            systemMessageBg: isDark ? mixColors(bg, '#fde68a', 0.2) : mixColors(bg, '#fde68a', 0.28),
            systemMessageText: isDark ? '#fef3c7' : '#78350f'
        };
    }
    function buildThemePalette(theme, palette) {
        const base = palette || {
            primaryColor: '#2563eb',
            secondaryColor: '#6b7280',
            bgColor: '#ffffff',
            textColor: '#1f2937',
            cardBgColor: '#ffffff',
            cardBorderColor: '#d1d5db',
            inputBgColor: '#ffffff',
            inputBorderColor: '#cbd5e1',
            chatBubbleBotBg: '#f3f4f6',
            chatBubbleBotText: '#1f2937',
            chatBubbleUserBg: '#2563eb',
            chatBubbleUserText: '#ffffff',
            headerBorderColor: '#e5e7eb',
            systemMessageBg: '#fef3c7',
            systemMessageText: '#92400e'
        };
        const isDark = theme === 'dark';
        const bgColor = isDark ? mixColors(base.bgColor || '#ffffff', '#000000', 0.72) : '#ffffff';
        const textColor = getReadableTextColor(bgColor);
        const cardBgColor = isDark ? mixColors(bgColor, '#ffffff', 0.08) : '#ffffff';
        const cardBorderColor = isDark ? mixColors(cardBgColor, '#ffffff', 0.16) : '#d1d5db';
        const inputBgColor = isDark ? mixColors(cardBgColor, '#ffffff', 0.06) : '#ffffff';
        const inputBorderColor = isDark ? mixColors(cardBorderColor, '#ffffff', 0.12) : '#cbd5e1';
        const chatBubbleBotBg = isDark ? mixColors(bgColor, '#ffffff', 0.12) : '#f3f4f6';
        const chatBubbleBotText = textColor;
        const headerBorderColor = cardBorderColor;
        const systemMessageBg = isDark ? mixColors(bgColor, '#fde68a', 0.2) : '#fef3c7';
        const systemMessageText = isDark ? '#fef3c7' : '#92400e';
        return {
            ...base,
            bgColor,
            textColor,
            cardBgColor,
            cardBorderColor,
            inputBgColor,
            inputBorderColor,
            chatBubbleBotBg,
            chatBubbleBotText,
            headerBorderColor,
            systemMessageBg,
            systemMessageText
        };

    function setPaletteVariables(target, palette) {

        target.style.setProperty('--primary', palette.primaryColor || '#007bff');
        target.style.setProperty('--secondary', palette.secondaryColor || '#6c757d');
        target.style.setProperty('--bg', palette.bgColor || '#f8f9fa');

        target.style.setProperty('--card', palette.cardBgColor || '#ffffff');

        target.style.setProperty('--input', palette.inputBgColor || '#ffffff');
        target.style.setProperty('--iborder', palette.inputBorderColor || '#cccccc');
        target.style.setProperty('--bot-bg', palette.chatBubbleBotBg || '#e9ecef');

        target.style.setProperty('--sys-bg', palette.systemMessageBg || '#fff3cd');
        target.style.setProperty('--sys-text', palette.systemMessageText || '#856404');
    }

    pdf2Upload.addEventListener('change', async (ev) => {
        const file = ev.target.files[0]; if (!file) return;
        if (!(file.type === 'application/pdf' || file.name.toLowerCase().endsWith('.pdf'))) {
            pdf2StatusDisplay.textContent = 'No es un PDF válido.'; pdf2StatusDisplay.style.color = 'var(--danger)'; return;
        }
        pdf2Name = file.name; pdf2NameDisplay.textContent = file.name;
        pdf2StatusDisplay.textContent = 'Procesando...'; pdf2StatusDisplay.style.color = 'var(--warning)';
        const reader = new FileReader();
        reader.onload = async (e) => {
            try {
                const pdf = await pdfjsLib.getDocument({ data: new Uint8Array(e.target.result) }).promise;
                let text = '';
                for (let i = 1; i <= pdf.numPages; i++) {
                    const page = await pdf.getPage(i);
                    const tc = await page.getTextContent();
                    tc.items.forEach(item => text += item.str + ' ');
                    text += '\n';
                }
                pdf2Text = text;
                pdf2StatusDisplay.textContent = '"' + pdf2Name + '" cargado.'; pdf2StatusDisplay.style.color = 'var(--success)';
                addMsg('Segundo documento "' + pdf2Name + '" listo.', 'system');
            } catch(err) { pdf2StatusDisplay.textContent = 'Error al procesar.'; pdf2StatusDisplay.style.color = 'var(--danger)'; pdf2Text = ''; }
        };
        reader.readAsArrayBuffer(file);
    });

        if (sender.includes('error')) el.classList.add('error');
        if (sender === 'bot' && !isThinking) {
            const processedMessage = message.replace(/\[/g, '\\[').replace(/\]/g, '\\]').replace(/\(/g, '\\(').replace(/\)/g, '\\)');
            const html = marked.parse ? marked.parse(processedMessage) : processedMessage;
            const botAvatarUrl = getAvatarUrl('bot');
            el.innerHTML = '<div class="message"><img class="avatar-img" src="' + botAvatarUrl + '" alt=""><div class="message-bubble bot-bubble"><strong>Chatbot:</strong><div class="tex2jax_process" style="margin-top:5px;">' + html + '</div><div style="margin-top:10px;font-size:.8em;color:var(--secondary);font-style:italic;">Modelo: ' + MODEL + '</div></div></div>';
            if (window.MathJax && window.MathJax.typesetPromise) window.MathJax.typesetPromise([el]).catch(err => console.error(err));
        } else if (sender === 'bot') {
            const botAvatarUrl = getAvatarUrl('bot');
            el.innerHTML = '<div class="message"><img class="avatar-img" src="' + botAvatarUrl + '" alt=""><div class="message-bubble bot-bubble"><strong>Chatbot:</strong> <span class="thinking-animation">' + message + '</span></div></div>';
            el.id = 'thinking-msg';
        } else if (sender === 'user') {
            const userAvatarUrl = getAvatarUrl('user');
            el.innerHTML = '<div class="message user-message"><div class="message-bubble user-bubble"></div><img class="avatar-img" src="' + userAvatarUrl + '" alt=""></div>';

    function updateLastMsg(message) {
        const el = document.getElementById('thinking-msg');
        const botAvatarUrl = getAvatarUrl('bot');
        const processedMessage = message.replace(/\[/g, '\\[').replace(/\]/g, '\\]').replace(/\(/g, '\\(').replace(/\)/g, '\\)');
        const html = marked.parse ? marked.parse(processedMessage) : processedMessage;
        if (el) {

    async function sendQuestion() {
        const question = questionInput.value.trim();
        if (!question || isProcessing) return;
        addMsg(question, 'user'); questionInput.value = '';
        conversationHistory.push({ role: 'user', content: question });
        isProcessing = true; sendButton.disabled = true; questionInput.disabled = true;
        loadingSpinner.style.display = 'inline-block'; sendButtonText.textContent = 'Enviando';
        addMsg('Pensando...', 'bot', true);
        const maxLen = 800000;
        const t1 = PDF_TEXT.length > maxLen ? PDF_TEXT.substring(0, maxLen) + '... (truncado)' : PDF_TEXT;
        const systemInstructions = 'Eres un asistente que SOLO debe ayudar con preguntas relacionadas con el contenido del/los documento(s) PDF de esta sesión y con el tema del chatbot: «' + CHATBOT_THEME + '». ' +
            'No respondas temas claramente ajenos (vida personal sin relación, otros libros o materiales no incluidos, programación o tareas arbitrarias no vinculadas al texto, cotilleo, política o entretenimiento sin conexión con el PDF, etc.). ' +
            'Si la pregunta no guarda relación razonable con el documento ni con ese tema, responde ÚNICAMENTE con UNA línea que empiece exactamente con [FUERA_DE_ALCANCE] seguida de una frase breve en español. ' +
            'Para preguntas válidas, fundamenta la respuesta en los textos del documento; si falta información en el PDF, dilo con claridad.';

        let prompt = 'Instrucciones del sistema:\n' + systemInstructions + '\n\n';
        prompt += 'Documento 1 ("' + PDF_NAME + '"): "' + t1 + '"\n\n';
        if (pdf2Text) {
            const t2 = pdf2Text.length > maxLen ? pdf2Text.substring(0, maxLen) + '... (truncado)' : pdf2Text;
            prompt += 'Documento 2 ("' + pdf2Name + '"): "' + t2 + '"\n\n';
        }
        prompt += '(Instrucción: Para expresiones matemáticas, utiliza SÓLO el formato $$...$$ para bloque y $...$ para texto en línea.)\n\n';

        // Incluir el historial completo de la conversación para dar contexto al modelo
        var historyBlock = conversationHistory.slice(0, -1).map(function(turn, index) {
            var speaker = turn.role === 'user' ? 'Usuario' : 'Asistente';
            return '[Turno ' + (index + 1) + '] ' + speaker + ': ' + turn.content;
        }).join('\n\n');
        if (historyBlock) {
            prompt += 'Conversación previa (historial del chat):\n' + historyBlock + '\n\n';
        }

        prompt += 'Pregunta: ' + question + '\n\nRespuesta:';
        try {
            const raw = (await postBackendText({
                model: MODEL,
                prompt: prompt,
                system: systemInstructions
            }) || '').trim();
            if (raw.startsWith('[FUERA_DE_ALCANCE]')) {
                const texto = raw.replace('[FUERA_DE_ALCANCE]', '').trim();
                conversationHistory.push({ role: 'assistant', content: texto });
                dismissThinkingAsSystem(texto, true);
            } else {
                conversationHistory.push({ role: 'assistant', content: raw });
                updateLastMsg(raw || 'La IA no proporcionó una respuesta.');
            }
        } catch(err) { updateLastMsg('Lo siento, ocurrió un error: ' + err.message); }
        finally {
            isProcessing = false; sendButton.disabled = false; questionInput.disabled = false;
            loadingSpinner.style.display = 'none'; sendButtonText.textContent = 'Enviar'; questionInput.focus();
        }
    }

        return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }

    function processHtmlToDocx(htmlContent) {
        const paragraphs = [];
        const tempDiv = document.createElement('div');
        tempDiv.innerHTML = htmlContent;
        const elements = tempDiv.children;
        if (elements.length === 0 && htmlContent.replace(/\s/g, '').length > 0) {
            return [new docx.Paragraph({ text: tempDiv.textContent || htmlContent, spacing: { after: 200 } })];
        }
        for (let i = 0; i < elements.length; i++) {
            const element = elements[i];
            const tagName = element.tagName.toLowerCase();
            const text = element.textContent || element.innerText || '';
            if (tagName === 'h1' || tagName === 'h2') {
                paragraphs.push(new docx.Paragraph({
                    text: text,
                    heading: tagName === 'h1' ? docx.HeadingLevel.HEADING_1 : docx.HeadingLevel.HEADING_2,
                    spacing: { before: 400, after: 200 }
                }));
            } else if (tagName === 'h3') {
                paragraphs.push(new docx.Paragraph({
                    text: text,
                    heading: docx.HeadingLevel.HEADING_3,
                    spacing: { before: 300, after: 200 }
                }));
            } else if (tagName === 'ul' || tagName === 'ol') {
                const listItems = element.querySelectorAll('li');
                listItems.forEach(function(li) {
                    paragraphs.push(new docx.Paragraph({
                        text: li.textContent,
                        bullet: { level: 0 },
                        spacing: { after: 100 }
                    }));
                });
            } else if (tagName === 'p') {
                const textRuns = [];
                if (element.children.length === 0) {
                    textRuns.push(new docx.TextRun({ text: text }));
                } else {
                    processInlineElements(element, textRuns);
                }
                paragraphs.push(new docx.Paragraph({
                    children: textRuns.length > 0 ? textRuns : [new docx.TextRun({ text: text })],
                    spacing: { after: 200 }
                }));
            } else if (tagName === 'blockquote') {
                paragraphs.push(new docx.Paragraph({
                    text: text,
                    italics: true,
                    indent: { left: 720 },
                    spacing: { after: 200 },
                    border: { left: { color: 'CCCCCC', size: 6, style: docx.BorderStyle.SINGLE } }
                }));
            } else if (tagName === 'code') {
                paragraphs.push(new docx.Paragraph({
                    text: text,
                    font: 'Courier New',
                    shading: { type: docx.ShadingType.SOLID, color: 'F5F5F5' },
                    spacing: { after: 100 }
                }));
            } else if (tagName === 'pre') {
                paragraphs.push(new docx.Paragraph({
                    text: text,
                    font: 'Courier New',
                    shading: { type: docx.ShadingType.SOLID, color: '2D2D2D' },
                    color: 'FFFFFF',
                    spacing: { after: 200 }
                }));
            } else {
                paragraphs.push(new docx.Paragraph({ text: text, spacing: { after: 200 } }));
            }
        }
        return paragraphs;
    }

    function processInlineElements(element, textRuns) {
        for (let j = 0; j < element.childNodes.length; j++) {
            const node = element.childNodes[j];
            if (node.nodeType === Node.TEXT_NODE) {
                textRuns.push(new docx.TextRun({ text: node.textContent }));
            } else if (node.nodeType === Node.ELEMENT_NODE) {
                const tagName = node.tagName.toLowerCase();
                const nodeText = node.textContent || '';
                if (tagName === 'strong' || tagName === 'b') {
                    textRuns.push(new docx.TextRun({ text: nodeText, bold: true }));
                } else if (tagName === 'em' || tagName === 'i') {
                    textRuns.push(new docx.TextRun({ text: nodeText, italics: true }));
                } else if (tagName === 'u') {
                    textRuns.push(new docx.TextRun({ text: nodeText, underline: {} }));
                } else if (tagName === 'code') {
                    textRuns.push(new docx.TextRun({
                        text: nodeText,
                        font: 'Courier New',
                        shading: { type: docx.ShadingType.SOLID, color: 'F0F0F0' }
                    }));
                } else if (tagName === 'a') {
                    textRuns.push(new docx.TextRun({ text: nodeText, color: '0066CC', underline: {} }));
                } else {
                    processInlineElements(node, textRuns);
                }
            }
        }
    }

            spacing: { after: 200 }
        }));
        children.push(new docx.Paragraph({
            text: '________________________________________________________________________________________________',
            spacing: { after: 400 }
        }));

        chatMessages.forEach(function(msg) {
            if (msg.classList.contains('system-message')) {
                children.push(new docx.Paragraph({
                    text: msg.textContent,
                    italics: true,
                    alignment: docx.AlignmentType.CENTER,
                    spacing: { after: 200 },
                    color: '666666'
                }));
            } else if (msg.classList.contains('user-message')) {
                const ub = msg.querySelector('.user-bubble');
                const userText = ub ? ub.textContent.trim() : msg.textContent.replace(/^Usuario:\s*/i, '').trim();
                children.push(new docx.Paragraph({
                    children: [
                        new docx.TextRun({ text: 'Usuario: ', bold: true, color: '0066CC' }),
                        new docx.TextRun({ text: userText })
                    ],
                    spacing: { after: 200 },
                    alignment: docx.AlignmentType.RIGHT,
                    shading: { type: docx.ShadingType.SOLID, color: 'E3F2FD' }
                }));
            } else if (msg.classList.contains('bot-message')) {
                const botBubble = msg.querySelector('.message-bubble');
                if (botBubble) {
                    const contentDiv = botBubble.querySelector('.tex2jax_process') || botBubble.querySelector('div[style*="margin-top:5px"]');
                    const modelInfoEl = botBubble.querySelector('div[style*="font-size:0.8em"]');
                    const modelInfo = modelInfoEl ? modelInfoEl.textContent : '';
                    if (contentDiv) {
                        const formatted = processHtmlToDocx(contentDiv.innerHTML);
                        formatted.forEach(function(paragraph) { children.push(paragraph); });
                        if (modelInfo) {
                            children.push(new docx.Paragraph({
                                children: [new docx.TextRun({ text: modelInfo, italics: true, size: 20, color: '666666' })],
                                spacing: { after: 200 }
                            }));
                        }
                    } else {
                        let plain = botBubble.textContent || '';
                        if (modelInfo) plain = plain.split(modelInfo).join('').trim();
                        plain = plain.replace(/^Chatbot:\s*/i, '').trim();
                        children.push(new docx.Paragraph({ text: plain, spacing: { after: 200 } }));
                    }
                }
            }
        });

        const doc = new docx.Document({
            sections: [{ properties: {}, children: children }]
        });
        docx.Packer.toBlob(doc).then(function(blob) {
            saveAs(blob, 'Sesion_Chat_' + Date.now() + '.docx');
        });
    }

    sendButton.addEventListener('click', sendQuestion);
    questionInput.addEventListener('keypress', e => { if (e.key==='Enter' && !e.shiftKey) { e.preventDefault(); sendQuestion(); } });
    document.getElementById('download-html-session-btn').addEventListener('click', downloadSessionHtml);
    document.getElementById('download-word-session-btn').addEventListener('click', downloadSessionWord);
    addMsg('Documento "' + PDF_NAME + '" listo. Solo respondo preguntas sobre este contenido o el tema «' + CHATBOT_THEME + '». ¡Puedes empezar!', 'system');
    questionInput.focus();
</script>
</body>
</html>
