        header{text-align:center;border-bottom:1px solid var(--border);padding-bottom:15px;}

        header p{margin:5px 0 0;font-size:.9em;color:var(--secondary);}
        .toolbar{display:flex;justify-content:flex-end;align-items:center;gap:10px;flex-wrap:wrap;}

        button:hover{background:#0056b3;}
        button:disabled{background:var(--secondary)!important;opacity:.65;cursor:not-allowed;}
        #theme-btn{background:var(--secondary);}
        #palette-btn{background:linear-gradient(135deg,var(--primary),var(--secondary));color:#fff;}
        .toolbar-actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center;}
        .btn-export{background:var(--primary);color:#fff;border:none;padding:8px 14px;border-radius:var(--radius);cursor:pointer;font-size:.85em;transition:background .2s;}
        .btn-export:hover{background:#0056b3;}
        .pdf2-section{padding:10px;border:1px dashed var(--border);border-radius:var(--radius);}
        .pdf2-section label.title{font-size:.85em;font-weight:bold;display:block;margin-bottom:6px;color:var(--secondary);}

        .file-label{background:var(--secondary);color:#fff;padding:6px 12px;border-radius:var(--radius);cursor:pointer;font-size:.85em;}

        #pdf2-name{font-style:italic;color:var(--secondary);font-size:.85em;}
        #pdf2-status{font-size:.85em;margin-top:4px;font-weight:bold;}
        .suggested-questions-row{display:flex;flex-direction:column;gap:6px;}
        .sq-label{font-size:.85em;font-weight:600;color:var(--secondary);}
        .questions-select{width:100%;padding:8px;border:1px solid var(--iborder);border-radius:var(--radius);background:var(--input);color:var(--text);font-size:.9em;}
        .chat-display{height:360px;overflow-y:auto;border:1px solid var(--iborder);border-radius:var(--radius);padding:10px;background:var(--bg);line-height:1.6;}

        .chat-display .user-message,.chat-display .bot-message{background:transparent;color:inherit;padding:0;border-radius:0;max-width:100%;text-align:inherit;margin-left:0;}
        .message{display:flex;align-items:flex-end;gap:10px;margin-bottom:4px;max-width:100%;}
        .message.user-message{flex-direction:row-reverse;justify-content:flex-start;}
        .avatar-img{width:40px;height:40px;border-radius:50%;object-fit:cover;flex-shrink:0;border:1px solid #eee;background-color:#f0f0f0;}
        body.dark-mode .avatar-img{border-color:#444;background-color:#555;}
        .message-bubble{padding:10px 15px;border-radius:18px;max-width:85%;word-wrap:break-word;line-height:1.5;display:flex;flex-direction:column;}
        .user-message .message-bubble.user-bubble{background:var(--user-bg);color:var(--user-text);border-bottom-right-radius:5px;margin-left:auto;}
        .bot-message .message-bubble.bot-bubble{background:var(--bot-bg);color:var(--bot-text);border-bottom-left-radius:5px;margin-right:auto;}
        .chat-display .message-bubble strong{color:var(--primary);font-size:.9em;}
        .chat-display .bot-message .message-bubble p{margin:0 0 8px;}.chat-display .bot-message .message-bubble p:last-child{margin:0;}
        .chat-display .bot-message .message-bubble pre{background:var(--dark);color:var(--light);padding:10px;border-radius:5px;overflow-x:auto;}
        .chat-display .bot-message .message-bubble code{background:rgba(0,0,0,.1);padding:2px 4px;border-radius:3px;}
        body.dark-mode .chat-display .bot-message .message-bubble code{background:rgba(255,255,255,.1);}
        .chat-display .system-message{background:var(--sys-bg);color:var(--sys-text);text-align:center;font-style:italic;font-size:.9em;padding:8px 12px;border-radius:var(--radius);}
        .chat-display .system-message.error{background:#f8d7da;color:#721c24;}
        .thinking-animation{opacity:.75;animation:pulseThink 1s ease-in-out infinite;}
        @keyframes pulseThink{50%{opacity:1}}
        .input-area{display:flex;gap:10px;}
        #question-input{flex-grow:1;padding:10px;border:1px solid var(--iborder);border-radius:var(--radius);font-size:1em;resize:none;background:var(--input);color:var(--text);}
        #send-button{background:var(--success);padding:0 20px;display:flex;align-items:center;justify-content:center;gap:8px;}
        #send-button:hover{background:#1e7e34;}
        .loader{border:3px solid #f3f3f3;border-top:3px solid var(--primary);border-radius:50%;width:16px;height:16px;animation:spin 1s linear infinite;display:none;}
        @keyframes spin{0%{transform:rotate(0deg)}100%{transform:rotate(360deg)}}
        footer{text-align:center;padding:12px;background:var(--dark);color:var(--light);font-size:.8em;margin-top:20px;}
        @media(max-width:600px){.input-area{flex-direction:column;}#send-button{width:100%;padding:12px;}}
    </style>
</head>

el\tcumplimiento\tde\tlos\tdemás\t  derechos\thumanos\thacia\tla\tconstrucción\tde\tuna\tsociedad\tjusta,\tque\tpromueva\tel\tprogreso\t  individual\ty\tsocial,\tsin\tdistinción\tde\tclase\to\tgénero,\ty\tque\tmedie\tpor\tla\tconstrucción\tde\tla\tpaz\t  mundial y la libertad.  1.  A MANERA DE CONTEXTO  Un aula diversa desde el punto de vista cultural no solo será más   inclusiva, sino que potenciará además el aprendizaje y el rendimiento   de los estudiantes. Un entorno de trabajo multicultural no solo será   más innovador, sino que será además más productivo y más rentable   económicamente.  UNESCO     El  concepto  de  derecho  a  la  educación  fue  adoptado  y  proclamado  por  la  Asamblea    General\tde\tlas\tNaciones\tUnidas\tel\t10\tde\tdiciembre\tde\t1948,\ten\tsu\tDeclaración\tUniversal\tde\t  Derechos\tHumanos.\tDe\testa\tapuesta\tmundial\thace\tparte\tColombia,\tno\tsolo\tdesde\tel\t5\tde\tno -  viembre\tde\t1945\tal\tunirse\ta\tla\tOrganización\tde\tlas\tNaciones\tUnidas,\tsino\talgunas\tdécadas\tdes -  1.1 El derec cación en tiempos de pandemia y pospandemia \nModelo Educativo y Pedagógico 20  1.2 Un nuevo desafío tecnológico  pués\tcuando\tlo\tincluye\ten\tsu\tConstitución\tPolítica\tde\t1991,\tal\testablecer\tmayores\telementos\t  de garantía.  \t   Ahora\tbien,\ten\tla\tépoca\tde\tla\tpandemia,\teste\timportante\tderecho,\tque\tha\tsoportado\t  sistemáticos\tdesconocimientos,\tpresentó\tun\tcrecimiento\ten\tsu\tvulneración\tpor\tel\tfenómeno\t  biosocial que la Covid-19 trajo consigo; tanto así que la Comisión Interamericana de Derechos   Humanos (CIDH) expidió la Resolución 1 el 10 de abril de 2020 (a menos de un mes de haberse   declarado\temergencia\tsanitaria\ten\tColombia),\tdenominada:\tPandemia\ty\tDerechos\tHumanos\ten\t  las\tAméricas,\tbuscando\tgarantizar\tel\tcumplimiento\tde\tlos\tderechos\tque\tse\tvieron\tafectados\tpor\t  esta\tsituación,\tentre\tellos\tel\tde\tla\teducación.  \t   En\tépoca\tde\tpandemia,\tla\tI.U.\tPascual\tBravo\tpudo\tgarantizar\tel\ttalento\thumano\ty\tlos\t  recursos\tdigitales\tpara\tcontinuar\tcon\tsus\tservicios\teducativos,\tpensando\ten\tel\tbeneficio\tde\t  estudiantes\ty\tdocentes,\ty\tapoyando\tsus\tprincipales\tdificultades;\tentre\tBienestar\tUniversitario,\t  Gestión\tde\tTalleres\ty\tLaboratorios,\ty\tla\tUnidad\tde\tEducación\tDigital\tse\tlogró\tresponder\ta\teste\t  impacto.\tLos\tavances\ttecnológicos\tmarcaron\tla\tdiferencia\ten\tla\tforma\tde\tenseñanza,\tconvirtien -  do\tlas\therramientas\tdigitales\ten\tel\tmayor\taliado\tde\tla\tdidáctica\ty\tel\taprendizaje.\tSin\tembargo,\t  el\ttiempo\tde\taislamiento,\tla\tenfermedad\tpropia\to\tde\tlos\tseres\tqueridos,\tel\tretorno\thíbrido\tde\tlos\t  estudiantes\ta\tlas\taulas,\ty\tposteriormente\ta\tla\tpresencialidad,\tllegaron\tcon\tel\tmiedo,\tla\tdescon -  fianza\ty\tel\taumento\ten\tlos\tcasos\tde\ttrastornos\tde\tsalud\tmental,\tlo\tque\ttrajo\tconsigo\tun\tnuevo\t  reto\tpara\tla\teducación\t(Montiel\tChamorro,\t2022).    Uno de los grandes aportes que se dio en la época de la pandemia fue aprovechar la tecno -  logía\ten\tbeneficio\tdel\tdesarrollo\tsocial,\tpues\testa\tle\tposibilitó\ta\tla\teducación\tseguir\tsu\tcurso,\tadap -  tándose\ta\tla\tnueva\tnormalidad\ty\tcreando\tnuevos\tescenarios\tde\taprendizaje.\tA\tsu\tvez,\tdemostró\t  que\tpor\testa\tvía\tla\teducación\tpuede\tllegar\ta\tmuchos\tmás\tindividuos,\thacerse\tmás\tflexible,\tgenerar\t  un mayor impacto social y potencializar la internacionalización del currículo y de los procesos edu -  cativos.  \t   La\tOrganización\tde\tlas\tNaciones\tUnidas\tpara\tla\tEducación,\tla\tCiencia\ty\tla\tCultura.\t[UNES -  CO],\t(2022)\ten\tsu\tInforme\tde\tla\tComisión\tInternacional\tsobre\tlos\tFuturos\tde\tla\tEducación,\tmen -  ciona\tque\tla\teducación\tdebe\tser\tel\tbaluarte\tde\tla\ttecnología,\tpara\tque\testa\tsea\tutilizada\ten\tsu\t  beneficio,\ty\tpor\tende\ten\tel\tde\tla\tsociedad,\taprovechando\tlas\toportunidades\tque\tel\tmundo\tactual\t  presenta y sus avances en ciencia y tecnología. La educación debe ofrecer las herramientas nece - \nModelo Educativo y Pedagógico 21  sarias\tpara\tafrontar\tlos\tretos\tdel\tsiglo\tXXI,\ty\tsu\tmejor\taliada,\tsin\tlugar\ta\tduda,\tes\tla\ttecnología,\t  pues\tlas\texigencias\tsociales,\tacadémicas\ty\tlaborales\testán\tgirando\thacia\tsu\tuso,\taplicación,\t  estudio\ty\tresignificación.\t  \t   En\testa\tmedida,\ty\trelacionando\teste\tplanteamiento\tcon\tlo\testablecido\tpor\tla\tUNESCO\t  (2022)\ty\tcon\tla\tapuesta\teducativa\tde\tla\tI.U.\tPascual\tBravo,\tse\tpuede\tenfatizar\ten\tla\timportancia\t  de\tun\tmodelo\teducativo\torientado\thacia\tlas\tnecesidades\tcontextuales,\tque\tpueda\tentregar\ta\t  la sociedad y al sector productivo los egresados que está necesitando. Esto se constituye en   un\tgran\treto\tinstitucional,\tdebido\tal\tefecto\tque\testá\tteniendo\ten\tlas\tcompetencias\tde\tlos\tgra -  duados\tla\tobsolescencia\tde\tparte\tde\tlos\taprendizajes\tque\tdan\tlas\tuniversidades,\tcon\tel\trápido\t  avance\ttecnológico,\tlas\tnuevas\tprofesiones\ty\tlas\tbrechas\tde\ttalento\tque\tse\testán\tidentificando;\t  esto\tes,\tporque\talgunos\tde\tlos\tperfiles\tde\tlos\tegresados\tno\tcumplen\tcon\tlas\tnecesidades\ty\t  expectativas de los mercados cambiantes y emergentes.  \t   Finalmente,\tes\tindispensable\tnombrar\tque,\tcon\ttodo\tel\tauge\ttecnológico\tque\tcaracteriza\t  el\tsiglo\tXXI,\tprincipalmente\ten\ttérminos\tde\tinteligencia\tartificial,\tes\tmuy\timportante\tque\testé\t  unido\ta\tla\tética,\tde\tmodo\ttal\tque\tcada\tavance\tgenerado\ttenga\tclaro\tel\tpara\tqué\ty\tel\tporqué\tde\t  su\texistencia,\tasí\tcomo\ttambién\tel\taporte\tque\tdicha\ttecnología\tle\thace,\tno\tsolo\ta\tla\teconomía\t  mundial,\tsino\tal\tcrecimiento\tsocial\ty\tcultural\tde\tlas\tnaciones\t(Cortina,\t2013).\tQue\tlos\tavances\t  tecnológicos\tno\tperjudiquen\ta\tlos\tseres\thumanos,\tsino\tque\tsean\taprovechados\tpara\tque\tcada\t  sociedad\tpueda\tcrecer,\ty\tsus\tindividuos\tpuedan\ttener\tun\tmejor\tnivel\ty\tcalidad\tde\tvida.  1.3 Y de la educación ambiental, ¿qué?  \t   A\tpropósito\tde\tla\timportancia\tde\tla\tdimensión\tética\ten\tla\ttecnología,\ty\tde\tlos\tcambios\t  contextuales\tque\tse\than\tplanteado\thasta\tel\tmomento,\ttambién\tes\tindispensable\tque\tlos\tsis -  temas  educativos  asuman  la  educación  ambiental  como  uno  de  los  grandes  retos  que  trae    consigo este siglo. El deterioro ambiental ya dejó de ser un discurso banal en las instituciones   educativas\ty\tmedios\tde\tcomunicación\tpara\tconvertirse\ten\tuna\trealidad\tecológica\ty\tsocial,\tde\tla\t  cual depende el futuro de la humanidad.    Cada vez se hace más importante generar espacios académicos para abordar los pro -  cesos\tde\tindustrialización\ty\tcambio\tclimático,\tno\tsolo\tpara\tmostrar\tel\tdeterioro\thasta\tel\tcual\tha\t  llegado\tel\tplaneta\ttierra,\tsino\tcon\tla\tintención\tde\tcrear\tconciencia\ten\tlos\testudiantes\tsobre\tel\t  cuidado\tdel\tmedio\tambiente,\ty\tla\timportancia\tdel\tequilibrio\tentre\ttecnología,\tindustrialización,\ty\t  el\tuso,\to\tabuso,\tde\tlos\trecursos\tnaturales;\tteniendo\ten\tcuenta\tque\tes\tun\tdeterioro\tque\tdata\tde\t  tiempo\tatrás,\tcomo\tconsecuencia\tde\tlas\trevoluciones\tindustriales,\tque\tse\than\tpresentado\ta\tlo\t  largo\tde\tla\thistoria,\ten\tlas\tcuales\tla\tsociedad\ta\ttravés\tdel\tdeterioro\tdel\tmedio\tambiente,\tel\tcon - \nModelo Educativo y Pedagógico 22  1.4 La I.U. Pascual Bravo hacia una sociedad pluralista  sumismo y el calentamiento global se ha visto obligada a diseñar estrategias sostenibles para el   cuidado del planeta.  \t   Es\timportante\ttambién\teducar\ten\teste\ttema\ta\ttodos,\tdesde\tque\tse\tinicia\tel\tproceso\tes -  colar en la primera infancia hasta terminar los estudios de universidad. De igual manera y en   sintonía con lo que planteó Wright (2002) las universidades deben poner en práctica políticas   ambientales\tque,\tproducto\tde\tla\tinvestigación,\tfortalezcan\tla\teducación,\tla\textensión\ty\tla\tope -  ración\tmisma\tde\tlas\tentidades\ty,\ten\testo,\testá\tcomprometida\tla\tinstitución.    La I.U. Pascual Bravo tiene una presencia activa en procesos de investigación relaciona -  dos con el medio ambiente; adicional tiene la apuesta de fortalecer la educación ambiental en   sus propuestas curriculares. Al ser una institución con enfoque tecnológico no puede perder de   vista el equilibrio entre la innovación y la dimensión ética en relación con el cuidado del medio   ambiente; más aún cuando se trata de una institución que incluye los Objetivos de Desarrollo   Sostenible\t-\tODS\t-\ten\tsu\tpropuesta\teducativa.\tEl\tdeseo\tde\tcontribuir\tal\tdesarrollo\tsostenible,\ty\t  sus\tobjetivos,\tno\tsolo\tfue\tun\tcumplimiento\tpolítico,\tsino\tque\tse\tconvirtió\ten\tun\tdeber\tque\tllevó\t  a\tla\tinstitución\ta\tcomprometerse\tcon\tser\tun\tcampus\tverde,\tinteligente\te\tinclusivo,\tpor\tlo\tque\t  registra\tsu\tpropio\tmodelo,\ty\tdesde\tallí\tla\teducación\tambiental\tdebe\thacer\tparte\tdel\tfortaleci -  miento de esta cultura.  \t   El\tconcepto\tde\tdiversidad\tafianza\tla\tdefinición\tde\tuna\tsociedad\tpluralista,\tteniendo\ten\t  cuenta que no es la simple aceptación de las minorías en una sociedad previamente establecida   como\thomogénea,\tsino\tque\thabla\tdel\trespeto\tpor\tla\tdiferencia;\tpermite\tver\tla\tdiversidad\tcomo\t  una\triqueza\tcultural\thacia\tel\tfortalecimiento\tdel\tdesarrollo\tsocial\ty\teconómico,\ttanto\tindividual\t  como\tcolectivo,\thacia\tla\tlucha\tpor\tla\tigualdad\ty\tla\tequidad.\tPertenecer\ta\tuna\tsociedad\tpluralis -  ta\thace\tparte\tde\tincluir\tla\tdiversidad\ten\tlo\tcotidiano:\ten\tlas\taulas\tde\tclase,\ten\tlos\tdiálogos\tdel\t  corredor,\ten\tla\tbúsqueda\tcolectiva\tdel\tbien\tcomún,\ten\tla\tconstrucción\tde\tseres\tautónomos\ty\t  seguros de sí mismos porque son reconocidos sus derechos y sus talentos desde sus propias   diferencias\t(sociales,\treligiosas,\tsexuales,\tculturales,\tbiológicas,\tlingüísticas,\traciales,\tetc.),\ty\t  tienen\tla\tlibertad,\ty\tla\tconfianza,\tde\tser\tescuchados\ty\ttenidos\ten\tcuenta\t(Ortega\tRuiz\ty\tManguez\t  Vallejos\t(2001),\tCanal\tBBVA\t(2019\t),\tUNESCO\t(2022)).  \t   En\tel\tcamino\thacia\tla\tconstrucción\tde\tuna\tsociedad\tpluralista,\tla\tI.U.\tPascual\tBravo\tha\t  ido forjando la apertura social y cultural de su proceso de admisión a los programas que lidera.   A\tlo\tlargo\tde\tsu\texistencia,\tse\tha\tconstituido\ten\tuna\toportunidad\tde\tinclusión\teducativa\tpara\t \nModelo Educativo y Pedagógico 23  los jóvenes menos favorecidos de la ciudad de Medellín y del departamento de Antioquia; pues   en\tsu\tgran\tmayoría,\tsus\testudiantes\tpertenecen\ta\tlos\testratos\tsocioeconómicos\t1,\t2\ty\t3,\tson\t  egresados\tde\tinstituciones\tpúblicas,\ttrabajadores\ty\tcon\tnúcleos\tfamiliares\tdiversos.\tAdicional,\t  la I.U Pascual Bravo ha estado en esta construcción con el apoyo de la Dirección de Bienestar   Universitario\ten\tla\tparticipación\tde\tprogramas\ty\tservicios\tque\tpromueven\tla\tinclusión,\tla\tequi -  dad\tde\tgénero\ty\tla\tdiversidad;\tlas\tpolíticas\tinstitucionales\tfrente\ta\ttemas\tde\tinclusión\ty\tequidad,\t  el\tmodelo\tde\tcampus\tverde,\tinteligente\te\tinclusivo;\ty\tel\tmodelo\tde\tregionalización.\t  \t   Aunque\tlos\tpasos\tque\tse\than\tdado\tson\trepresentativos,\tes\timportante\tque\tla\tdiversidad\t  recorra\ttodos\tlos\tespacios\tinstitucionales;\tpúblicos\ty\tprivados,\tque\tel\trespeto\tse\tsienta\ten\tlos\t  diálogos\ty\tdebates\tdentro\ty\tfuera\tdel\taula\tde\tclase,\tque\tla\tapuesta\tde\tuna\tsociedad\tpluralista\t  se convierta en una característica propia de la institución.     Los retos que han traído consigo los últimos tiempos solo pueden ser afrontados traba -  jando\ten\tcomunidad;\tun\tejemplo\tde\testo\tse\tvivió\ten\tépoca\tde\tpandemia,\tdonde\tla\tunión\tde\t  estudiantes,\tfamilias,\tdocentes\te\tinstituciones\tlogró\tamortiguar\tsu\timpacto.\tLa\ttransformación\t  de\tla\teducación,\tcuyo\tfin\túltimo\tes\tlograr\tla\temancipación\tdel\tindividuo\tde\taquellas\tcondiciones\t  de\tdesigualdad\te\tinequidad\ta\tlas\tcuales\tha\testado\tsometido,\trequiere\tde\tmás\ttrabajos\tcomo\t  este:\tdonde\tcada\tsujeto\tpueda\taportar\tdesde\tsu\tsaber,\tsu\thacer\ty\tsu\tser\ten\tbúsqueda\tdel\tbien\t  social.   \t   Ahora\tbien,\ten\tlos\tnuevos\tescenarios\tmundiales\tse\thace\tde\tnuevo\timperante\tlograr\testa\t  unión\tpara\tafrontar\tlos\tretos\tde\tla\teducación\tsuperior,\tdel\tfuturo\tfrente\ta\tlos\tdesafíos\tecológicos,\t  tecnológicos,\teconómicos,\téticos\ty\tsociales.\tEn\teste\tcaso\tpuntual,\tdeben\testar\ten\tla\tmisma\t  dirección\tel\tProyecto\tEducativo\tInstitucional,\tel\tenfoque\tpedagógico\ty\tel\tplan\tde\testudios\taca -  démico,\tlos\tdocentes,\tlos\tinvestigadores,\tel\tsector\tproductivo,\tlos\testudiantes\ty,\tpor\tsupues -  to,\tel\tEstado.\tEl\tfuturo\tde\tla\teducación\tdepende\tde\tla\tsolución\tde\tlos\tproblemas\tdel\tpresente\t  (UNESCO,\t2022),\tde\tla\tparticipación\tsocial\tactiva\ten\tla\tque\tse\tplanee\ty\tbusque\tel\tbien\tcomún,\t  y\tde\tla\trapidez\tcon\tla\tque\tse\tapropien\tlos\tavances\ttecnológicos,\tlos\tcuales\tvan\ta\tuna\tvelocidad\t  tal,\tque\tla\tdefinición\tde\tobsolescencia\ttecnológica\tperderá\ttodo\tsu\tsentido\tcon\trespecto\ta\tlo\t  que se considera antiguo. \nModelo Educativo y Pedagógico 24 2. REFE   - RENTES  TEÓRICOS  2. REFERENTES  TEÓRICOS \nModelo Educativo y Pedagógico 25  2. REFERENTES TEÓRICOS  Cuanto más pienso en la práctica educativa   y reconozco la responsabilidad que ella nos exige,   más me convenzo de nuestro deber de luchar   para que ella sea realmente respetada.  Paulo Freire   2.1 Educación  \t   La\tetimología\tde\tla\tpalabra\teducación\tplantea\tque\t“educare\t(educar,\tcriar,\talimentar)\tse\t  formó\tmediante\tel\tprefijo\tex(fuera)\ty\tel\tverbo\tducare\t(guiar,\tconducir)\toriginado\ten\tel\tindoeuro -  peo\tdeuk”\t(Soca,\t2010,\tp.78).\tLas\tconcepciones\tcriar\ty\tconducir,\tsegún\tNassif\t(1984)\tson\tparte\t  de\tdos\tideas\tde\teducación:\tla\ttradicional\ty\tla\tprogresivista.\tLa\tprimera\tcentrada\ten\tel\teducador,\t  con\tun\testudiante\tpasivo,\ty\tla\tsegunda\tcentrada\ten\tel\testudiante,\ty\tsu\tresponsabilidad\ty\tespon -  taneidad en el proceso.   \t   La\tI.U.\tPascual\tBravo\tcree\ten\tla\teducación\tcentrada\ten\tel\testudiante,\tcomo\tsujeto\tres -  ponsable\ty\tautónomo\ten\tsu\tproceso\teducativo,\tsuscitando\tla\temancipación\tsocial,\tcultural,\t  emocional\ty\tpolítica.\tEn\tel\tinforme\tde\tautoevaluación\tinstitucional\tdel\t2021\tse\t“concibe\tla\tedu -  cación\tcomo\tun\tmedio\tde\ttransformación\tsocial”\t(Institución\tUniversitaria\tPascual\tBravo,\t2021,\t  p.16),\tdebido\ta\tque\tlas\tprácticas\teducativas\tno\tson\thechos\taislados;\tpor\tel\tcontrario,\tse\tdan\ten\t  un\tcontexto\tsocial\tque\tes\tcambiante\tpor\tellas\tmismas,\tcontribuyendo\ta\tla\ttransformación\tsocial\t  de la ciudad y el país.     La educación es un proceso de toda la vida: todos los espacios que habita el ser huma -  no\tse\ttornan\teducativos.\tNassif\t(1984)\tplanteó\tque\tla\teducación\tes\tconvertir\tlo\tque\thace\tel\tser\t  humano\ten\tun\tproceso\tcon\tfundamentación\tcientífica,\tpara\tser\tenseñado\ty\taprendido.\tEsto\t  implica concebir a la educación en relación íntima con la experiencia: propia y ajena; de manera   que el contexto se constituye en el epicentro experiencial del proceso educativo. Desde esta   perspectiva,\tla\tI.U.\tPascual\tBravo\tinscribe\tsus\tprocesos\teducativos\tdesde\tla\tperspectiva\tde\tla\t  educación\ta\tlo\tlargo\tde\tla\tvida.\tPara\testo,\tconcibe\tsu\taccionar\tformativo\ten\tarticulación\tcon\tto -  dos\tlos\tniveles\teducativos\tdel\tsistema\tcolombiano,\tdesde\tla\teducación\tinicial\thasta\tla\tsuperior,\t  en los cuales busca incidir en su desarrollo armónico. \nModelo Educativo y Pedagógico 26  2.2 Pedagogía  El\tMinisterio\tde\tEducación\tNacional\t[MEN],\t(2017)\tdefine\tla\tpedagogía\tcomo\tun\tsaber\tque  se\tproduce\tpermanentemente\tcuando\tla\tcomunidad\teducativa\tinvestiga\tel\tsentido\tde\tlo\tque\thace,\t  las\tcaracterísticas\tde\taquellos\ty\taquellas\ta\tquienes\tenseña,\tla\tpertinencia\ty\tla\ttrascendencia\tde\tlo\t  que enseña. La pedagogía lleva al maestro a percibir los procesos que suceden a su alrededor y a    buscar los mejores procedimientos para intervenir crítica e innovativamente en ellos (párr.2).  \t   La\tpedagogía\ten\tla\tinstitución\tes\tentendida\tcomo\tla\tdisciplina\tque\treflexiona\tel\tacto\tedu -  cativo\tpara\tdarle\tsentido\ty\tvalidez\ta\tla\teducación.\tEntender\tla\tpedagogía,\tdesde\testa\treflexión,\t  es\tapostar\tpor\tuna\tfundamentación\tteórica\tque\tse\trelacione\tcon\totras\tdisciplinas,\tde\tmanera\t  que permanezca la coherencia en el proceso educativo; no solo desde el discurso acerca de   la\tenseñanza,\tsino\tcomo\tpráctica\tcuyo\tcampo\tde\taplicación\tes\tel\tmismo\tdiscurso\t(Bedoya\ty\t  Gómez,\t1989).     La  I.U.  Pascual  Bravo  considera  que  los  docentes  construyen  el  saber  pedagógico  a    partir\tde\tla\treflexión\tque\thacen\tde\tsus\tprácticas\teducativas.\tPara\testo\t\tDe\tShön\t(1998)\tplantea\t  llevar\ta\tcabo\ttres\tfases:\tconocimiento\ten\tla\tacción,\treflexión\ten\ty\tdurante\tla\tacción,\ty,\treflexión\t  sobre\tla\tacción\ty\tsobre\tla\treflexión\ten\tacción.\tEstas\tfases\tse\tpueden\tver\treflejadas\ten\tla\tcapa -  cidad\tde\tanalizar\tla\tperspectiva\tcontextual,\tconcretada\ten\tla\tenseñanza\ta\tpartir\tdel\tdiseño\ty\t  planificación\tcurricular,\tque\tpermita\tla\temancipación\tde\tlos\testudiantes\tmediante\tel\tdesarrollo\t  del pensamiento crítico.   \t   En\tsintonía\tcon\tlo\tanterior,\tla\tinstitución\tapuesta\tpor\tla\tpedagogía\tcrítica\tal\tbuscar\tla\t  emancipación\tdel\testudiante.\tComo\tlo\tplantea\tMuñoz\t(2018)\tla\temancipación\tlleva\ta\tuna\tmayor\t  consciencia\tde\tla\texistencia\ty\tlos\tcontextos,\tcomprometiendo\tal\testudiante\tcon\tsu\thistoria\ty\tla\t  transformación\tsocial,\tcomo\trevolución\to\tproyecto,\tdonde\tse\tbusca\tla\tsuperación\tde\trealidades\t \nModelo Educativo y Pedagógico 27  2.3 Formación  evitando\tque\tel\tser\thumano\tsea\tuno\tmás,\ty\tdefendiendo\tla\tcondición\thumana\tcomo\tpotencia\t  creadora.  \t   La\tReal\tAcademia\tEspañola\tdefine\tla\tpalabra\tformar\tcomo\t“Dar\tforma\ta\talgo”\t(s.f.\tdefini -  ción\t1)\ty\t“Preparar\tintelectual,\tmoral\to\tprofesionalmente\ta\tuna\tpersona\to\tun\tgrupo\tde\tpersonas”\t  (s.f.\tdefinición\t5).\tPor\totra\tparte,\tdefine\tla\tformación\tcomo\t“acción\ty\tefecto\tde\tformar\to\tformar -  se”\t(s.f.\tdefinición\t1).\tA\tpartir\tde\testas\tconcepciones,\tse\tpuede\tinferir\tque\tla\tacción\tde\tformar\t  se\tda\tdesde\tel\tsujeto\tmismo\to\tdesde\tun\tagente\texterno,\ty\tes\tintencionada\tpara\tgenerar\tuna\t  forma\tespecífica,\tapropiar\tcaracterísticas\tintelectuales,\tactitudinales\ty\tprocedimentales\ten\tlas\t  personas que se dispongan para ello.   \t   Según\tGadamer\t(1996)\t“en\tla\tformación\tuno\tse\tapropia\tpor\tentero\tde\taquello\ten\tlo\tcual\ty\t  a\ttravés\tde\tlo\tcual\tuno\tse\tforma.\tEn\testa\tmedida\ttodo\tlo\tque\tella\tincorpora\tse\tintegra\ten\tella\t[...]\t  En\tla\tformación\talcanzada\tnada\tdesaparece,\tsino\tque\ttodo\tse\tguarda”\t(p.40).\tEn\teste\tsentido,\t  se puede considerar la formación como un proceso que no es exclusivo de las ofertas de edu -  cación\tformal,\tsino\tcomo\tuna\tacción\tpermanente\tque\tse\tda\ta\tlo\tlargo\tde\tla\tvida\ty\ten\tdistintos\t  contextos,\ten\tlos\tcuales\tlos\tseres\thumanos\tse\tapropian\tde\tlos\tsaberes\ty\tprácticas\tsociales.  \t   A\tsu\tvez,\tNavarrete\tCazales\t(2013)\tpiensa\teste\tconcepto,\tdesde\tun\tcontexto\tacademi -  cista,\tal\tmencionar\tque\t”la\tformación\taludida\ta\tlo\tintelectual-profesional\tde\tuna\tpersona:\tpuede\t  hacer\treferencia,\tpor\tuna\tparte,\ta\tla\tautoformación\to\tal\tautodidactismo\to,\tpor\totra,\ta\tla\tforma -  ción\tinstitucional\tintencionada\ttal\tcomo\tla\tque\tse\tda\ten\tla\tescuela\ty\tse\tcertifica\tpor\tmedio\tde\tun\t  título”\t(p.8).\tDesde\testa\tperspectiva\tel\testudiante\tes\tconsciente\tde\tsu\tformación\tpermitiéndole\t  ser responsable y autónomo de su proceso; al mismo tiempo visibiliza el rol de las instituciones   educativas\tcomo\tagentes\tcertificadores\tque\tle\timprimen\tidoneidad,\tde\tmanera\tintencionada,\tal\t  sujeto que se educa.  \t   Teniendo\ten\tcuenta\tlo\tanterior,\tla\tI.U.\tPascual\tBravo\tconsidera\tque\tla\tformación\tpermite\t  que\tel\testudiante\tse\tapropie\tde\tlos\tconocimientos,\tlos\tlleve\ta\tla\tsolución\tde\tproblemas\tsociales\t  por\tmedio\tde\tlas\taplicaciones\ttecnológicas,\ty\tde\tsu\tcrecimiento\tintelectual\ty\tactitudinal.\tAsí\t  mismo,\tla\tmotivación\tse\tconstituye\ten\tel\tpunto\tde\tpartida\tpara\tque\tun\tsujeto\tparticipe\tactiva -  mente\tde\tsu\tproceso\teducativo,\tde\tmanera\tque\tsea\tun\tagente\ttransformador\tde\tsu\trealidad,\t \nModelo Educativo y Pedagógico 28  pero que esté permeado por la intencionalidad que surge de la vocación técnica y tecnológica   que profesa en la actualidad la institución.  2.4 Evaluación  \t   La\tevaluación\tes\t“la\tposibilidad\tde\tvalorar\tla\tinformación\tque\ttenemos\tsobre\tuna\tsitua -  ción\to\tun\tproceso\tpara\ttomar\tdecisiones\ttendientes\ta\tsu\tmejoramiento”\t(Hernández\tRojas,\t  2004,\tp.114).\tDe\testa\tmanera,\tla\tevaluación\tpuede\taplicarse\ta\tcualquier\tproceso\tde\tla\tvida\tque\t  sea susceptible de ser mejorado.  \t   Desde\tel\támbito\teducativo,\tla\tevaluación\tes\tel\tconjunto\tde\tmedios,\ttécnicas\te\tinstrumen -  tos que el docente utiliza para recolectar y analizar información sobre el avance en el aprendi -  zaje\tde\tlos\testudiantes,\ty\tsobre\tsu\tpropia\tacción\tde\tenseñanza\t(Knust\ty\tGómez,\t2009).\tAhora\t  bien,\tentendiendo\tque\tla\tevaluación\tes\tun\teje\trector\tdel\tproceso\teducativo\ty\tsiguiendo\tel\tadagio\t  popular:    si  no  se  cambia  la  manera  de  evaluar  no  se  cambia  la  manera  de  educar,   el  reto  del    profesor\tes\tconstruir\tuna\tplaneación,\tcon\tun\tproceso\tevaluativo\tclaro,\tque\tincluya\tlas\ttécnicas\t  e\tinstrumentos\tque\tpermitan\tvalorar\tlos\tresultados\tde\taprendizaje\tde\tlos\testudiantes,\ten\tlos\t  módulos académicos que orienta.  \t   La\tI.U.\tPascual\tBravo,\ten\tsu\tenfoque\tpor\tcompetencias,\tadopta\tla\tevaluación\tformativa,\t  midiendo\tel\tdesempeño\tde\tlos\testudiantes,\ttanto\tdesde\tlos\tconocimientos\ty\thabilidades,\tcomo\t  desde\tlas\tdestrezas\ty\tactitudes\ten\tsituaciones\treales\to\tsimuladas,\tque\tdan\tcuenta\tde\tlos\tresul -  tados de aprendizaje adquiridos a lo largo del módulo.   \t   La\tevaluación\tformativa\tes\tun\tproceso\tcíclico,\ten\tel\tcual\tel\tdocente\tanaliza\ty\trealimenta\t  las\tevidencias\tde\taprendizaje\tentregadas\tpor\tel\testudiante,\tpara\timplementar\tacciones\tque\tper -  mitan una mejora en sus comprensiones y en el desarrollo de sus habilidades; y así volver a pre -  sentar\tlas\tevidencias,\tcon\tlos\tajustes\tpertinentes,\tpara\tuna\tnueva\trevisión.\tPara\tel\tdesarrollo\tde\t  esta evaluación es necesario que el docente tenga bases sólidas en el conocimiento disciplinar   y\tcuente\tcon\thoras\tde\tatención\tal\testudiante\tpara\tescuchar\tsus\tideas,\tinquietudes\ty\treconocer\t  sus\tdificultades\t(Talanquer,\t2015).  \t   Dadas\tlas\tcaracterísticas\tde\tinteracción,\tpresentes\ten\tel\tproceso\teducativo,\tla\tevalua -  ción\tse\tconstituye\ten\tuna\tapuesta\tdialógica\tsobre\tlos\taprendizajes\tque\tse\tgeneran.\tPor\ttanto,\t  la\taplicación\tde\tlas\testrategias\tde\tla\tevaluación,\treferidas\ta\tla\tautoevaluación,\tcoevaluación\ty\t  heteroevaluación,\tse\tconstituyen\ten\tun\tlineamiento\tde\taplicación\tcotidiana,\tpara\tla\tvaloración\t  conjunta\tdel\tdesarrollo\tde\tlos\tresultados\tde\taprendizaje,\tde\tla\tmano\tde\tlas\ttécnicas\te\tinstru -  mentos necesarios. \nModelo Educativo y Pedagógico 29  \t   Evaluar\tes\tuna\tparte\tfundamental\tdel\tproceso\teducativo,\ty\tse\tconstituye\ten\tuna\therra -  mienta\tque\tel\testudiante\tutiliza\tpara\tformarse,\ty\tpor\tlo\ttanto\tdebe\tconocerla.\tLa\tevaluación\tpo -  tencia\tla\tautonomía\ty\tdebe\tser\tabierta,\tobjetiva,\ttransparente,\tveraz\ty\tpermanente.\tSu\tfunción\t  es\tverificar\tel\tnivel\tde\tlogro\ten\tla\tidoneidad\tque\tdemuestran\tlos\testudiantes\tcon\tsus\tevidencias\t  de\taprendizaje.\tIdoneidad\treferida\tal\tgrado\tde\tlas\tdestrezas\tde\tlas\thabilidades\tcognitivas,\tpro -  cedimentales y actitudinales que aplica el estudiante en situaciones contextuales. \nModelo Educativo y Pedagógico 30 3. FUNDA   - MENTOS FI   - LOSÓFICOS  Y CIENTÍFI   - COS  3. FUNDAMENTOS   FILOSÓFICOS Y   CIENTÍFICOS \nModelo Educativo y Pedagógico 31  3. FUNDAMENTOS FILOSÓFICOS Y CIENTÍFICOS  El objetivo de la educación es la virtud   y el deseo de convertirse en un buen ciudadano.  Platón  3.1 Fundamentos epistemológicos    La I.U. Pascual Bravo se inscribe en el paradigma de la complejidad con enfoque sistémico.   Entre\totros\tautores,\tsustenta\testa\tpostura\ta\tpartir\tde\tlo\tplanteado\tpor\tEdgar\tMorín\t(1994)\tcon\tla\t  teoría del pensamiento complejo y Niklas Luhmann (1996) con la teoría de sistemas.  \t   Según\tOrtiz\t(2018),\tde\tlas\tfilosofías\tprincipales\t(idealismo,\trealismo,\tpragmatismo\ty\texis -  tencialismo)\tsurgen\tlas\tfilosofías\teducativas\t(perennialismo,\tesencialismo,\tprogresivismo\ty\tre -  construccionismo).\tLa\tI.U.\tPascual\tBravo\tse\tinscribe\ten\tla\tfilosofía\tclásica\tdel\tpragmatismo,\t  y,\tde\testa,\ten\tla\tfilosofía\teducativa\tdel\tprogresivismo1.\tLas\tcaracterísticas\tde\tambas\tposturas\t  filosóficas\tse\tpueden\tevidenciar\ten\tla\ttabla\t1.  Tabla 1  Características de la postura filosófica.  PRAGMATISMO   PROGRESIVISMO  •  Integra\tlos\tpostulados\tde\tWilliam\tJames,\tCharles\t  Sanders\tPeirce\ty\tJohn\tDewey,\tentre\totros.  •  Se\tbasa\ten\tcambios,\tprocesos\ty\texperiencias.\t  •  Al igual que Heráclito la realidad se concibe   dinámica,\ten\tpermanente\tcambio.\t  •  El\tmétodo\tes\tcientífico\tmediante\tla\tsolución\tde\t  problemas.   •  Enseña a pensar críticamente.  •  El currículo se centraliza en el estudiante y se   desarrolla como guía.   •  Recoge\tlos\tpostulados\tde\tJohn\tDewey,\tJhon\t  Childs\ty\tWilliam\tKilpatrick.\t  •  La participación y construcción democrática   son pilares del proceso educativo.   •  Hace\ténfasis\ten\tcómo\ty\tqué\tpensar,\ta\ttravés\tde\t  los\tmedios,\tlos\tprocesos\ty\tlos\tmétodos.\t  •  Implica un currículo interdisciplinario que se   desarrolla a través de experiencias mediante   situaciones de aprendizaje.  Nota.\tElaboración\tpropia\ta\tpartir\tde\tlo\tplanteado\tpor\tOrtiz\t(2018).  1 Las\tfilosofías\teducativas\tsurgen\tde\tlas\tfilosofías\tprincipales,\tque\tplantea\tOrtiz\t(2018),\tpero\tno\tnecesariamente\t  desde una perspectiva lineal: unas y otras asumen postulados que las complementan. \nModelo Educativo y Pedagógico 32  3.2 Fundamentos sociológicos  \t   Desde\tel\tpunto\tde\tvista\tmacrosocial,\tla\tI.U.\tPascual\tBravo\tintegra\tlas\tteorías\tsociológicas\tdel\t  positivismo lógico y del funcionalismo. El principal exponente del positivismo lógico es Comte   (1957),\tcon\tuna\tpostura\tque\tse\taleja\tde\tla\tinstrucción,\ty\tdesarrolla\tla\tformación\tintegral;\tel\tco -  nocimiento\tse\tvalida\tgracias\ta\tla\taplicación\tdel\tmétodo\tcientífico,\tpor\tla\texperimentación\tde\tlos\t  fenómenos\tnaturales\ty\tel\taporte\tque\testos\tle\thacen\tal\tdesarrollo\ttecnológico;\tadicional,\tpotencia\t  la\tdestreza\tde\tla\tadaptación\tsocial.\tA\tsu\tvez,\tel\tfuncionalismo,\tplanteado,\tentre\totros\texponentes,\t  por\tquien\tse\tconsidera\tel\tpadre\tde\tla\tsociología\tmoderna:\tDurkheim\t(1979),\tsustenta\tel\tapren -  dizaje cooperativo y colaborativo.  \t   A\tnivel\tmicrosocial,\ty\ten\tcoherencia\tcon\tlo\tanterior,\tla\tteoría\tde\tla\tacción\tsocial\tplanteada\t  por Max Weber (2001) también soporta el desarrollo del aprendizaje colaborativo desde la pers -  pectiva del construccionismo (esto a pesar de su posición antipositivista).  \t   La\tI.U.\tPascual\tBravo,\ten\trazón\ta\tsu\tvocación\ttecnológica,\tasume\tla\tcontraposición\t  epistemológica\tdel\tconocimiento,\trepresentada\ten\tlos\tfundamentos\tsociológicos\taquí\tesbo -  zados,\tporque\tes\tconsciente\tde\tla\tnecesidad\tde\tunir\tla\tciencia,\tla\ttecnología\ty\tla\tsociedad.\tEn\t  este sentido se retoman los planteamientos de Palacios et al. (2001) al mencionar la necesidad   de\treconocer\tlos\taspectos\tsociales\tde\tla\tciencia\ty\tla\ttecnología,\tpara\tque\tsus\taplicaciones\ty\t  efectos\tcontextuales\tfuesen\tsignificativos\ten\tlas\tpersonas\ty\tcomunidades\tbeneficiadas.\t \nModelo Educativo y Pedagógico 33  3.3 Fundamentos psicológicos, pedagógicos y neurológicos  3.4 Fundamentos didácticos  \t   La\tI.U.\tPascual\tBravo\treconoce\tque\tel\tser\thumano\tes\tinconmensurable,\tcomplejo\ty\tque\tse\t  desarrolla\ten\tmulticontextos.\tPor\testo\ty\tdesde\tel\tpunto\tde\tvista\tpsicológico\ty\tpedagógico,\tasume\t  una\tposición\tecléctica\ten\tla\tmanera\tde\tcomprender\tlos\tprocesos\tcognitivos,\temocionales\ty\tso -  ciales,\tpor\tlos\tcuales\tpasa\ttodo\tindividuo\ten\tsu\tproceso\tde\taprendizaje.\tPor\ttanto,\tse\tfundamenta\t  en\tlas\tteorías\tdel\taprendizaje\tdel\tconductismo,\tel\thumanismo\ty\tel\tcognitivismo.\tDe\testas\tsurgen\tel\t  constructivismo,\tel\tconstruccionismo\ty\tel\tconectivismo.\tDe\tlas\tteorías\tcognitivas\tse\tdeja\tpermear\t  de\tPiaget\t(1981)\tcon\tel\tdesarrollo\tcognitivo\ty\tel\tpaso\tpor\tsus\tdiferentes\testadios\tde\taprendizaje\t  hacia\tla\tpsicología\tcognitiva,\tde\tVygotsky\t(1978)\tcon\tla\tinteracción\tsocial,\tde\tBruner\t(1961)\tcon\tel\t  aprendizaje\tpor\tdescubrimiento\ty\tde\tAusubel\t(2000)\tcon\tel\taprendizaje\tsignificativo.  \t   A\tpartir\tdel\tparadigma\tdel\tpensamiento\tcomplejo\ty\tdel\tenfoque\tsistémico,\tcon\tla\tirrupción\t  de\tlas\ttecnologías,\tel\tconectivismo\tdesarrolla\tmodos\tde\taprender\tcon\tla\tinformación\tcircundan -  te,\ta\ttravés\tde\tnodos\ty\tredes.\tDe\testo\tsurge\tel\tfundamento\tneurológico\tque\tbusca\tcomprender\t  cómo\tfunciona\tel\tcerebro\ty\tsu\trelación\tcon\tla\tenseñanza\ty\tel\taprendizaje.\tPor\ttanto,\tla\tadaptación\t  a los cambios se sustenta por la plasticidad cerebral; el aprendizaje por la capacidad de conec -  tar\tmúltiples\tvariables\tcon\tsentido\tcrítico,\tgenerando\tconexiones\tsinápticas;\ty\tpor\tlos\testímulos\t  emocionales\ty\tmultisensoriales\tque\tactivan\tlas\tfunciones\tgenerales\tdel\tcerebro,\ty\tque\thallan\tsu\t  desarrollo en la capacidad comunicativa a través del lenguaje.    La I.U. Pascual Bravo fundamenta su proceso educativo en principios y enfoques que   proporcionan\tla\tbase\tpara\tel\tdiseño\tde\testrategias\tde\tenseñanza\ty\taprendizaje\tefectivas,\ta\t  saber: metodologías para aprendizajes activos (Aprendizaje Basado en Retos - ABR; Aprendi -  zaje Basado en Problemas - ABP; Aprendizaje Basado en Proyectos - ABPr; Aprendizaje Ba -  sado\ten\tCasos\t-\tABC,\tsimulaciones\ty\tjuegos\tde\troles,\tgamificación,\taprender\thaciendo,\tetc.);\t  modelos de ambientes de aprendizaje contextuales; reconocimiento de inteligencias múltiples   y diversas formas de aprender; interdisciplinariedad; evaluación formativa; y modelos de inte -  gración\tde\ttecnologías\tal\taprendizaje,\tcomo\tel\tmodelo\tTPACK\tpropuesto\tpor\tKoehler\ty\tMishra\t  (2009). \nModelo Educativo y Pedagógico 34  3.5 Fundamentos curriculares  \t   La\tI.U.\tPascual\tBravo\tapuesta\tpor\tun\tmodelo\tcurricular\tpor\tcompetencias.\tAdemás\tdefine\t  un modelo de diseño curricular propio con integración de las tecnologías y con enfoque de   resultados\tde\taprendizaje.\tPor\testo,\tadopta\tel\tconcepto\tconstruido\tpor\tDíaz\tBarriga\ty\tLugo,\t  que es retomado por Díaz Barriga Arceo:  Por modelo curricular se entiende una construcción teórica o una forma de representación de  al -  gún\tobjeto\to\tproceso\t(en\teste\tcaso,\ten\tel\támbito\tdel\tcurrículo)\tque\tdescribe\tsu\tfuncionamiento\ty\t  permite explicarlo e intervenir en él. Incluye la selección de los elementos o componentes que se   consideran\tmás\timportantes,\tasí\tcomo\tde\tsus\trelaciones\ty\tformas\tde\toperación.\tRepresenta\tun\t  ideal\to\tprototipo\tque\tsirve\tcomo\tun\tejemplo\tpara\timitar\to\treproducir,\tpor\tlo\tque\tademás\tde\tdescri -  bir,\tes\tprescriptivo.\tUn\tmodelo\tcurricular\tes\tuna\testrategia\tpotencial\tpara\tel\tdesarrollo\tdel\tcurrículo\t  y,\tdado\tsu\tcarácter\trelativamente\tgenérico,\tpuede\tser\taplicado\ty\tresignificado\ten\tuna\tvariedad\tmás\t  o\tmenos\tamplia\tde\tpropuestas\tcurriculares\tespecíficas,\tposibilitando\tsu\tconcreción\ty\tubicación\ten\t  contexto\t(2005,\tp.65).    El currículo se comprende como un conjunto de experiencias de aprendizaje contenidas en   variables\t(controladas\ty\tno\tcontroladas)\tdel\tproceso\tformativo,\tque\tse\tencuentran\ten\tsinergia\t  con\tlos\tactores,\tmedios\ty\tcriterios\tde\tdesempeño\tasociados\ta\tlos\tsaberes\trequeridos,\tsegún\tun\t  contexto determinado.     En\tsintonía\tcon\tTobón\t(2013)\tel\tcurrículo\tintegra\tlos\tconocimientos,\tprocesos\tcognitivos,\t  destrezas,\thabilidades,\tvalores\ty\tactitudes\ten\tel\tdesempeño\tde\tuna\tpersona,\ta\ttravés\tde\t  programas\tde\tformación\tacordes\ta\tlas\tnecesidades\tprofesionales,\tsociales\ty\tde\tinvestigación\t  del\tcontexto.\tAdemás,\tla\tI.U.\tPascual\tBravo\ttambién\tintegra\tconceptos\trelacionados\tcon\tel\tuso\t  de\tlas\tTIC;\tcon\tla\taplicación\tde\tlas\tetapas\tdel\tdiseño\tcurricular\tdefinidas\tpor\tDíaz\tBarriga\tArceo\t  (2005);\ty\tcon\tlos\tpostulados\tde\tKemmis\tet\tal.\t(1988)\tsobre\tcómo\tel\tcurrículo\tes\tun\tpuente\tque\t  promueve la construcción conjunta de valores y desarrolla la interactividad entre la escuela y   el\tcontexto,\tlo\tque\tposibilita\tcerrar\tla\tbrecha\tentre\tteoría\ty\tpráctica,\ty\trecrear\tel\taula\tcomo\tun\t  escenario de aplicación con situaciones de aprendizaje del mundo real.     Con\ttodo\tlo\tanterior,\tla\tI.U.\tPascual\tBravo,\ten\tsu\tmodelo\teducativo\ty\tpedagógico,\tdecide\t  apostar\tpor\tun\tenfoque\ten\tel\tdesarrollo\tdel\tpensamiento\tcomplejo,\tdel\tpensamiento\tcrítico\ty\t  las  habilidades  para  resolver  problemas;  en  el  aprendizaje  permanente  a  lo  largo  de  la  vida;    en la diversidad y la inclusión; en la innovación y el emprendimiento; en el compromiso con la   responsabilidad\tsocial,\tlas\thabilidades\tdigitales,\tla\tcomunicación\tasertiva,\tla\tmulticulturalidad,\t  las\thabilidades\ten\tlengua\textranjera,\tentre\totras\thabilidades\tque\tya\than\tsido\tdeclaradas\tcomo\t  indispensables\ten\tla\tépoca\tactual.\tEsto\timplica,\tdesde\tel\tpunto\tde\tvista\teducativo,\tpedagógico\t \nModelo Educativo y Pedagógico 35  y\tcurricular,\tla\tcreación\tde\tcurrículos\tque\tbrinden\ta\tlos\testudiantes\trutas\to\ttrayectorias\tde\t  formación\tflexible,\tinterdisciplinar,\tmultimodal\to\thíbrida\t(virtual-presencial),\tcon\tcertificación\tde\t  ciclo\tcorto\to\tmicro\tcredenciales,\tcon\tarticulaciones\tentre\tlos\tdistintos\tniveles\tde\teducación\ty\t  tipologías\tde\teducación\t(formal,\tETDH),\ty\tcon\tuna\tgran\tpreponderancia\tde\tactividades\tpara\tel\t  aprendizaje\tsignificativo\ty\tel\tuso\tde\tla\ttecnología.    Finalmente,\tla\tI.U.\tPascual\tBravo,\ten\tcorrespondencia\tcon\tlas\texpectativas\tsociales\ty\t  culturales,\tconceptúa\tal\tcurrículo\ten\tel\tmarco\tde\tuna\tpropuesta\tarticulada,\tcoherente\ty\tflexible,\t  que genera las condiciones para concretar sus ideales formativos y profesionales. Se articula   con\tel\tProyecto\tEducativo\tInstitucional;\tlos\tprogramas\tprofesionales;\tlos\tproyectos\tde\tinvestigación,\t  extensión\ty\tbienestar;\tel\tquehacer\tde\tlos\tdocentes,\tde\tlos\testudiantes\ty\tde\tlos\tadministrativos.\t  Aunado\ta\testo,\tasume\tun\tcurrículo\tpor\tcompetencias\tcon\tenfoque\tde\tintegración\ta\tlas\t  Tecnologías\tdel\tAprendizaje\ty\tel\tConocimiento\t-\tTAC\ty\tlos\tResultados\tde\tAprendizaje\t-\tRA,\ty\t  se\tfundamenta\ten\tlas\tcorrientes\tconductistas,\tconstructivistas,\tconstruccionistas\ty\tco -  nectivistas.\tPor\testo,\tintegra\tlas\tdimensiones\thumanas\tdel\tser,\thacer\ty\tsaber\ten\tel\tmarco\tde\tlas\t  relaciones\tarmónicas\tque\tconstruye\tel\testudiante\tcon\tsus\tcompañeros,\tdocentes,\tsaberes,\t  familias,\tcomunidades,\tempresas,\ty\tcon\tla\tsociedad\ten\tgeneral. \nModelo Educativo y Pedagógico 36 4. EJES IN   - TEGRADO   - RES PAS   - CUALINOS  4. EJES   INTEGRADORES   PASCUALINOS \nModelo Educativo y Pedagógico 37  4. EJES INTEGRADORES PASCUALINOS  El educador democrático no puede negarse el deber   de reforzar, en su práctica docente, la capacidad crítica   del educando, su curiosidad, su insumisión.   Paulo Freire  4.1 Carácter tecnológico  \t   Desde\tsus\tinicios,\tla\tI.U.\tPascual\tBravo\tse\tha\tcaracterizado\tpor\tsu\tvocación\ttecnológica\t  y\tpor\tende,\tpor\tsu\tenfoque\ty\tcompromiso\tcon\tla\ttecnología,\ttanto\ten\tla\tdocencia,\tcomo\ten\tla\t  investigación y la innovación. Para comprender este enfoque es importante distinguir entre cien -  cia y tecnología.  \t   La\tciencia\tse\tencarga\tde\tdescubrir,\texplicar,\tverificar\ty\tpredecir\tfenómenos\tde\tla\trealidad,\t  generando\tconocimiento\tsobre\tlo\tque\texiste\tmediante\thipótesis.\tPor\tsu\tparte,\ta\ttravés\tde\tla\t  aplicación\tde\tconocimientos\tcientíficos\ty\ttécnicas,\tla\ttecnología\tle\tpermite\tal\tser\thumano\tcon -  trolar,\tmodificar\ty\tmejorar\tsu\tentorno,\tde\tacuerdo\tcon\tnecesidades\tespecíficas;\tademás\tjuega\t  un\tpapel\tfundamental\ten\tla\tintervención\ty\ttransformación\tde\tla\trealidad\tnatural,\tsocial\ty\thumana\t  (Gay,\t2022).  \t   En\tel\támbito\tde\tla\trealidad\tnatural,\tla\ttecnología\tse\tutiliza\tpara\tcontrolar\ty\tmanipular\tlos\t  elementos\tdel\tmundo\tfísico.\tEn\tcuanto\ta\tla\trealidad\tsocial,\tdesempeña\tun\tpapel\timportante\ten\t  la\tcomunicación,\tla\tinteracción\ty\tel\tacceso\ta\tla\tinformación;\tlos\tavances\ten\tlas\ttecnologías\tde\t  la\tinformación\ty\tla\tcomunicación\than\ttransformado\tla\tmanera\tcómo\tel\tser\thumano\tse\tcomunica,\t  se\trelaciona\ty\taccede\tal\tconocimiento.\tEn\tel\támbito\tde\tla\trealidad\thumana,\tla\ttecnología\ttiene\tla\t  capacidad de mejorar la calidad de vida de las personas y proporcionar soluciones a problemas   concretos.   \t   A\ttravés\tde\tla\tinnovación\ttecnológica\tse\tconstruye\tun\tmundo\tartificial\tparalelo\tal\tmundo\t  natural,\tdonde\tla\ttecnología\tdesempeña\tun\tpapel\tcrucial\ten\tla\tconfiguración\tde\tla\tsociedad\ty\t  en\tla\tmejora\tde\tla\tcalidad\tde\tvida\tde\tlas\tpersonas.\tPor\tlo\ttanto,\tno\tes\tsimplemente\tun\tnivel\t  educativo\to\tun\ttipo\tde\tinstitución,\tsino\tun\tcampo\tde\tconocimiento\tque\tse\tbasa\ten\tla\ttécnica\ty\t  que\ttiene\tcomo\tobjetivo\tintervenir\ten\tla\trealidad.\tLa\tciencia\tayuda\ta\tcomprender\tlas\trealidades,\t  mientras que la tecnología permite intervenir en ellas para lograr los efectos deseados; la ciencia   descubre\ty\texplica\tlo\tque\tya\texiste,\tmientras\tque\tla\ttecnología\tconstruye\tlo\tque\tno\texiste.\tEn\tel\t  mundo\tcontemporáneo,\tla\ttécnica\testá\tmediada\tpor\tla\tracionalidad\ttecnológica\ty\tsolo\tse\tconci - \nModelo Educativo y Pedagógico 38  be\tcomo\ttal\ten\tel\tcontexto\tde\tun\tobjeto\ttecnológico,\tque\tse\tcompone\tde\telementos\tfuncionales\t  y estructurales diseñados para cumplir una determinada función.  \t   La\tevolución\tdel\tmundo\tartificial,\timpulsado\tpor\tla\ttecnología,\tha\tabierto\tun\tnuevo\tpano -  rama\tpara\tla\tinteracción\thumana,\tpermitiendo\tno\tsolo\tvivir\ten\tun\tentorno\tnatural,\tsino\ttambién\t  sumergirse\ten\tdiversos\tmundos\tartificiales.\tEcheverría\t(2000)\tlos\tdenomina\t“telépolis”,\tBron -  cano\t(2000)\tlos\tdescribe\tcomo\t“mundos\tartificiales”,\thaciendo\treferencia\ta\taquellos\tentornos\t  virtuales\tque\tpresentan\tescenarios\tdonde\tlos\thumanos\tpueden\texplorar,\texperimentar\ty\tcrear\t  formas que no son posibles en el mundo físico. Estos entornos ofrecen un potencial ilimitado   para\tla\teducación,\tpues\tpermiten\tel\tdesarrollo\tde\tcompetencias\ty\thabilidades\tespecíficas\tpor\t  parte\tde\tquienes\tlos\tusan,\tpero\tsin\tdejar\tde\tlado\tla\tinteracción\tdirecta\ty\tel\tdiálogo\tcon\tlos\tfenó -  menos reales.    Esta realidad ampliada destaca el carácter tecnológico de la I.U Pascual Bravo al ir más   allá\tde\tla\tpresencia\tde\tobjetos\ttecnológicos,\tpues\timplica\ttambién\tcomprender\ty\tperfeccionar\t  las\tinteracciones\tque\tse\tdan\tdentro\tde\testos\tnuevos\tmundos\tartificiales;\tlas\tcuales,\tpara\tlograr\t  los\tefectos\tdeseados,\tdeben\tser\tabordadas\tdesde\tuna\tperspectiva\tcientífica\ty\ttecnológica\tre -  flexiva.\tEs\tasí\tcomo\tel\tcarácter\to\tla\tvocación\ttecnológica\thacen\tque\tla\tinstitución\tse\tencuentre\t  en una posición privilegiada para explorar y comprender estos escenarios emergentes; pues sus   docentes,\testudiantes\ty\tegresados\ttienen\tla\toportunidad\tde\tinvestigar\ty\tdesarrollar\tlas\ttecno -  logías\tque\tdan\tvida\ta\testos\tmundos\tartificiales,\tfacilitando\tla\tinteracción\tfluida\tentre\tlos\tseres\t  humanos y su entorno tecnológico.   \t   Finalmente,\tse\trequiere\tuna\treflexión\tconstante\ty\tun\tenfoque\tcientífico\tpara\tgarantizar\t  que\tlas\tinteracciones\ten\testos\tentornos\tsean\tbenéficas\ty\talineadas\tcon\tlos\tobjetivos\tde\tla\tins -  titución.\tPor\tlo\ttanto,\tse\tpuede\tafirmar\tque\tel\tcarácter\to\tvocación\ttecnológica\tde\tla\tI.U.\tPascual\t  Bravo\testá\tmediada\tpor\tel\tuso\tde\tla\ttecnología\tcomo\telemento\tclave\ten\tla\teducación,\tla\tinves -  tigación\ty\tla\tinnovación;\tlo\tque\timplica\tla\tactualización\tconstante\tde\tlos\trecursos\ttecnológicos,\t  programas\tacadémicos\tque\trespondan\ta\tlas\tnecesidades\tsociales\ty\tlaborales,\tinvestigación\t  avanzada y vinculación con la industria; todo esto con el propósito de preparar a los estudiantes   para enfrentar los desafíos de la sociedad actual y del futuro. \nModelo Educativo y Pedagógico 39  4.2 Metodologías activas e investigación formativa  4.3 Modelo de relacionamiento   \t   Labrador\tPiquer\ty\tAndreu\tAndrés\t(2008)\tdefinen\tlas\tmetodologías\tactivas\tcomo\t“Aquellos\t  métodos,\ttécnicas\ty\testrategias\tque\tutiliza\tel\tdocente\tpara\tconvertir\tel\tproceso\tde\tenseñanza\t  en\tactividades\tque\tfomenten\tla\tparticipación\tactiva\tdel\testudiante\ty\tlleven\tal\taprendizaje”\t(p.5).\t  La principal característica de estas metodologías es que el estudiante es el centro del proceso   de\tenseñanza,\tpermitiendo\tque\tasuma\tun\tpapel\tactivo\ty\tresponsable\tfrente\ta\tsu\taprendizaje;\t  además de incentivar el trabajo colaborativo para compartir con otros sus opiniones y experien -  cias.    Los Proyectos de Aula (PA) y los Proyectos Integradores de Aula (PIA) son una estrategia   didáctica\ty\tmetodológica\tactiva,\tque\trecrea\tlas\tformas,\tlos\tmedios\ty\tlos\tmétodos\tque\tse\tconsi -  deran\tmás\toportunos\tpara\tlograr\taplicaciones\treales\tde\tcorte\tcognitivo,\tprocedimental,\tactitudi -  nal\ty\tde\tproducto,\trequeridos\tpor\tlos\tcontextos\tde\tactuación\ttanto\ten\tel\torden\tdisciplinar\tcomo\t  en el profesional. En la construcción y ejecución de los PA y los PIA se aplican metodologías   activas\tcomo\tel\tAprendizaje\tBasado\ten\tProblemas\t(ABP),\tAprendizaje\tBasado\ten\tRetos\t(ABR),\t  Aprendizaje\tBasado\ten\tProyectos\t(ABPr),\tAprendizaje\tExperiencial\t(AE),\tJuego\tde\tRoles,\tentre\t  otras\tque,\tpor\tefectos\tde\tinnovación\tdidáctica\ty\tpedagógica,\tpuedan\temerger\tcon\tel\tpaso\tdel\t  tiempo.    Los PA y PIA dan solución a inquietudes o problemas de los contextos disciplinares y de   aplicación,\ten\tel\tmarco\tde\tla\tinvestigación\tformativa;\ta\tsu\tvez\tarticulan\tla\tteoría\ty\tla\tpráctica\ten\t  el\taprendizaje.\tEn\tellos,\tse\tintegran\tvarios\tmódulos\tacadémicos\tde\taprendizaje\ta\tpartir\tde\tla\t  inter\ty\tla\ttransdisciplinariedad.\tPor\tsu\tparte,\tel\tmodelo\tde\tinvestigación\tformativa\tinstitucional\t  interviene,\tde\tforma\tintegral\ty\tholística,\tlos\tprocesos\teducativos\ty\tformativos\tque\tse\tsuscitan\tal\t  interior\tdel\taula.\tDe\tigual\tforma,\tse\taplica\tla\testrategia\tde\tsemilleros\tde\tinvestigación\tque\tacerca\t  a\tlos\testudiantes\ta\tla\tpráctica\tdel\tmétodo\tcientífico,\tcomo\tparte\tsustantiva\tde\tdicho\tmodelo.  \t   La\tinstitución\tdefinió\tla\tpolítica\tde\tinternacionalización\tmediante\tel\tAcuerdo\t007\tde\tdi -  ciembre\tde\t2013,\taplicable\ten\ttodas\tlas\tsedes\tdonde\toferta\tsus\tprogramas\tacadémicos.\tEste\t  acuerdo\tpretende\tpromover\tcondiciones\tde\tinterculturalidad,\ta\ttravés\tde\tinteracciones\tnacio -  nales\te\tinternacionales,\tfomentar\tla\tinternacionalización\te\timpulsar\tla\tcreación\tde\tcurrículos\tcon\t  dicha\tvisión.\tPosteriormente,\tla\tI.U.\tPascual\tBravo\t(2018)\ten\tsu\tPlan\tde\tdesarrollo\tinstitucional\t  2019-2022,\tcontempló\tun\teje\testratégico\tdedicado\tal\trelacionamiento\ty\ta\tla\tinternacionaliza - \nModelo Educativo y Pedagógico 40  ción,\tlo\tque\tllevó\ta\tque\ten\tel\taño\t2019\tse\tcreara\tla\tpropuesta:\tModelo\tde\trelacionamiento\tpara\tla\t  I.U\tPascual\tBravo,\tque\texpone\tla\tdocencia,\tla\tinvestigación,\tla\textensión\ty\tla\tproyección\tsocial,\t\t  como ejes fundamentales.    El eje de docencia plantea la necesidad de tener una visión de relacionamiento al interior   de\tlos\tcurrículos,\tlo\tque\timplica\trepensar,\trevisar,\tvalidar\ty\tcalificar\tsu\tenfoque\tinternacional,\t  para que estén en sintonía con las demandas de los distintos entornos con los que la institu -  ción\tinteractúa.\tPor\totra\tparte,\ttambién\tespera\tfavorecer\tla\tformación\tde\tlenguas\textranjeras\ty\t  dialectos; generar espacios de relacionamiento in situ (como cursos digitales con integración a   micrositios\ty\tclassroom,\tMOOC,\tNOOC\ty\tLIAs)\ta\ttravés\tde\tlas\tTecnologías\tde\tla\tInformación\ty\t  la Comunicación (TIC); y promover convenios de relacionamiento nacional e internacional para   la\thomologación\tde\tcompetencias\ty\ttitulaciones.\tFinalmente,\tpretende\tobtener\tprocesos\tde\t  acreditación nacional e internacional para incorporar en la I.U Pascual Bravo estándares de alta   calidad.   \t   Por\tsu\tparte,\tel\teje\tde\tinvestigación\tpretende\tampliar\tlas\tfronteras\tinstitucionales\thacia\t  el\támbito\tnacional\te\tinternacional.\tA\tnivel\tnacional,\tla\tI.U.\tPascual\tBravo\tha\tconfigurado\tel\tpro -  grama\tPITS\tcomo\tun\tmarco\tde\tinterrelación\tde\tla\tuniversidad,\tla\tempresa\ty\tel\testado,\tpara\tdar\t  respuesta\ta\tsus\tdemandas\ty\tnecesidades\ta\tpartir\tde\tlas\tcapacidades\tinstitucionales,\tpor\tlo\tque\t  el\tmodelo\tinstitucional\tde\tinvestigación\tes\tde\tcorte\taplicado,\tcon\taltos\timpactos\ten\tdesarrollos\t  tecnológicos.\tEn\tadición\ta\testo,\ttambién\tpropone\testablecer\tconvenios\tcon\totras\tentidades\te\t  instituciones\tde\teducación\tsuperior,\tcon\tlas\tcuales\tse\tpueda\tgenerar\tvínculos,\ttener\tprocesos\t  en\tconjunto\ty\trealizar\teventos\tcientíficos.\tTambién\tbusca\tpromover\tla\tparticipación\tde\tlos\tinves -  tigadores\tde\tla\tinstitución\ten\tdiferentes\tredes;\tincentivar\tla\telaboración\tde\tartículos\tcientíficos\t  de\talto\timpacto,\tde\tacuerdo\tcon\tel\tmodelo\tde\tmedición\tMinciencias,\tque\tpromuevan\tla\tvisibi -  lidad\tde\tla\tinstitución\ta\ttravés\tde\tpublicaciones.\tFinalmente,\tbusca\tpromover\ty\tparticipar\ten\tla\t  elaboración\tde\tpropuestas\tde\tinvestigación,\tque\tpuedan\tfinanciarse\tde\tmanera\texterna,\tsobre\t \nModelo Educativo y Pedagógico 41  problemáticas de interés global contempladas en los ODS.    Las funciones de extensión y proyección social en la I.U. Pascual Bravo buscan propiciar   la\tgeneración\tde\tingresos\ty\tla\tproyección\tsocial\ten\tdiferentes\tcontextos,\tpara\tser\ttransferidos\ty\t  apropiados por las diferentes comunidades. El modelo de relacionamiento contempla la oferta   educativa\tflexible\ty\tpermanente\ta\tlo\tlargo\tde\tla\tvida:\ten\tlos\tniveles\tbásico,\tmedio\ty\tsuperior,\ta\t  través\tde\tsemilleros,\tcursos\tvocacionales,\ttécnicos\tlaborales,\tformación\ten\tniveles\tpreceden -  tes,\tcursos\tcortos,\tdiplomados,\tconsultorías,\tasesorías\ty\tacompañamiento\ten\temprendimien -  tos  de  base  tecnológica  y  de  industrias  culturales  y  creativas.  Esta  oferta  se  presenta  a  nivel    nacional\te\tinternacional,\tdesde\tla\tcapacidad\tinstalada\tinstitucional\tpara\tel\tdesarrollo\tde\tideas\t  innovadoras.     Es importante mencionar que en la I.U. Pascual Bravo se valoran las competencias de   relacionamiento,\ty\tque\tde\tacuerdo\tcon\tsu\tidentidad\ty\tpropósitos\tformativos\tse\tconstituyen\t  mediante\telementos\tde\tcompetencias\to\telementos\tde\tresultados\tde\taprendizaje;\tadicional,\tse\t  considera\tuna\tcompetencia\tinstitucional\ttransversal,\tdesde\tlo\tinterpersonal,\tal\treconocer\tque\tel\t  relacionamiento se da desde el ser y que se despliega en las relaciones con los demás. Es de -  cir,\tel\tprimer\trelacionamiento\tque\tse\tdebe\tgenerar\tes\tdesde\tel\tpropio\tindividuo,\tal\treconocerse\t  como\túnico\te\tirrepetible,\tdotado\tde\tcualidades,\thabilidades\ty\tcompetencias\tque\tdeben\testar\tal\t  servicio\tde\tla\tsociedad.\tLuego\tde\testo,\tse\tpueden\tpropiciar\tespacios\tde\trelacionamiento\tcon\t  otras\tpersonas\tpertenecientes\ta\tla\tcomunidad\teducativa,\ten\támbitos\tlocales,\tregionales,\tnacio -  nales\te\tinternacionales,\tque\tdan\tsentido\ta\tuna\tcomunidad\tglobal\tinteractiva.  4.4 Acreditación de alta calidad  \t   Para\tla\tI.U.\tPascual\tBravo,\tla\tacreditación\tinstitucional\ten\talta\tcalidad\tes\tun\tproceso\tque\t  busca garantizar y reconocer la excelencia académica y la formación integral. A través de ella se   evalúan\ty\tverifican\tdiversos\taspectos\trelacionados\tcon\tla\tcalidad\tde\tla\teducación\timpartida,\tla\t  gestión\tinstitucional,\tla\tinfraestructura,\tel\tcuerpo\tdocente,\tel\tplan\tde\testudios,\tentre\totros.\tEsto\t  se\tapalanca\ten\tprocesos\tde\tautoevaluación\tque\tbuscan,\tde\tmanera\tcontinua\ty\tsistemática,\t  comprobar\tque\ttodo\taquello\tque\tse\tdeclara\tse\tcumple\tefectivamente,\ty\tque\tse\tconoce\tcómo\tse\t  llegó\ta\tese\tcometido.\tLa\tautoevaluación\tseñala\tla\tdistancia\tentre\tlo\tque\tse\tmanifiesta\tcomo\tun\t  paradigma\tde\texcelencia\ty\tlo\tque\trealmente\tse\tlogra;\tpara\tque,\tde\tmanera\tconstante,\tse\tajusten\t  y\tmejoren\tlos\tprocesos,\tlas\tprácticas\ty\tpor\tende\tlos\tresultados.\tPor\ttanto,\tla\tinstitución\tconcibe\t  su calidad desde una postura procesual en la que la autoevaluación y la autorregulación se lle -  van\ta\tcabo,\ten\tel\tmarco\tde\tun\tsistema\tde\taseguramiento\ty\tdel\tproyecto\teducativo\tinstitucional. \nModelo Educativo y Pedagógico 42    La búsqueda de la excelencia académica implica ofrecer programas rigurosos y actualiza -  dos,\tque\tcumplan\tcon\taltos\testándares\tde\tcalidad\ty\testén\ten\tsintonía\tcon\tlas\tdemandas\ty\tnecesi -  dades del mundo laboral y social. Una institución acreditada se asegura de contar con profesores   altamente\tcapacitados,\tmetodologías\tde\tenseñanza\tefectivas,\trecursos\teducativos\tadecuados\ty\t  ambientes propicios para el aprendizaje.  \t   La\tformación\tintegral,\tpor\totro\tlado,\timplica\tno\tsolo\tel\tdesarrollo\tde\tcompetencias\ty\tcono -  cimientos\ttécnicos\ten\tun\tárea\tespecífica,\tsino\ttambién\tla\tpromoción\tde\tcompetencias\tgenéricas\ty\t  transversales,\tcomo\tel\tpensamiento\tcrítico,\tla\tética,\tla\tinnovación,\tla\tinvestigación,\tel\tliderazgo\ty\t  la\tresponsabilidad\tsocial.\tLa\tI.U.\tPascual\tBravo\tapuesta\tpor\tbrindar\tuna\teducación\tholística,\tque\t  promueve el crecimiento personal y profesional de sus estudiantes.  \t   En\testa\tmedida,\tla\tacreditación\tde\talta\tcalidad\tha\timpulsado\ta\tla\tI.U\tPascual\tBravo\ta\tbuscar\t  constantemente\tla\tmejora\tcontinua\ten\tpro\tde\tla\tcalidad\tde\tsus\tprogramas\teducativos.\tAdemás,\tla\t  acreditación\tbrinda\tconfianza\ta\tla\tcomunidad\teducativa,\tpues\tcertifica\ta\tla\tinstitución\ten\tel\tcum -  plimiento\tde\taltos\testándares\tde\tcalidad,\ten\tbeneficio\tde\tla\tpreparación\tde\tlos\tegresados\tpara\t  enfrentar los desafíos del mundo social y productivo. \n\nModelo Educativo y Pedagógico 44 5. ROL DE  LOS SUJE   - TOS Y LA  CONCEP   - CIÓN DE LA  ACTIVIDAD  QUE REALI   - ZAN   5. ROL DE LOS SUJETOS   Y LA CONCEPCIÓN DE LA   ACTIVIDAD QUE REALIZAN \nModelo Educativo y Pedagógico 45  5. ROL DE LOS SUJETOS Y LA CONCEPCIÓN   DE LA ACTIVIDAD QUE REALIZAN  Enseñar no es transferir conocimiento,   sino crear las posibilidades   para su propia producción o construcción.  Paulo Freire  5.1 El estudiante y su rol  \t   El\taprendizaje\tno\tes\tla\ttransmisión\tde\tinformación\tdel\tprofesor\tal\testudiante,\tsino\tque\tes\t  una\tconstrucción\tdinámica\ten\tla\tcual\tel\testudiante,\ten\tsu\tproceso\tde\taprendizaje,\tasume\tun\trol\t  activo\ty\tautónomo\ten\tsu\tpropio\tconocimiento,\tresaltando\taquellos\tenfoques\tque\trepresentan\t  una\tvisión\tprogresivista\ty\tdemocrática\tde\tla\teducación\t(Dewey,\t2010).    La I.U Pascual Bravo reconoce al estudiante como un sujeto que asume un rol protagó -  nico\ten\tla\tconstrucción\tde\tsu\tconocimiento,\ta\ttravés\tde\tla\texperiencia,\tla\treflexión,\tla\tcolabo -  ración\ty\tla\tgeneración\tde\tconexiones\tque\tlo\tinvolucran\ten\tel\tproceso\tsocial,\tsegún\tlos\tplantea -  mientos\tdel\tenfoque\tconductista,\tconstructivista,\tconstruccionista\ty\tconectivista;\tsuscitando\tla\t  emancipación\tsocial,\tcultural,\temocional\ty\tpolítica.\t\tEn\testa\tmisma\tvía,\ty\tteniendo\ten\tcuenta\tla\t  formación tecnológica que el estudiante presenta a lo largo de su proceso educativo y profe -  sional,\tdebe\tser\tconsciente\tde\tlas\timplicaciones\tambientales\ty\téticas\tque\tdichos\tavances\ttraen\t  consigo para lograr desarrollos tecnológicos sostenibles en pro del cuidado del planeta y sus   habitantes.    El estudiante trasciende sus aprendizajes locales y se involucra en contextos más am -  plios,\tmediante\tinteracciones\tglobales,\tque\tse\tdan,\tpor\tejemplo,\ta\tpartir\tde\tsu\tparticipación\ten\t  redes,\teventos,\tmisiones,\tentre\totras.\tEsta\tparticipación\tactiva,\ten\tcomunidades\tde\taprendizaje,\t \nModelo Educativo y Pedagógico 46  es\tposible\tgracias\tal\tuso\tde\trecursos\tdigitales,\tque\tpermiten\tenriquecer\tsu\texperiencia\teduca -  tiva y ampliar su comprensión del mundo.  \t   De\tigual\tforma,\tel\tpropósito\tde\tla\tapuesta\teducativa\ty\tpedagógica\tde\tla\tI.U.\tPascual\tBra -  vo es que el estudiante logre desarrollar capacidades para reconocer el valor de una educación   integral\ty\tcomprender\tlos\tdesafíos\tque\timplica\tsu\tpermanencia\ten\tella,\tpara\tluego\tconstruir\ty\t  transformar la sociedad. En esta medida la institución considera al estudiante como un sujeto   en proceso de emancipación; un estudiante que reconozca la importancia de la exigencia en su   proceso\teducativo\ty\ten\tsu\tdesarrollo\tcomo\tindividuo\tautónomo,\tresponsable\ty\tético.  5.2 Concepción metodológica del aprendizaje     Para  un  aprendizaje  efectivo  se  necesitan  condiciones  que  involucren  al  estudiante  de    manera  activa  en  su  proceso.  Estas  condiciones  incluyen  proporcionar  situaciones  de  expe -  riencias\tmetacognitivas\tauténticas\tque\tdespierten\tsu\tinterés,\ty\taborden\tproblemas\to\tproyectos\t  reales\tque\testimulen\tsu\tpensamiento,\tteniendo\tla\toportunidad\tde\tcomprobar\tsus\tideas\ten\tla\t  aplicación.\tEs\tdecir,\ttodo\taquello\tque\tdebe\temprender\tel\testudiante\tpara\taprender;\tValenzuela\t  González\t(2000)\tconsidera\tel\taprendizaje\tautodirigido,\tautónomo\ty\tautorregulado\tcomo\tuna\t  estrategia\tmetodológica\tposibilitadora\tde\taprendizajes\tsignificativos.\t  \t   El\testudiante\taprende\tde\tmanera\tsignificativa\tcuando\tpercibe\tque\tla\texperiencia\tde\tla\t  enseñanza\tque\trecibe\ttiene\trelevancia\tpara\tsus\tpropios\tpropósitos\te\tintereses,\tpuede\tparticipar\t  de manera activa en el proceso de aprendizaje y recibe realimentación y evaluación continua.   Rogers\t(1969)\tplantea\tque\tlos\testudiantes\taprenden\ta\ttravés\tde\tla\tpráctica,\tla\trepetición,\tla\tapli -  cación,\tla\tresolución\tde\tproblemas,\tla\tparticipación\tactiva,\tla\treflexión\ty\tla\tcrítica\tconstructiva;\t  destacando\tla\timportancia\tde\taplicar\tlos\tconceptos\tteóricos\ta\ttravés\tde\texperimentos,\tactivi -  dades y proyectos.  \t   De\testa\tmanera\tes\tpreciso\tdecir\tque,\tel\taprendizaje\tno\tes\tuna\tactividad\tinterna\tindividual,\t  sino que es la formación de conexiones enfocadas a la construcción colectiva y las afectaciones   cambiantes del entorno social; reconociendo la importancia de desarrollar en los estudiantes   habilidades\tpara\taprender\ta\taprender,\taprender\thaciendo\ty\taprender\ta\tser.\tA\tsu\tvez,\tel\tapren -  dizaje también se da por medio de herramientas digitales que permiten al estudiante acceder   a\tla\tinformación,\ty\tcrear\tlazos\tcon\totras\tpersonas\ty\trecursos\trelevantes\tpara\tsu\taprendizaje;\tlo\t  que permite integrar al estudiante a la participación colaborativa en la práctica de resolución de   problemas\ty\ta\tla\tconstrucción\tdel\tpensamiento\ten\tcontextos\tsignificativos.\tAdemás,\tle\timplica,\t  desde\tel\tpunto\tde\tvista\tético,\tvalorar\tlas\tpercepciones\tque\tse\tvan\tgenerando\tcon\tel\tpaso\tdel\t  tiempo sobre su propio proceso. \nModelo Educativo y Pedagógico 47  5.3 El profesor y su rol  5.3.1 El profesor y su rol en la docencia    Según Dewey (2010) el rol del docente en el proceso de enseñanza es el de guía y fa -  cilitador\tdel\taprendizaje\tdel\testudiante.\tEn\tlugar\tde\tser\tuna\tfuente\túnica\tde\tconocimiento,\tel\t  docente debe crear un ambiente de aprendizaje donde los estudiantes tengan la oportunidad   de\tinteractuar\tcon\tsu\tentorno\ty\taprender\tde\tforma\tactiva.\tPor\tlo\ttanto,\tel\trol\tdel\tdocente\ten\tel\t  proceso\teducativo\tno\tse\tlimita\ta\ttransmitir\tel\tconocimiento,\tsino\ttambién\ta\tmotivar,\tinspirar\ty\t  guiar a los estudiantes para desarrollar su máximo potencial.   \t   El\tdocente\tes\tun\torientador\tque\tadapta\tlas\tnecesidades,\tintereses\ty\testilos\tde\taprendi -  zaje\tde\tlos\testudiantes,\tpara\tcrear\tsituaciones\ty\tescenarios\tque\tpromuevan\tla\tcreatividad,\tel\t  pensamiento crítico y el desarrollo de las capacidades analíticas y resolutivas del estudiante. Es   decir,\tel\tdocente\tdebe\tmotivar\ty\tgenerar\tun\tambiente\tde\taprendizaje\tque\tfomente,\ten\tsus\testu -  diantes,\texperiencias\teducativas\tque\tles\tpermita\thacer\tconexiones\tcon\tsus\tpropias\tvivencias\ty\t  conocimientos\tprevios;\ty\ta\tsu\tvez,\tgenerar\treflexiones\tsobre\tla\tconstrucción\tdel\tconocimiento\t  de manera colaborativa.    En la I.U. Pascual Bravo se concibe al docente como un ser integral con habilidades téc -  nicas,\tcualidades\thumanas\ty\tformación\tacadémica\tidónea,\tcomprometido\ten\tlas\tinteracciones\t  con\testudiantes,\tempresas\ty\tdiferentes\tentornos\tsociales,\tque\treconoce\tla\tdiversidad\tde\tlos\tes -  tudiantes y a partir de ello promueve la emancipación.  También dispone de una visión crítica y   profunda\ten\tla\tconstrucción\tdel\tconocimiento\ty\trelacionamiento\tintercultural,\tconvirtiéndose\ten\t  un\torientador,\tinspirador\ty\tacompañante\ten\tla\texperiencia\teducativa\tde\tlos\testudiantes,\ta\ttravés\t  de\tlas\tTecnologías\tdel\tAprendizaje\ty\tel\tConocimiento\t(TAC),\tcomo\therramientas\tpara\tpotenciar\t  el\taprendizaje\tsignificativo.\t \nModelo Educativo y Pedagógico 48  \t   Cuando\tun\tprofesional\ttoma\tla\tdecisión\tde\tconvertirse\ten\tun\tdocente,\tindependiente -  mente\tde\tsu\tárea\tdisciplinar,\tdebe\ttener\tconocimiento\ten\t5\taspectos\tpara\tser\tidóneo\ten\tel\tde -  sarrollo\tde\tsu\tejercicio,\ttal\tcomo\taporta\tAtria\tCuri\t(2020),\testos\tson:  El\tdocente\tdebe\tdominar\tel\tcontenido\tque\tenseña\ty\tlas\tmetas\tcurriculares,\tlo\tcual\timplica\ttener\t  un nivel de educación superior al de los estudiantes.   Debe\tposeer\tconocimientos\tsobre\tcómo\tenseñar\tel\tcontenido\tdisciplinar,\tadaptando\testrate -  gias didácticas y evaluativas según las necesidades.   Es necesario que el docente cuente con conocimientos pedagógicos generales que abarquen   la\tgestión\tdel\taula,\tla\tevaluación\ty\tla\tadaptabilidad\tde\tla\tenseñanza.\t  El\tdocente\tdebe\tcomprender\tal\tsujeto\tque\taprende,\treconociendo\tlas\tdiferentes\tinteligencias,\t  estilos\ty\tritmos\tde\taprendizaje,\tasí\tcomo\tlas\tvariables\tpersonales\ty\tcontextuales\tque\tinfluyen\ten\t  el proceso educativo.   Es esencial que el docente cuente con conocimientos del contexto en el cual se aplica el cono -  cimiento\tdisciplinar,\ttanto\ten\tel\támbito\tlaboral\tcomo\ten\tel\tcontexto\teducativo.  5.3.2 El profesor y su rol en la investigación    El proceso de investigación en la I.U. Pascual Bravo se presenta de dos maneras: por un   lado,\tse\tencuentra\tla\tinvestigación\tformativa\ty\tpor\tel\totro\tla\tinvestigación\taplicada.\tEn\tambos\t  procesos\tse\tpuede\tdar\tla\tinteracción\tde\tdocentes,\testudiantes\ty\totros\tagentes\texternos.    La investigación formativa busca fortalecer los aprendizajes de los estudiantes en temas   relacionados con la investigación desde sus propias áreas disciplinares. Los docentes encar -  gados de orientar estos procesos crean semilleros de investigación para consolidar espacios   propicios\tde\tindagación,\tproposición\ty\tejecución\tde\tpropuestas,\tmediadas\tpor\tlas\tdiferentes\t  metodologías\tde\tinvestigación\texistentes.\tEl\tfin\túltimo\tde\teste\ttipo\tde\tinvestigación\tes\tpreparar\t  a\tlos\testudiantes\tpara\tgenerar\tprocesos\tde\tdivulgación\tde\tla\tinformación,\tpara\tlo\tcual\texisten\t  diferentes\tmedios,\tcomo\teventos,\trevistas\tacadémicas\to\tde\tdivulgación,\tredes,\tetc.\tLa\tinves -  tigación formativa en la I.U Pascual Bravo hace el tránsito hacia la investigación aplicada por   medio de la construcción de los PIA.  \t   Por\tsu\tparte,\tla\tinvestigación\taplicada\tpretende\tdar\trespuesta\ta\tsituaciones\tproblema\t  que se encuentran en la sociedad desde un enfoque tecnológico. En este aspecto el docente   de\tla\tI.U.\tPascual\tBravo\tdebe\tcumplir\tun\trol\tde\tliderazgo,\tdonde\tpueda\tpensarse\tuna\testructura\t  clara,\tarticulada\tcon\tlos\tmodelos\tinstitucionales\tde\tinvestigación,\tque\ttenga,\tcomo\tmínimo,\tun\t \nModelo Educativo y Pedagógico 49  5.3.3 El profesor y su rol en la extensión  5.4 Concepción metodológica de la enseñanza  contexto\tde\tintervención,\tobjetivos,\tantecedentes,\tsoportes\tteóricos,\tmetodología,\ty\tla\tproyec -  ción\tde\tun\tanálisis\tde\tla\tinformación,\tresultados\ty\thallazgos.\tEn\testa\tmedida,\tla\tI.U.\tPascual\t  Bravo,\tcon\tsu\tenfoque\ttecnológico,\tha\tgenerado\tgrandes\talianzas\tque\than\tposibilitado\tla\tcons -  trucción de proyectos de investigación avalados por entes locales o nacionales.  \t   La\tLey\t30\tdel\t28\tde\tdiciembre\tde\t1992\tseñala,\ten\tsu\tartículo\t120,\tque\tla\textensión\ten\tel\t  ámbito de las instituciones de educación  superior   comprende\tlos\tprogramas\tde\teducación\tpermanente,\tcursos,\tseminarios\ty\tdemás\tprogramas\tdes -  tinados\ta\tla\tdifusión\tde\tlos\tconocimientos,\tal\tintercambio\tde\texperiencias,\tasí\tcomo\tlas\tactivida -  des de servicio tendientes a procurar el bienestar general de la comunidad y la satisfacción de las   necesidades\tde\tla\tsociedad\t(p.24).  \t   Teniendo\ten\tcuenta\tlo\tanterior,\tse\tpuede\tdecir\tque\tel\tdocente\tde\tla\tI.U\tPascual\tBravo\t  tiene  un  rol  protagónico  en  la  planeación  y  ejecución  de  acciones  que  impactan  de  manera    positiva\tla\tcomunidad,\tproporcionando\texperiencias\ty\tconocimientos\ta\ttravés\tde\tconvenios\ty\t  contratos\tde\trelacionamiento\tempresarial,\tproyectos\tde\temprendimiento,\toferta\tde\tprogramas\t  técnicos\tlaborales,\tproyectos\tde\ttransferencia\ttecnológica,\tprácticas\tprofesionales,\tofertas\tde\t  formación\tcontinua\t(cursos,\tdiplomados,\ttalleres,\tetc.),\tentre\totros\tservicios\tque\tofrece\tla\tinsti -  tución a la comunidad externa e interna con la que se relaciona.     El rol del docente en la extensión universitaria permite que el conocimiento que se cons -  truye\ten\tel\taula,\ty\tse\tconsolida\ten\tla\tinvestigación,\tsea\tobjeto\tde\tapropiación\tsocial\te\tinterven -  ción en la comunidad.     La  concepción  metodológica  de  la  enseñanza  en  la  I.U.  Pascual  Bravo  se  basa  en  un    enfoque\tinteractivo\ty\tdinámico,\tdonde\tse\tpromueve\tla\tcomunicación\tefectiva\tentre\tdocentes\ty\t  estudiantes; se reconoce la importancia de adaptar estrategias y metodologías de enseñanza a   las\tnecesidades\tindividuales,\tbuscar\taprendizajes\tautónomos\ty\tproporcionar\trecursos\tnecesarios\t  para\tinvestigar,\treflexionar\ty\tconstruir\tsu\tpropio\tconocimiento. \nModelo Educativo y Pedagógico 50  \t   La\tenseñanza\timplica\tdefinir\tlas\tcompetencias,\tseleccionar\ty\torganizar\tlos\tsaberes,\telegir\t  las\tmetodologías,\ty\tsus\trecursos\tmás\tadecuados,\ty\tevaluar\tel\tprogreso\tde\tlos\testudiantes.\tEsto\t  se garantiza mediante el proceso constante de actualización y capacitación a los docentes en   avances\ty\ttendencias,\ttanto\ten\tel\tsaber\teducativo,\tpedagógico\ty\tdidáctico,\tcomo\ten\tel\tsaber\t  disciplinar.    La\t enseñanza,\t como\t proceso\t participativo,\t genera\t conexiones\t e\t interacciones\t en\t la\t  construcción\tde\tconocimiento;\tademás,\tpermite\tla\tformación\tde\tredes\tde\taprendizaje\tque\tinvolucran\t  a\testudiantes,\texpertos\ty\tSistemas\tde\tAdministración\tdel\tAprendizaje\t-\tLMS\t(Siemens,\t2004).\t  Estas\tredes\tbrindan\tacceso\ta\tuna\tamplia\tgama\tde\tinformación\ty\trecursos,\tenfatizando\ten\tla\t  importancia\tde\tcrear\tconexiones\tsignificativas\tque\tfomenten\tla\tparticipación\tactiva\tde\tlos\t  estudiantes.\tDe\testa\tmanera,\tse\treconoce\tque\tel\taprendizaje\tse\tproduce\ten\tla\tinteracción\tcon\t  otros\ty\tcon\tel\tentorno,\taprovechando\tlas\tposibilidades\tque\tofrecen\tlas\ttecnologías\tdigitales.    Por\totra\tparte,\tla\tenseñanza\tgenera\tlas\tcondiciones\tnecesarias\tpara\treflexionar\tsobre\tla\t  emancipación,\tfomenta\tel\tpensamiento\tcrítico\ty\tla\treflexión\tsobre\tel\tconocimiento\taprehendido.\t  A su vez aporta nuevos enfoques y perspectivas que enriquezcan el desarrollo de un individuo   integral,\ty\tque\tcomplementen\tsus\thabilidades\tesenciales\tpara\tsu\trealización\tpersonal,\tciudadana\t  e\tinclusión\tsocial.\tPerspectivas\tcomo\tel\taprender\ta\taprender,\tlas\tcompetencias\tciudadanas\ty\t  cívicas,\tel\tespíritu\temprendedor\ty\tlas\tcapacidades\tde\texpresión\tintegral\ty\tcultural.\tA\tsu\tvez,\t  estas habilidades permiten la gestión constructiva del propio conocimiento como representación   progresiva\tde\tsu\tvisión\ty\trealización\tpersonal\t(Siemens,\t2004).  5.5 El directivo y su rol     El  rol  del  directivo  es  liderar  el  alcance  de  los  objetivos  y  logros  de  una  educación  de    calidad,\timpulsando\tsu\tmejora\tcontinua,\ty\testableciendo\tobjetivos\testratégicos\tque\testén\t  alineados  con  las  necesidades  y  demandas  de  la  comunidad  educativa.  Estudia  y  busca    comprender,\ten\tprofundidad,\tel\tfenómeno\teducativo;\tademás\tde\tpromover\tla\tformación\ty\tel\t  desarrollo\tprofesional,\tgenerando\toportunidades\tde\tcapacitación,\tactualización\te\timplementación\t  de\tmetodologías\tinnovadoras\tcon\tel\tuso\tde\ttecnologías\teducativas,\tpara\tenriquecer\tlos\tprocesos\t  de\tenseñanza,\taprendizaje\ty\tevaluación.    El MEN y FExE (2022) destacan que el rol del directivo no solo implica liderar la gestión   administrativa\ty\tfinanciera,\tsino\ttambién\tmejorar\tla\tcalidad\tdel\tservicio\tofrecido\tpara\timpactar\t  positivamente los aprendizajes. Lidera una cultura orientada hacia una organización que aprende  \nModelo Educativo y Pedagógico 51  y\tcrea\tambientes\tcada\tvez\tmás\tpropicios\tpara\tel\taprendizaje\ty\tla\tconvivencia.\tAsimismo,\tel\t  directivo  colabora  e  interactúa  con  los  docentes  y  personal  administrativo  para  implementar    prácticas\tpedagógicas\tinnovadoras\ty\tcreativas,\tque\tpermitan\tmejorar\tla\tformación\tintegral\ty\t  afrontar los desafíos educativos del mundo actual.    Para\tla\tI.U.\tPascual\tBravo,\ty\ten\tsintonía\tcon\tlo\texpresado\tpor\tAyala\t(2020),\tlos\tdirectivos\t  son\tlíderes\tcon\taltas\tcualidades\ty\tcalidades\thumanas\ty\tprofesionales,\tque\tactúan\tcomo\t  gestores\tcohesionadores\tde\tlos\tequipos\tde\ttrabajo;\ttienen\tla\tcapacidad,\ty\tel\tconocimiento,\tde\t  ser creativos y visionarios para comunicar políticas y desarrollar estrategias. Se caracterizan por   su\ttalante\tdemocrático,\tpor\tabrir\tespacios\tparticipativos\tdesde\tuna\tperspectiva\tcolaborativa,\t  por\tincentivar\tprocesos\ttransformacionales\tque\tpotencien\tla\tinnovación\tcon\tdesempeños\tcreativos,\t  y por contribuir a la generación de condiciones que propicien una cultura y clima organizacional   favorables para lograr el aseguramiento de la calidad.     Para\talcanzar\tlo\tanteriormente\tnombrado,\tlos\tdirectivos\tdeben\treconocer\tla\timportancia\t  del\tcomponente\tmisional,\tser\tlíderes\tproactivos,\ttener\tun\talto\tcompromiso,\ty\tuna\tgran\tconvicción\t  con\tel\tsaber\tde\tla\teducación,\tcon\tla\tnecesidad\tde\tactualizarse\tpermanentemente,\ty\tcomprender\t  las implicaciones del proceso formativo y su participación directa en él.  5.6 Concepción metodológica de la gerencia educativa    La concepción metodológica de la gerencia educativa se basa en una comprensión profunda   del\tproceso\tde\tenseñanza,\taprendizaje\ty\tevaluación,\ty\tsu\trelación\tcon\tla\tgestión\tinstitucional.\t  En\testa\tconcepción,\tel\taprendizaje\tse\tenfoca\ten\tel\tdesarrollo\tintegral\tde\tlos\testudiantes,\t \nModelo Educativo y Pedagógico 52  promoviendo la adquisición de competencias y habilidades necesarias para su desempeño en   la\tsociedad.\tAdicional,\tla\tgerencia\teducativa\tpiensa\ten\tla\tplanificación\ty\tgestión\tde\tlos\trecursos\t  institucionales\tpara\tque\testén\ten\tpro\tde\tla\teficacia\ty\teficiencia\tde\tla\tinstitución.    Por\totro\tlado,\testa\tconcepción\tbusca\tpromover\tuna\tcultura\tde\tcalidad\ty\texcelencia\ten\tla\t  que\tse\tfomente\tla\tinnovación\ty\tla\tmejora\tcontinua,\ty\tse\testablezcan\tprocesos\tde\tplanificación\t  estratégica,\tevaluación\ty\tseguimiento,\tpara\tasegurar\tel\tcumplimiento\tde\tlos\tobjetivos\ty\tde\tlos\t  resultados\tde\taprendizaje.\tSegún\tOspina,\tBurgos\ty\tMadera\t(2017),\tla\tgerencia\teducativa\t  implica\tla\tplanificación,\torganización,\tdirección\ty\tcontrol\tde\tlos\trecursos\thumanos,\tfinancieros\t  y materiales para lograr los objetivos propuestos. En el contexto de los cambios organizaciona -  les,\tla\tgerencia\teducativa\tdebe\tayudar\ta\tlas\tinstituciones\ta\tadaptarse\ta\tlos\tnuevos\tdesafíos\ty\t  oportunidades que surjan en su entorno.    La I.U. Pascual Bravo se apropia de la concepción metodológica de la gerencia educativa ,\t  mediante  la  implementación  de  estrategias  que  buscan  garantizar  la  calidad  de  la  educación    superior.\tPromueve\tuna\tgestión\tparticipativa\ty\ttransparente,\tque\tinvolucra\ta\ttoda\tla\tcomunidad\t  educativa en la toma de decisiones y en la búsqueda constante de la mejora continua; enfoca   sus esfuerzos en la formación integral de los estudiantes y brinda espacios para el desarrollo de   competencias,\thabilidades\ty\tvalores,\tque\tpermitan\tenfrentar\tlos\tretos\ty\tdemandas\tdel\tmundo\t  actual.\tAsimismo,\tfomenta\tla\timplementación\tde\tmetodologías\tinnovadoras\ty\tel\tuso\tde\ttecnologías\t  educativas,\ten\tsintonía\tcon\tlas\ttendencias\tactuales\tde\tla\teducación.  5.7 El egresado, la sociedad, las organizaciones comunitarias, las   empresas y su rol    La comunidad educativa en la I.U. Pascual Bravo se conforma a partir de la unión y cohesión   de\tla\ttriada\tescuela,\tempresa\ty\tsociedad;\ty\tse\tconsolida\ta\tpartir\tde\tsu\tmodelo\tde\tinteracción\ty\t  relacionamiento. La institución centra su proceso educativo en la dinámica de las interacciones   que\tse\tpresentan\tentre\tlos\tintegrantes\tde\tla\tcomunidad\teducativa,\ta\ttravés\tde\tmúltiples\tformas\t  y\tmedios.\tEsta\tdinámica\tse\tsustenta\tmediante\tprocesos\tde\tinvestigación\ty\tconfluencia\ten\tredes\t  académicas;\tcon\tperspectivas\tde\tapertura,\tflexibilidad,\tinnovación\ty\tdisrupción.\tLos\tegresados\t  forman\tparte\tintegral\tde\testa\tcomunidad,\tla\tcual\tse\tbeneficia\tde\tsus\tservicios,\ty\tla\tinstitución\t  desarrolla estrategias cotidianas de seguimiento sobre los impactos que tengan en los ámbitos   de\tactuación\tprofesional,\tdonde\tellos\tintervienen,\ty\tles\tofrece\toportunidad\tde\tcualificación\ty\t  formación a lo largo de la vida. \nModelo Educativo y Pedagógico 53  5.7.1 El rol del egresado  5.7.2 El rol de la sociedad  \t   Para\tla\tI.U.\tPascual\tBravo\tel\tegresado\tes\tel\treflejo\tde\tla\tapuesta\teducativa\ty\tpedagógica,\t  consolidada\ten\tprofesionales\tque\tvivieron\texperiencias\tformativas\tsignificativas\ty\tdisruptivas,\t  que\tconfluye
