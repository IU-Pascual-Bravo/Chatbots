<style>
:root{
  --navy:#1B2148;
  --navy-2:#2B3480;
  --blue:#3E8EDE;
  --cyan:#5FC9D6;
  --yellow:#F2C94C;
  --bg-grad:linear-gradient(135deg,#eef1fb 0%,#e6f6f8 50%,#fdf8ec 100%);
}
*{box-sizing:border-box;}
body{font-family:"Segoe UI",sans-serif;margin:0;background:var(--bg-grad);display:flex;justify-content:center;padding:15px;min-height:100vh;box-sizing:border-box;}
.chat-app{width:100%;max-width:950px;background:white;border-radius:18px;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 8px 30px rgba(27,33,72,.18);}

/* ---- Barra superior con logos y título ---- */
.top-bar{
  background:linear-gradient(120deg,var(--navy) 0%,var(--navy-2) 55%,var(--blue) 100%);
  background-size:200% 200%;
  animation:gradientShift 10s ease infinite;
  padding:14px 18px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
}
@keyframes gradientShift{
  0%{background-position:0% 50%;}
  50%{background-position:100% 50%;}
  100%{background-position:0% 50%;}
}
.top-bar .logo{height:52px;width:auto;object-fit:contain;flex-shrink:0;background:white;border-radius:8px;padding:5px 8px;}
.top-bar .logo-left{background:white;}
.top-bar .logo-right{background:white;}
.title-wrap{flex-grow:1;text-align:center;padding:0 8px;}
.app-title{
  margin:0;
  font-size:1.5em;
  font-weight:800;
  color:#fff;
  background:linear-gradient(90deg,#fff,var(--yellow),var(--cyan),#fff);
  background-size:300% auto;
  -webkit-background-clip:text;
  background-clip:text;
  -webkit-text-fill-color:transparent;
  animation:shine 6s linear infinite;
  letter-spacing:.5px;
}
@keyframes shine{
  to{background-position:300% center;}
}
.app-subtitle{
  margin:4px 0 0;
  color:#e9edff;
  font-size:.8em;
  min-height:1.1em;
  font-style:italic;
  opacity:.9;
}

.header{background:linear-gradient(90deg,var(--navy-2),var(--blue));color:white;padding:10px 15px;text-align:center;font-size:1em;font-weight:600;letter-spacing:.3px;}

#chat-log{flex-grow:1;overflow-y:auto;padding:20px;display:flex;flex-direction:column;gap:15px;background:linear-gradient(180deg,#f8f9fc,#f1f4fa);}
.msg{display:flex;gap:12px;max-width:85%;}
.msg.user{align-self:flex-end;flex-direction:row-reverse;}
.msg.bot{align-self:flex-start;}
.avatar{width:46px;height:46px;border-radius:50%;background:#eee;flex-shrink:0;border:2px solid var(--blue);object-fit:cover;box-shadow:0 2px 6px rgba(0,0,0,.12);}
.bubble{padding:12px 18px;border-radius:18px;line-height:1.6;font-size:15px;box-shadow:0 2px 8px rgba(27,33,72,.08);}
.user .bubble{background:linear-gradient(135deg,var(--navy-2),var(--blue));color:white;border-bottom-right-radius:2px;}
.bot .bubble{background:white;color:#333;border-bottom-left-radius:2px;border:1px solid #eee;}
.bubble b{font-weight:bold;} .bubble ul{margin:10px 0;padding-left:20px;}
.bubble img{max-width:100%;border-radius:10px;margin-top:15px;display:block;border:1px solid #ddd;}

.input-area{padding:15px;background:white;display:flex;gap:10px;border-top:1px solid #eee;}
input{flex-grow:1;padding:12px;border:1px solid #ddd;border-radius:25px;outline:none;font-size:15px;}
input:focus{border-color:var(--blue);}
.btn-send{background:linear-gradient(135deg,var(--navy-2),var(--blue));color:white;border:none;padding:0 22px;border-radius:25px;cursor:pointer;font-weight:bold;transition:filter .15s;}
.btn-send:hover{filter:brightness(1.1);}

.faq-bar{padding:10px;display:flex;gap:8px;flex-wrap:wrap;justify-content:center;background:white;}
.faq-btn{background:linear-gradient(135deg,#eef1fb,#e6f0fb);border:1px solid #dde3f7;padding:7px 14px;border-radius:15px;font-size:13px;cursor:pointer;color:var(--navy-2);font-weight:600;transition:filter .15s;}
.faq-btn:hover{filter:brightness(0.96);}

.footer-tools{padding:12px 20px;background:linear-gradient(180deg,#f8f9fc,#eef0f6);display:flex;justify-content:space-between;align-items:center;border-top:1px solid #eee;flex-wrap:wrap;gap:12px;}
.tool-btn{
  color:white;border:none;padding:9px 16px;border-radius:22px;cursor:pointer;
  font-size:13px;font-weight:600;letter-spacing:.2px;
  display:flex;align-items:center;gap:7px;
  box-shadow:0 3px 8px rgba(0,0,0,.15);
  transition:filter .15s,transform .15s,box-shadow .15s;
}
.tool-btn i{font-size:14px;}
.tool-btn:hover{filter:brightness(1.08);transform:translateY(-2px);box-shadow:0 5px 12px rgba(0,0,0,.2);}
.tool-btn:active{transform:translateY(0);box-shadow:0 2px 5px rgba(0,0,0,.15);}
#pdf-btn{background:linear-gradient(135deg,#e2574c,#b7332a);}
#audio-btn{background:linear-gradient(135deg,#8a94a6,#6c757d);}
#audio-btn.is-on{background:linear-gradient(135deg,#3cb878,#1e8449);}
#pause-btn{background:linear-gradient(135deg,#f2a154,#dd7e1a);}
#stop-btn{background:linear-gradient(135deg,#d9564c,#a5342b);}
.audio-group{display:flex;gap:8px;background:white;padding:6px;border-radius:26px;box-shadow:inset 0 0 0 1px #eee;}
.img-toggle{
  display:flex;align-items:center;gap:8px;font-size:13px;color:var(--navy-2);
  user-select:none;cursor:pointer;background:white;padding:8px 14px;border-radius:22px;
  box-shadow:0 2px 6px rgba(27,33,72,.1);font-weight:600;
}
.img-toggle i{color:var(--blue);}
.img-toggle input{cursor:pointer;width:16px;height:16px;accent-color:var(--blue);}
</style>
</head>

function buildSystem(){
  var mathInstr = USE_MATHJAX ? " Cuando escribas expresiones matemáticas, usa SIEMPRE notación LaTeX: matemáticas en línea con $...$ y en bloque con $$...$$. Nunca escribas matemáticas como texto plano." : "";
  return `Asume el rol de "Acompañante Empático y Estimulador Cognitivo para Personas Mayores". Tu objetivo principal es mitigar la soledad emocional y cognitiva, mantener la mente del usuario activa y segura, y ofrecer entretenimiento terapéutico mediante la conversación y el juego.

Sigue rigurosamente estas pautas de comportamiento y configuración técnica:

1. PERSONALIDAD Y TONO
- Sé empático/a, optimista, curioso/a, extremadamente paciente y cercano/a.
- Habla siempre de manera clara, utilizando un lenguaje cálido y sencillo. Evita tecnicismos o frases extremadamente largas.
- Adopta un interés genuino por la vida del usuario, preguntándole por su día, su estado de ánimo, sus comidas, su música favorita o pasatiempos.

2. RITMO DE CONVERSACIÓN (MÉTODOS DE ACCESIBILIDAD)
- Para facilitar la comprensión, procesa la conversación de forma pausada.
- Si el usuario muestra cansancio o intenta despedirse, cierra la conversación de forma amable y cálida de inmediato. No insistas con más preguntas de seguimiento para evitar frustración.

3. ESTIMULACIÓN COGNITIVA Y RECUERDOS (REMINISCENCIA)
- Dirige las conversaciones hacia temas agradables y nostálgicos del pasado (infancia, música de juventud, películas antiguas, historia).
- Utiliza la memoria conversacional: recuerda detalles que el usuario te haya contado en sesiones anteriores para dar continuidad y ejercitar su memoria.
- Actúa ocasionalmente como una "radio inteligente": léele noticias breves de actualidad y coméntalas con él/ella de forma amena.

4. MÓDULO DE JUEGOS COGNITIVOS
Cuando el usuario quiera jugar o cuando notes que necesita estimulación mental, activa la función de juegos.
- Juego de Palabras Desordenadas (Scramble): Puedes sugerir una temática (por ejemplo, "frutas", "animales", "países").
- REGLA CRÍTICA — NUNCA desordenes las letras tú mismo: los modelos de lenguaje cometen errores frecuentes al mezclar o contar letras manualmente (por ejemplo, escribir "p e r n a" para la palabra "pera", que ni siquiera tiene las mismas letras). Por eso, en esta aplicación TÚ NUNCA escribes las letras ya desordenadas; solo eliges palabras reales y completas, y la aplicación se encarga de desordenarlas correctamente.
- Formato obligatorio para iniciar o continuar el juego de Scramble: incluye en tu respuesta (además de tu texto conversacional normal, cálido y breve) un bloque exacto así, con SOLO palabras reales del tema pedido, completas, en minúsculas, una por línea, sin numerarlas y sin mezclar sus letras:
[PALABRAS]
palabra1
palabra2
palabra3
[/PALABRAS]
  * Incluye entre 6 y 10 palabras de 3 a 10 letras cada una, todas reales y pertenecientes al tema.
  * No escribas las palabras desordenadas en ninguna parte de tu respuesta; la aplicación las desordenará y las mostrará numeradas automáticamente.
  * No repitas este bloque [PALABRAS] en los turnos donde solo estés confirmando si el usuario acertó una palabra ya mostrada; úsalo solo al iniciar un juego nuevo o cambiar de tema/lista.
- Integración con la API de generación de texto: si un sistema te consulte para alimentar de manera dinámica este juego u otras aplicaciones web descargables en HTML (fuera de esta conversación), debes estar preparado para recibir una solicitud de palabras. Cuando así se te pida:
  * Genera un conjunto de al menos 10 palabras en español relacionadas con el tema que te solicite la aplicación.
  * Devuelve la respuesta en minúsculas, separadas por espacios, sin comas, puntos ni caracteres especiales (excepto tildes y la letra 'ñ').
  * Asegúrate de que las palabras tengan una longitud de entre 3 y 10 caracteres para que encajen en los contenedores de arrastrar y soltar (letter-slot) del juego interactivo.

5. MONITOREO DE BIENESTAR Y SEGURIDAD (SALVAGUARDAS)
- Realiza de manera natural preguntas estándar de evaluación cognitiva camufladas en la charla para detectar de forma temprana indicios de pérdida de memoria o razonamiento.
- Supervisión de crisis: Si detectas palabras clave o señales que indiquen depresión profunda, pensamientos delirantes o riesgo de autolesión, no valides conductas de aislamiento. En su lugar, mantén un enfoque de resistencia cariñosa, indaga sobre sus redes familiares reales para motivar su reconexión y menciona que puede activarse un protocolo de alerta hacia cuidadores o servicios de emergencia si fuese necesario.
- Identidad artificial: revisa el HISTORIAL DE LA CONVERSACIÓN que se te proporciona más abajo. Si está vacío o es tu primera respuesta, preséntate UNA SOLA VEZ como "compañero virtual de Inteligencia Artificial" para no engañar al usuario respecto a tu naturaleza artificial. Si el historial ya muestra que te presentaste antes, NO repitas esa presentación ni frases similares ("soy tu compañero virtual de IA...") en esta respuesta: continúa la conversación con naturalidad, como lo haría alguien que ya se conoce con el usuario. Solo vuelve a aclarar tu naturaleza artificial si el usuario lo pregunta directamente o parece confundido al respecto.

Responde siempre en español, con formato de negritas (**texto**) y listas con viñetas cuando ayude a la claridad.${mathInstr}`;

// Cuántos turnos previos (usuario+asistente) se incluyen como contexto en cada petición.
// Un valor alto da más "memoria" pero aumenta el tamaño y costo de cada llamada.
var MAX_HISTORY_TURNS=12;

function buildHistoryBlock(){
  if(conversationHistory.length===0) return "";
  // Tomamos los últimos N mensajes (ya excluye el mensaje actual, que se agrega aparte en send()).
  var recent=conversationHistory.slice(-MAX_HISTORY_TURNS*2);
  var lines=recent.map(function(m){return m.role+": "+m.text;});
  return "\n\nHISTORIAL DE LA CONVERSACIÓN (más reciente al final, úsalo para mantener continuidad y no repetir preguntas ya respondidas):\n"
    +lines.join("\n")
    +"\n\nFIN DEL HISTORIAL.";
}

var chatLog=document.getElementById("chat-log");
var userInput=document.getElementById("user-input");
var audioEnabled=false;
var conversationHistory=[];

// --- Manejo determinístico del juego de Scramble (evita errores de conteo/mezcla de letras del LLM) ---
var WORD_TAG_RE=/\[PALABRAS\]([\s\S]*?)\[\/PALABRAS\]/i;

function shuffleWord(word){
  var letters=word.split("");
  if(letters.length<2) return word;
  var shuffled,intentos=0;
  do{
    for(var i=letters.length-1;i>0;i--){
      var j=Math.floor(Math.random()*(i+1));
      var tmp=letters[i];letters[i]=letters[j];letters[j]=tmp;
    }
    shuffled=letters.join("");
    intentos++;
  }while(shuffled===word && intentos<10);
  return shuffled;
}

function processScrambleBlock(rawText){
  // Si el modelo no incluyó el bloque de palabras, no hay nada que transformar.
  var match=rawText.match(WORD_TAG_RE);
  if(!match) return {display:rawText,context:rawText,words:null};

  var words=match[1].split("\n")
    .map(function(w){return w.trim().toLowerCase();})
    .filter(function(w){return /^[a-záéíóúñü]{3,10}$/.test(w);});

  if(words.length===0) return {display:rawText.replace(WORD_TAG_RE,"").trim(),context:rawText,words:null};

  var listHtml=words.map(function(w,idx){
    var scrambled=shuffleWord(w).split("").join(" ");
    return "**"+(idx+1)+")** "+scrambled;
  }).join("\n");

  var display=rawText.replace(WORD_TAG_RE,listHtml);
  // El historial que ve el modelo conserva las palabras reales (no mezcladas) para que pueda
  // validar correctamente las respuestas del usuario en los siguientes turnos.
  var context=rawText.replace(WORD_TAG_RE,
    "[Juego Scramble iniciado. Palabras reales y en orden, ya mostradas al usuario con las letras desordenadas por la aplicación: "
    +words.join(", ")+"]");
  return {display:display,context:context,words:words};
}


function toggleAudio(){
  audioEnabled=!audioEnabled;
  var btn=document.getElementById("audio-btn");
  btn.innerHTML=audioEnabled
    ? "<i class=\"fas fa-volume-up\"></i> ON"
    : "<i class=\"fas fa-volume-mute\"></i> OFF";
  btn.classList.toggle("is-on",audioEnabled);
  if(!audioEnabled) window.speechSynthesis.cancel();
}
function pauseAudio(){
  if(window.speechSynthesis.speaking && !window.speechSynthesis.paused){
    window.speechSynthesis.pause();
    document.getElementById("pause-btn").innerHTML="<i class=\"fas fa-play\"></i> Reanudar";
  } else if(window.speechSynthesis.paused){
    window.speechSynthesis.resume();
    document.getElementById("pause-btn").innerHTML="<i class=\"fas fa-pause\"></i> Pausar";
  }
}
function stopAudio(){
  window.speechSynthesis.cancel();
  document.getElementById("pause-btn").innerHTML="<i class=\"fas fa-pause\"></i> Pausar";
}
function speak(text){
  if(!audioEnabled) return;
  window.speechSynthesis.cancel();
  var clean=text.replace(/[*#\$\\<>]/g,"").replace(/<br>/g," ");
  var sp=new SpeechSynthesisUtterance(clean);
  sp.lang="es-ES";
  // Asegurar que las voces estén cargadas
  var voices=window.speechSynthesis.getVoices();
  if(voices.length>0){
    var esVoice=voices.find(function(v){return v.lang.startsWith("es");});
    if(esVoice) sp.voice=esVoice;
    window.speechSynthesis.speak(sp);
  } else {
    window.speechSynthesis.onvoiceschanged=function(){
      var v2=window.speechSynthesis.getVoices();
      var esV=v2.find(function(v){return v.lang.startsWith("es");});
      if(esV) sp.voice=esV;
      window.speechSynthesis.speak(sp);
    };
  }
}

function formatText(t){
  // Proteger bloques matemáticos antes de formatear markdown
  var maths=[];
  t=t.replace(/(\$\$[\s\S]*?\$\$|\$[^\$\n]+?\$|\\\[[\s\S]*?\\\]|\\\([\s\S]*?\\\))/g,function(m){
    maths.push(m); return "@@MATH"+(maths.length-1)+"@@";
  });
  t=t.replace(/\*\*(.*?)\*\*/g,"<b>$1</b>")
       .replace(/^- (.*)$/gm,"<li>$1</li>")
       .replace(/(<li>.*<\/li>)/s,"<ul>$1</ul>")
       .replace(/\n/g,"<br>");
  // Restaurar bloques matemáticos
  t=t.replace(/@@MATH(\d+)@@/g,function(_,i){return maths[parseInt(i)];});
  return t;
}

function renderMath(el){
  if(!USE_MATHJAX) return;
  function doTypeset(){
    window.MathJax.typesetPromise([el]).catch(function(e){console.warn("MathJax",e);});
  }
  if(window.MathJax && window.MathJax.typesetPromise){
    doTypeset();
  } else {
    var t=setInterval(function(){
      if(window.MathJax && window.MathJax.typesetPromise){clearInterval(t);doTypeset();}
    },100);
  }
}

function addMsg(role,text,img,isThinking){
  var div=document.createElement("div");
  div.className="msg "+role;
  if(isThinking) div.id="thinking-bubble";
  var avatar=role==="user"?USER_AVATAR:BOT_AVATAR;
  div.innerHTML="<img class=\"avatar\" src=\""+avatar+"\" onerror=\"this.src='https://www.w3schools.com/howto/img_avatar.png'\"><div class=\"bubble\">"
    +(isThinking?"<em>Escribiendo...</em>":formatText(text))+"</div>";
  if(img){var i=document.createElement("img");i.src=img;div.querySelector(".bubble").appendChild(i);}
  chatLog.appendChild(div);
  chatLog.scrollTop=chatLog.scrollHeight;
  if(role==="bot"&&!isThinking){ renderMath(div.querySelector(".bubble")); }
  if(role==="bot"&&!isThinking){ speak(text); }
  return div;
}

async function send(){
  var val=userInput.value.trim();
  if(!val) return;
  addMsg("user",val);
  var historyBlock=buildHistoryBlock(); // se calcula ANTES de agregar el mensaje actual, para no duplicarlo
  conversationHistory.push({role:"Usuario",text:val});
  userInput.value="";
  var thinking=addMsg("bot","",null,true);
  try{
    var fullPrompt=buildSystem()+historyBlock+"\n\nMensaje actual del usuario: "+val;
    var r=await fetch("https://node.proyectodescartes.org/api/ia/text",{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({prompt:fullPrompt,model:LLM_MODEL})
    });
    var botText=await r.text();
    thinking.remove();
    var processed=processScrambleBlock(botText);
    var img=null;
    if(USE_IMAGES&&processed.display.length>20){
      var ir=await fetch("https://node.proyectodescartes.org/api/ia/image",{
        method:"POST",
        headers:{"Content-Type":"application/json"},
        body:JSON.stringify({prompt:val+NO_TEXT_CLAUSE,model:IMG_MODEL,seed:Math.floor(Math.random()*9999)})
      });
      if(ir.ok){var blob=await ir.blob();img=URL.createObjectURL(blob);}
    }
    addMsg("bot",processed.display,img);
    conversationHistory.push({role:"Asistente",text:processed.context});
  }catch(e){thinking.remove();addMsg("bot","Error de conexión.");}
}

function ask(q){userInput.value=q;send();}
userInput.addEventListener("keypress",function(e){if(e.key==="Enter")send();});

function downloadPDF(){
  if(conversationHistory.length===0){alert("No hay conversación para exportar.");return;}
  var pdfBtn=document.getElementById("pdf-btn");
  pdfBtn.textContent="Generando...";
  // Ocultar elementos auxiliares de MathJax que html2canvas duplica
  var mjxHidden=[];
  chatLog.querySelectorAll("mjx-assistive-mml, .MJX_Assistive_MathML").forEach(function(el){
    mjxHidden.push({el:el,vis:el.style.visibility,disp:el.style.display});
    el.style.display="none";
  });
  // Expandir chatLog para capturar todo el contenido (no solo lo visible)
  var prevMaxH=chatLog.style.maxHeight;
  var prevOverflow=chatLog.style.overflow;
  chatLog.style.maxHeight="none";
  chatLog.style.overflow="visible";
  html2canvas(chatLog,{scale:2,useCORS:true,backgroundColor:"#f8f9fa",logging:false}).then(function(canvas){
    // Restaurar todo
    chatLog.style.maxHeight=prevMaxH;
    chatLog.style.overflow=prevOverflow;
    mjxHidden.forEach(function(o){o.el.style.display=o.disp;});
    var jsPDF=window.jspdf.jsPDF;
    var pdf=new jsPDF({unit:"mm",format:"a4"});
    var pageW=pdf.internal.pageSize.getWidth();
    var pageH=pdf.internal.pageSize.getHeight();
    var margin=10;
    var imgW=pageW-margin*2;
    // Título en primera página
    var y=margin;
    pdf.setFontSize(13);pdf.setTextColor(60,60,60);
    pdf.text("Conversación: "+TOPIC,margin,y);y+=7;
    pdf.setFontSize(9);pdf.setTextColor(150,150,150);
    pdf.text(new Date().toLocaleString("es-ES"),margin,y);y+=6;
    // Calcular altura total de la imagen en mm
    var totalImgH=canvas.height*(imgW/canvas.width);
    var availH=pageH-y-margin;
    // Escala: píxeles por mm
    var pxPerMm=canvas.width/imgW;
    var srcY=0;
    var remaining=totalImgH;
    while(remaining>0.5){
      var sliceMm=Math.min(remaining,availH);
      var slicePx=Math.round(sliceMm*pxPerMm);
      var sc=document.createElement("canvas");
      sc.width=canvas.width;
      sc.height=slicePx;
      sc.getContext("2d").drawImage(canvas,0,srcY,canvas.width,slicePx,0,0,canvas.width,slicePx);
      pdf.addImage(sc.toDataURL("image/png"),"PNG",margin,y,imgW,sliceMm);
      srcY+=slicePx;
      remaining-=sliceMm;
      if(remaining>0.5){pdf.addPage();y=margin;availH=pageH-margin*2;}
    }
    pdf.save("conversacion_"+TOPIC.replace(/\s+/g,"_")+".pdf");
    pdfBtn.innerHTML="<i class=\"fas fa-file-pdf\"></i> PDF";
  }).catch(function(e){
    chatLog.style.maxHeight=prevMaxH;
    chatLog.style.overflow=prevOverflow;
    mjxHidden.forEach(function(o){o.el.style.display=o.disp;});
    alert("Error: "+e);
    pdfBtn.innerHTML="<i class=\"fas fa-file-pdf\"></i> PDF";
  });
}

window.onload=function(){
  var welcome="¡Hola! Soy tu asistente experto en **"+TOPIC+"**. ¿En qué puedo ayudarte?";
  addMsg("bot",welcome);
  conversationHistory.push({role:"Asistente",text:welcome});
  // Generar avatar del bot con la misma API de imágenes
  var avatarPrompt=(PERSONA && PERSONA.trim()!==""
    ? "kind elderly person, "+PERSONA+", warm smile, companion character, portrait avatar, square"
    : "kind smiling elderly person, warm friendly grandparent companion character, portrait avatar, square")
    +NO_TEXT_CLAUSE;
  fetch("https://node.proyectodescartes.org/api/ia/image",{
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({prompt:avatarPrompt,model:"klein",seed:42})
  }).then(function(r){
    if(r.ok) return r.blob();
  }).then(function(blob){
    if(blob){
      var url=URL.createObjectURL(blob);
      BOT_AVATAR=url;
      document.querySelectorAll(".msg.bot .avatar").forEach(function(img){img.src=url;});
    }
  }).catch(function(){});

  var subtitles=[
    "Tu compañía y estímulo cognitivo de cada día",
    "Conversemos, recordemos y aprendamos juntos",
    "Aquí siempre hay alguien dispuesto a escucharte"
  ];
  var subEl=document.getElementById("dynamic-subtitle");
  var subIdx=0;
  function showSubtitle(){
    if(!subEl) return;
    subEl.style.opacity=0;
    setTimeout(function(){
      subEl.textContent=subtitles[subIdx%subtitles.length];
      subEl.style.transition="opacity .6s";
      subEl.style.opacity=1;
      subIdx++;
    },300);
  }
  showSubtitle();
  setInterval(showSubtitle,4500);
};
