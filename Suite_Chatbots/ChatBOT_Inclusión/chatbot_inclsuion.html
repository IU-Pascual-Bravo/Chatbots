        :root{--primary:#007bff;--secondary:#6c757d;--light:#f8f9fa;--dark:#343a40;--success:#28a745;--danger:#dc3545;--warning:orange;--radius:8px;--font:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif;--bg:var(--light);--text:var(--dark);--card:#fff;--border:#ddd;--input:#fff;--iborder:#ccc;--bot-bg:#e9ecef;--bot-text:var(--dark);--user-bg:var(--primary);--user-text:#fff;--sys-bg:#fff3cd;--sys-text:#856404;}

        .thinking-animation{opacity:.75;animation:pulseThink 1s ease-in-out infinite;}
        @keyframes pulseThink{50%{opacity:1}}
        .input-area{display:flex;gap:10px;}
        #question-input{flex-grow:1;padding:10px;border:1px solid var(--iborder);border-radius:var(--radius);font-size:1em;resize:none;background:var(--input);color:var(--text);}
        #send-button{background:var(--success);padding:0 20px;display:flex;align-items:center;justify-content:center;gap:8px;}
        #send-button:hover{background:#1e7e34;}
        .loader{border:3px solid #f3f3f3;border-top:3px solid var(--primary);border-radius:50%;width:16px;height:16px;animation:spin 1s linear infinite;display:none;}
        @keyframes spin{0%{transform:rotate(0deg)}100%{transform:rotate(360deg)}}
        footer{text-align:center;padding:12px;background:var(--dark);color:var(--light);font-size:.8em;margin-top:20px;}
        @media(max-width:600px){.input-area{flex-direction:column;}#send-button{width:100%;padding:12px;}}
    </style>
</head>

    const PDF_TEXT = "TABLA DE CATEGORÍAS SIMAT    Extraída del documento “Características y diagnósticos  –   CIE 10”    1. Categorías SIMAT  –   Discapacidad    Cód.   Categoría SIMAT   ¿Quién cumple esta categoría?   Algunos diagnósticos clínicos que indican esa   categoría    15   Discapacidad física    Estudiantes que presentan en forma permanente deficiencias corporales y/o   funcionales a nivel del músculo esquelético, tegumentario, neurológico, de   origen congénito o adquirido, pérdida o ausencia de alguna parte de su cuerpo   o presencia de desórdenes del movimiento corporal.    Lesiones musculoesqueléticas: amputaciones de algún   miembro, lesiones de ligamentos y tendones que limitan la   movilidad o desplazamiento, huesos de cristal; parálisis   cerebral sin compromiso cognitivo; cuadriplejia , hemiplejia,   monoplejia o paraplejia; distrofia muscular, lesión   neuromuscular, espina bífida.    12   Discapacidad auditiva: usuario de   lengua de señas Colombia    Estudiantes con distintos tipos de pérdida auditiva que generan limitaciones   significativas en la percepción de los sonidos del mundo y en los intercambios   comunicativos verbales con otras personas.    Sordera profunda.    13   Discapacidad auditiva: usuario del   castellano    Personas con hipoacusia y sordas hablantes o usuarias del castellano que   adquirieron la lengua oral con suficiencia y usan ayudas auditivas para   compensar las restricciones en la comunicación. También incluye personas   sordas usuarias de la Lengua de Señas Colombiana (LSC).    Hipoacusia.    14   Sordoceguera    Personas que presentan una alteración auditiva y visual, parcial o total. La   combinación de dos deficiencias sensoriales genera dificultades en la   comunicación, orientación espacial, movilidad y acceso a la información.    No se especifican diagnósticos clínicos en la tabla fuente.    8   Discapacidad intelectual    Personas que presentan deficiencias en las capacidades mentales generales,   como razonamiento, resolución de problemas, planificación, pensamiento   abstracto, juicio, aprendizaje académico y aprendizaje de la experiencia.    Síndrome de Down; otros síndromes con compromiso   intelectual; trastorno cognitivo.    18   Discapacidad psicosocial (mental) /   DSM trastorno del espectro autista    Incluye estudiantes con diversos tipos de trastornos mentales, ansiedad,   depresión y otros que alteran significativamente el desarrollo de actividades   cotidianas y la ejecución de tareas o responsabilidades que implican   organización, modulación y regulación del estrés y las emociones. Incluye   estudiantes con diagnóstico de trastorno del espectro autista (TEA).    Esquizofrenia, trastorno afectivo bipolar, trastornos de   ansiedad manifestados mediante trastorno obsesivo   compulsivo, mutismo selectivo, fobia social, trastorno de   estrés postraumático, psicosis, entre otros; trastorno del   espectro autista.    10   Discapacidad múltiple   Personas que presentan dos o más deficiencias permanentes de orden físico,   sensorial, mental o intelectual, y que actúan de manera asociada.   Cuando tiene 2 o más discapacidades.    3   Discapacidad visual: baja visión   irreversible    Personas con diversas condiciones oculares y capacidades visuales, que van   hasta la pérdida completa de la visión, pasando por distintos grados de pérdida,   lo que se conoce como baja visión.   Baja visión.    4   Discapacidad visual: ceguera   Personas con pérdida completa de la visión, según la categoría presentada en   el documento.   Ceguera.       2. Categorías SIMAT  –   Capacidades y talentos excepcionales    El documento señala que la excepcionalidad es un fenómeno heterogéneo.  Las categorías incluidas en el SIMAT son:    Cód.   Categoría incluida en el SIMAT    —   Capacidades excepcionales    —   Talento excepcional en tecnología    —   Talento excepcional liderazgo social / emprendimiento    —   Talento excepcional en ciencias naturales o básicas     \n—   Talento excepcional en artes o letras    —   Talento excepcional en actividad física, ejercicio y deporte    —   Talento excepcional en ciencias sociales y/o humanas       Nota: en la diapositiva fuente estas categorías aparecen sin código SIMAT visible.    3. Subcategorías SIMAT  –   Trastornos    El documento aclara expresamente: “Trastorno NO ES DISCAPACIDAD”.  En la plataforma se consideran 3 subcategorías:    #   Subcategoría SIMAT   Descripción / ejemplos indicados en el documento    1   Trastorno por déficit de atención con/sin Hiperactividad   TDAH / Trastorno por déficit de atención con o sin hiperactividad    2   Trastorno específico de aprendizaje escolar   Disgrafía, discalculia, dislexia    3   Trastorno específico de aprendizaje escolar y por déficit de atención   Incluye estudiantes con trastorno de aprendizaje y déficit   de atención          Fuente: “Características y diagnósticos  –   CIE 10”, Estrategia: Inclusión, género y diversidad, Institución Universitaria Pascual Bravo.   \n";
    const PDF_NAME = "Tabla_categorias_SIMAT.pdf";

    const PDF2_TEXT_EMBEDDED = "BARRERAS Y AJUSTES    1. Categoría Actitudinales    Actitudinales     BARRERAS   POSIBLES AJUSTES     Dificultades en los procesos de   autorregulación de algunos   compañeros que afectan la   dinámica académica y la   convivencia en el aula.    Construir de manera participativa acuerdos de convivencia y   corresponsabilidad al inicio del semestre, promoviendo el   respeto por la diversidad, la participación y el compromiso   académico. Favorecer espacios de aprendizaje dentro y fuera   del aula que fortalezcan las habilidades socioemocionales y el   trabajo colaborativo.    Exigencias y niveles de   complejidad que no consideran   la diversidad de ritmos, estilos y   formas de aprendizaje.    Incorporar estrategias pedagógicas diversificadas, recursos   multimodales, metodologías activas y alternativas de   participación que permitan el acceso equitativo a los procesos   de enseñanza y aprendizaje.    Carencia de clima de confianza,   empatía y seguridad    Fomentar el trabajo con los pares, establecer acuerdos, usar   un lenguaje menos técnico, con términos más cercanos a sus   vivencias.    Considerar que todos los   estudiantes que comparten un   mismo diagnóstico tienen las   mismas características,   dificultades.    Promover ambientes inclusivos y respetuosos, fortaleciendo la   comunicación asertiva, el aprendizaje colaborativo, la   participación activa y el reconocimiento de la diversidad como   un valor para la comunidad universitaria.    Estigmatización de estudiantes   que requieren ajustes   razonables.   Promover ambientes respetuosos, libres de discriminación y   lenguaje inclusivo.   \nCreencia de que los ajustes   razonables disminuyen la   exigencia académica.   Garantizar los mismos resultados de aprendizaje utilizando   estrategias flexibles para alcanzarlos.       2. Categoría  Metodológicos   y curriculares    Metodológicos   y curriculares    BARRERAS   POSIBLES AJUSTES     Efectos distractores:   Saturación de información   visual que inciden en el   desarrollo del ambiente de   aprendizaje.     Organizar los entornos virtuales y presenciales reduciendo   estímulos innecesarios, priorizando la información relevante y   facilitando materiales estructurados. Permitir al estudiante   ubicarse en espacios con menor interferencia y facilitar recursos   para la gestión de la atención.   Es importante ubicarlo frente al   maestro donde pueda mantener con facilidad el contacto visual y   debe tener a los lados niños sin problemas de atención que le   sirvan de modelos, situar en la primera fila del aula: Lejos de   ventanas u otros que llamen la atención.     Se ha demostrado que reducir el grado de estimulación ayuda a   centrar la atención del niño y se recomienda no modificar   continuamente los estímulos ni organizarlos del ambiente, la   organización del salón debe permitir el trabajo individual o en   pequeños grupos, se recomienda organizar desde el comienzo del   año escolar un sitio especial marcado con los nombres de los   niños y un sitio en el cual colocar las tareas para llevar a casa.    La metodología utilizada no es   acorde con el modelo   pedagógico en el que se   inscribe el establecimiento   educativo.    Articular la planeación académica con el modelo pedagógico   institucional, los principios de educación inclusiva y el Diseño   Universal para el Aprendizaje desde el diseño del curso.    Enseñanza centrada en   actividades tradicionales y   clases magistrales.    Incorporar metodologías activas que favorezcan la participación,   la reflexión crítica, la construcción colaborativa del conocimiento   y el aprendizaje experiencial.   \nTemas complejos que   requieren de conocimientos   previos y conceptos   memorísticos (enfocados en   contenidos).    Presentar los contenidos mediante ejemplos contextualizados,   aplicaciones prácticas, estudios de caso y estrategias que faciliten   la comprensión progresiva de conceptos complejos.    Explicaciones de temáticas             }
            if (typeof j === 'string') return j;
        } catch (e) {}
        return s;
    }

    function hexToRgb(hex) {
        const normalized = String(hex || '#000000').replace('#', '');
        const full = normalized.length === 3 ? normalized.split('').map(ch => ch + ch).join('') : normalized;
        const value = parseInt(full, 16);
        return { r: (value >> 16) & 255, g: (value >> 8) & 255, b: value & 255 };
    }
    function rgbToHex(r, g, b) {
        const toHex = (value) => Math.max(0, Math.min(255, Math.round(value))).toString(16).padStart(2, '0');
        return '#' + toHex(r) + toHex(g) + toHex(b);
    }
    function mixColors(colorA, colorB, amount) {
        const a = hexToRgb(colorA);
        const b = hexToRgb(colorB);
        return rgbToHex(a.r + (b.r - a.r) * amount, a.g + (b.g - a.g) * amount, a.b + (b.b - a.b) * amount);
    }
    function getLuminance(hex) {
        const { r, g, b } = hexToRgb(hex);
        const toLinear = (value) => {
            const s = value / 255;
            return s <= 0.03928 ? s / 12.92 : ((s + 0.055) / 1.055) ** 2.4;
        };
        return 0.2126 * toLinear(r) + 0.7152 * toLinear(g) + 0.0722 * toLinear(b);
    }
    function hslToHex(h, s, l) {
        const hue = ((h % 360) + 360) % 360;
        const saturation = Math.max(0, Math.min(100, s)) / 100;
        const lightness = Math.max(0, Math.min(100, l)) / 100;
        const hueToRgb = (p, q, t) => {
            let temp = t;
            if (temp < 0) temp += 1;
            if (temp > 1) temp -= 1;
            if (temp < 1 / 6) return p + (q - p) * 6 * temp;
            if (temp < 1 / 2) return q;
            if (temp < 2 / 3) return p + (q - p) * (2 / 3 - temp) * 6;
            return p;
        };
        const q = lightness < 0.5 ? lightness * (1 + saturation) : lightness + saturation - lightness * saturation;
        const p = 2 * lightness - q;
        const r = hueToRgb(p, q, hue / 360 + 1 / 3);
        const g = hueToRgb(p, q, hue / 360);
        const b = hueToRgb(p, q, hue / 360 - 1 / 3);
        return rgbToHex(r * 255, g * 255, b * 255);
    }
    function getReadableTextColor(bgColor) { return getLuminance(bgColor) > 0.56 ? '#111827' : '#f8fafc'; }
    function generatePalette() {
        const hue = Math.floor(Math.random() * 360);
        const bg = hslToHex(hue, 45 + Math.floor(Math.random() * 20), 16 + Math.floor(Math.random() * 70));
        const text = getReadableTextColor(bg);
        const isDark = getLuminance(bg) < 0.5;
        const accent = hslToHex((hue + 35 + Math.floor(Math.random() * 60)) % 360, 80, isDark ? 55 : 45);
        const card = isDark ? mixColors(bg, '#ffffff', 0.08) : mixColors(bg, '#000000', 0.05);
        const border = isDark ? mixColors(card, '#ffffff', 0.18) : mixColors(card, '#000000', 0.12);
        const input = isDark ? mixColors(card, '#ffffff', 0.07) : mixColors(card, '#000000', 0.04);
        const inputBorder = isDark ? mixColors(border, '#ffffff', 0.12) : mixColors(border, '#000000', 0.1);
        const botBg = isDark ? mixColors(bg, '#ffffff', 0.12) : mixColors(bg, '#000000', 0.06);
        return {
            bgColor: bg,
            textColor: text,
            cardBgColor: card,
            cardBorderColor: border,
            inputBgColor: input,
            inputBorderColor: inputBorder,
            chatBubbleBotBg: botBg,
            chatBubbleBotText: text,
            chatBubbleUserBg: accent,
            chatBubbleUserText: getReadableTextColor(accent),
            primaryColor: accent,
            secondaryColor: isDark ? mixColors(accent, '#ffffff', 0.2) : mixColors(accent, '#000000', 0.2),
            headerBorderColor: border,
            systemMessageBg: isDark ? mixColors(bg, '#fde68a', 0.2) : mixColors(bg, '#fde68a', 0.28),
            systemMessageText: isDark ? '#fef3c7' : '#78350f'
        };
    }
    function buildThemePalette(theme, palette) {

            cardBgColor: '#ffffff',
            cardBorderColor: '#d1d5db',
            inputBgColor: '#ffffff',
            inputBorderColor: '#cbd5e1',
            chatBubbleBotBg: '#f3f4f6',
            chatBubbleBotText: '#1f2937',
            chatBubbleUserBg: '#2563eb',
            chatBubbleUserText: '#ffffff',
            headerBorderColor: '#e5e7eb',
            systemMessageBg: '#fef3c7',
            systemMessageText: '#92400e'
        };
        const isDark = theme === 'dark';

        const textColor = getReadableTextColor(bgColor);
        const cardBgColor = isDark ? mixColors(bgColor, '#ffffff', 0.08) : '#ffffff';

        const systemMessageBg = isDark ? mixColors(bgColor, '#fde68a', 0.2) : '#fef3c7';
        const systemMessageText = isDark ? '#fef3c7' : '#92400e';
        return {
            ...base,

            textColor,
            cardBgColor,

    function setPaletteVariables(target, palette) {

    async function sendQuestion() {
        const question = questionInput.value.trim();
        if (!question || isProcessing) return;
        addMsg(question, 'user'); questionInput.value = '';
        conversationHistory.push({ role: 'user', content: question });
        isProcessing = true; sendButton.disabled = true; questionInput.disabled = true;
        loadingSpinner.style.display = 'inline-block'; sendButtonText.textContent = 'Enviando';
        addMsg('Pensando...', 'bot', true);
        const maxLen = 800000;
        const t1 = PDF_TEXT.length > maxLen ? PDF_TEXT.substring(0, maxLen) + '... (truncado)' : PDF_TEXT;
        const systemInstructions = 'Eres un asistente que SOLO debe ayudar con preguntas relacionadas con el contenido del/los documento(s) PDF de esta sesión y con el tema del chatbot: «' + CHATBOT_THEME + '». ' +
            'No respondas temas claramente ajenos (vida personal sin relación, otros libros o materiales no incluidos, programación o tareas arbitrarias no vinculadas al texto, cotilleo, política o entretenimiento sin conexión con el PDF, etc.). ' +
            'Si la pregunta no guarda relación razonable con el documento ni con ese tema, responde ÚNICAMENTE con UNA línea que empiece exactamente con [FUERA_DE_ALCANCE] seguida de una frase breve en español. ' +
            'Para preguntas válidas, fundamenta la respuesta en los textos del documento; si falta información en el PDF, dilo con claridad.';

        let prompt = 'Instrucciones del sistema:\n' + systemInstructions + '\n\n';
        prompt += 'Documento 1 ("' + PDF_NAME + '"): "' + t1 + '"\n\n';
        if (pdf2Text) {
            const t2 = pdf2Text.length > maxLen ? pdf2Text.substring(0, maxLen) + '... (truncado)' : pdf2Text;
            prompt += 'Documento 2 ("' + pdf2Name + '"): "' + t2 + '"\n\n';
        }
        prompt += '(Instrucción: Para expresiones matemáticas, utiliza SÓLO el formato $$...$$ para bloque y $...$ para texto en línea.)\n\n';

        var historyBlock = conversationHistory.slice(0, -1).map(function(turn, index) {
            var speaker = turn.role === 'user' ? 'Usuario' : 'Asistente';
            return '[Turno ' + (index + 1) + '] ' + speaker + ': ' + turn.content;
        }).join('\n\n');
        if (historyBlock) {
            prompt += 'Conversación previa (historial del chat):\n' + historyBlock + '\n\n';
        }

        prompt += 'Pregunta: ' + question + '\n\nRespuesta:';
        try {
            const raw = (await postBackendText({
                model: MODEL,
                prompt: prompt,
                system: systemInstructions
            }) || '').trim();
            if (raw.startsWith('[FUERA_DE_ALCANCE]')) {
                const texto = raw.replace('[FUERA_DE_ALCANCE]', '').trim();
                conversationHistory.push({ role: 'assistant', content: texto });
                dismissThinkingAsSystem(texto, true);
            } else {
                conversationHistory.push({ role: 'assistant', content: raw });
                updateLastMsg(raw || 'La IA no proporcionó una respuesta.');
            }
        } catch(err) { updateLastMsg('Lo siento, ocurrió un error: ' + err.message); }
        finally {
            isProcessing = false; sendButton.disabled = false; questionInput.disabled = false;
            loadingSpinner.style.display = 'none'; sendButtonText.textContent = 'Enviar'; questionInput.focus();
        }
    }

    function processHtmlToDocx(htmlContent) {
        const paragraphs = [];
        const tempDiv = document.createElement('div');
        tempDiv.innerHTML = htmlContent;
        const elements = tempDiv.children;
        if (elements.length === 0 && htmlContent.replace(/\s/g, '').length > 0) {
            return [new docx.Paragraph({ text: tempDiv.textContent || htmlContent, spacing: { after: 200 } })];
        }
        for (let i = 0; i < elements.length; i++) {
            const element = elements[i];
            const tagName = element.tagName.toLowerCase();
            const text = element.textContent || element.innerText || '';
            if (tagName === 'h1' || tagName === 'h2') {
                paragraphs.push(new docx.Paragraph({
                    text: text,
                    heading: tagName === 'h1' ? docx.HeadingLevel.HEADING_1 : docx.HeadingLevel.HEADING_2,
                    spacing: { before: 400, after: 200 }
                }));
            } else if (tagName === 'h3') {
                paragraphs.push(new docx.Paragraph({
                    text: text,
                    heading: docx.HeadingLevel.HEADING_3,
                    spacing: { before: 300, after: 200 }
                }));
            } else if (tagName === 'ul' || tagName === 'ol') {
                const listItems = element.querySelectorAll('li');
                listItems.forEach(function(li) {
                    paragraphs.push(new docx.Paragraph({
                        text: li.textContent,
                        bullet: { level: 0 },
                        spacing: { after: 100 }
                    }));
                });
            } else if (tagName === 'p') {
                const textRuns = [];
                if (element.children.length === 0) {
                    textRuns.push(new docx.TextRun({ text: text }));
                } else {
                    processInlineElements(element, textRuns);
                }
                paragraphs.push(new docx.Paragraph({
                    children: textRuns.length > 0 ? textRuns : [new docx.TextRun({ text: text })],
                    spacing: { after: 200 }
                }));
            } else if (tagName === 'blockquote') {
                paragraphs.push(new docx.Paragraph({
                    text: text,
                    italics: true,
                    indent: { left: 720 },
                    spacing: { after: 200 },
                    border: { left: { color: 'CCCCCC', size: 6, style: docx.BorderStyle.SINGLE } }
                }));
            } else if (tagName === 'code') {
                paragraphs.push(new docx.Paragraph({
                    text: text,
                    font: 'Courier New',
                    shading: { type: docx.ShadingType.SOLID, color: 'F5F5F5' },
                    spacing: { after: 100 }
                }));
            } else if (tagName === 'pre') {
                paragraphs.push(new docx.Paragraph({
                    text: text,
                    font: 'Courier New',
                    shading: { type: docx.ShadingType.SOLID, color: '2D2D2D' },
                    color: 'FFFFFF',
                    spacing: { after: 200 }
                }));
            } else {
                paragraphs.push(new docx.Paragraph({ text: text, spacing: { after: 200 } }));
            }
        }
        return paragraphs;
    }

    function processInlineElements(element, textRuns) {
        for (let j = 0; j < element.childNodes.length; j++) {
            const node = element.childNodes[j];
            if (node.nodeType === Node.TEXT_NODE) {
                textRuns.push(new docx.TextRun({ text: node.textContent }));
            } else if (node.nodeType === Node.ELEMENT_NODE) {
                const tagName = node.tagName.toLowerCase();
                const nodeText = node.textContent || '';
                if (tagName === 'strong' || tagName === 'b') {
                    textRuns.push(new docx.TextRun({ text: nodeText, bold: true }));
                } else if (tagName === 'em' || tagName === 'i') {
                    textRuns.push(new docx.TextRun({ text: nodeText, italics: true }));
                } else if (tagName === 'u') {
                    textRuns.push(new docx.TextRun({ text: nodeText, underline: {} }));
                } else if (tagName === 'code') {
                    textRuns.push(new docx.TextRun({
                        text: nodeText,
                        font: 'Courier New',
                        shading: { type: docx.ShadingType.SOLID, color: 'F0F0F0' }
                    }));
                } else if (tagName === 'a') {
                    textRuns.push(new docx.TextRun({ text: nodeText, color: '0066CC', underline: {} }));
                } else {
                    processInlineElements(node, textRuns);
                }
            }
        }
    }

    function downloadSessionWord() {
        if (typeof docx === 'undefined' || typeof saveAs === 'undefined') {
            alert('Las librerías para exportar Word aún se están cargando. Espera unos segundos e inténtalo de nuevo.');
            return;
        }
        const chatMessages = chatDisplay.querySelectorAll('.user-message, .bot-message, .system-message');
        const children = [];
        children.push(new docx.Paragraph({
            text: 'Sesión de Chat (documento PDF)',
            heading: docx.HeadingLevel.HEADING_1,
            alignment: docx.AlignmentType.CENTER,
            spacing: { after: 400 }
        }));
        children.push(new docx.Paragraph({
            children: [
                new docx.TextRun({ text: 'Documento: ', bold: true }),
                new docx.TextRun({ text: PDF_NAME })
            ],
            spacing: { after: 100 }
        }));
        children.push(new docx.Paragraph({
            children: [
                new docx.TextRun({ text: 'Tema del chatbot: ', bold: true }),
                new docx.TextRun({ text: CHATBOT_THEME })
            ],
            spacing: { after: 100 }
        }));
        children.push(new docx.Paragraph({
            children: [
                new docx.TextRun({ text: 'Modelo: ', bold: true }),
                new docx.TextRun({ text: MODEL })
            ],
            spacing: { after: 200 }
        }));
        children.push(new docx.Paragraph({
            text: '________________________________________________________________________________________________',
            spacing: { after: 400 }
        }));

        chatMessages.forEach(function(msg) {
            if (msg.classList.contains('system-message')) {
                children.push(new docx.Paragraph({
                    text: msg.textContent,
                    italics: true,
                    alignment: docx.AlignmentType.CENTER,
                    spacing: { after: 200 },
                    color: '666666'
                }));
            } else if (msg.classList.contains('user-message')) {
                const ub = msg.querySelector('.user-bubble');
                const userText = ub ? ub.textContent.trim() : msg.textContent.replace(/^Usuario:\s*/i, '').trim();
                children.push(new docx.Paragraph({
                    children: [
                        new docx.TextRun({ text: 'Usuario: ', bold: true, color: '0066CC' }),
                        new docx.TextRun({ text: userText })
                    ],
                    spacing: { after: 200 },
                    alignment: docx.AlignmentType.RIGHT,
                    shading: { type: docx.ShadingType.SOLID, color: 'E3F2FD' }
                }));
            } else if (msg.classList.contains('bot-message')) {
                const botBubble = msg.querySelector('.message-bubble');
                if (botBubble) {
                    const contentDiv = botBubble.querySelector('.tex2jax_process') || botBubble.querySelector('div[style*="margin-top:5px"]');
                    const modelInfoEl = botBubble.querySelector('div[style*="font-size:0.8em"]');
                    const modelInfo = modelInfoEl ? modelInfoEl.textContent : '';
                    if (contentDiv) {
                        const formatted = processHtmlToDocx(contentDiv.innerHTML);
                        formatted.forEach(function(paragraph) { children.push(paragraph); });
                        if (modelInfo) {
                            children.push(new docx.Paragraph({
                                children: [new docx.TextRun({ text: modelInfo, italics: true, size: 20, color: '666666' })],
                                spacing: { after: 200 }
                            }));
                        }
                    } else {
                        let plain = botBubble.textContent || '';
                        if (modelInfo) plain = plain.split(modelInfo).join('').trim();
                        plain = plain.replace(/^Chatbot:\s*/i, '').trim();
                        children.push(new docx.Paragraph({ text: plain, spacing: { after: 200 } }));
                    }
                }
            }
        });

        const doc = new docx.Document({
            sections: [{ properties: {}, children: children }]
        });
        docx.Packer.toBlob(doc).then(function(blob) {
            saveAs(blob, 'Sesion_Chat_' + Date.now() + '.docx');
        });
    }

    sendButton.addEventListener('click', sendQuestion);
    questionInput.addEventListener('keypress', e => { if (e.key==='Enter' && !e.shiftKey) { e.preventDefault(); sendQuestion(); } });
    document.getElementById('download-html-session-btn').addEventListener('click', downloadSessionHtml);
    document.getElementById('download-word-session-btn').addEventListener('click', downloadSessionWord);
    let readyMsg = 'Documento "' + PDF_NAME + '" listo. ';
    if (PDF2_NAME_EMBEDDED && PDF3_NAME_EMBEDDED) {
        readyMsg = 'Documentos "' + PDF_NAME + '", "' + PDF2_NAME_EMBEDDED + '" y "' + PDF3_NAME_EMBEDDED + '" listos. ';
    } else if (PDF2_NAME_EMBEDDED) {
        readyMsg = 'Documentos "' + PDF_NAME + '" y "' + PDF2_NAME_EMBEDDED + '" listos. ';
    }
    addMsg(readyMsg + 'Solo respondo preguntas sobre este contenido o el tema «' + CHATBOT_THEME + '». ¡Puedes empezar!', 'system');
    questionInput.focus();
</script>
